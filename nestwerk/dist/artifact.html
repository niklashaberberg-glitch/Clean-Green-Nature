/* ===== view-tausch.js ===== */
/* =====================================================================
   Nestwerk – Ansicht: Ringtausch
   Der direkte Tausch scheitert fast immer daran, dass genau zwei Leute
   genau das Gegenteil wollen. Über Ketten geht es: A zieht zu B, B zu C,
   C in die Wohnung von A. Nestwerk sucht diese Ketten automatisch.
   ===================================================================== */
(function (NW) {
  'use strict';

  const U = NW.util, ui = NW.ui, A = NW.analyse, S = NW.store, M = NW.match, P = NW.plan;
  const h = U.html, raw = U.raw, ico = U.svg;

  let sicht = { nurMeine: false, maxLaenge: 4, minGuete: 60 };

  /* ------------------------- Ringgrafik ------------------------- */

  /* Jede Grafik bringt ihre eigene Pfeilspitze mit – mehrere Ringe auf
     einer Seite dürfen sich nicht dieselbe Kennung teilen. */
  let grafikNummer = 0;

  function ringGrafik(r) {
    const spitze = 'pfeilspitze-' + (++grafikNummer);
    const n = r.knoten.length;
    const g = 260, mitte = g / 2, radius = g / 2 - 52;
    const punkte = r.knoten.map((k, i) => {
      const w = -Math.PI / 2 + i * 2 * Math.PI / n;
      return { x: mitte + Math.cos(w) * radius, y: mitte + Math.sin(w) * radius, k };
    });
    let pfeile = '';
    punkte.forEach((p, i) => {
      const q = punkte[(i + 1) % n];
      /* Etwas eingezogen, damit die Spitze nicht im Knoten steckt. */
      const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy) || 1;
      const ax = p.x + dx / len * 26, ay = p.y + dy / len * 26;
      const bx = q.x - dx / len * 30, by = q.y - dy / len * 30;
      const kr = 1 - (r.kanten[i] ? r.kanten[i].wert : 1);
      const farbe = kr < 0.12 ? 'var(--gut)' : kr < 0.3 ? 'var(--warn)' : 'var(--schlecht)';
      pfeile += '<path d="M' + ax.toFixed(1) + ' ' + ay.toFixed(1) + 'L' + bx.toFixed(1) + ' ' + by.toFixed(1) +
        '" stroke="' + farbe + '" stroke-width="2.4" marker-end="url(#' + spitze + ')"/>';
    });
    let knoten = '';
    punkte.forEach((p, i) => {
      knoten += '<g class="ringgrafik__knoten" transform="translate(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ')">' +
        '<circle r="21" class="' + (p.k.eigen ? 'is-ich' : '') + '"/>' +
        '<text y="5">' + (p.k.eigen ? 'Du' : String.fromCharCode(65 + i)) + '</text></g>';
    });
    return raw('<svg class="ringgrafik" viewBox="0 0 ' + g + ' ' + g + '" role="img" aria-label="Tauschkette mit ' + n + ' Beteiligten">' +
      '<defs><marker id="' + spitze + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
      '<path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>' +
      pfeile + knoten + '</svg>');
  }

  function ringKarte(r, index) {
    const buchstabe = (i) => r.knoten[i].eigen ? 'Du' : String.fromCharCode(65 + i);
    return h`<article class="ringkarte">
      <header class="ringkarte__kopf">
        <div>
          <h3>${r.laenge === 2 ? 'Direkter Tausch' : r.laenge + 'er-Ring'}
            ${r.knoten.some((k) => k.eigen) ? ui.badge('mit dir', 'gut') : ''}</h3>
          <p>${r.laenge === 2 ? r.knoten[0].stadt + ' ↔ ' + r.knoten[1].stadt
        : r.knoten.map((k) => k.stadt).join(' → ') + ' → ' + r.knoten[0].stadt}</p>
        </div>
        <div class="ringkarte__guete">
          <b>${Math.round(r.wert * 100)} %</b><span>Güte</span>
        </div>
      </header>
      <div class="ringkarte__koerper">
        ${ringGrafik(r)}
        <ol class="ringkarte__schritte">
          ${r.knoten.map((k, i) => {
      const ziel = r.knoten[(i + 1) % r.laenge];
      return h`<li>
              <span class="ringkarte__marke">${buchstabe(i)}</span>
              <div>
                <b><a href="#/objekt/${k.id}">${U.dec(k.zimmer)} Zi., ${k.flaeche} m², ${U.eur(k.warm)} warm</a></b>
                <span>${k.viertel}, ${k.stadt} → zieht nach ${ziel.viertel}, ${ziel.stadt}</span>
                ${r.kanten[i] && r.kanten[i].maengel.length
          ? h`<i class="ringkarte__mangel">${ico('warnung')}${r.kanten[i].maengel.join(' · ')}</i>` : ''}
              </div>
            </li>`;
    })}
        </ol>
      </div>
      <footer class="ringkarte__fuss">
        <span>schwächstes Glied: ${Math.round(r.schwaechste * 100)} %</span>
        <span>${r.knoten.filter((k) => k.tausch.vermieterZustimmung === 'liegt vor').length} von ${r.laenge} Vermieterzustimmungen liegen vor</span>
        <button type="button" class="knopf knopf--klein" data-tu="ring-anstossen" data-i="${index}">${ico('nachricht')}Kette anstoßen</button>
      </footer>
    </article>`;
  }

  /* ------------------------- Eigenes Angebot ------------------------- */

  function meinAngebot() {
    const s = S.get();
    const m = s.meinTausch;
    if (!m) {
      return h`<section class="block block--betont">
        <h2>${ico('tausch')}Dein Tauschangebot fehlt noch</h2>
        <p>Ohne eigene Wohnung im Topf kann Nestwerk dich in keine Kette einbauen. Das Anlegen dauert zwei Minuten.</p>
        <p><button type="button" class="knopf" data-tu="tausch-anlegen">${ico('plus')}Angebot anlegen</button></p>
      </section>`;
    }
    const alle = NW.data.listings.filter((x) => x.kind === 'tausch').concat([m]);
    const einseitig = M.einseitig(alle, m);
    const schrauben = M.stellschrauben(NW.data.listings.filter((x) => x.kind === 'tausch'), m);
    return h`<section class="block block--betont">
      <h2>${ico('tausch')}Dein Angebot</h2>
      <div class="meintausch">
        <div>
          <b>${U.dec(m.zimmer)} Zi. · ${m.flaeche} m² · ${U.eur(m.warm)} warm</b>
          <span>${m.viertel}, ${m.stadt}</span>
        </div>
        <div>
          <b>gesucht: ${m.tausch.suche.staedte.join(', ')}</b>
          <span>ab ${U.dec(m.tausch.suche.zimmerMin)} Zi., ${m.tausch.suche.flaecheMin} m², bis ${U.eur(m.tausch.suche.warmMax)}</span>
        </div>
        <div class="meintausch__tun">
          <button type="button" class="knopf knopf--klein knopf--still" data-tu="tausch-anlegen">${ico('stift')}Ändern</button>
          <button type="button" class="knopf knopf--klein knopf--still" data-tu="tausch-weg">${ico('muell')}Entfernen</button>
        </div>
      </div>
      <div class="kennzahlen kennzahlen--vier">
        <div><b>${einseitig.wollenMich.length}</b><span>würden deine Wohnung nehmen</span></div>
        <div><b>${einseitig.ichWill.length}</b><span>Wohnungen passen dir</span></div>
        <div><b>${M.ringeFuer(alle, m.id, { maxLen: 2 }).length}</b><span>direkte Tausche</span></div>
        <div><b>${M.ringeFuer(alle, m.id).length}</b><span>Ketten insgesamt</span></div>
      </div>
      ${schrauben.length ? h`<h3>Was mehr Ketten bringen würde</h3>
        ${P.darf('stellschrauben')
        ? h`<ul class="schrauben">
            ${schrauben.slice(0, 4).map((s2) => h`<li>
              <span>${s2.label}</span>
              <b>+${s2.gewinn} ${U.plural(s2.gewinn, 'Kette', 'Ketten')}</b>
            </li>`)}
          </ul>
          <p class="fein">Nestwerk hat jede Lockerung einzeln durchgerechnet – das sind keine Schätzungen.</p>`
        : h`<ul class="schrauben schrauben--verdeckt">
            ${schrauben.slice(0, 4).map((s2) => h`<li><span>${s2.label}</span><b>+? Ketten</b></li>`)}
          </ul>
          ${ui.sperrHinweis('stellschrauben', 'Nestwerk hat jede dieser Lockerungen einzeln durchgerechnet. '
          + 'Mit Plus siehst du, wie viele zusätzliche Ketten jede einzelne öffnet.')}`}` : ''}
    </section>`;
  }

  /* ------------------------- Ansicht ------------------------- */

  function ansicht() {
    const s = S.get();
    const angebote = NW.data.listings.filter((x) => x.kind === 'tausch').concat(s.meinTausch ? [s.meinTausch] : []);
    const erlaubt = P.grenze('ringLaenge');
    if (sicht.maxLaenge > erlaubt) sicht.maxLaenge = erlaubt;
    /* Auch im freien Tarif wird alles gerechnet – nur nicht alles gezeigt.
       Wer nicht weiß, was ihm entgeht, kann nicht entscheiden. */
    const gesamt = M.ringe(angebote, { maxLen: 4, minWert: 0.5 });
    const laengere = gesamt.filter((r) => r.laenge > erlaubt);
    let alle = M.ringe(angebote, { maxLen: sicht.maxLaenge, minWert: 0.5 });
    alle = alle.filter((r) => r.wert * 100 >= sicht.minGuete);
    if (sicht.nurMeine) alle = alle.filter((r) => r.knoten.some((k) => k.eigen));
    NW.viewTausch.letzte = alle;

    const zahlen = { 2: 0, 3: 0, 4: 0 };
    alle.forEach((r) => { zahlen[r.laenge] = (zahlen[r.laenge] || 0) + 1; });

    return {
      titel: 'Ringtausch',
      html: h`<div class="seite seite--schmal">
        <header class="seite__kopf">
          <h1>${ico('ring')}Ringtausch</h1>
          <p class="seite__unter">Beim direkten Tausch müssen zwei Menschen exakt das Gegenteil voneinander wollen –
            das passiert fast nie. In einer Kette reicht es, wenn jeder die Wohnung des Nächsten möchte.
            Nestwerk durchsucht alle Angebote nach solchen geschlossenen Ketten.</p>
          <p class="werkzeug__weiter">
            <button type="button" class="knopf knopf--still" data-tu="ring-erklaeren">
              ${ico('ring')}In vier Bildern erklärt</button></p>
        </header>

        ${meinAngebot()}

        <section class="block">
          <div class="block__kopfzeile">
            <h2>${alle.length} ${U.plural(alle.length, 'Kette', 'Ketten')} gefunden</h2>
            <p class="fein">${zahlen[2] || 0} direkt · ${zahlen[3] || 0} Dreier · ${zahlen[4] || 0} Vierer</p>
          </div>
          <div class="tauschfilter">
            <label class="schalter"><input type="checkbox" data-tu-change="ring-meine" ${sicht.nurMeine ? 'checked' : ''}>
              <span>nur Ketten mit meinem Angebot</span></label>
            <label class="feld feld--flach"><span>höchstens</span>
              <select data-tu-change="ring-laenge">
                ${[2, 3, 4].map((n) => h`<option value="${n}" ${sicht.maxLaenge === n ? 'selected' : ''}
                  ${n > erlaubt ? 'disabled' : ''}>${n} Beteiligte${n > erlaubt ? ' – Plus' : ''}</option>`)}
              </select></label>
            <label class="feld feld--regler"><span>Güte ab ${sicht.minGuete} %</span>
              <input type="range" min="50" max="100" step="5" value="${sicht.minGuete}" data-tu-input="ring-guete"></label>
          </div>

          ${alle.length ? h`<div class="ringliste-gross">${alle.slice(0, 12).map((r, i) => ringKarte(r, i))}</div>`
        : h`<div class="leer">${ico('ring')}<h3>Keine Kette in dieser Einstellung</h3>
            <p>Senk die Mindestgüte, erlaub längere Ketten oder lockere dein eigenes Angebot.</p></div>`}

          ${laengere.length ? h`<div class="ringsperre">
            <h3>${ico('schloss')}${laengere.length} weitere ${U.plural(laengere.length, 'Kette', 'Ketten')} über drei und vier Haushalte</h3>
            <p>Der direkte Tausch scheitert fast immer daran, dass zwei Menschen exakt das Gegenteil voneinander
              wollen. Genau deshalb sind die längeren Ketten der eigentliche Nutzen – gerade sind
              ${laengere.filter((r) => r.laenge === 3).length} Dreier- und
              ${laengere.filter((r) => r.laenge === 4).length} Viererketten offen.</p>
            <ul class="ringsperre__liste">
              ${laengere.slice(0, 3).map((r) => h`<li>
                <b>${r.laenge}er-Ring</b>
                <span>${r.knoten.map(() => '•').join(' → ')} → •</span>
                <em>${Math.round(r.wert * 100)} % Güte</em></li>`)}
            </ul>
            ${ui.sperrHinweis('ring')}
          </div>` : ''}
        </section>

        <section class="block">
          <h2>${ico('info')}Wie ein Tausch praktisch abläuft</h2>
          <ol class="ablauf">
            <li><b>Kette bestätigen</b><span>Alle Beteiligten sagen zu. Ein Wackelkandidat reißt die ganze Kette.</span></li>
            <li><b>Vermieter fragen</b><span>Jede Vermieterseite muss zustimmen. Genossenschaften und kommunale
              Gesellschaften sind das gewohnt, private Eigentümer meist nicht.</span></li>
            <li><b>Termine abstimmen</b><span>Alle Umzüge sollten in dieselbe Woche fallen – sonst zahlt jemand doppelt Miete.</span></li>
            <li><b>Verträge schließen</b><span>Rechtlich ist es kein Tausch, sondern für jede Wohnung ein neuer
              Mietvertrag. Alte Konditionen laufen nicht mit.</span></li>
            <li><b>Übergaben protokollieren</b><span>Zählerstände, Mängel, Schlüsselanzahl – jede Wohnung einzeln.</span></li>
          </ol>
          <p class="fein">Ein Anspruch auf Zustimmung besteht nicht. Manche Vermieter verlangen dieselben
            Unterlagen wie bei jeder Neuvermietung – die Bewerbermappe im Profil hilft auch hier.</p>
          <p class="werkzeug__weiter">
            <button type="button" class="knopf knopf--klein knopf--still" data-tu="ring-erklaeren">
              ${ico('ring')}Das Ganze als Bild</button></p>
        </section>

        <section class="block">
          <h2>${ico('liste')}Alle Tauschangebote</h2>
          <div class="ergebnisse__liste ergebnisse__liste--drei">
            ${NW.data.listings.filter((x) => x.kind === 'tausch').slice(0, 9)
          .map((x) => ui.inseratsKarte(x, A.bewerten(x, s.profil), { kompakt: true }))}
          </div>
          <p><a class="knopf knopf--still" href="#/suche?art=tausch">Alle in der Suche ansehen</a></p>
        </section>
      </div>`
    };
  }

  /* ------------------------- Aktionen ------------------------- */

  const A_ = ui.aktionRegistrieren;

  A_('ring-meine', (el) => { sicht.nurMeine = el.checked; ui.neuZeichnen(); });
  A_('ring-laenge', (el) => { sicht.maxLaenge = Number(el.value); ui.neuZeichnen(); });
  A_('ring-guete', U.debounce((el) => { sicht.minGuete = Number(el.value); ui.neuZeichnen(); }, 200));

  A_('ring-anstossen', (el) => {
    const r = NW.viewTausch.letzte[Number(el.dataset.i)];
    if (!r) return;
    const zeilen = ['Vorschlag für einen ' + (r.laenge === 2 ? 'direkten Tausch' : r.laenge + 'er-Ringtausch') + ':', ''];
    r.knoten.forEach((k, i) => {
      const ziel = r.knoten[(i + 1) % r.laenge];
      zeilen.push((i + 1) + '. ' + (k.eigen ? 'Ich' : k.anbieter.name) + ' – ' + U.dec(k.zimmer) + ' Zi., ' +
        k.flaeche + ' m², ' + U.eur(k.warm) + ' warm, ' + k.viertel + ' (' + k.stadt + ') → zieht nach ' +
        ziel.viertel + ' (' + ziel.stadt + ')');
    });
    zeilen.push('', 'Güte der Kette: ' + Math.round(r.wert * 100) + ' %. Schwächstes Glied: ' + Math.round(r.schwaechste * 100) + ' %.');
    if (r.maengel.length) zeilen.push('Abstriche: ' + U.uniq(r.maengel).join('; '));
    zeilen.push('', 'Nächster Schritt: Alle bestätigen, dann fragt jede und jeder die eigene Vermieterseite.');
    ui.dialog({
      titel: 'Kette anstoßen',
      breit: true,
      inhalt: h`<p>Nestwerk hat eine Nachricht vorbereitet, die an alle Beteiligten geht.
        In dieser Vorführung wird nichts wirklich verschickt – kopier den Text und nutze ihn, wie du magst.</p>
        <label class="feld"><span>Nachricht</span><textarea rows="12" id="ring-text">${zeilen.join('\n')}</textarea></label>`,
      fuss: h`<button type="button" class="knopf knopf--still" data-tu="kopieren" data-quelle="#ring-text">${ico('kopieren')}Kopieren</button>
        <button type="button" class="knopf" data-tu="dialog-zu">Schließen</button>`
    });
  });

  /* ------------------------- Ringtausch erklärt -------------------------
     Ein Dialog, vier Bilder. Der Inhalt wird an Ort und Stelle getauscht
     statt einen neuen Dialog zu öffnen – sonst springt der Fokus bei
     jedem Schritt zurück an den Anfang. */

  let schritt = 0;

  function erklaerungInhalt() {
    const s = NW.ringBild.SCHRITTE[schritt];
    return h`<div class="ringerklaerung">
      <ol class="ringerklaerung__punkte">
        ${NW.ringBild.SCHRITTE.map((x, i) => h`<li class="${i === schritt ? 'is-an' : i < schritt ? 'is-durch' : ''}">
          <button type="button" data-tu="ring-schritt" data-n="${i}"
            aria-current="${i === schritt ? 'step' : 'false'}"><span class="nur-sr">Schritt ${i + 1}: ${x.titel}</span></button>
        </li>`)}
      </ol>
      <figure class="ringerklaerung__bild">
        ${raw(s.bild())}
        <figcaption><b>${s.titel}</b> ${s.text}</figcaption>
      </figure>
    </div>`;
  }

  function erklaerungZeichnen() {
    const ziel = U.$('#ring-erklaerung');
    if (ziel) ziel.innerHTML = String(erklaerungInhalt());
    const fuss = U.$('#ring-erklaerung-fuss');
    if (fuss) fuss.innerHTML = String(erklaerungFuss());
  }

  function erklaerungFuss() {
    const letzter = schritt >= NW.ringBild.SCHRITTE.length - 1;
    return h`<button type="button" class="knopf knopf--still" data-tu="ring-schritt" data-n="${schritt - 1}"
        ${schritt === 0 ? 'disabled' : ''}>${ico('zurueck')}Zurück</button>
      <span class="fein">Schritt ${schritt + 1} von ${NW.ringBild.SCHRITTE.length}</span>
      ${letzter
        ? h`<button type="button" class="knopf" data-tu="dialog-zu">Verstanden</button>`
        : h`<button type="button" class="knopf" data-tu="ring-schritt" data-n="${schritt + 1}">Weiter${ico('chevron')}</button>`}`;
  }

  A_('ring-erklaeren', () => {
    schritt = 0;
    ui.dialog({
      titel: 'Wie ein Ringtausch funktioniert',
      breit: true,
      inhalt: h`<div id="ring-erklaerung">${erklaerungInhalt()}</div>`,
      fuss: h`<div class="ringerklaerung__fuss" id="ring-erklaerung-fuss">${erklaerungFuss()}</div>`
    });
  });

  A_('ring-schritt', (el) => {
    const n = Number(el.dataset.n);
    if (n < 0 || n >= NW.ringBild.SCHRITTE.length) return;
    schritt = n;
    erklaerungZeichnen();
  });

  A_('tausch-weg', () => {
    const m = S.get().meinTausch;
    if (!m) return;
    if (!confirm('Dein Tauschangebot wird entfernt. Fortfahren?')) return;
    S.inseratLoeschen(m.id);
    ui.toast('Angebot entfernt.');
    ui.neuZeichnen();
  });

  NW.viewTausch = { letzte: [] };
  ui.ansichten.tausch = ansicht;
})(window.NW = window.NW || {});

/* ===== view-tools.js ===== */
/* =====================================================================
   Nestwerk – Ansichten: Merkliste, Vergleich, Suchaufträge,
   Nachrichten und Umzugsplan.
   ===================================================================== */
(function (NW) {
  'use strict';

  const U = NW.util, ui = NW.ui, A = NW.analyse, S = NW.store, P = NW.plan, W = NW.werkzeuge;
  const h = U.html, raw = U.raw, ico = U.svg;

  /* ================================================================
     Merkliste als Bewerbungstafel
     ================================================================ */

  function merkKarte(id, eintrag) {
    const l = NW.data.byId[id];
    if (!l) return '';
    const b = A.bewerten(l, S.get().profil);
    return h`<article class="merkkarte" data-id="${id}">
      <a class="merkkarte__bild" href="#/objekt/${id}" aria-hidden="true" tabindex="-1">${raw(NW.img.make(l, 0))}</a>
      <div class="merkkarte__text">
        <b><a href="#/objekt/${id}">${U.truncate(l.titel, 52)}</a></b>
        <span>${l.viertel}, ${l.stadt} · ${l.kind === 'kauf' ? U.eur(l.kaufpreis) : U.eur(l.warm) + ' warm'}</span>
        ${eintrag.termin ? h`<i class="merkkarte__termin">${ico('kalender')}${U.dateDE(eintrag.termin.datum)}, ${eintrag.termin.zeit}</i>` : ''}
        ${eintrag.notiz ? h`<p class="merkkarte__notiz">${U.truncate(eintrag.notiz, 120)}</p>` : ''}
      </div>
      <div class="merkkarte__fuss">
        <span class="merkkarte__passung">${b.score} %</span>
        <label class="nur-sr" for="st-${id}">Status</label>
        <select id="st-${id}" data-tu-change="status-setzen" data-id="${id}">
          ${S.PIPELINE.map((p) => h`<option value="${p.id}" ${eintrag.status === p.id ? 'selected' : ''}>${p.label}</option>`)}
        </select>
        <button type="button" class="ikon-btn" data-tu="merken" data-id="${id}" title="Entfernen">${ico('muell')}</button>
      </div>
    </article>`;
  }

  function merkliste() {
    const s = S.get();
    const ids = Object.keys(s.merkliste);
    if (!ids.length) {
      return {
        titel: 'Merkliste',
        html: h`<div class="seite seite--schmal">
          <header class="seite__kopf"><h1>${ico('herz')}Merkliste</h1></header>
          <div class="leer">${ico('herz')}
            <h3>Noch nichts gemerkt</h3>
            <p>Klick bei einem Inserat auf das Herz. Hier entsteht daraus eine Tafel, die deine Bewerbungen
              von „gemerkt“ bis „Zusage“ begleitet.</p>
            <p><a class="knopf" href="#/suche">${ico('suche')}Zur Suche</a></p></div>
        </div>`
      };
    }

    const spalten = S.PIPELINE.map((p) => ({
      p, eintraege: ids.filter((id) => s.merkliste[id].status === p.id)
    }));
    const faellig = S.nachfassFaellig();
    const termine = ids.map((id) => {
      const e = s.merkliste[id];
      if (!e.termin) return null;
      const l = NW.data.byId[id];
      if (!l) return null;
      return { id, datum: e.termin.datum, zeit: e.termin.zeit, listing: l, titel: l.titel };
    }).filter(Boolean).sort((a, b) => (a.datum + a.zeit).localeCompare(b.datum + b.zeit));
    const gesamt = ids.length;
    const beworben = ids.filter((id) => ['kontakt', 'termin', 'unterlagen', 'zusage'].indexOf(s.merkliste[id].status) >= 0).length;
    const zusagen = ids.filter((id) => s.merkliste[id].status === 'zusage').length;
    const absagen = ids.filter((id) => s.merkliste[id].status === 'absage').length;
    const quote = beworben + absagen > 0 ? Math.round(zusagen / (beworben + absagen) * 100) : 0;

    return {
      titel: 'Merkliste',
      html: h`<div class="seite">
        <header class="seite__kopf">
          <h1>${ico('herz')}Merkliste und Bewerbungen</h1>
          <p class="seite__unter">Alles, was du im Blick hast – vom ersten Merken bis zur Zusage.</p>
        </header>

        <div class="kennzahlen kennzahlen--vier">
          <div><b>${gesamt}</b><span>Objekte insgesamt</span></div>
          <div><b>${beworben}</b><span>in Bearbeitung</span></div>
          <div><b>${zusagen}</b><span>Zusagen</span></div>
          <div><b>${quote} %</b><span>Erfolgsquote</span></div>
        </div>

        ${faellig.length ? h`<section class="block ${P.darf('nachfassen') ? 'block--betont' : ''}">
          <h2>${ico('verlauf')}Nachfassen</h2>
          ${P.darf('nachfassen')
        ? h`<p class="block__unter">Angeschrieben, keine Antwort. Eine freundliche Nachfrage nach ein paar Tagen
              bringt erfahrungsgemäß mehr als jede zweite ausbleibende Antwort erwarten lässt.</p>
            <ul class="nachfass">
              ${faellig.map((f) => h`<li>
                ${ico('nachricht')}
                <div><b><a href="#/objekt/${f.id}">${U.truncate(f.listing.titel, 46)}</a></b>
                  <span>seit ${f.tage} Tagen ohne Antwort · ${f.listing.anbieter.name}</span></div>
                <button type="button" class="knopf knopf--klein" data-tu="nachfassen" data-id="${f.id}">Nachricht öffnen</button>
              </li>`)}
            </ul>`
        : h`<p class="block__unter">${faellig.length} deiner Anfragen ${U.plural(faellig.length, 'ist', 'sind')}
              seit mehreren Tagen unbeantwortet.</p>
            ${ui.sperrHinweis('nachfassen', 'Mit Plus sagt Nestwerk dir, welche Anfrage wie lange liegt, und '
          + 'formuliert die Nachfrage vor. Ohne Plus musst du selbst mitzählen.')}`}
        </section>` : ''}

        ${termine.length > 1 ? h`<section class="block">
          <h2>${ico('route')}Besichtigungen ordnen</h2>
          ${P.darf('tagesplan') ? tagesplanBlock(termine) : h`
            <p class="block__unter">Du hast ${termine.length} Besichtigungstermine.</p>
            ${ui.sperrHinweis('tagesplan', 'Mit Plus ordnet Nestwerk deine Termine zu einer Route, rechnet die '
        + 'Fahrzeiten dazwischen und warnt, wenn zwei Termine zeitlich nicht zusammenpassen.')}`}
        </section>` : ''}

        ${P.darf('serienbewerbung') && ids.filter((id) => s.merkliste[id].status === 'gemerkt').length > 1
        ? h`<section class="block">
          <h2>${ico('nachricht')}Serienbewerbung</h2>
          <p class="block__unter">${ids.filter((id) => s.merkliste[id].status === 'gemerkt').length} Objekte
            stehen auf „gemerkt“. Nestwerk schreibt für jedes ein eigenes Anschreiben aus deinem Profil –
            angepasst an Titel, Lage und Preis, nicht als Rundmail.</p>
          <button type="button" class="knopf" data-tu="serie">${ico('nachricht')}Anschreiben vorbereiten</button>
        </section>` : ''}

        <div class="tafel">
          ${spalten.map((sp) => h`<section class="tafel__spalte" aria-label="${sp.p.label}">
            <header class="tafel__kopf tafel__kopf--${sp.p.farbe}">
              <b>${sp.p.label}</b><span>${sp.eintraege.length}</span>
            </header>
            <div class="tafel__karten">
              ${sp.eintraege.length ? sp.eintraege.map((id) => merkKarte(id, s.merkliste[id]))

          nützlich, um zu merken, ob die Suche zu eng oder das Anschreiben zu blass ist.</p>

  function tagesplanBlock(termine) {
    const nachTag = {};
    termine.forEach((t) => { (nachTag[t.datum] = nachTag[t.datum] || []).push(t); });
    const tage = Object.keys(nachTag).sort();
    return h`<p class="block__unter">Nach kürzestem Weg geordnet. Wo zwei Termine zeitlich nicht zusammenpassen,
        steht es dabei.</p>
      ${tage.map((tag) => {
      const plan = W.tagesplan(nachTag[tag]);
      return h`<div class="tagesplan">
          <h3>${U.dateDE(tag)}${plan.gesamtMinuten ? h` <i>${U.minutesLabel(plan.gesamtMinuten)} unterwegs</i>` : ''}</h3>
          <ol class="tagesplan__liste">
            ${plan.reihenfolge.map((r, i) => h`<li>
              <span class="tagesplan__zeit">${r.termin.zeit}</span>
              <div>
                <b><a href="#/objekt/${r.termin.id}">${U.truncate(r.termin.titel, 42)}</a></b>
                <span>${r.termin.listing.viertel}, ${r.termin.listing.stadt}</span>
              </div>
              ${i ? h`<i class="tagesplan__fahrt">${ico('zug')}${U.minutesLabel(r.fahrtMinuten)}</i>` : ''}
            </li>`)}
          </ol>
          ${plan.konflikte.map((k) => h`<p class="warn-meldung">${ico('warnung')}
            Zwischen ${k.a.zeit} und ${k.b.zeit} fehlen rund ${k.fehlt} Minuten. Verschieb einen der beiden Termine.</p>`)}
        </div>`;
    })}
      <p class="fein">Fahrzeiten mit öffentlichen Verkehrsmitteln geschätzt, 30 Minuten je Besichtigung eingerechnet.</p>`;

  /* ================================================================
     Vergleich
     ================================================================ */

  function vergleich() {
    const s = S.get();
    const objekte = s.vergleich.map((id) => NW.data.byId[id]).filter(Boolean);
    if (!objekte.length) {
      return {
        titel: 'Vergleich',
        html: h`<div class="seite seite--schmal">
          <header class="seite__kopf"><h1>${ico('waage')}Vergleich</h1></header>
          <div class="leer">${ico('waage')}
            <h3>Noch nichts im Vergleich</h3>
            <p>Bis zu ${S.maxVergleich()} Objekte lassen sich nebeneinanderstellen – mit echten Monatskosten,
              Vergleichsmiete und Passung in einer Tabelle.</p>
            <p><a class="knopf" href="#/suche">${ico('suche')}Objekte suchen</a></p></div>
        </div>`
      };
    }

    const daten = objekte.map((l) => ({
      l, b: A.bewerten(l, s.profil), k: A.kosten(l, s.profil)
    }));

    /* Zeilen mit Angabe, welche Richtung besser ist. */
    const zeilen = [
      { label: 'Passung', wert: (d) => d.b.score + ' %', zahl: (d) => d.b.score, hoch: true },
      { label: 'Preis', wert: (d) => d.l.kind === 'kauf' ? U.eur(d.l.kaufpreis) : U.eur(d.l.warm) + ' warm', zahl: (d) => d.l.kind === 'kauf' ? d.l.kaufpreis : d.l.warm, hoch: false },
      { label: 'Echte Monatskosten', wert: (d) => U.eur(d.k.monatSumme), zahl: (d) => d.k.monatSumme, hoch: false },
      { label: 'Einmalig beim Einzug', wert: (d) => U.eur(d.k.einmalSumme), zahl: (d) => d.k.einmalSumme, hoch: false },
      { label: 'Erstes Jahr insgesamt', wert: (d) => U.eur(d.k.erstesJahr), zahl: (d) => d.k.erstesJahr, hoch: false },
      { label: 'Belastungsquote', wert: (d) => d.k.quote ? d.k.quote + ' %' : '–', zahl: (d) => d.k.quote || 999, hoch: false },
      { label: 'Preis je m²', wert: (d) => d.l.kind === 'kauf' ? U.num(Math.round(d.l.kaufpreis / d.l.flaeche)) + ' €' : U.dec(d.l.kalt / d.l.flaeche) + ' €', zahl: (d) => d.l.kind === 'kauf' ? d.l.kaufpreis / d.l.flaeche : d.l.kalt / d.l.flaeche, hoch: false },
      { label: 'Zur Vergleichsmiete', wert: (d) => d.b.mietCheck ? (d.b.mietCheck.diff >= 0 ? '+' : '') + d.b.mietCheck.diff + ' %' : d.b.kaufCheck ? (d.b.kaufCheck.diff >= 0 ? '+' : '') + d.b.kaufCheck.diff + ' %' : '–', zahl: (d) => d.b.mietCheck ? d.b.mietCheck.diff : d.b.kaufCheck ? d.b.kaufCheck.diff : 0, hoch: false },
      { label: 'Zimmer', wert: (d) => U.dec(d.l.zimmer), zahl: (d) => d.l.zimmer, hoch: true },
      { label: 'Fläche', wert: (d) => d.l.flaeche + ' m²', zahl: (d) => d.l.flaeche, hoch: true },
      { label: 'Baujahr', wert: (d) => String(d.l.baujahr) + (d.l.saniert ? ' (san.)' : ''), zahl: (d) => d.l.baujahr, hoch: true },
      { label: 'Energie', wert: (d) => d.l.energie ? d.l.energie.klasse + ' · ' + d.l.energie.kwh + ' kWh' : 'entfällt',
        zahl: (d) => d.l.energie ? -A.ENERGIE_RANG[d.l.energie.klasse] : -99, hoch: true },
      { label: 'Heizung', wert: (d) => d.l.energie ? d.l.energie.heizung : 'entfällt' },
      { label: 'Etage', wert: (d) => (d.l.etage === 0 ? 'EG' : d.l.etage >= d.l.etagen ? 'DG' : d.l.etage + '. OG') + ' von ' + d.l.etagen },
      { label: 'Kaution', wert: (d) => d.l.kind === 'kauf' ? '–' : d.l.kaution ? U.eur(d.l.kalt * d.l.kaution) : 'keine', zahl: (d) => d.l.kalt * d.l.kaution, hoch: false },
      { label: 'Provision', wert: (d) => d.l.provision ? U.dec(d.l.provision) + (d.l.kind === 'kauf' ? ' %' : ' KM') : 'frei', zahl: (d) => d.l.provision, hoch: false },
      { label: 'Arbeitsweg', wert: (d) => d.b.pendel ? U.minutesLabel(d.b.pendel.min) : '–', zahl: (d) => d.b.pendel ? d.b.pendel.min : 999, hoch: false },
      { label: 'Frei ab', wert: (d) => U.daysSince(d.l.freiAb) > 0 ? 'sofort' : U.dateDE(d.l.freiAb) },
      { label: 'Interessenten', wert: (d) => String(d.l.stats.bewerber), zahl: (d) => d.l.stats.bewerber, hoch: false },
      { label: 'Anbieter antwortet', wert: (d) => d.l.anbieter.quote + ' %', zahl: (d) => d.l.anbieter.quote, hoch: true },
      { label: 'Prüfhinweis', wert: (d) => d.b.risiko.stufe === 'ok' ? 'unauffällig' : d.b.risiko.stufe === 'achtung' ? 'genau lesen' : 'Warnung', zahl: (d) => -d.b.risiko.punkte, hoch: true },
      { label: 'Auffällige Klauseln', wert: (d) => { const f = A.klauselCheck(d.l); return f.length ? f.length + ' (' + f[0].titel + ')' : 'keine'; }, zahl: (d) => -A.klauselCheck(d.l).length, hoch: true }
    ];

    /* Ausstattung: alle vorkommenden Merkmale nebeneinander. */
    const alleMerkmale = U.uniq(objekte.reduce((a, l) => a.concat(l.ausstattung), [])).sort();

    return {
      titel: 'Vergleich',
      html: h`<div class="seite">
        <header class="seite__kopf">
          <h1>${ico('waage')}Vergleich</h1>
          <p class="seite__unter">${objekte.length} von ${S.maxVergleich()} Plätzen belegt. Der jeweils beste Wert je Zeile ist hervorgehoben.
            ${!P.istPlus() ? raw('<a href="#/plus">Mit Plus sind es sechs.</a>') : ''}</p>
        </header>
        <div class="vergleich__rolle">
          <table class="vergleich">
            <thead>
              <tr>
                <th scope="col" class="vergleich__ecke">Merkmal</th>
                ${daten.map((d) => h`<th scope="col">
                  <a class="vergleich__kopf" href="#/objekt/${d.l.id}">
                    <span class="vergleich__bild">${raw(NW.img.make(d.l, 0))}</span>
                    <b>${U.truncate(d.l.titel, 40)}</b>
                    <i>${d.l.viertel}, ${d.l.stadt}</i>
                  </a>
                  <button type="button" class="link" data-tu="vergleich" data-id="${d.l.id}">entfernen</button>
                </th>`)}
              </tr>
            </thead>
            <tbody>
              ${zeilen.map((z) => {
        let bestIdx = -1;
        if (z.zahl) {
          const werte = daten.map(z.zahl);
          const best = z.hoch ? Math.max.apply(null, werte) : Math.min.apply(null, werte);
          if (werte.filter((w) => w === best).length < werte.length) bestIdx = werte.indexOf(best);
        }
        return h`<tr><th scope="row">${z.label}</th>
                  ${daten.map((d, i) => h`<td class="${i === bestIdx ? 'is-best' : ''}">${z.wert(d)}</td>`)}
                </tr>`;
      })}
              <tr class="vergleich__trenner"><th scope="row" colspan="${daten.length + 1}">Ausstattung</th></tr>
              ${alleMerkmale.map((m) => h`<tr><th scope="row">${m}</th>
                ${daten.map((d) => h`<td>${d.l.ausstattung.indexOf(m) >= 0 ? ui.ico('check') : raw('<span class="fehlt">–</span>')}</td>`)}
              </tr>`)}
            </tbody>
          </table>
        </div>
        <p><button type="button" class="knopf knopf--still" data-tu="vergleich-kopieren">${ico('kopieren')}Vergleich als Text kopieren</button></p>
      </div>`
    };
  }

          <div class="leer">${ico('glocke')}
            <h3>Kein Suchauftrag angelegt</h3>

            <p><a class="knopf" href="#/suche">${ico('suche')}Filter einstellen</a></p></div>
        </div>`

        + 'einen Auftrag. Mit Plus sind es beliebig viele – alle mit sofortiger Meldung.')}
        </div>` : ''}
        ${s.agenten.map((a) => {
        const t = S.agentTreffer(a);
        return h`<section class="agent ${a.aktiv ? '' : 'is-aus'}">
            <header class="agent__kopf">
              <div>
                <h2>${a.name}</h2>
                <p>${beschreibeFilter(a.filter)}</p>
              </div>
              <div class="agent__zahlen">
                <b class="${t.neu.length ? 'is-neu' : ''}">${t.neu.length}</b><span>neu</span>
                <b>${t.alle.length}</b><span>gesamt</span>
              </div>
            </header>
            ${t.neu.length ? h`<div class="ergebnisse__liste ergebnisse__liste--drei">
              ${t.neu.slice(0, 3).map((l) => ui.inseratsKarte(l, A.bewerten(l, s.profil), { kompakt: true }))}
            </div>` : h`<p class="agent__leer">Seit ${U.since(a.zuletztGeprueft)} nichts Neues.</p>`}
            <footer class="agent__fuss">
              <button type="button" class="knopf knopf--klein" data-tu="agent-oeffnen" data-id="${a.id}">${ico('suche')}In der Suche öffnen</button>
              ${t.neu.length ? h`<button type="button" class="knopf knopf--klein knopf--still" data-tu="agent-gelesen" data-id="${a.id}">${ico('check')}Als gesehen markieren</button>` : ''}
              <label class="schalter schalter--klein">
                <input type="checkbox" data-tu-change="agent-aktiv" data-id="${a.id}" ${a.aktiv ? 'checked' : ''}>
                <span>aktiv</span></label>
              <button type="button" class="link" data-tu="agent-weg" data-id="${a.id}">löschen</button>
            </footer>
          </section>`;
      })}
      </div>`
    };
  }

  function beschreibeFilter(f) {
    const teile = [];
    teile.push(f.arten.map((a) => ui.ART_LABEL[a]).join(' + '));
    if (f.staedte.length) teile.push(f.staedte.join(', '));
    if (f.viertel.length) teile.push(f.viertel.map((v) => v.split('|')[1]).join(', '));
    if (f.preisMax) teile.push('bis ' + U.eur(f.preisMax));
    if (f.zimmerMin) teile.push('ab ' + U.dec(f.zimmerMin) + ' Zi.');
    if (f.flaecheMin) teile.push('ab ' + f.flaecheMin + ' m²');
    if (f.ausstattung.length) teile.push(f.ausstattung.join(', '));
    if (f.provisionsfrei) teile.push('provisionsfrei');
    if (f.maxPendel) teile.push('höchstens ' + f.maxPendel + ' Min. Weg');
    return teile.join(' · ');
  }

  /* ---------------------- Anfragen zu eigenen Inseraten ----------------------

     Hier wird sichtbar, was auf der Preisseite behauptet wird: Anfragen
     mit Plus stehen oben. Damit das kein blindes Versprechen bleibt,
     steht daneben, warum – und zwar für die anbietende Seite lesbar. */

  function eigenesPostfach() {
    const s = S.get();
    if (!s.eigeneInserate.length) return '';
    return h`<section class="block">
      <div class="block__kopfzeile">
        <h2>${ico('nachricht')}Anfragen zu deinen Inseraten</h2>
        <span class="fein">${s.eigeneInserate.length} ${U.plural(s.eigeneInserate.length, 'Inserat', 'Inserate')}</span>
      </div>
      ${s.eigeneInserate.map((e) => {
      const anfragen = P.anfragenSortieren(NW.data.anfragenFuer(e));
      const mitPlus = anfragen.filter((a) => a.plus).length;
      return h`<article class="anfragen">
          <header class="anfragen__kopf">
            <b><a href="#/objekt/${e.id}">${U.truncate(e.titel, 52)}</a></b>
            <span>${anfragen.length} ${U.plural(anfragen.length, 'Anfrage', 'Anfragen')}${mitPlus
        ? ' · ' + mitPlus + ' mit Plus' : ''}</span>
          </header>
          <ol class="anfragen__liste">
            ${anfragen.map((a) => h`<li class="${a.plus ? 'is-plus' : ''}">
              ${raw(NW.img.avatar(a.name, 34))}
              <div>
                <b>${a.name}${a.plus ? ui.badge('Plus', 'info', 'plus5') : ''}
                  ${a.unterlagen ? ui.badge('Unterlagen dabei', 'gut') : ''}</b>
                <i>${U.truncate(a.text, 96)}</i>
                <span>${U.since(a.zeit)}</span>
              </div>
            </li>`)}
          </ol>
          <details class="anfragen__warum">
            <summary>${ico('info')}Warum stehen manche Anfragen oben?</summary>
            <p>Anfragen von Nutzenden mit <b>Nestwerk Plus</b> werden zuerst gezeigt und sind mit „Plus“
              gekennzeichnet. Das ist bezahlte Sichtbarkeit, kein Urteil über die Person: Nestwerk sagt damit
              nichts darüber, wer besser zu deiner Wohnung passt. Darunter folgen alle weiteren in der
              Reihenfolge des Eingangs – gelöscht oder versteckt wird keine.</p>
            <p class="fein">Du kannst die Reihenfolge ignorieren; die Liste zeigt alle Anfragen vollständig.</p>
          </details>
          <p class="fein anfragen__demo">${ico('info')}Beispielanfragen dieser Vorführung. Es gibt keinen
            Server, also auch niemanden, der wirklich geschrieben hätte – die Namen und Texte entstehen aus der
            Kennung des Inserats und bleiben deshalb gleich.</p>
        </article>`;
    })}
    </section>`;
  }

  function nachrichten(route) {
    const s = S.get();
    const aktivId = route.arg || (s.threads[0] ? s.threads[0].id : null);
    const aktiv = s.threads.find((t) => t.id === aktivId);
    if (aktiv && aktiv.ungelesen) setTimeout(() => { S.threadGelesen(aktiv.id); ui.aktualisiereZaehler(); }, 400);

    if (!s.threads.length) {
      return {
        titel: 'Nachrichten',
        html: h`<div class="seite seite--schmal">
          <header class="seite__kopf"><h1>${ico('nachricht')}Nachrichten</h1></header>
          ${eigenesPostfach()}
          <div class="leer">${ico('nachricht')}<h3>Noch kein eigener Verlauf</h3>
            <p>Sobald du ein Inserat anschreibst, erscheint der Verlauf hier.</p>
            <p><a class="knopf" href="#/suche">${ico('suche')}Zur Suche</a></p></div></div>`
      };
    }

    return {
      titel: 'Nachrichten',
      html: h`<div class="seite">
        <header class="seite__kopf"><h1>${ico('nachricht')}Nachrichten</h1></header>
        ${eigenesPostfach()}
        <div class="post">
          <nav class="post__liste" aria-label="Verläufe">
            ${s.threads.map((t) => {
        const l = NW.data.byId[t.listingId];
        const letzte = t.nachrichten[t.nachrichten.length - 1];
        return h`<a class="post__eintrag ${t.id === aktivId ? 'is-an' : ''}" href="#/nachrichten/${t.id}">
                ${raw(NW.img.avatar(t.partner, 40))}
                <div>
                  <b>${t.partner}${t.ungelesen ? raw('<i class="punkt" aria-label="ungelesen"></i>') : ''}</b>
                  <span>${l ? U.truncate(l.titel, 34) : 'Inserat entfernt'}</span>
                  <i>${letzte ? U.truncate(letzte.text.replace(/\n/g, ' '), 44) : ''}</i>
                </div>
              </a>`;
      })}
          </nav>
          <section class="post__verlauf" aria-label="Verlauf">
            ${aktiv ? verlauf(aktiv) : h`<p class="post__leer">Wähle links einen Verlauf.</p>`}
          </section>
        </div>
      </div>`
    };
  }

  function verlauf(t) {

    return h`<header class="post__kopf">
        ${raw(NW.img.avatar(t.partner, 44))}

          ${l ? h`<a href="#/objekt/${l.id}">${l.titel}</a>` : ''}</div>
        ${l ? h`<span class="post__quote">antwortet in ${l.anbieter.quote} % der Fälle</span>` : ''}
      </header>
      <div class="post__blasen">
        ${t.nachrichten.map((n) => h`<div class="blase blase--${n.von}">
          <p>${raw(U.esc(n.text).replace(/\n/g, '<br>'))}</p>
          <time>${U.since(n.zeit)}</time>
        </div>`)}
        ${wartet ? h`<p class="post__warten">${ico('verlauf')}Abgeschickt. In dieser Vorführung antwortet niemand –

          ${l ? (l.anbieter.antwortStd < 24 ? l.anbieter.antwortStd + ' Stunden' : Math.round(l.anbieter.antwortStd / 24) + ' Tagen') : 'einiger Zeit'}.</p>` : ''}

      <form class="post__feld" data-tu-submit="post-senden" data-id="${t.id}">

        <textarea id="post-text" rows="2" placeholder="Antwort schreiben…"></textarea>
        <button type="submit" class="knopf">${ico('nachricht')}Senden</button>
      </form>`;
  }

  function umzug() {
    const s = S.get();
    const datum = S.einzugsdatum();
    const plan = S.umzugsPlan();
    const erledigt = plan.filter((a) => a.erledigt).length;
    const gruppen = {};
    plan.forEach((a) => { (gruppen[a.gruppe] = gruppen[a.gruppe] || []).push(a); });

    return {
      titel: 'Umzug',
      html: h`<div class="seite seite--schmal">

          <h1>${ico('umzug')}Umzugsplan</h1>
          <p class="seite__unter">Zwanzig Aufgaben mit Fristen, die sich aus deinem Einzugstermin ergeben.
            Zwei davon haben harte gesetzliche Grenzen – die sind markiert.</p>
        </header>

        <section class="block">
          <label class="feld"><span>Geplanter Einzug</span>
            <input type="date" value="${datum}" data-tu-change="umzug-datum"></label>
          ${datum ? h`<p class="fein">${!s.einzugsdatum ? 'Übernommen aus deinem Profil. ' : ''}Die Kündigung der alten

    ui.neuZeichnen();

  A_('umzug-datum', (el) => { S.set({ einzugsdatum: el.value }, 'umzug'); ui.neuZeichnen(); });
  A_('umzug-check', (el) => { S.umzugSetzen(el.dataset.id, el.checked); ui.neuZeichnen(); });

  A_('umzug-kopieren', () => {
    const plan = S.umzugsPlan();
    const zeilen = ['Umzugsplan', ''];
    plan.forEach((a) => {
      zeilen.push((a.erledigt ? '[x] ' : '[ ] ') + (a.faellig ? U.dateDE(a.faellig) + ' – ' : '') + a.label +

    ui.AKTIONEN.kopieren({ dataset: { text: zeilen.join('\n') } });

  ui.ansichten.vergleich = vergleich;
  ui.ansichten.agenten = agenten;
  ui.ansichten.nachrichten = nachrichten;
  ui.ansichten.umzug = umzug;
  NW.viewTools = { beschreibeFilter };
})(window.NW = window.NW || {});

  /* ------------------------- Bilder zum Inserat -------------------------

     Ein Inserat ohne Fotos wird kaum angeklickt – das gilt beim Vermieten
     wie beim Verkaufen. Die Dateien bleiben auf diesem Gerät, deshalb
     werden sie vor dem Ablegen verkleinert: Ein Foto aus einer heutigen
     Kamera hat gut vier Megabyte, und der Speicher eines Browsers fasst
     insgesamt oft nur fünf. Verkleinert auf 1.400 Pixel Kantenlänge und
     als JPEG mit 78 Prozent Güte bleiben davon rund 150 Kilobyte, ohne
     dass man den Unterschied sieht. */

  const BILD_MAX = 10;
  const BILD_KANTE = 1400;
  const BILD_GUETE = 0.78;
  const BILD_TYPEN = ['image/jpeg', 'image/png', 'image/webp', 'image/heic', 'image/heif'];

  /* Zwischenspeicher, solange das Formular offen ist. */

  function verkleinern(datei) {
    return new Promise((gut, schlecht) => {
      const url = URL.createObjectURL(datei);
      const bild = new Image();
      bild.onload = () => {
        try {
          const faktor = Math.min(1, BILD_KANTE / Math.max(bild.naturalWidth, bild.naturalHeight));
          const b = Math.max(1, Math.round(bild.naturalWidth * faktor));
          const hh = Math.max(1, Math.round(bild.naturalHeight * faktor));
          const leinwand = document.createElement('canvas');
          leinwand.width = b; leinwand.height = hh;
          const stift = leinwand.getContext('2d');
          stift.drawImage(bild, 0, 0, b, hh);
          URL.revokeObjectURL(url);
          gut({ datei: leinwand.toDataURL('image/jpeg', BILD_GUETE), breite: b, hoehe: hh, text: '' });
        } catch (e) { URL.revokeObjectURL(url); schlecht(e); }
      };
      bild.onerror = () => { URL.revokeObjectURL(url); schlecht(new Error('Die Datei ließ sich nicht lesen.')); };
      bild.src = url;
    });
  }

  const bildGroesse = (b) => Math.round(b.datei.length * 0.75 / 1024) + ' kB';

  const R_VORGABE = {
    kaufpreis: 420000, flaeche: 85, eigenkapital: 90000, zins: 3.7, tilgung: 2.0,
    bundesland: 'NRW', makler: 3.57, miete: 1150, mietsteigerung: 2.0,
    wertsteigerung: 1.5, anlage: 4.0, hausgeld: 290, instand: 1.0, jahre: 15
  };
  let rWerte = Object.assign({}, R_VORGABE);

  function rechnen(w) {
    const grest = A.GRUNDERWERB[w.bundesland] || 6;
    const nebenkosten = w.kaufpreis * (grest + 2 + w.makler) / 100;
    const gesamt = w.kaufpreis + nebenkosten;
    const darlehen = Math.max(0, gesamt - w.eigenkapital);
    const rate = darlehen * (w.zins + w.tilgung) / 100 / 12;
    const mZins = w.zins / 100 / 12;

    let rest = darlehen, zinsSumme = 0;
    let wert = w.kaufpreis;
    let depot = Math.max(0, w.eigenkapital - 0);  /* Mieter legt das Eigenkapital an */
    let miete = w.miete;
    let mieteGesamt = 0, kaeuferAusgaben = 0;
    const mAnlage = w.anlage / 100 / 12;
    const mWert = w.wertsteigerung / 100 / 12;
    const verlauf = [];

    for (let m = 1; m <= w.jahre * 12; m++) {
      /* Käufer */
      const z = rest * mZins;
      const tilg = Math.max(0, rate - z);
      if (rest > 0) { zinsSumme += z; rest = Math.max(0, rest - tilg); }
      const instandMonat = w.kaufpreis * w.instand / 100 / 12;
      const kaeuferMonat = (rest > 0 || tilg > 0 ? rate : 0) + w.hausgeld + instandMonat;
      kaeuferAusgaben += kaeuferMonat;
      wert *= (1 + mWert);

      /* Mieter: zahlt Miete, legt die Differenz an */
      mieteGesamt += miete;
      const differenz = kaeuferMonat - miete;
      depot = depot * (1 + mAnlage) + Math.max(0, differenz);
      if (differenz < 0) depot += differenz;   /* Miete teurer als Kauf: Depot schrumpft */
      if (depot < 0) depot = 0;
      if (m % 12 === 0) {
        miete *= (1 + w.mietsteigerung / 100);
        verlauf.push({
          jahr: m / 12,
          kaeufer: Math.round(wert - rest),
          mieter: Math.round(depot)
        });
      }
    }

    return {
      nebenkosten: Math.round(nebenkosten), gesamt: Math.round(gesamt), darlehen: Math.round(darlehen),
      rate: Math.round(rate), restschuld: Math.round(rest), zinsSumme: Math.round(zinsSumme),
      immobilienwert: Math.round(wert),
      vermoegenKauf: Math.round(wert - rest),
      vermoegenMiete: Math.round(depot),
      kaeuferAusgaben: Math.round(kaeuferAusgaben), mieteGesamt: Math.round(mieteGesamt),
      erstesJahrRate: Math.round(rate + w.hausgeld + w.kaufpreis * w.instand / 100 / 12),
      verlauf, grest
    };
  }

  function verlaufGrafik(v) {
    if (!v.length) return '';
    const max = Math.max.apply(null, v.map((p) => Math.max(p.kaeufer, p.mieter, 1)));
    const min = Math.min.apply(null, v.map((p) => Math.min(p.kaeufer, p.mieter, 0)));
    const B = 640, H = 240, links = 62, unten = 24, pad = 10;
    const x = (i) => links + i / Math.max(1, v.length - 1) * (B - links - pad);
    const y = (val) => H - unten - (val - min) / Math.max(1, max - min) * (H - unten - pad);
    const linie = (feld) => v.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[feld]).toFixed(1)).join('');

    /* Waagerechte Hilfslinien mit Beschriftung in Tausend Euro. */
    let raster = '';
    const stufen = 4;
    for (let i = 0; i <= stufen; i++) {
      const wert = min + (max - min) * i / stufen;
      const yy = y(wert).toFixed(1);
      raster += '<line x1="' + links + '" y1="' + yy + '" x2="' + (B - pad) + '" y2="' + yy +
        '" stroke="currentColor" opacity="' + (i === 0 ? '.32' : '.12') + '"/>' +
        '<text class="verlauf__achse" x="' + (links - 8) + '" y="' + (Number(yy) + 4) + '" text-anchor="end">' +
        U.num(Math.round(wert / 1000)) + 'k</text>';
    }

    /* Jahresmarken, höchstens sechs, damit es lesbar bleibt. */
    const schritt = Math.max(1, Math.ceil(v.length / 6));
    let jahre = '';
    v.forEach((p, i) => {
      if (i % schritt && i !== v.length - 1) return;
      jahre += '<text class="verlauf__achse" x="' + x(i).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle">' +
        p.jahr + '</text>';
    });
    jahre += '<text class="verlauf__achse" x="' + (B - pad) + '" y="' + (H - 7) +
      '" text-anchor="end" opacity=".7">Jahre</text>';

    const letzte = v[v.length - 1];
    return raw('<svg class="verlauf" viewBox="0 0 ' + B + ' ' + H + '" role="img" ' +
      'aria-label="Vermögensentwicklung: nach ' + letzte.jahr + ' Jahren ' + U.eur(letzte.kaeufer) +
      ' mit Kauf gegenüber ' + U.eur(letzte.mieter) + ' mit Miete und Anlage">' +
      raster + jahre +
      '<path d="' + linie('mieter') + '" fill="none" stroke="var(--akzent2)" stroke-width="2.6" stroke-linejoin="round"/>' +
      '<path d="' + linie('kaeufer') + '" fill="none" stroke="var(--akzent)" stroke-width="2.6" stroke-linejoin="round"/>' +
      '<circle cx="' + x(v.length - 1).toFixed(1) + '" cy="' + y(letzte.kaeufer).toFixed(1) + '" r="4.5" fill="var(--akzent)"/>' +
      '<circle cx="' + x(v.length - 1).toFixed(1) + '" cy="' + y(letzte.mieter).toFixed(1) + '" r="4.5" fill="var(--akzent2)"/>' +
      '</svg>');
  }

      const staedte = f.getAll('wunschStadt');

        grund: f.get('grund') || 'Veränderung.',
        suche: {
          staedte: staedte.length ? staedte : [d.city],

        flexibelAb: daten.freiAb,
        dreiecktauschOk: f.get('ringOk') === 'on',

  function protokollText() {
    const p = protokoll();
    const z = [];
    z.push('ÜBERGABEPROTOKOLL – ' + (p.art === 'auszug' ? 'Auszug' : 'Einzug'));
    z.push('');
    z.push('Objekt:        ' + (p.adresse || '—'));

    z.push('');
    z.push('ZÄHLERSTÄNDE');

/* =====================================================================
   Nestwerk – Marktdaten
   Wie sich die Mieten je Viertel entwickelt haben. Drei Reihen im
   Vergleich, dazu der Stadtdurchschnitt als ruhige Bezugslinie.

   Die Farben der Reihen sind auf Farbfehlsichtigkeit geprüft (alle
   Paare, hell und dunkel). Zusätzlich trägt jede Linie am Ende ihren
   Namen und es gibt eine Tabellenansicht – beides notwendig, weil eine
   der drei Farben im hellen Modus knapp unter 3:1 Kontrast liegt.
   ===================================================================== */
(function (NW) {
  'use strict';

  const U = NW.util, ui = NW.ui, S = NW.store, W = NW.werkzeuge, P = NW.plan, G = NW.geo;
  const h = U.html, raw = U.raw, ico = U.svg;

  let sicht = { stadt: 'Köln', haupt: null, vergleich: [], tabelle: false };

  const MONATE = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

  function stadtWaehlen(stadt) {
    sicht.stadt = stadt;
    const c = G.cityByName[stadt];
    sicht.haupt = c.districtList[0].key;
    sicht.vergleich = [];
  }

  function reihenFuer() {
    const haupt = W.preisreihe(sicht.haupt);
    const weitere = sicht.vergleich.map((k) => W.preisreihe(k)).filter(Boolean);
    return [haupt].concat(weitere).filter(Boolean);
  }

  /* Stadtdurchschnitt als Bezug – bewusst keine Reihenfarbe, sondern grau. */
  function durchschnitt(reihen) {
    const c = G.cityByName[sicht.stadt];
    const alle = c.districtList.map((d) => W.preisreihe(d.key));
    const n = alle[0].punkte.length;
    const punkte = [];
    for (let i = 0; i < n; i++) {
      punkte.push({
        datum: alle[0].punkte[i].datum,
        monat: alle[0].punkte[i].monat,
        jahr: alle[0].punkte[i].jahr,
        wert: Math.round(U.sum(alle.map((a) => a.punkte[i].wert)) / alle.length * 100) / 100
      });
    }
    return { viertel: { name: sicht.stadt + ' im Mittel' }, punkte, jetzt: punkte[punkte.length - 1].wert };
  }

  /* ================================================================
     Liniendiagramm
     ================================================================ */

  function verlaufsDiagramm(reihen, mittel) {
    const B = 760, H = 300, links = 54, rechts = 118, oben = 16, unten = 32;
    const alle = reihen.concat([mittel]);
    const werte = alle.reduce((a, r) => a.concat(r.punkte.map((p) => p.wert)), []);
    let min = Math.min.apply(null, werte), max = Math.max.apply(null, werte);
    const luft = (max - min) * 0.14 || 1;
    min = Math.max(0, min - luft); max = max + luft;

    const n = reihen[0].punkte.length;
    const x = (i) => links + i / (n - 1) * (B - links - rechts);
    const y = (v) => H - unten - (v - min) / (max - min) * (H - unten - oben);

    /* Ruhiges Raster mit Beschriftung in Euro je Quadratmeter. */
    let raster = '';
    const stufen = 4;
    for (let i = 0; i <= stufen; i++) {
      const v = min + (max - min) * i / stufen;
      const yy = y(v).toFixed(1);
      raster += '<line class="viz__raster" x1="' + links + '" y1="' + yy + '" x2="' + (B - rechts) + '" y2="' + yy + '"/>' +
        '<text class="viz__achse" x="' + (links - 10) + '" y="' + (Number(yy) + 4) + '" text-anchor="end">' +
        U.dec(Math.round(v * 10) / 10) + '</text>';
    }

    /* Jahresmarken statt aller 36 Monate. */
    let xachse = '';
    reihen[0].punkte.forEach((p, i) => {
      if (p.monat !== 0 && i !== n - 1) return;
      xachse += '<text class="viz__achse" x="' + x(i).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' +
        (i === n - 1 ? MONATE[p.monat] + ' ' + String(p.jahr).slice(2) : String(p.jahr)) + '</text>';
    });

    const pfad = (r) => r.punkte.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.wert).toFixed(1)).join('');

    /* Bezugslinie zuerst, damit sie hinter den Reihen liegt. */
    let linien = '<path class="viz__mittel" d="' + pfad(mittel) + '"/>';
    let enden = '';
    reihen.forEach((r, si) => {
      linien += '<path class="viz__linie" style="stroke:var(--serie-' + (si + 1) + ')" d="' + pfad(r) + '"/>';
      const letzterY = y(r.punkte[n - 1].wert);
      linien += '<circle class="viz__ende" style="fill:var(--serie-' + (si + 1) + ')" cx="' + x(n - 1).toFixed(1) +
        '" cy="' + letzterY.toFixed(1) + '" r="4.5"/>';
      enden += '<text class="viz__endname" x="' + (x(n - 1) + 10) + '" y="' + (letzterY - 3).toFixed(1) + '">' +
        U.esc(U.truncate(r.viertel.name, 14)) + '</text>' +
        '<text class="viz__endwert" x="' + (x(n - 1) + 10) + '" y="' + (letzterY + 11).toFixed(1) + '">' +
        U.esc(U.dec(r.punkte[n - 1].wert) + ' €/m²') + '</text>';
    });
    const mittelY = y(mittel.punkte[n - 1].wert);
    enden += '<text class="viz__endmittel" x="' + (x(n - 1) + 10) + '" y="' + (mittelY + 4).toFixed(1) + '">Mittel</text>';

    return raw('<div class="viz" data-min="' + min + '" data-max="' + max + '" data-n="' + n +
      '" data-links="' + links + '" data-rechts="' + rechts + '" data-oben="' + oben + '" data-unten="' + unten + '">' +
      '<svg class="viz__svg" viewBox="0 0 ' + B + ' ' + H + '" role="img" aria-label="' +
      U.esc('Mietentwicklung je Quadratmeter über ' + Math.round(n / 12) + ' Jahre: ' +
        reihen.map((r) => r.viertel.name + ' zuletzt ' + U.dec(r.punkte[n - 1].wert) + ' Euro').join(', ')) + '">' +
      raster + xachse +
      '<g class="viz__fadenkreuz" hidden><line class="viz__faden" y1="' + oben + '" y2="' + (H - unten) + '"/></g>' +
      linien + enden +
      '<rect class="viz__flaeche" x="' + links + '" y="' + oben + '" width="' + (B - links - rechts) +
      '" height="' + (H - unten - oben) + '" fill="transparent"/>' +
      '</svg><div class="viz__tip" hidden></div></div>');
  }

  /* ================================================================

          <span class="vizbalken__spur"><i style="width:${(a.jetzt / max * 100).toFixed(1)}%"></i></span>

     ================================================================ */

  function fadenkreuz(wurzel, reihen, mittel) {
    const box = U.$('.viz', wurzel);
    if (!box) return;
    const svg = box.querySelector('.viz__svg');
    const tip = box.querySelector('.viz__tip');
    const gruppe = box.querySelector('.viz__fadenkreuz');
    const faden = box.querySelector('.viz__faden');
    const n = Number(box.dataset.n);
    const links = Number(box.dataset.links), rechts = Number(box.dataset.rechts);
    const B = 760;

    function zeigen(e) {
      const kasten = svg.getBoundingClientRect();
      const sx = (e.clientX - kasten.left) / kasten.width * B;
      const anteil = (sx - links) / (B - links - rechts);
      if (anteil < -0.02 || anteil > 1.02) return verstecken();
      const i = U.clamp(Math.round(anteil * (n - 1)), 0, n - 1);
      const x = links + i / (n - 1) * (B - links - rechts);
      faden.setAttribute('x1', x); faden.setAttribute('x2', x);
      gruppe.hidden = false;

      const p0 = reihen[0].punkte[i];
      tip.hidden = false;
      tip.innerHTML = '<b>' + MONATE[p0.monat] + ' ' + p0.jahr + '</b>' +
        reihen.map((r, si) => '<span><i style="background:var(--serie-' + (si + 1) + ')"></i>' +
          U.esc(r.viertel.name) + ' <em>' + U.dec(r.punkte[i].wert) + ' €/m²</em></span>').join('') +
        '<span class="viz__tip-mittel"><i></i>im Mittel <em>' + U.dec(mittel.punkte[i].wert) + ' €/m²</em></span>';
      const relX = x / B * kasten.width;
      tip.style.left = U.clamp(relX, 100, kasten.width - 100) + 'px';
    }

    function verstecken() {
      gruppe.hidden = true;
      tip.hidden = true;
    }

    svg.addEventListener('pointermove', zeigen);
    svg.addEventListener('pointerleave', verstecken);
    svg.addEventListener('pointerdown', zeigen);
  }

        inhalt: /^image\//.test(d.typ)
          ? h`<img class="tresor__vorschau" src="${url}" alt="${d.name}">`
          : h`<p>Vorschau für diesen Dateityp gibt es hier nicht. Du kannst die Datei entschlüsselt sichern.</p>`,
        fuss: h`<button type="button" class="knopf knopf--still" data-tu="tresor-sichern" data-id="${el.dataset.id}">${ico('speichern')}Entschlüsselt sichern</button>
          <button type="button" class="knopf" data-tu="dialog-zu">Schließen</button>`,
        beimSchliessen: () => URL.revokeObjectURL(url)
      });
    }, (e) => ui.toast(e.message, 'schlecht'));
  });

  A_('tresor-sichern', (el) => {
    T.oeffnen(el.dataset.id).then((d) => {
      ui.dateiSichern(d.name, d.bytes, d.typ || 'application/octet-stream');
    }, (e) => ui.toast(e.message, 'schlecht'));
  });

  /* --------------------- Freigabe erstellen --------------------- */

  function freigabeDialog(objektId, empfaengerVorschlag) {
    if (!T.istOffen()) { ui.toast('Öffne zuerst den Tresor.', 'schlecht'); ui.gehe('tresor'); return; }
    if (!dokumente.length) { ui.toast('Im Tresor liegt noch nichts.', 'schlecht'); ui.gehe('tresor'); return; }
    ui.dialog({
      titel: 'Unterlagen freigeben',
      breit: true,
      inhalt: h`<p>Verschickt wird kein Anhang, sondern ein Verweis, der von selbst erlischt. Wähl nur aus,
          was in diesem Schritt wirklich gebraucht wird.</p>
        <fieldset class="filter__gruppe"><legend>Dokumente</legend>
          ${dokumente.map((d) => h`<label class="schalter">
            <input type="checkbox" data-freigabe="${d.id}" ${T.HEIKEL.indexOf(d.art) >= 0 ? '' : 'checked'}>
            <span><b>${d.name || artName(d.art)}</b>
              <i>${artName(d.art)} · ${kb(d.groesse)}${T.HEIKEL.indexOf(d.art) >= 0
        ? ' · vor der Besichtigung besser nicht' : ''}</i></span></label>`)}
        </fieldset>
        <div class="formraster">
          <label class="feld"><span>Empfänger (nur für deine Übersicht)</span>
            <input type="text" id="freigabe-empfaenger" value="${empfaengerVorschlag || ''}"></label>
          <label class="feld"><span>Gültig für</span>
            <select id="freigabe-tage">
              <option value="3">3 Tage</option>
              <option value="7" selected>7 Tage</option>
              <option value="14">14 Tage</option>
              <option value="30">30 Tage</option>
            </select></label>
          <label class="feld"><span>Höchstens abrufbar</span>
            <select id="freigabe-abrufe">
              <option value="1">einmal</option>
              <option value="3" selected>dreimal</option>
              <option value="5">fünfmal</option>
              <option value="10">zehnmal</option>
            </select></label>
        </div>
        <p class="fein">Kürzer und seltener ist besser. Für eine Besichtigung reicht meist ein Abruf über drei Tage.</p>`,
      fuss: h`<button type="button" class="knopf knopf--still" data-tu="dialog-zu">Abbrechen</button>
        <button type="button" class="knopf" data-tu="freigabe-erstellen" data-objekt="${objektId || ''}">${ico('teilen')}Verweis erzeugen</button>`
    });
  }

  A_('freigabe-neu', () => freigabeDialog(null, ''));

  /* --------------------- Freigabe im Anschreiben ---------------------
     Ein zweiter Dialog würde den ersten ersetzen und den getippten Text
     mitnehmen. Deshalb steckt die Freigabe hier direkt im Anschreiben. */

  function freigabeAbschnitt(objektId, empfaenger, optionen) {
    const opt = optionen || {};
    const rahmen = (inhalt) => h`<fieldset class="filter__gruppe"><legend>Unterlagen sicher mitschicken</legend>
      ${inhalt}</fieldset>`;
    const hinweis = (text, knopf) => rahmen(h`<p class="fein">${text}</p>
      <p class="werkzeug__weiter"><a class="knopf knopf--klein knopf--still" href="#/tresor">${ico('schloss')}${knopf}</a></p>`);

    if (!T.verfuegbar()) return '';
    if (!T.eingerichtet()) {
      return hinweis('Statt Dateien anzuhängen, die für immer im fremden Postfach liegen, kannst du deine '
        + 'Unterlagen einmal verschlüsselt ablegen und hier nur einen Verweis mitschicken, der nach gesetzter '
        + 'Frist erlischt.', 'Tresor einrichten');
    }
    if (!T.istOffen()) {
      return hinweis('Dein Tresor ist gesperrt. Öffne ihn, um statt Anhängen einen befristeten Verweis '
        + 'mitzuschicken.', 'Tresor öffnen');
    }
    if (!dokumente.length) {
      return hinweis('Im Tresor liegt noch nichts. Lade dort ab, was regelmäßig verlangt wird – danach '
        + 'genügt hier ein Verweis.', 'Unterlagen ablegen');
    }
    return rahmen(h`<p class="fein">${opt.einleitung || 'Verschickt wird kein Anhang, sondern ein Verweis, '
      + 'der von selbst erlischt und sich widerrufen lässt. Heikles bleibt bewusst abgewählt.'}</p>
      ${dokumente.map((d) => h`<label class="schalter">
        <input type="checkbox" data-freigabe="${d.id}" ${T.HEIKEL.indexOf(d.art) >= 0 ? '' : 'checked'}>
        <span><b>${d.name || artName(d.art)}</b>
          <i>${artName(d.art)} · ${kb(d.groesse)}${T.HEIKEL.indexOf(d.art) >= 0
      ? ' · vor der Besichtigung besser nicht' : ''}</i></span></label>`)}
      <div class="formraster">
        <label class="feld"><span>Gültig für</span>
          <select id="freigabe-tage">
            <option value="3">3 Tage</option>
            <option value="7" selected>7 Tage</option>
            <option value="14">14 Tage</option>
          </select></label>
        <label class="feld"><span>Höchstens abrufbar</span>
          <select id="freigabe-abrufe">
            <option value="1">einmal</option>
            <option value="3" selected>dreimal</option>
            <option value="5">fünfmal</option>
          </select></label>
      </div>
      <input type="hidden" id="freigabe-empfaenger" value="${empfaenger || ''}">
      ${opt.ohneKnopf ? '' : h`<p class="werkzeug__weiter">
        <button type="button" class="knopf knopf--klein" data-tu="anschreiben-verweis"
          data-objekt="${objektId || ''}" data-ziel="#anschreiben-text">${ico('teilen')}Verweis erzeugen und einfügen</button>
      </p>`}`);
  }

  A_('anschreiben-verweis', (el) => {
    const ids = U.$$('[data-freigabe]').filter((x) => x.checked).map((x) => x.dataset.freigabe);
    if (!ids.length) { ui.toast('Wähle mindestens ein Dokument.', 'schlecht'); return; }
    T.freigabeErstellen({
      dokumente: ids,
      empfaenger: (U.$('#freigabe-empfaenger') || {}).value || '',
      tage: Number((U.$('#freigabe-tage') || {}).value) || 7,
      maxAbrufe: Number((U.$('#freigabe-abrufe') || {}).value) || 3,
      objektId: el.dataset.objekt || null
    }).then((f) => {
      const feld = U.$(el.dataset.ziel || '#anschreiben-text');
      if (feld) {
        /* Bewusst eng: Nur ein zuvor von hier eingefügter Block wird
           ersetzt. Ein ähnlich beginnender Satz aus dem Anschreiben
           bleibt stehen. */
        feld.value = feld.value.replace(/\n*Meine Unterlagen liegen verschlüsselt bereit[\s\S]*$/, '')
          .replace(/\s+$/, '')
          + '\n\nMeine Unterlagen liegen verschlüsselt bereit. Dieser Verweis öffnet sie, gilt '
          + f.tage + ' ' + U.plural(f.tage, 'Tag', 'Tage') + ' und lässt sich ' + f.maxAbrufe + ' Mal öffnen:\n'
          + f.link;
      }
      /* Der Abschnitt hat seinen Zweck erfüllt – an seiner Stelle steht
         jetzt, was verschickt wird. */
      const feldsatz = el.closest('fieldset');
      if (feldsatz) {
        feldsatz.innerHTML = String(h`<legend>Unterlagen sicher mitschicken</legend>
          <p class="gut-meldung">${ico('pruefen')}Verweis erzeugt und unten in den Text eingefügt:
            ${ids.length} ${U.plural(ids.length, 'Dokument', 'Dokumente')}, gültig ${f.tage} ${U.plural(f.tage, 'Tag', 'Tage')},
            ${f.maxAbrufe} ${U.plural(f.maxAbrufe, 'Abruf', 'Abrufe')}.</p>
          <p class="fein">Widerrufen kannst du ihn jederzeit im <a href="#/tresor">Dokumententresor</a>.</p>`);
      }
      laden();
    }, (e) => ui.toast(e.message, 'schlecht'));
  });

  A_('freigabe-erstellen', (el) => {
    const ids = U.$$('[data-freigabe]').filter((x) => x.checked).map((x) => x.dataset.freigabe);
    if (!ids.length) { ui.toast('Wähle mindestens ein Dokument.', 'schlecht'); return; }
    T.freigabeErstellen({
      dokumente: ids,
      empfaenger: (U.$('#freigabe-empfaenger') || {}).value || '',
      tage: Number((U.$('#freigabe-tage') || {}).value) || 7,
      maxAbrufe: Number((U.$('#freigabe-abrufe') || {}).value) || 3,
      objektId: el.dataset.objekt || null
    }).then((f) => {
      ui.dialogZu();
      ui.dialog({
        titel: 'Verweis erzeugt',
        breit: true,
        inhalt: h`<p>Dieser Verweis gilt <b>${f.tage} Tage</b> und lässt sich <b>${f.maxAbrufe} Mal</b> öffnen.
            Danach ist er wertlos. Im Tresor kannst du ihn jederzeit vorher widerrufen.</p>
          <label class="feld"><span>Verweis</span>
            <textarea rows="3" id="freigabe-link" readonly>${f.link}</textarea></label>
          <div class="hinweisbox">${ico('warnung')}
            <div><b>Der Schlüssel steckt im Verweis</b>
            <p>Alles hinter dem Rautezeichen ist der Schlüssel. Wer den Verweis weitergibt, gibt die Unterlagen
              weiter. Verschick ihn deshalb einzeln und nicht in Verteilern.</p></div>
          </div>
          <p class="fein">In dieser Vorführung liegen die verschlüsselten Dateien in diesem Browser – der
            Verweis funktioniert deshalb nur auf diesem Gerät.</p>`,
        fuss: h`<button type="button" class="knopf knopf--still" data-tu="kopieren" data-quelle="#freigabe-link">${ico('kopieren')}Verweis kopieren</button>
          <button type="button" class="knopf" data-tu="dialog-zu">Fertig</button>`
      });
      NW.viewTresor.letzterLink = f.link;
      laden();
      /* Die Dokumentenliste ist unverändert – die Freigabenliste nicht.
         Ohne diesen Anstoß bliebe die neue Freigabe unsichtbar. */
      if (ui.aktuell === 'tresor') ui.neuZeichnen();
    }, (e) => ui.toast(e.message, 'schlecht'));
  });

  A_('freigabe-widerrufen', (el) => {
    T.widerrufen(el.dataset.id);
    ui.neuZeichnen();
    ui.toast('Widerrufen. Der Verweis führt ab sofort ins Leere.', 'gut');
  });

  A_('freigabe-loeschen', (el) => {
    T.freigabeLoeschen(el.dataset.id);
    ui.neuZeichnen();
  });

  A_('freigabe-ansehen', (el) => {
    const d = (NW.viewTresor.geoeffnet || [])[Number(el.dataset.i)];
    if (!d) return;
    const url = URL.createObjectURL(new Blob([d.bytes], { type: d.typ || 'application/octet-stream' }));
    ui.dialog({
      titel: d.name, breit: true,
      inhalt: /^image\//.test(d.typ)
        ? h`<img class="tresor__vorschau" src="${url}" alt="${d.name}">`
        : h`<p>Für diesen Dateityp gibt es hier keine Vorschau. Sichere die Datei, um sie zu öffnen.</p>`,
      fuss: h`<button type="button" class="knopf" data-tu="dialog-zu">Schließen</button>`,
      beimSchliessen: () => URL.revokeObjectURL(url)
    });
  });

  A_('freigabe-sichern', (el) => {
    const d = (NW.viewTresor.geoeffnet || [])[Number(el.dataset.i)];
    if (!d) return;
    ui.dateiSichern(d.name, d.bytes, d.typ || 'application/octet-stream');
  });

  /* Für die Serienbewerbung: je Empfänger ein eigener Verweis. Ein
     geteilter wäre ein Generalschlüssel – jede Seite könnte ihn
     weiterreichen, und der Abrufzähler liefe für alle zusammen. */
  function verweisJeEmpfaenger(auftraege) {
    const ids = U.$$('[data-freigabe]').filter((x) => x.checked).map((x) => x.dataset.freigabe);
    if (!ids.length || !T.istOffen()) return Promise.resolve({});
    const tage = Number((U.$('#freigabe-tage') || {}).value) || 7;
    const maxAbrufe = Number((U.$('#freigabe-abrufe') || {}).value) || 3;
    /* Nacheinander: Jede Freigabe schreibt dieselbe Liste zurück, parallel
       würden sich die Schreibvorgänge gegenseitig überholen. */
    const ergebnis = {};
    return auftraege.reduce((kette, a) => kette.then(() => T.freigabeErstellen({
      dokumente: ids, empfaenger: a.empfaenger, objektId: a.objektId, tage, maxAbrufe
    }).then((f) => {
      ergebnis[a.objektId] = '\n\nMeine Unterlagen liegen verschlüsselt bereit. Dieser Verweis öffnet sie, gilt '
        + f.tage + ' ' + U.plural(f.tage, 'Tag', 'Tage') + ' und lässt sich ' + f.maxAbrufe + ' Mal öffnen:\n' + f.link;
    }).catch(() => { })), Promise.resolve()).then(() => { laden(); return ergebnis; });
  }

  ui.ansichten.tresor = seite;
  ui.ansichten.freigabe = freigabeAnsicht;
  NW.viewTresor = { laden, freigabeDialog, freigabeAbschnitt, verweisJeEmpfaenger,
    geoeffnet: [], letzterLink: '', artName };
})(window.NW = window.NW || {});

/* ===== view-recht.js ===== */
/* =====================================================================
   Nestwerk – Ansicht: Rechtliches

   Ein Bereich, mehrere Dokumente: #/recht zeigt die Übersicht,
   #/recht/impressum, /datenschutz, /agb, /widerruf, /melden,
   /barrierefreiheit, /kuendigen und /angaben die einzelnen Seiten.

   Die Texte stehen ausformuliert im Quelltext und nicht in einer
   Datenstruktur. Rechtstexte werden gelesen, nicht ausgewertet – und wer
   sie ändern muss, findet sie so an der Stelle, an der sie auch stehen.
   ===================================================================== */
(function (NW) {
  'use strict';

  const U = NW.util, ui = NW.ui, R = NW.recht, P = NW.plan, S = NW.store;
  const h = U.html, raw = U.raw, ico = U.svg;

  const SEITEN = [
    { id: 'impressum', name: 'Impressum', icon: 'info',
      unter: 'Wer die Seite betreibt und wie er erreichbar ist – Pflichtangaben nach § 5 DDG.' },
    { id: 'datenschutz', name: 'Datenschutzerklärung', icon: 'schloss',
      unter: 'Welche Daten verarbeitet werden, auf welcher Grundlage und welche Rechte du hast.' },
    { id: 'agb', name: 'Allgemeine Geschäftsbedingungen', icon: 'blatt',
      unter: 'Was Nestwerk leistet, was es kostet und was gilt, wenn etwas schiefgeht.' },
    { id: 'widerruf', name: 'Widerrufsbelehrung', icon: 'zurueck',
      unter: 'Vierzehn Tage Widerrufsrecht bei bezahlten Verträgen, mit Musterformular.' },
    { id: 'melden', name: 'Rechtswidrige Inhalte melden', icon: 'warnung',
      unter: 'Meldeweg nach Art. 16 der Verordnung über digitale Dienste.' },
    { id: 'barrierefreiheit', name: 'Barrierefreiheit', icon: 'person',
      unter: 'Was umgesetzt ist, was fehlt und wo Rückmeldung ankommt.' },
    { id: 'kuendigen', name: 'Verträge hier kündigen', icon: 'x',
      unter: 'Die Schaltfläche, die § 312k BGB verlangt – ohne Umweg über den Kundendienst.' }
  ];

  /* ================================================================
     Bausteine
     ================================================================ */

  const rw = (feld, beschreibung) => R.wert(feld, beschreibung);

  function kopf(titel, unter) {
    return h`<header class="seite__kopf">
      <p class="rechtspfad"><a href="#/recht">${ico('zurueck')}Rechtliches</a></p>
      <h1>${titel}</h1>
      ${unter ? h`<p class="seite__unter">${unter}</p>` : ''}
      <p class="fein">Fassung vom ${R.stand()}</p>
    </header>`;
  }

  function luecken() {
    const f = R.fehlendeAngaben();
    if (!f.length) return '';
    return h`<div class="block block--warn">
      <h2>${ico('warnung')}${f.length} ${U.plural(f.length, 'Pflichtangabe fehlt', 'Pflichtangaben fehlen')} noch</h2>
      <p>Solange sie fehlen, ist dieses Dokument nicht vollständig. Im Text stehen die Lücken markiert.</p>
      <ul class="pruef">
        ${f.map((x) => h`<li>${ico('warnung')}<span><b>${x.label}</b> – ${x.grund}</span></li>`)}
      </ul>
      <p class="werkzeug__weiter"><a class="knopf knopf--klein" href="#/recht/angaben">${ico('stift')}Angaben ergänzen</a></p>
    </div>`;
  }

  /* ================================================================
     Übersicht
     ================================================================ */

  function uebersicht() {
    const f = R.fehlendeAngaben();
    return {
      titel: 'Rechtliches',
      html: h`<div class="seite seite--schmal">
        <header class="seite__kopf">
          <h1>${ico('blatt')}Rechtliches</h1>
          <p class="seite__unter">Anbieter, Datenschutz, Geschäftsbedingungen und Widerruf – die Angaben, die
            eine Seite in Deutschland führen muss, und die, die man führen sollte.</p>
        </header>

        <div class="hinweisbox">${ico('warnung')}
          <div><b>Diese Texte sind ein Entwurf, keine Rechtsberatung</b>
          <p>Sie sind nach den geltenden Vorschriften geschrieben – Digitale-Dienste-Gesetz, DSGVO, BGB,
            Verordnung über digitale Dienste – und decken ab, was ein Kleingewerbe mit einer solchen Seite
            braucht. Aber sie ersetzen nicht den Blick von jemandem mit Zulassung. Vor dem ersten echten
            Nutzer gehören vor allem die Geschäftsbedingungen, die Haftung und die Frage nach einer Erlaubnis
            gemäß § 34c GewO geprüft.</p></div>
        </div>

        ${f.length ? h`<div class="block block--warn">
          <h2>${ico('warnung')}Noch ${f.length} ${U.plural(f.length, 'Angabe fehlt', 'Angaben fehlen')}</h2>
          <p>Ein Impressum ohne ladungsfähige Anschrift oder ohne schnelle Kontaktmöglichkeit erfüllt die
            Pflicht aus § 5 DDG nicht – und das ist abmahnbar. Die Lücken sind in allen Dokumenten sichtbar
            markiert, damit sie nicht untergehen.</p>
          <ul class="pruef">
            ${f.map((x) => h`<li>${ico('warnung')}<span><b>${x.label}</b><br>${x.grund}</span></li>`)}
          </ul>
          <p class="werkzeug__weiter">
            <a class="knopf" href="#/recht/angaben">${ico('stift')}Jetzt eintragen</a></p>
        </div>` : h`<p class="gut-meldung">${ico('pruefen')}Alle Pflichtangaben sind eingetragen.
          <a href="#/recht/angaben">Ändern</a></p>`}

        <div class="werkzeuge">

            <summary>${o.titel}</summary>
            <p>${o.text}</p>
          </details>`)}
        </section>
      </div>`
    };
  }

  /* ================================================================
     Impressum
     ================================================================ */

  function impressum() {
    const a = R.angaben();
    return {
      titel: 'Impressum',
      html: h`<div class="seite seite--schmal">

        <div class="block rechtstext">
          <h2>Anbieter</h2>

          <p class="fein">Rechtsform: ${a.rechtsform}.
            ${a.handelsregister ? 'Registereintrag: ' + a.handelsregister + '.'
        : 'Ein Eintrag im Handelsregister besteht nicht; als Kleingewerbe besteht dazu keine Pflicht.'}</p>

          <h2>Kontakt</h2>
          <dl class="rechtsliste">
            <dt>E-Mail</dt><dd>${rw('email', 'E-Mail-Adresse')}</dd>
            <dt>Telefon</dt><dd>${rw('telefon', 'Telefonnummer')}</dd>
          </dl>
          <p class="fein">§ 5 Abs. 1 Nr. 2 DDG verlangt Angaben, die eine schnelle elektronische Kontaktaufnahme
            und unmittelbare Kommunikation ermöglichen. Die E-Mail-Adresse ist dafür Pflicht; die Nummer ist
            der übliche zweite Weg.</p>

          <h2>Umsatzsteuer</h2>
          ${a.ustId
