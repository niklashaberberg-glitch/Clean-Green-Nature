        staerke: 'unbekannt', andrang: mitbewerber === 0 ? 'keiner' : mitbewerber < 8 ? 'gering'
          : mitbewerber < 30 ? 'spürbar' : mitbewerber < 80 ? 'hoch' : 'sehr hoch',
        stufe: 'unbekannt',
        satz: 'Über deine Bewerbung weiß Nestwerk noch nichts – ohne Einkommen und Unterlagen im Profil lässt sich '
          + 'nichts einschätzen. Was feststeht: '
          + (mitbewerber === 0 ? 'Bisher hat sich niemand sonst gemeldet.'
            : mitbewerber === 1 ? 'Bisher hat sich eine weitere Person gemeldet.'
              : 'Es haben sich bereits ' + mitbewerber + ' andere gemeldet.')
      };
    }

    /* Zwei Dinge, die nichts miteinander zu tun haben, und die deshalb
       getrennt gehören: Wie gut deine Bewerbung ist – das kannst du
       ändern. Und wie viele sich sonst noch bewerben – das nicht.
       Eine einzige Prozentzahl vermischt beides und entmutigt nur. */
    const staerke = vielfach >= 1.6 ? 'stark' : vielfach >= 1.05 ? 'solide'
      : vielfach >= 0.6 ? 'durchschnittlich' : 'schwach';
    const andrang = mitbewerber === 0 ? 'keiner' : mitbewerber < 8 ? 'gering'
      : mitbewerber < 30 ? 'spürbar' : mitbewerber < 80 ? 'hoch' : 'sehr hoch';

    const staerkeSatz = {
      stark: 'Deine Bewerbung ist stärker als die der meisten Mitbewerber.',
      solide: 'Deine Bewerbung ist solide – nichts spricht gegen dich.',
      durchschnittlich: 'Deine Bewerbung fällt weder positiv noch negativ auf.',
      schwach: 'An deiner Bewerbung gibt es Punkte, die dich hier aussortieren könnten.'
    }[staerke];

    const andrangSatz = mitbewerber === 0
      ? 'Und du bist bisher die einzige Person, die sich meldet – besser wird der Zeitpunkt nicht.'
      : mitbewerber === 1
        ? 'Bisher meldet sich außer dir nur eine weitere Person.'
        : 'Es haben sich aber schon ' + mitbewerber + ' andere gemeldet, sodass rechnerisch etwa '
          + prozent + ' von 100 Bewerbungen wie deiner zum Zug kämen. '
          + (staerke === 'stark' || staerke === 'solide'
            ? 'Das liegt am Andrang, nicht an dir.'
            : 'Bei dieser Konkurrenz zählt jeder Punkt, den du verbessern kannst.');

    if (mitbewerber > 80) {
      tipps.push('Bei ' + mitbewerber + ' Interessenten entscheidet am Ende oft der Zufall. Bewirb dich, aber halte parallel andere Optionen offen.');
    }
    if (l.besichtigungen.length) {
      tipps.push('Nimm einen der hinterlegten Termine sofort – gebuchte Termine kommen vor formlosen Anfragen.');
    }
    if (staerke === 'stark' && mitbewerber > 30) {
      tipps.push('Deine Mappe ist gut. Nutz sie: Bewirb dich auf mehr Objekte statt auf das eine – bei diesem Andrang ist Menge wichtiger als Auswahl.');
    }

    return {
      prozent, mitbewerber, faktoren, tipps: U.uniq(tipps).slice(0, 4),
      staerke, andrang,
      /* Die Ampel folgt der Stärke, nicht der Prozentzahl: Sie zeigt,
         was in deiner Hand liegt. */
      stufe: staerke === 'stark' ? 'gut' : staerke === 'solide' ? 'gut'
        : staerke === 'durchschnittlich' ? 'mittel' : 'schwach',
      satz: staerkeSatz + ' ' + andrangSatz
    };
  }

  /* ================================================================
     2. Doppelt eingestellte Wohnungen
     ================================================================ */

  /* Dieselbe Wohnung taucht auf Portalen regelmäßig mehrfach auf –
     von zwei Maklern, oder vom Eigentümer und vom Makler zugleich.
     Wer das nicht merkt, bewirbt sich zweimal auf dasselbe Objekt. */
  function duplikate(l, alle) {
    const kandidaten = (alle || NW.data.listings).filter((x) => {
      if (x.id === l.id) return false;
      if (x.kind !== l.kind) return false;
      if (x.viertelKey !== l.viertelKey) return false;
      if (Math.abs(x.flaeche - l.flaeche) > 2) return false;
      if (Math.abs(x.zimmer - l.zimmer) > 0.5) return false;
      if (Math.abs(x.baujahr - l.baujahr) > 3) return false;
      const preisA = l.kind === 'kauf' ? l.kaufpreis : l.kalt;
      const preisB = x.kind === 'kauf' ? x.kaufpreis : x.kalt;
      if (Math.abs(preisA - preisB) / Math.max(1, preisA) > 0.06) return false;
      return true;
    });

    return kandidaten.map((x) => {
      const merkmale = [];
      if (x.flaeche === l.flaeche) merkmale.push('gleiche Fläche');
      if (x.zimmer === l.zimmer) merkmale.push('gleiche Zimmerzahl');
      if (x.baujahr === l.baujahr) merkmale.push('gleiches Baujahr');
      if (x.etage === l.etage) merkmale.push('gleiche Etage');
      if (U.distKm(x, l) < 0.4) merkmale.push('nahezu gleiche Lage');
      const gleicherAnbieter = x.anbieter.name === l.anbieter.name;
      return {
        listing: x, merkmale,
        gleicherAnbieter,
        sicherheit: Math.min(95, 45 + merkmale.length * 12),
        deutung: gleicherAnbieter
          ? 'Derselbe Anbieter hat zwei sehr ähnliche Wohnungen eingestellt – vermutlich zwei Einheiten im selben Haus.'
          : 'Zwei verschiedene Anbieter, nahezu identische Angaben. Häufig dieselbe Wohnung über zwei Wege.'
      };
    }).sort((a, b) => b.sicherheit - a.sicherheit).slice(0, 3);
  }

  /* ================================================================
     3. Preisverlauf je Viertel
     ================================================================ */

  /* Erzeugt aus der Kennung des Viertels eine stabile Zeitreihe:
     Grundtrend, jahreszeitliche Schwankung, etwas Rauschen. */
  function preisreihe(viertelKey, monate) {
    const d = G.districtByKey[viertelKey];
    if (!d) return null;
    const n = monate || 36;
    const r = U.rng(U.hash(viertelKey));
    const jahrestrend = 0.018 + r() * 0.055;          /* 1,8 % bis 7,3 % im Jahr */
    const heute = NW.now();
    const punkte = [];
    let rauschen = 0;
    for (let i = n - 1; i >= 0; i--) {
      const datum = new Date(heute.getFullYear(), heute.getMonth() - i, 1);
      const jahre = -i / 12;
      const trend = Math.pow(1 + jahrestrend, jahre);
      const saison = 1 + Math.sin((datum.getMonth() + 1) / 12 * Math.PI * 2) * 0.012;
      rauschen = rauschen * 0.6 + (r() - 0.5) * 0.02;
      punkte.push({
        datum: U.isoDate(datum),
        monat: datum.getMonth(),
        jahr: datum.getFullYear(),
        wert: Math.round(d.mietBasis * trend * saison * (1 + rauschen) * 100) / 100
      });
    }
    const erst = punkte[0].wert, letzt = punkte[punkte.length - 1].wert;
    return {
      viertel: d,
      punkte,
      jetzt: letzt,
      vorJahr: punkte[Math.max(0, punkte.length - 13)].wert,
      start: erst,
      veraenderungJahr: Math.round((letzt / punkte[Math.max(0, punkte.length - 13)].wert - 1) * 1000) / 10,
      veraenderungGesamt: Math.round((letzt / erst - 1) * 1000) / 10,
      jahrestrend: Math.round(jahrestrend * 1000) / 10
    };
  }

  /* Mehrere Viertel für den Vergleich, absteigend nach heutigem Preis. */
  function preisvergleich(stadt) {
    const c = G.cityByName[stadt];
    if (!c) return [];
    return c.districtList.map((d) => preisreihe(d.key)).filter(Boolean)
      .sort((a, b) => b.jetzt - a.jetzt);
  }

  /* ================================================================
     4. Leistbarkeit
     ================================================================ */

  function leistbarkeit(angaben) {
    const netto = Math.max(0, Number(angaben.netto) || 0);
    const haushalt = U.clamp(Number(angaben.haushalt) || 1, 1, 8);
    const schulden = Math.max(0, Number(angaben.rateSonstige) || 0);
    const verfuegbar = Math.max(0, netto - schulden);

    /* Zwei verschiedene Grenzen, die oft verwechselt werden:
       Was du dir leisten kannst – und was Vermieter sehen wollen. */
    const warmBequem = Math.round(verfuegbar * 0.30);
    const warmGrenze = Math.round(verfuegbar * 0.35);
    const warmKritisch = Math.round(verfuegbar * 0.40);
    const kaltVermieter = Math.round(netto / 3);

    /* Was vom Warmbudget nach Abzug der Nebenkosten als Kaltmiete bleibt. */
    const nkAnteil = 0.26;
    const kaltAusBudget = Math.round(warmBequem * (1 - nkAnteil));
    const kaltMoeglich = Math.min(kaltAusBudget, kaltVermieter);
    const engpass = kaltVermieter < kaltAusBudget ? 'vermieter' : 'budget';

    /* Wie groß darf die Wohnung sein – je Stadt verschieden. */
    const staedte = G.CITIES.map((c) => {
      const basis = c.mietBasis;
      return {
        stadt: c.name,
        proQm: basis,
        flaeche: Math.floor(kaltMoeglich / basis),
        reicht: Math.floor(kaltMoeglich / basis) >= (haushalt === 1 ? 30 : haushalt * 22)
      };
    }).sort((a, b) => b.flaeche - a.flaeche);

    /* Kauf: Was trägt die Rate, die dem Warmbudget entspricht? */
    const eigenkapital = Math.max(0, Number(angaben.eigenkapital) || 0);
    const zins = Number(angaben.zins) || 3.7;
    const tilgung = Number(angaben.tilgung) || 2;
    const rate = warmGrenze;
    const darlehen = rate * 12 / ((zins + tilgung) / 100);
    /* Nebenkosten im Schnitt rund 10 % – sie müssen aus dem Eigenkapital kommen. */
    const nebenkostenAnteil = 0.10;
    const kaufpreis = Math.max(0, (darlehen + eigenkapital) / (1 + nebenkostenAnteil));

    return {
      netto, haushalt, verfuegbar,
      warmBequem, warmGrenze, warmKritisch,
      kaltVermieter, kaltAusBudget, kaltMoeglich, engpass,
      staedte,
      kauf: {
        rate: Math.round(rate),
        darlehen: Math.round(darlehen),
        kaufpreis: Math.round(kaufpreis / 1000) * 1000,
        eigenkapital, zins, tilgung,
        nebenkosten: Math.round(kaufpreis * nebenkostenAnteil)
      }
    };
  }

  /* ================================================================
     5. Wohnberechtigungsschein – Vorprüfung
     ================================================================ */

  /* Die Einkommensgrenzen setzen die Länder selbst und weichen teils
     erheblich voneinander ab. Nestwerk rechnet deshalb nicht heimlich
     mit einer Zahl, sondern legt sie offen und macht sie änderbar.
     Voreingestellt ist der Rahmen des Bundes aus § 9 WoFG. */
  const WBS_BUND = { eine: 12000, zwei: 18000, jeWeitere: 4100, jeKind: 500 };

  const WBS_ABZUEGE = [
    { id: 'werbung', label: 'Werbungskostenpauschale', betrag: 1230, hinweis: 'Pauschbetrag je erwerbstätiger Person, sofern keine höheren Kosten nachgewiesen werden.' },
    { id: 'steuern', label: 'Pauschale für Steuern', anteil: 10, hinweis: '10 % des Bruttoeinkommens, wenn Einkommensteuer gezahlt wird.' },
    { id: 'kranken', label: 'Pauschale für Kranken- und Pflegeversicherung', anteil: 10, hinweis: '10 %, wenn Pflichtbeiträge geleistet werden.' },
    { id: 'rente', label: 'Pauschale für Rentenversicherung', anteil: 10, hinweis: '10 %, wenn Pflichtbeiträge geleistet werden.' }
  ];

  function wbsPruefung(angaben) {
    const brutto = Math.max(0, Number(angaben.brutto) || 0);
    const personen = U.clamp(Number(angaben.personen) || 1, 1, 10);
    const kinder = U.clamp(Number(angaben.kinder) || 0, 0, 10);
    const erwerbstaetige = U.clamp(Number(angaben.erwerbstaetige) || 1, 0, 10);

    const abzuege = [];
    let summe = 0;
    if (angaben.werbungskosten !== false && erwerbstaetige > 0) {
      const b = 1230 * erwerbstaetige;
      abzuege.push({ label: 'Werbungskosten (' + erwerbstaetige + ' × 1.230 €)', betrag: b });
      summe += b;
    }
    ['steuern', 'kranken', 'rente'].forEach((k) => {
      if (!angaben[k]) return;
      const eintrag = WBS_ABZUEGE.find((x) => x.id === k);
      const b = Math.round(brutto * eintrag.anteil / 100);
      abzuege.push({ label: eintrag.label + ' (' + eintrag.anteil + ' %)', betrag: b });
      summe += b;
    });
    /* Freibeträge, die es in allen Ländern in ähnlicher Form gibt. */
    if (angaben.schwerbehindert) { abzuege.push({ label: 'Freibetrag Schwerbehinderung', betrag: 2100 }); summe += 2100; }
    if (kinder > 0) {
      const b = kinder * 600;
      abzuege.push({ label: 'Freibetrag für ' + kinder + ' ' + U.plural(kinder, 'Kind', 'Kinder'), betrag: b });
      summe += b;
    }

    const massgeblich = Math.max(0, brutto - summe);

    const grenzeVorgabe = Number(angaben.grenze) || 0;
    const grenzeBund = (personen === 1 ? WBS_BUND.eine
      : personen === 2 ? WBS_BUND.zwei
        : WBS_BUND.zwei + (personen - 2) * WBS_BUND.jeWeitere) + kinder * WBS_BUND.jeKind;
    const grenze = grenzeVorgabe > 0 ? grenzeVorgabe : grenzeBund;

    const abstand = grenze - massgeblich;
    const quote = grenze > 0 ? massgeblich / grenze : 0;

    return {
      brutto, personen, kinder, abzuege, summeAbzuege: summe,
      massgeblich, grenze, grenzeBund, eigeneGrenze: grenzeVorgabe > 0,
      abstand, quote,
      ergebnis: quote <= 0.85 ? 'wahrscheinlich' : quote <= 1 ? 'knapp' : 'unwahrscheinlich',
      satz: quote <= 0.85
        ? 'Dein maßgebliches Einkommen liegt deutlich unter der eingestellten Grenze – ein Antrag lohnt sich.'
        : quote <= 1
          ? 'Du liegst knapp unter der Grenze. Kleine Abweichungen bei den Abzügen entscheiden hier.'
          : 'Du liegst über der eingestellten Grenze. Prüfe, ob dein Land höhere Grenzen oder weitere Stufen kennt.'
    };
  }

  /* ================================================================
     6. Wohngeld – Vorprüfung ohne erfundenen Betrag
     ================================================================ */

  /* Die Höhe folgt einer Formel mit Beiwerten, die sich je nach
     Haushaltsgröße unterscheiden und regelmäßig geändert werden. Eine
     Zahl daraus zu erfinden wäre schlimmer als keine. Nestwerk prüft
     deshalb die Voraussetzungen und sagt, wo der Betrag herkommt. */
  const WOHNGELD_AUSSCHLUSS = [
    { id: 'buergergeld', label: 'Ich beziehe Bürgergeld', text: 'Beim Bürgergeld sind die Wohnkosten bereits enthalten. Wohngeld gibt es dann nicht zusätzlich.' },
    { id: 'grundsicherung', label: 'Ich beziehe Grundsicherung oder Sozialhilfe', text: 'Auch hier sind die Unterkunftskosten Teil der Leistung.' },
    { id: 'bafoegVoll', label: 'Ich bekomme BAföG oder Berufsausbildungsbeihilfe', text: 'Wer dem Grunde nach förderfähig ist, ist vom Wohngeld in der Regel ausgeschlossen. Ausnahmen gibt es, wenn weitere Haushaltsmitglieder ohne Förderung mitwohnen.' },
    { id: 'eigentum', label: 'Ich wohne im eigenen Wohneigentum', text: 'Dann heißt die Leistung Lastenzuschuss und wird anders berechnet – der Antrag läuft über dieselbe Stelle.' }
  ];

  function wohngeldPruefung(angaben) {
    const gruende = WOHNGELD_AUSSCHLUSS.filter((a) => angaben[a.id]);
    const personen = U.clamp(Number(angaben.personen) || 1, 1, 12);
    const brutto = Math.max(0, Number(angaben.brutto) || 0);
    const miete = Math.max(0, Number(angaben.miete) || 0);

    /* Grobe Orientierung: Oberhalb dieser Einkommen läuft Wohngeld in
       der Praxis aus. Bewusst als Spanne und ausdrücklich als Faustwert. */
    const faustwert = 1300 + (personen - 1) * 500;
    const belastung = brutto > 0 ? miete / brutto : 0;

    let ergebnis, satz;
    if (gruende.length) {
      ergebnis = 'ausgeschlossen';
      satz = 'Für deine Situation kommt Wohngeld nach den angegebenen Punkten nicht in Betracht.';
    } else if (brutto === 0 || miete === 0) {
      ergebnis = 'unklar';
      satz = 'Trag Bruttoeinkommen und Warmmiete ein, dann ordnet Nestwerk das ein.';
    } else if (brutto <= faustwert && belastung >= 0.25) {
      ergebnis = 'wahrscheinlich';
      satz = 'Einkommen und Mietbelastung liegen in dem Bereich, in dem Wohngeld regelmäßig bewilligt wird. Ein Antrag lohnt sich.';
    } else if (brutto <= faustwert * 1.4) {
      ergebnis = 'moeglich';
      satz = 'Es liegt im Grenzbereich. Weil Mietstufe und Abzüge stark hineinspielen, entscheidet erst die genaue Berechnung.';
    } else {
      ergebnis = 'unwahrscheinlich';
      satz = 'Bei diesem Einkommen wird Wohngeld selten bewilligt – ausgeschlossen ist es aber nicht, etwa bei hoher Mietstufe oder vielen Haushaltsmitgliedern.';
    }

    return {
      gruende, personen, brutto, miete, faustwert,
      belastung: Math.round(belastung * 100),
      ergebnis, satz,
      hinweise: [
        'Wohngeld wird ab Antragsmonat gezahlt, nicht rückwirkend. Ein Antrag am Monatsende kostet einen vollen Monat.',
        'Zuständig ist die Wohngeldstelle der Stadt oder des Kreises. Den Betrag berechnet sie nach § 19 WoGG.',
        'Auch wer nur wenige Euro bekommt, erhält damit oft Anspruch auf weitere Vergünstigungen.'
      ]
    };
  }

  /* ================================================================
     7. Nebenkostenabrechnung prüfen
     ================================================================ */

  /* Umlagefähig ist nur, was die Betriebskostenverordnung aufzählt.
     Alles andere trägt die Vermieterseite – auch wenn es im Vertrag steht. */
  const BETRIEBSKOSTEN = [
    { id: 'grundsteuer', label: 'Grundsteuer', ok: true, hinweis: 'Laufende öffentliche Lasten des Grundstücks.' },
    { id: 'wasser', label: 'Wasserversorgung', ok: true, hinweis: 'Verbrauch, Grundgebühr, Zählermiete, Eichung.' },
    { id: 'abwasser', label: 'Entwässerung', ok: true },
    { id: 'heizung', label: 'Heizung und Warmwasser', ok: true, hinweis: 'Mindestens 50 % müssen nach Verbrauch verteilt werden – sonst darfst du 15 % kürzen.' },
    { id: 'aufzug', label: 'Aufzug', ok: true, hinweis: 'Auch Erdgeschossmieter zahlen mit, sofern der Vertrag es vorsieht.' },
    { id: 'strasse', label: 'Straßenreinigung und Müllabfuhr', ok: true },
    { id: 'gebaeude', label: 'Gebäudereinigung und Ungezieferbekämpfung', ok: true },
    { id: 'garten', label: 'Gartenpflege', ok: true, hinweis: 'Nur Pflege. Eine Neuanlage ist Instandsetzung und nicht umlagefähig.' },
    { id: 'beleuchtung', label: 'Beleuchtung der Gemeinschaftsflächen', ok: true },
    { id: 'schornstein', label: 'Schornsteinreinigung', ok: true },
    { id: 'versicherung', label: 'Sach- und Haftpflichtversicherung', ok: true, hinweis: 'Gebäude, Glas, Haftpflicht – nicht die Rechtsschutzversicherung.' },
    { id: 'hauswart', label: 'Hauswart', ok: true, hinweis: 'Nur die Hausmeistertätigkeit. Reparaturen und Verwaltung müssen herausgerechnet werden.' },
    { id: 'antenne', label: 'Gemeinschaftsantenne oder Kabelanschluss', ok: true, hinweis: 'Seit Juli 2024 nur noch, wenn du dem Vertrag zustimmen konntest.' },
    { id: 'waschraum', label: 'Gemeinschaftliche Waschküche', ok: true },
    { id: 'sonstige', label: 'Sonstige Betriebskosten', ok: true, hinweis: 'Nur wenn sie im Mietvertrag einzeln benannt sind – eine Sammelklausel reicht nicht.' },

    { id: 'verwaltung', label: 'Verwaltungskosten', ok: false, hinweis: 'Hausverwaltung, Kontoführung, Porto, Steuerberatung: trägt die Vermieterseite.' },
    { id: 'instand', label: 'Instandhaltung und Reparaturen', ok: false, hinweis: 'Auch dann nicht umlagefähig, wenn sie klein sind.' },
    { id: 'ruecklage', label: 'Instandhaltungsrücklage', ok: false, hinweis: 'Bei Eigentumswohnungen häufig fälschlich mit abgerechnet.' },
    { id: 'leerstand', label: 'Kosten leerstehender Wohnungen', ok: false, hinweis: 'Der Leerstandsanteil bleibt bei der Vermieterseite.' },
    { id: 'bank', label: 'Bank- und Mahngebühren', ok: false },
    { id: 'wartungReparatur', label: 'Reparaturanteil in Wartungsverträgen', ok: false, hinweis: 'Wartung ja, die enthaltene Reparaturpauschale nein.' },
    { id: 'neuanschaffung', label: 'Neuanschaffungen und Modernisierung', ok: false, hinweis: 'Modernisierung läuft über eine Mieterhöhung, nicht über die Nebenkosten.' },
    { id: 'rechtsschutz', label: 'Rechtsschutz- und Mietausfallversicherung', ok: false }
  ];

  function nebenkostenPruefung(angaben) {
    const positionen = angaben.positionen || {};
    const gefunden = [];
    let summeOk = 0, summeNicht = 0;
    BETRIEBSKOSTEN.forEach((b) => {
      const betrag = Number(positionen[b.id]) || 0;
      if (!betrag) return;
      gefunden.push({ eintrag: b, betrag });
      if (b.ok) summeOk += betrag; else summeNicht += betrag;
    });

    const befunde = [];
    if (summeNicht > 0) {
      befunde.push({
        art: 'kritisch',
        titel: U.eur(summeNicht) + ' vermutlich zu Unrecht umgelegt',
        text: 'Diese Posten zählt die Betriebskostenverordnung nicht auf. Widersprich schriftlich und verlange eine berichtigte Abrechnung.'
      });
    }

    /* Fristen sind hier das schärfste Schwert – und werden am häufigsten verpasst. */
    if (angaben.endeZeitraum) {
      const ende = new Date(angaben.endeZeitraum + 'T12:00:00');
      const frist = U.addDays(ende, 365);
      const zugang = angaben.zugang ? new Date(angaben.zugang + 'T12:00:00') : null;
      if (zugang && zugang > frist) {
        befunde.push({
          art: 'kritisch',
          titel: 'Abrechnung zu spät zugegangen',
          text: 'Die Abrechnung musste bis zum ' + U.dateDE(U.isoDate(frist)) + ' bei dir sein. Danach kann keine Nachzahlung mehr verlangt werden – ein Guthaben musst du trotzdem bekommen.'
        });
      } else if (zugang) {
        const einwendung = U.addDays(zugang, 365);
        befunde.push({
          art: 'info',
          titel: 'Deine Einwendungsfrist läuft bis ' + U.dateDE(U.isoDate(einwendung)),
          text: 'Bis dahin kannst du Einwendungen erheben. Verlange vorher Einsicht in die Belege – das steht dir zu.'
        });
      }
    }

    if (angaben.heizungNachFlaeche) {
      befunde.push({

     8. Besichtigungen zu einer Route ordnen
     ================================================================ */

  /* Kurzer Weg zuerst: Von jedem Punkt aus wird der nächstgelegene
     noch offene Termin gewählt. Bei einer Handvoll Terminen genügt das
     und ist nachvollziehbarer als ein exaktes Verfahren. */
  function tagesplan(termine, start) {
    if (!termine.length) return { reihenfolge: [], gesamtMinuten: 0 };
    const offen = termine.slice();
    const reihenfolge = [];
    let hier = start || offen[0].listing;
    let fahrt = 0;

    while (offen.length) {
      let bestI = 0, bestMin = Infinity;
      offen.forEach((t, i) => {
        const min = U.travelMin(hier, t.listing, 'oepnv');
        if (min < bestMin) { bestMin = min; bestI = i; }
      });
      const naechster = offen.splice(bestI, 1)[0];
      reihenfolge.push({ termin: naechster, fahrtMinuten: reihenfolge.length ? bestMin : 0 });
      fahrt += reihenfolge.length > 1 ? bestMin : 0;
      hier = naechster.listing;
    }

    /* Konflikte melden: zwei Termine, zwischen die die Fahrt nicht passt. */
    const konflikte = [];
    reihenfolge.forEach((r, i) => {
      if (!i) return;
      const vorher = reihenfolge[i - 1].termin;
      if (vorher.datum !== r.termin.datum) return;
      const minuten = (z) => Number(z.split(':')[0]) * 60 + Number(z.split(':')[1]);
      const luecke = minuten(r.termin.zeit) - minuten(vorher.zeit) - 30;
      if (luecke < r.fahrtMinuten) {
        konflikte.push({
          a: vorher, b: r.termin,
          fehlt: Math.round(r.fahrtMinuten - luecke)
        });
      }
    });

    return { reihenfolge, gesamtMinuten: Math.round(fahrt), konflikte };

    const fehlt = Object.keys(UNTERLAGEN_NAMEN).filter((k) => !u[k] && k !== 'buergschaft' && k !== 'wbs');
    return fehlt.length ? satz + ' Was darüber hinaus nötig ist, reiche ich kurzfristig nach.' : satz;
  }

/* =====================================================================
   Nestwerk – Dokumententresor

   Das Problem: Wer sich auf zwanzig Wohnungen bewirbt, verschickt zwanzig
   Mal Gehaltsnachweise, Ausweiskopie und Schufa – an Fremde, per E-Mail,
   ohne Ablaufdatum. Die Unterlagen liegen danach in zwanzig Postfächern
   und bleiben dort für immer.

   Die Antwort hier: Die Dokumente werden einmal im Browser verschlüsselt
   abgelegt. Verschickt wird nie die Datei, sondern ein Verweis, der nach
   einer gesetzten Frist und einer gesetzten Zahl von Abrufen erlischt und
   sich jederzeit widerrufen lässt.

   Was daran echt ist: die Verschlüsselung. AES-GCM mit 256 Bit, Schlüssel
   aus dem Kennwort über PBKDF2 mit 310.000 Runden. Jedes Dokument hat
   einen eigenen Schlüssel, der mit dem Tresorschlüssel umschlossen wird –
   nur so lässt sich ein einzelnes Dokument freigeben, ohne den Tresor zu
   öffnen. Der Freigabeschlüssel steht im Fragment des Verweises, dem Teil
   hinter dem Rautezeichen, den Browser niemals an einen Server senden.

   Was hier fehlt: der Server. In dieser Vorführung liegt das Chiffrat im
   Browser, der Verweis funktioniert deshalb nur auf diesem Gerät. Im
   Betrieb läge dort das Chiffrat und sonst nichts – kein Schlüssel, keine
   Datei im Klartext, nichts, was ein Einbruch verwertbar machen würde.
   ===================================================================== */
(function (NW) {
  'use strict';

  const U = NW.util;

  const DB_NAME = 'nestwerk-tresor';
  const DB_VERSION = 1;
  const SPEICHER = 'dokumente';
  const META = 'nestwerk.tresor.v1';

  const RUNDEN = 310000;
  const MAX_BYTES = 8 * 1024 * 1024;   /* je Datei */
  const OK_TYPEN = ['application/pdf', 'image/jpeg', 'image/png', 'image/webp', 'image/heic'];

  const ARTEN = [
    { id: 'selbstauskunft', name: 'Selbstauskunft', hinweis: 'Standardformular mit Angaben zu Person und Einkommen.' },
    { id: 'gehaltsnachweise', name: 'Gehaltsnachweise', hinweis: 'Die letzten drei Abrechnungen.' },
    { id: 'schufa', name: 'Schufa-Bonitätsauskunft', hinweis: 'Erst nach der Besichtigung herausgeben – nie mit der ersten Anfrage.' },
    { id: 'mietschuldenfrei', name: 'Mietschuldenfreiheit', hinweis: 'Bescheinigung der bisherigen Vermieterseite.' },
    { id: 'ausweis', name: 'Ausweiskopie', hinweis: 'Nummer schwärzen. Erst bei ernsthaftem Interesse.' },
    { id: 'buergschaft', name: 'Bürgschaft', hinweis: 'Falls Einkommen oder Bonität allein nicht reichen.' },
    { id: 'wbs', name: 'Wohnberechtigungsschein', hinweis: 'Nur für geförderte Wohnungen nötig.' },
    { id: 'sonstiges', name: 'Sonstiges', hinweis: 'Arbeitsvertrag, Bürgschaftserklärung, was sonst verlangt wird.' }
  ];

  /* Unterlagen, die man niemals mit der ersten Anfrage verschickt. */
  const HEIKEL = ['schufa', 'ausweis'];

  const verfuegbar = () => !!(window.crypto && window.crypto.subtle && window.indexedDB && window.TextEncoder);

  /* ------------------------- Kleinkram ------------------------- */

  const enc = new TextEncoder();
  const dec = new TextDecoder();

  function zuBase64(puffer) {
    const bytes = new Uint8Array(puffer);
    let s = '';
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function ausBase64(text) {
    const s = atob(String(text).replace(/-/g, '+').replace(/_/g, '/'));
    const bytes = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
    return bytes;
  }

  const zufall = (n) => crypto.getRandomValues(new Uint8Array(n));

  /* ------------------------- Speicher ------------------------- */

  let dbVersprechen = null;

  function db() {
    if (dbVersprechen) return dbVersprechen;
    dbVersprechen = new Promise((gut, schlecht) => {
      const anfrage = indexedDB.open(DB_NAME, DB_VERSION);
      anfrage.onupgradeneeded = () => {
        const d = anfrage.result;
        if (!d.objectStoreNames.contains(SPEICHER)) d.createObjectStore(SPEICHER, { keyPath: 'id' });
      };
      anfrage.onsuccess = () => gut(anfrage.result);
      anfrage.onerror = () => schlecht(anfrage.error);
    });
    return dbVersprechen;
  }

  function tun(modus, fn) {
    return db().then((d) => new Promise((gut, schlecht) => {
      const t = d.transaction(SPEICHER, modus);
      const s = t.objectStore(SPEICHER);
      let ergebnis;
      try { ergebnis = fn(s); } catch (e) { schlecht(e); return; }
      t.oncomplete = () => gut(ergebnis && ergebnis.result !== undefined ? ergebnis.result : ergebnis);
      t.onerror = () => schlecht(t.error);
    }));
  }

  function meta() {
    try { return JSON.parse(localStorage.getItem(META) || 'null'); } catch (e) { return null; }
  }

  function metaSetzen(m) {
    try { localStorage.setItem(META, JSON.stringify(m)); } catch (e) { /* Speicher voll */ }
  }

  /* ------------------------- Schlüssel ------------------------- */

  let tresorSchluessel = null;    /* nur im Arbeitsspeicher, nie gespeichert */

  function schluesselAusKennwort(kennwort, salz) {
    return crypto.subtle.importKey('raw', enc.encode(kennwort), 'PBKDF2', false, ['deriveKey'])
      .then((roh) => crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salz, iterations: RUNDEN, hash: 'SHA-256' },
        roh, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt', 'wrapKey', 'unwrapKey']
      ));
  }

  function verschluesseln(schluessel, daten) {
    const iv = zufall(12);
    return crypto.subtle.encrypt({ name: 'AES-GCM', iv }, schluessel, daten)
      .then((chiffrat) => ({ iv: zuBase64(iv), chiffrat }));
  }

  function entschluesseln(schluessel, ivText, chiffrat) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: ausBase64(ivText) }, schluessel, chiffrat);
  }

  /* ------------------------- Einrichten und Öffnen ------------------------- */

  const eingerichtet = () => !!(meta() && meta().salz);
  const istOffen = () => !!tresorSchluessel;

  function einrichten(kennwort) {
    if (!verfuegbar()) return Promise.reject(new Error('Dieser Browser kann keine Verschlüsselung.'));
    if (!kennwort || kennwort.length < 8) return Promise.reject(new Error('Das Kennwort braucht mindestens acht Zeichen.'));
    const salz = zufall(16);
    return schluesselAusKennwort(kennwort, salz).then((k) => {
      return verschluesseln(k, enc.encode('nestwerk-tresor')).then((probe) => {
        metaSetzen({
          salz: zuBase64(salz), runden: RUNDEN,
          probeIv: probe.iv, probe: zuBase64(probe.chiffrat),
          angelegt: U.isoDate(NW.now()), freigaben: []
        });
        tresorSchluessel = k;
        return true;
      });
    });
  }

  function entsperren(kennwort) {
    const m = meta();
    if (!m) return Promise.reject(new Error('Es ist noch kein Tresor eingerichtet.'));
    return schluesselAusKennwort(kennwort, ausBase64(m.salz))
      .then((k) => entschluesseln(k, m.probeIv, ausBase64(m.probe).buffer)
        .then((klar) => {
          if (dec.decode(klar) !== 'nestwerk-tresor') throw new Error('falsch');
          tresorSchluessel = k;
          return true;
        }))
      .catch(() => { throw new Error('Das Kennwort stimmt nicht.'); });
  }

  function sperren() { tresorSchluessel = null; }

  /* ------------------------- Dokumente ------------------------- */

  function hinzufuegen(datei, art) {
    if (!istOffen()) return Promise.reject(new Error('Der Tresor ist gesperrt.'));
    if (datei.size > MAX_BYTES) return Promise.reject(new Error('Die Datei ist größer als 8 MB.'));
    if (datei.type && OK_TYPEN.indexOf(datei.type) < 0) {
      return Promise.reject(new Error('Erlaubt sind PDF, JPG, PNG, WEBP und HEIC.'));
    }
    const id = 'dok-' + zuBase64(zufall(9));

    /* Jedes Dokument bekommt einen eigenen Schlüssel. Nur so lässt sich
       ein einzelnes freigeben, ohne den Tresor preiszugeben. */
    return crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt'])
      .then((dokSchluessel) => datei.arrayBuffer()
        .then((bytes) => verschluesseln(dokSchluessel, bytes))
        .then((inhalt) => {
          /* Auch der Dateiname wird verschlüsselt – er verrät sonst mehr,
             als vielen bewusst ist. */
          return verschluesseln(dokSchluessel, enc.encode(JSON.stringify({ name: datei.name, typ: datei.type })))
            .then((kopf) => crypto.subtle.exportKey('raw', dokSchluessel)
              .then((rohSchluessel) => verschluesseln(tresorSchluessel, rohSchluessel)
                .then((umschlossen) => tun('readwrite', (s) => s.put({
                  id, art: art || 'sonstiges',
                  groesse: datei.size,
                  hinzu: new Date().toISOString(),
                  inhaltIv: inhalt.iv, inhalt: inhalt.chiffrat,
                  kopfIv: kopf.iv, kopf: kopf.chiffrat,
                  huelleIv: umschlossen.iv, huelle: umschlossen.chiffrat
                })).then(() => id))));
        }));
  }

  /* Holt den Dokumentschlüssel aus der Hülle. */
  function dokSchluessel(satz) {
    return entschluesseln(tresorSchluessel, satz.huelleIv, satz.huelle)
      .then((roh) => crypto.subtle.importKey('raw', roh, 'AES-GCM', true, ['encrypt', 'decrypt']));
  }

  function liste() {
    return tun('readonly', (s) => s.getAll()).then((saetze) => {
      saetze.sort((a, b) => a.hinzu.localeCompare(b.hinzu));
      if (!istOffen()) {
        /* Gesperrt: Nur was ohnehin unverschlüsselt liegt – Art, Größe,
           Datum. Der Dateiname bleibt verborgen. */
        return saetze.map((s) => ({ id: s.id, art: s.art, groesse: s.groesse, hinzu: s.hinzu, gesperrt: true }));
      }
      return Promise.all(saetze.map((satz) => dokSchluessel(satz)
        .then((k) => entschluesseln(k, satz.kopfIv, satz.kopf))
        .then((klar) => {
          const kopf = JSON.parse(dec.decode(klar));
          return { id: satz.id, art: satz.art, groesse: satz.groesse, hinzu: satz.hinzu, name: kopf.name, typ: kopf.typ };
        })
        .catch(() => ({ id: satz.id, art: satz.art, groesse: satz.groesse, hinzu: satz.hinzu, gesperrt: true }))));
    });
  }

  function loeschen(id) {
    return tun('readwrite', (s) => s.delete(id)).then(() => {
      /* Aus allen Freigaben entfernen; eine leere Freigabe wird widerrufen. */
      const m = meta();
      if (!m) return;
      m.freigaben = (m.freigaben || []).map((f) => {
        f.dokumente = f.dokumente.filter((d) => d !== id);
        if (!f.dokumente.length) f.widerrufen = new Date().toISOString();
        return f;
      });
      metaSetzen(m);
    });
  }

  /* Entschlüsselt ein Dokument für die eigene Ansicht. */
  function oeffnen(id) {
    if (!istOffen()) return Promise.reject(new Error('Der Tresor ist gesperrt.'));
    return tun('readonly', (s) => s.get(id)).then((satz) => {
      if (!satz) throw new Error('Dokument nicht gefunden.');
      return dokSchluessel(satz).then((k) => Promise.all([
        entschluesseln(k, satz.inhaltIv, satz.inhalt),
        entschluesseln(k, satz.kopfIv, satz.kopf)
      ]).then(([inhalt, kopf]) => {
        const meta2 = JSON.parse(dec.decode(kopf));
        return { name: meta2.name, typ: meta2.typ, bytes: inhalt };
      }));
    });
  }

  /* ------------------------- Freigaben ------------------------- */

  function freigaben() {
    const m = meta();
    return (m && m.freigaben) ? m.freigaben.slice().reverse() : [];
  }

  function freigabeStatus(f) {
    if (f.widerrufen) return { gueltig: false, grund: 'widerrufen', text: 'widerrufen am ' + U.dateDE(f.widerrufen.slice(0, 10)) };
    const abgelaufen = new Date(f.ablauf) < NW.now();
    if (abgelaufen) return { gueltig: false, grund: 'abgelaufen', text: 'abgelaufen am ' + U.dateDE(f.ablauf.slice(0, 10)) };
    if (f.abrufe.length >= f.maxAbrufe) return { gueltig: false, grund: 'aufgebraucht', text: 'alle ' + f.maxAbrufe + ' Abrufe verbraucht' };
    const tage = Math.ceil((new Date(f.ablauf) - NW.now()) / 86400000);
    return { gueltig: true, grund: 'offen', text: 'gültig noch ' + tage + ' ' + U.plural(tage, 'Tag', 'Tage')
      + ', ' + (f.maxAbrufe - f.abrufe.length) + ' von ' + f.maxAbrufe + ' Abrufen offen' };
  }

  /* Erzeugt eine Freigabe: Die Dokumentschlüssel wandern in den Verweis,
     nicht in den Speicher. Wer den Verweis nicht hat, kann nichts lesen –
     auch nicht, wer Zugriff auf die abgelegten Daten bekommt. */
  function freigabeErstellen(optionen) {
    if (!istOffen()) return Promise.reject(new Error('Der Tresor ist gesperrt.'));
    const ids = optionen.dokumente || [];
    if (!ids.length) return Promise.reject(new Error('Wähle mindestens ein Dokument.'));
    const tage = U.clamp(Number(optionen.tage) || 7, 1, 90);
    const maxAbrufe = U.clamp(Number(optionen.maxAbrufe) || 3, 1, 20);

    return tun('readonly', (s) => s.getAll()).then((alle) => {
      const gewaehlt = alle.filter((s) => ids.indexOf(s.id) >= 0);
      return Promise.all(gewaehlt.map((satz) => dokSchluessel(satz)
        .then((k) => crypto.subtle.exportKey('raw', k))
        .then((roh) => ({ id: satz.id, k: zuBase64(roh) }))));
    }).then((schluessel) => {
      const id = 'fg-' + zuBase64(zufall(9));
      const m = meta();
      m.freigaben = m.freigaben || [];
      m.freigaben.push({
        id, dokumente: ids,
        empfaenger: (optionen.empfaenger || '').slice(0, 120),
        objektId: optionen.objektId || null,
        erstellt: new Date().toISOString(),
        ablauf: new Date(NW.now().getTime() + tage * 86400000).toISOString(),
        maxAbrufe, abrufe: [], widerrufen: null
      });
      metaSetzen(m);
      const geheim = zuBase64(enc.encode(JSON.stringify(schluessel)));
      return { id, geheim, link: linkFuer(id, geheim), tage, maxAbrufe };
    });
  }

  function linkFuer(id, geheim) {
    const basis = location.href.split('#')[0];
    return basis + '#/freigabe/' + id + '~' + geheim;
  }

  function widerrufen(id) {
    const m = meta();
    if (!m) return;
    (m.freigaben || []).forEach((f) => { if (f.id === id) f.widerrufen = new Date().toISOString(); });
    metaSetzen(m);
  }

  function freigabeLoeschen(id) {
    const m = meta();
    if (!m) return;
    m.freigaben = (m.freigaben || []).filter((f) => f.id !== id);
    metaSetzen(m);
  }

  /* Abruf durch die empfangende Seite. Braucht keinen Tresorschlüssel –
     die Dokumentschlüssel stehen im Verweis. */
  function freigabeAbrufen(id, geheim, protokollieren) {
    const m = meta();
    const f = (m && m.freigaben || []).find((x) => x.id === id);
    if (!f) return Promise.reject(new Error('Diesen Verweis gibt es nicht mehr.'));
    const status = freigabeStatus(f);
    if (!status.gueltig) return Promise.reject(new Error('Der Verweis ist ' + status.text + '.'));

    let schluessel;
    try { schluessel = JSON.parse(dec.decode(ausBase64(geheim))); }
    catch (e) { return Promise.reject(new Error('Der Verweis ist unvollständig.')); }

    return tun('readonly', (s) => s.getAll()).then((alle) => {
      return Promise.all(schluessel.map((eintrag) => {
        const satz = alle.find((s) => s.id === eintrag.id);
        if (!satz) return null;
        return crypto.subtle.importKey('raw', ausBase64(eintrag.k), 'AES-GCM', false, ['decrypt'])
          .then((k) => Promise.all([
            entschluesseln(k, satz.inhaltIv, satz.inhalt),
            entschluesseln(k, satz.kopfIv, satz.kopf)
          ]))
          .then(([inhalt, kopf]) => {
            const meta2 = JSON.parse(dec.decode(kopf));
            return { id: satz.id, art: satz.art, name: meta2.name, typ: meta2.typ, bytes: inhalt, groesse: satz.groesse };
          })
          .catch(() => null);
      }));
    }).then((dokumente) => {
      const gueltige = dokumente.filter(Boolean);
      if (!gueltige.length) throw new Error('Die Unterlagen lassen sich mit diesem Verweis nicht entschlüsseln.');
      let stand = f;
      if (protokollieren !== false) {
        const m2 = meta();
        const f2 = (m2.freigaben || []).find((x) => x.id === id);
        if (f2) { f2.abrufe.push({ zeit: new Date().toISOString() }); metaSetzen(m2); stand = f2; }
      }
      /* Der eigene Abruf zählt mit: Wer die Unterlagen gerade geöffnet hat,
         soll „1 von 3“ sehen und nicht „0 von 3“. */
      return { freigabe: stand, dokumente: gueltige };
    });
  }

  /* ------------------------- Aufräumen ------------------------- */

  function allesLoeschen() {
    tresorSchluessel = null;
    try { localStorage.removeItem(META); } catch (e) { /* egal */ }
    return tun('readwrite', (s) => s.clear()).catch(() => { });
  }

  NW.tresor = {
    ARTEN, HEIKEL, MAX_BYTES, OK_TYPEN, RUNDEN,
    verfuegbar, eingerichtet, istOffen, einrichten, entsperren, sperren,
    hinzufuegen, liste, loeschen, oeffnen,
    freigaben, freigabeStatus, freigabeErstellen, freigabeAbrufen,
    widerrufen, freigabeLoeschen, linkFuer, allesLoeschen
  };
})(window.NW = window.NW || {});

/* ===== recht.js ===== */
/* =====================================================================
   Nestwerk – Betreiberangaben und Rechtsgrundlagen

   Hier steht alles an einer Stelle, was in Impressum, Datenschutz-
   erklärung und AGB immer wieder auftaucht: wer der Anbieter ist, wie er
   erreichbar ist, welche Preise gelten. Die Texte greifen ausschließlich
   auf diese Werte zu. Wer umzieht, den Namen ändert oder den Preis
   anpasst, ändert das hier – und nicht an vierzehn Stellen im Fließtext.

   Was leer bleibt, wird in den Texten sichtbar als fehlende Angabe
   markiert, statt still zu verschwinden. Ein Impressum mit einer Lücke
   ist ein Fehler, den man sehen muss: Fehlt die ladungsfähige Anschrift
   oder eine schnelle elektronische Kontaktmöglichkeit, ist die
   Impressumspflicht nach § 5 DDG nicht erfüllt, und das ist abmahnbar.
   ===================================================================== */
(function (NW) {
  'use strict';

  const U = NW.util;

  /* Die Angaben, die der Betrieb selbst setzt. Was hier steht, ist
     Voreinstellung; überschrieben wird sie in der Anwendung unter
     „Angaben zum Anbieter“ und liegt dann im Speicher dieses Browsers. */
  const VORGABE = {
    name: 'Niklas Haberberg',
    rechtsform: 'Einzelunternehmen (Kleingewerbe)',
    zusatz: '',                 /* etwa „Nestwerk“ als Geschäftsbezeichnung */
    strasse: '',
    plz: '',
    ort: '',
    land: 'Deutschland',
    email: '',
    telefon: '',
    /* Postfach des Service-Teams. Getrennt von der Impressumsadresse:
       Die eine ist Pflichtangabe, die andere ein Arbeitsweg – und wer
       beides vermischt, kann später keine davon ändern. */
    service: 'info@nestwerk.de',
    ustId: '',                  /* § 27a UStG – bei Kleinunternehmern meist keine */
    kleinunternehmer: true,     /* § 19 UStG: kein Ausweis von Umsatzsteuer */
    handelsregister: '',        /* Kleingewerbe: keins */
    gewerbeamt: '',             /* zuständige Stelle der Gewerbeanmeldung */
    aufsichtsbehoerde: '',      /* Datenschutz: Aufsichtsbehörde am Sitz */
    verantwortlichMStV: '',     /* § 18 Abs. 2 MStV – Name und Anschrift */
    stand: '2026-08-23'
  };

  /* Welche Felder wofür gebraucht werden. Grundlage für die Prüfliste
     und für die Markierungen im Text. */
  const PFLICHT = [
    { feld: 'name', label: 'Name des Anbieters', wofuer: 'Impressum, Datenschutz, AGB',
      grund: '§ 5 Abs. 1 Nr. 1 DDG, Art. 13 Abs. 1 lit. a DSGVO' },
    { feld: 'strasse', label: 'Straße und Hausnummer', wofuer: 'Impressum',
      grund: '§ 5 Abs. 1 Nr. 1 DDG – ladungsfähige Anschrift, kein Postfach' },
    { feld: 'plz', label: 'Postleitzahl', wofuer: 'Impressum', grund: '§ 5 Abs. 1 Nr. 1 DDG' },
    { feld: 'ort', label: 'Ort', wofuer: 'Impressum', grund: '§ 5 Abs. 1 Nr. 1 DDG' },
    { feld: 'email', label: 'E-Mail-Adresse', wofuer: 'Impressum, Datenschutz, Widerruf',
      grund: '§ 5 Abs. 1 Nr. 2 DDG – Pflichtangabe' },
    { feld: 'telefon', label: 'Telefonnummer', wofuer: 'Impressum',
      grund: '§ 5 Abs. 1 Nr. 2 DDG – oder ein anderes ebenso schnelles Mittel; die Rechtsprechung verlangt in der Regel die Nummer' },
    { feld: 'gewerbeamt', label: 'Stelle der Gewerbeanmeldung', wofuer: 'Prüfliste',
      grund: 'keine Impressumspflicht, aber nützlich für die eigene Ablage', freiwillig: true },
    { feld: 'aufsichtsbehoerde', label: 'Datenschutz-Aufsichtsbehörde', wofuer: 'Datenschutzerklärung',
      grund: 'Art. 13 Abs. 2 lit. d DSGVO – Hinweis auf das Beschwerderecht' }
  ];

  function angaben() {
    const eigene = (NW.store.get().betreiber) || {};
    return Object.assign({}, VORGABE, eigene);
  }

  function fehlt(feld) {
    const a = angaben();
    return !String(a[feld] || '').trim();
  }

  function fehlendeAngaben() {
    return PFLICHT.filter((p) => !p.freiwillig && fehlt(p.feld));
  }

  /* Im Text: entweder der Wert oder eine sichtbare Lücke. */
  function wert(feld, beschreibung) {
    const a = angaben();
    const v = String(a[feld] || '').trim();
    if (v) return U.html`${v}`;
    return U.html`<mark class="luecke" title="Diese Angabe fehlt noch">[${beschreibung || feld} eintragen]</mark>`;
  }

  function anschrift() {
    const a = angaben();
    return U.html`${wert('name', 'Name')}${a.zusatz ? U.html`<br>${a.zusatz}` : ''}<br>
      ${wert('strasse', 'Straße und Hausnummer')}<br>
      ${wert('plz', 'PLZ')} ${wert('ort', 'Ort')}<br>
      ${a.land}`;

  function loeschen() {

    const k = aktuell();

      '<path d="M40 0H0V40" fill="none" stroke="currentColor" stroke-width="1" opacity=".12"/></pattern>' +
      '<radialGradient id="k-heat"><stop offset="0" stop-color="currentColor" stop-opacity=".38"/>' +
      '<stop offset="1" stop-color="currentColor" stop-opacity="0"/></radialGradient>' +
      '</defs>' +
      '<rect class="karte__bg" width="' + W + '" height="' + H + '" fill="url(#k-raster)"/>' +
      '<g class="karte__heat"></g>' +
      '<g class="karte__umkreis"></g>' +

      '</div>' +

      '<span><i style="background:' + FARBEN.wg + '"></i>WG</span>' +

      const x = e.clientX - rect.left, y = e.clientY - rect.top;

      this.listings.forEach((l) => {
        if (gezeigt[l.viertelKey]) return;
        gezeigt[l.viertelKey] = 1;
        const d = G.districtByKey[l.viertelKey];
        if (!d) return;
        const p = this.zumBild(d.lat, d.lng);
        if (p.x < 20 || p.x > W - 20 || p.y < 20 || p.y > H - 20) return;
        labels += '<text class="karte__viertel" x="' + p.x.toFixed(0) + '" y="' + (p.y - 26).toFixed(0) + '">' +
          U.esc(d.name) + '</text>';
      });
    } else {
      const gezeigt = {};
      this.listings.forEach((l) => {
        if (gezeigt[l.stadt]) return;
        gezeigt[l.stadt] = 1;
        const c = G.cityByName[l.stadt];
        if (!c) return;
        const p = this.zumBild(c.lat, c.lng);
        if (p.x < 10 || p.x > W - 10 || p.y < 10 || p.y > H - 10) return;
        labels += '<text class="karte__stadt" x="' + p.x.toFixed(0) + '" y="' + (p.y - 30).toFixed(0) + '">' + U.esc(c.name) + '</text>';
      });
    }
    this.gLabels.innerHTML = labels;

    /* --- Umkreis --- */
    if (this.umkreis) {
      const p = this.zumBild(this.umkreis.lat, this.umkreis.lng);
      const rad = this.umkreis.km * this.view.scale;
      this.gUmkreis.innerHTML =
        '<circle class="karte__radius" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + rad.toFixed(1) + '"/>' +
        '<circle class="karte__mitte" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="5"/>' +
        '<text class="karte__radiustext" x="' + p.x.toFixed(1) + '" y="' + (p.y - rad - 8).toFixed(1) + '">' +
        U.esc(U.dec(this.umkreis.km)) + ' km</text>';
    } else {
      this.gUmkreis.innerHTML = '';
    }

    /* --- Pins, bei Bedarf gebündelt --- */
    const zellgroesse = 34;
    const zellen = {};
    sichtbar.forEach((s) => {
      const key = Math.round(s.p.x / zellgroesse) + '_' + Math.round(s.p.y / zellgroesse);
      (zellen[key] = zellen[key] || []).push(s);
    });

    let pins = '';
    Object.keys(zellen).forEach((key) => {
      const gruppe = zellen[key];
      const x = U.sum(gruppe.map((g) => g.p.x)) / gruppe.length;
      const y = U.sum(gruppe.map((g) => g.p.y)) / gruppe.length;
      const ids = gruppe.map((g) => g.l.id);

      if (gruppe.length > 1) {
        const r = U.clamp(11 + Math.log(gruppe.length) * 5, 12, 26);
        const preise = gruppe.map((g) => g.l.kind === 'kauf' ? g.l.kaufpreis : g.l.warm);
        pins += '<g class="karte__cluster" data-pin="' + ids.join(',') + '" data-tip="' +
          U.esc('<b>' + gruppe.length + ' Objekte</b><br>ab ' + U.eur(Math.min.apply(null, preise)) + ' · Klick zum Aufteilen') + '" tabindex="0">' +
          '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) + '"/>' +
          '<text x="' + x.toFixed(1) + '" y="' + (y + 4).toFixed(1) + '">' + gruppe.length + '</text></g>';
      } else {
        const l = gruppe[0].l;
        const aktiv = l.id === this.aktivId;
        const preis = l.kind === 'kauf' ? U.eur(l.kaufpreis) : U.eur(l.warm);
        const tip = '<b>' + U.esc(l.titel) + '</b><br>' + U.esc(preis + (l.kind === 'kauf' ? '' : ' warm') +
          ' · ' + U.dec(l.zimmer) + ' Zi. · ' + l.flaeche + ' m²');
        if (this.view.scale > 90) {
          const breite = preis.length * 7.4 + 16;
          pins += '<g class="karte__preis' + (aktiv ? ' is-aktiv' : '') + '" data-pin="' + l.id + '" data-tip="' + U.esc(tip) + '" tabindex="0">' +
            '<rect x="' + (x - breite / 2).toFixed(1) + '" y="' + (y - 12).toFixed(1) + '" width="' + breite.toFixed(1) + '" height="24" rx="12" style="fill:' + FARBEN[l.kind] + '"/>' +
            '<text x="' + x.toFixed(1) + '" y="' + (y + 5).toFixed(1) + '">' + U.esc(preis) + '</text></g>';
        } else {
          pins += '<circle class="karte__pin' + (aktiv ? ' is-aktiv' : '') + '" data-pin="' + l.id + '" data-tip="' + U.esc(tip) +
            '" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (aktiv ? 9 : 6) + '" style="fill:' + FARBEN[l.kind] + '" tabindex="0"/>';
        }
      }
    });
    this.gPins.innerHTML = pins;
  };

  NW.karte = {
    erzeugen: (el, opt) => new Karte(el, opt),
    FARBEN
  };
})(window.NW = window.NW || {});

  function sprite() {

        'stroke-linecap="round" stroke-linejoin="round">' + ICONS[k] + '</symbol>').join('') +
      '</defs></svg>';
  }

  /* ================================================================
     Kleine Bausteine
     ================================================================ */

  const ART_LABEL = { miete: 'Miete', kauf: 'Kauf', wg: 'WG-Zimmer', tausch: 'Tausch' };
  const ART_ICON = { miete: 'schluessel', kauf: 'haus', wg: 'wg', tausch: 'tausch' };

  /* Die Art allein reicht als Beschriftung nicht mehr: „Kauf“ steht über
     einer Wohnung, einem Haus und einem Grundstück gleichermaßen, und das
     sind drei sehr verschiedene Dinge. */
  function artLabel(l) {
    if (l.kind === 'kauf') {
      return l.type === 'grundstueck' ? 'Grundstück' : l.type === 'haus' ? 'Haus' : 'Eigentumswohnung';
    }
    if (l.kind === 'miete' && l.type === 'haus') return 'Haus zur Miete';
    return ART_LABEL[l.kind];
  }

  const artIcon = (l) =>
    l.type === 'grundstueck' ? 'karte' : l.type === 'haus' ? 'dach' : ART_ICON[l.kind];

  function badge(text, art, symbol) {
    return h`<span class="badge badge--${art || 'neutral'}">${symbol ? ico(symbol) : ''}${text}</span>`;
  }

  function ampelFarbe(ton) {
    return { gut: 'gut', neutral: 'neutral', mittel: 'warn', schlecht: 'schlecht', warn: 'warn' }[ton] || 'neutral';
  }

  /* Ringförmige Prozentanzeige für die Passung. */
  function passungsRing(score, groesse) {
    const g = groesse || 44, r = g / 2 - 4, umfang = 2 * Math.PI * r;
    const stufe = score >= 80 ? 'gut' : score >= 60 ? 'ok' : score >= 40 ? 'mittel' : 'schwach';
    return raw('<span class="ring ring--' + stufe + '" style="--g:' + g + 'px" role="img" aria-label="Passung ' + score + ' Prozent">' +
      '<svg viewBox="0 0 ' + g + ' ' + g + '" aria-hidden="true">' +
      '<circle class="ring__spur" cx="' + g / 2 + '" cy="' + g / 2 + '" r="' + r + '"/>' +
      '<circle class="ring__wert" cx="' + g / 2 + '" cy="' + g / 2 + '" r="' + r + '" ' +
      'stroke-dasharray="' + umfang.toFixed(1) + '" stroke-dashoffset="' + (umfang * (1 - score / 100)).toFixed(1) + '"/>' +
      '</svg><b>' + score + '</b></span>');
  }

  function energieBalken(klasse) {
    const stufen = ['A+', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    const i = stufen.indexOf(klasse);
    return raw('<span class="energie" title="Energieklasse ' + klasse + '">' +
      stufen.map((s, n) => '<i class="' + (n === i ? 'is-aktiv' : '') + '" style="--n:' + n + '"></i>').join('') +
      '<b>' + klasse + '</b></span>');
  }

  /* ================================================================
     Inseratskarte
     ================================================================ */

  function preisZeile(l) {
    if (l.kind === 'kauf') {
      return h`<b>${U.eur(l.kaufpreis)}</b><span>${U.eur(Math.round(l.kaufpreis / l.flaeche))}/m²</span>`;
    }
    return h`<b>${U.eur(l.warm)}</b><span>warm · ${U.eur(l.kalt)} kalt</span>`;
  }

  function kartenMarken(l, b) {
    const marken = [];
    const tage = U.daysSince(l.stats.online);
    if (tage <= 2) marken.push(badge('neu', 'gut'));
    if (l.kind === 'miete' && l.provision === 0) marken.push(badge('provisionsfrei', 'info'));
    /* Die Vertrauensstufe der anbietenden Seite gehört auf die Karte, nicht
       nur auf die Objektseite: Wer sie erst nach dem Klick sieht, hat schon
       Zeit verloren. Unter Stufe 2 wird gewarnt statt geschwiegen. */
    const st = NW.konto ? (l.anbieter.stufe === undefined ? (l.anbieter.verifiziert ? 3 : 1) : l.anbieter.stufe) : null;
    if (st !== null && st <= 1) marken.push(badge('Anbieter ungeprüft', 'warn', 'warnung'));
    else if (st !== null && st >= 4) marken.push(badge('Ausweis geprüft', 'gut', 'pruefen'));
    else if (l.anbieter.verifiziert) marken.push(badge('geprüft', 'neutral', 'pruefen'));
    if (b && b.risiko.stufe === 'warnung') marken.push(badge('Prüfhinweis', 'schlecht', 'warnung'));
    else if (b && b.risiko.stufe === 'achtung') marken.push(badge('genau lesen', 'warn', 'warnung'));
    if (b && b.mietCheck && b.mietCheck.diff <= -12) marken.push(badge(b.mietCheck.diff + ' % zum Spiegel', 'gut'));
    if (b && b.mietCheck && b.mietCheck.diff > 25) marken.push(badge('+' + b.mietCheck.diff + ' % zum Spiegel', 'schlecht'));
    if (l.befristetBis) marken.push(badge('befristet', 'warn'));
    if (l.kind === 'wg' && b && b.wg && b.wg.ausschluss.length) marken.push(badge('Ausschlusskriterium', 'schlecht'));
    /* Bezahlte Sichtbarkeit steht als Erstes und heißt beim Namen. */
    if (NW.plan.istTop(l)) marken.unshift(badge('Top-Anzeige', 'info', 'blitz'));
    else if (NW.plan.istHervorgehoben(l)) marken.unshift(badge('hervorgehoben', 'info', 'stern'));
    return marken;
  }

  function inseratsKarte(l, b, optionen) {
    const opt = optionen || {};
    const gemerkt = NW.store.gemerkt(l.id);
    const imVergleich = NW.store.imVergleich(l.id);
    const eck = [];
    if (l.type === 'grundstueck') {
      eck.push(U.num(l.grundstueck || l.flaeche) + ' m² Grund');
      eck.push(String((l.grund || {}).baulandArt || 'Bauland').split(',')[0]);
      eck.push('GRZ ' + U.dec((l.grund || {}).grz || 0));
    } else {
      eck.push(U.dec(l.zimmer) + ' Zi.');
      eck.push(l.flaeche + ' m²');
      if (l.kind === 'wg') eck.push('WG mit ' + l.wg.groesse);
      else if (l.type === 'haus') eck.push(l.grundstueck ? U.num(l.grundstueck) + ' m² Grund' : 'Haus');
      else eck.push(l.etage === 0 ? 'EG' : l.etage >= l.etagen ? 'DG' : l.etage + '. OG');
    }
    eck.push('ab ' + U.dateDE(l.freiAb));

    const hervor = NW.plan.istHervorgehoben(l);
    return h`<article class="karte-inserat ${opt.kompakt ? 'is-kompakt' : ''} ${hervor ? 'is-hervor' : ''}" data-id="${l.id}">
      <a class="karte-inserat__bild" href="#/objekt/${l.id}" aria-label="${l.titel} ansehen">
        ${raw(NW.img.make(l, 0))}
        <span class="karte-inserat__art">${ico(artIcon(l))}${artLabel(l)}</span>
        ${b ? h`<span class="karte-inserat__ring">${passungsRing(b.score)}</span>` : ''}
      </a>
      <div class="karte-inserat__text">
        <div class="karte-inserat__marken">${kartenMarken(l, b)}</div>
        <h3><a href="#/objekt/${l.id}">${l.titel}</a></h3>
        <p class="karte-inserat__ort">${ico('karte')}${l.viertel}, ${l.stadt} · ${l.strasse}</p>
        <p class="karte-inserat__preis">${raw(preisZeile(l))}</p>
        <ul class="karte-inserat__eck">${eck.map((e) => h`<li>${e}</li>`)}</ul>
        ${b && b.pendel ? h`<p class="karte-inserat__pendel">${ico('zug')}${U.minutesLabel(b.pendel.min)} nach ${b.pendel.anker.name}</p>` : ''}
        ${l.kind === 'wg' && b && b.wg && !b.wg.ausschluss.length
        ? h`<p class="karte-inserat__wg">${ico('wg')}WG-Passung ${b.wg.score} % – ${b.wg.kurz}</p>` : ''}
        ${l.kind === 'tausch' ? h`<p class="karte-inserat__wg">${ico('tausch')}sucht ${l.tausch.suche.staedte.join(', ')}</p>` : ''}
        <div class="karte-inserat__fuss">
          <span class="karte-inserat__meta">${U.since(l.stats.online)} · ${l.stats.bewerber} ${U.plural(l.stats.bewerber, 'Interessent', 'Interessenten')}</span>
          <div class="karte-inserat__tun">
            <button type="button" class="ikon-btn ${gemerkt ? 'is-an' : ''}" data-tu="merken" data-id="${l.id}"
              aria-pressed="${gemerkt ? 'true' : 'false'}" title="Merken">${ico('herz')}</button>
            <button type="button" class="ikon-btn ${imVergleich ? 'is-an' : ''}" data-tu="vergleich" data-id="${l.id}"
              aria-pressed="${imVergleich ? 'true' : 'false'}" title="Vergleichen">${ico('waage')}</button>
          </div>
        </div>
      </div>
    </article>`;
  }

  /* ================================================================
     Tarifsperren und Anzeigen
     ================================================================ */

  /* Eine Sperre zeigt immer, was dahinterliegt – nie nur ein Schloss.
     Wer nicht sieht, was ihm fehlt, kann nicht entscheiden. */
  function sperrHinweis(leistungId, text) {
    const l = NW.plan.leistung(leistungId) || {};
    return h`<div class="sperre">
      <span class="sperre__zeichen">${ico('schloss')}</span>
      <div class="sperre__text">
        <b>${l.name || 'Mit Plus verfügbar'}</b>
        <p>${text || (l.frei + ' im freien Tarif, ' + l.plus + ' mit Plus.')}</p>
      </div>
      <button type="button" class="knopf knopf--klein" data-tu="sperre" data-leistung="${leistungId}">Ansehen</button>
    </div>`;
  }

  /* Anzeigen sind immer gekennzeichnet und sehen nie aus wie ein Inserat. */
  function anzeige(schluessel, variante) {
    const a = NW.plan.anzeige(schluessel);
    if (!a) return '';
    return h`<aside class="anzeige anzeige--${variante || 'breit'}" aria-label="Anzeige">
      <p class="anzeige__kopf">
        <span class="anzeige__marke">Anzeige</span>
        <span class="anzeige__art">${a.art}</span>
        <button type="button" class="anzeige__warum" data-tu="warum-werbung"
          title="Warum sehe ich das?" aria-label="Warum sehe ich das?">?</button>
      </p>
      <button type="button" class="anzeige__inhalt" data-tu="anzeige-klick">
        <span class="anzeige__zeichen">${ico(a.icon)}</span>
        <span class="anzeige__wort">
          <b>${a.titel}</b>
          <i>${a.text}</i>
          <em>${a.absender} · ${a.ruf}${ico('chevron')}</em>
        </span>
      </button>
      <a class="anzeige__ohne" href="#/plus">ohne Anzeigen lesen</a>
    </aside>`;
  }

  /* ================================================================
     Meldungen und Dialoge
     ================================================================ */

  const TOAST_MAX = 3;

  /* Meldungen dürfen sich nicht stapeln. Wer ein Formular ausfüllt,
     löst schnell ein Dutzend gleicher Hinweise aus – und sieht dann eine
     Wand aus Meldungen statt der Seite. Deshalb: gleiche Meldung wird
     aufgefrischt statt verdoppelt, und mehr als drei gleichzeitig gibt
     es nie. */
  function toast(text, art) {
    const box = U.$('#toasts');
    if (!box) return;

    const vorhanden = U.$$('.toast', box).find((t) => t.dataset.text === String(text));
    if (vorhanden) {
      vorhanden.classList.remove('is-weg');
      vorhanden.classList.add('is-frisch');
      setTimeout(() => vorhanden.classList.remove('is-frisch'), 200);
      planeAbgang(vorhanden);
      return;
    }

    const el = document.createElement('div');
    el.className = 'toast toast--' + (art || 'info');
    el.dataset.text = String(text);
    el.setAttribute('role', 'status');
    el.innerHTML = h`${ico(art === 'schlecht' ? 'warnung' : art === 'gut' ? 'pruefen' : 'info')}<span>${text}</span>`;
    box.appendChild(el);

    const alle = U.$$('.toast', box);
    if (alle.length > TOAST_MAX) alle.slice(0, alle.length - TOAST_MAX).forEach((x) => x.remove());
    planeAbgang(el);
  }

  function planeAbgang(el) {
    clearTimeout(Number(el.dataset.timer));
    el.dataset.timer = String(setTimeout(() => {
      el.classList.add('is-weg');
      el.addEventListener('transitionend', () => el.remove(), { once: true });
      setTimeout(() => el.remove(), 800);
    }, 3600));
  }

  /* Notweg, wenn kein Speichern möglich ist: Inhalt zum Herauskopieren. */
  function alsText(daten, dateiname) {
    dialog({
      titel: 'Datei sichern',
      breit: true,
      inhalt: h`<p>In dieser Umgebung darf die Seite keine Datei ablegen. Der vollständige Inhalt steht
        hier zum Kopieren – speichere ihn als <code>${dateiname || 'nestwerk-daten.json'}</code>.</p>
        <label class="feld"><span class="nur-sr">Inhalt</span><textarea rows="12" id="daten-text" readonly>${daten}</textarea></label>`,
      fuss: h`<button type="button" class="knopf" data-tu="kopieren" data-quelle="#daten-text">${ico('kopieren')}Kopieren</button>`
    });
  }

  /* Drei Wege, eine Datei loszuwerden: die Speicher-Schnittstelle der
     Umgebung, der klassische Link, und zur Not der Text zum Kopieren.
     Eingebettet in einer Hülle läuft ein Download-Link sonst ins Leere. */
  function dateiSichern(dateiname, inhalt, mime) {
    const umgebung = window.claude;
    if (umgebung && typeof umgebung.use === 'function') {
      umgebung.use('downloads').then((downloads) => {
        if (!downloads) { alsText(inhalt, dateiname); return; }
        return downloads.save({ filename: dateiname, data: inhalt })
          .then(() => toast('Datei gesichert.', 'gut'),
            (fehler) => {
              if (fehler && fehler.code === 'declined') toast('Sicherung abgebrochen.');
              else alsText(inhalt, dateiname);
            });
      }, () => alsText(inhalt, dateiname));
      return;
    }
    const blob = new Blob([inhalt], { type: mime || 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = dateiname;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Datei gesichert.', 'gut');
  }

  let dialogSchliessen = null;
  function dialog(optionen) {
    const opt = optionen || {};
    const wrap = U.$('#dialog');
    const vorher = document.activeElement;
    wrap.innerHTML = h`<div class="dialog__flaeche" data-tu="dialog-zu"></div>
      <div class="dialog__box ${opt.breit ? 'is-breit' : ''}" role="dialog" aria-modal="true" aria-labelledby="dialog-titel">
        <header class="dialog__kopf">
          <h2 id="dialog-titel">${opt.titel}</h2>
          <button type="button" class="ikon-btn" data-tu="dialog-zu" aria-label="Schließen">${ico('x')}</button>
        </header>
        <div class="dialog__inhalt">${raw(opt.inhalt || '')}</div>
        ${opt.fuss ? h`<footer class="dialog__fuss">${raw(opt.fuss)}</footer>` : ''}
      </div>`;
    wrap.hidden = false;
    document.body.classList.add('hat-dialog');
    const box = wrap.querySelector('.dialog__box');
    const fokusierbar = () => U.$$('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])', box);
    setTimeout(() => { const f = fokusierbar(); (f[0] || box).focus(); }, 20);

    function taste(e) {
      if (e.key === 'Escape') { e.preventDefault(); zu(); return; }
      if (e.key !== 'Tab') return;
      const f = fokusierbar();
      if (!f.length) return;
      const erst = f[0], letzt = f[f.length - 1];
      if (e.shiftKey && document.activeElement === erst) { e.preventDefault(); letzt.focus(); }
      else if (!e.shiftKey && document.activeElement === letzt) { e.preventDefault(); erst.focus(); }
    }
    document.addEventListener('keydown', taste);

    function zu() {
      document.removeEventListener('keydown', taste);
      wrap.hidden = true;
      wrap.innerHTML = '';
      document.body.classList.remove('hat-dialog');
      dialogSchliessen = null;
      if (vorher && vorher.focus) vorher.focus();
      if (opt.beimSchliessen) opt.beimSchliessen();
    }
    dialogSchliessen = zu;
    return zu;
  }

  function dialogZu() { if (dialogSchliessen) dialogSchliessen(); }

  /* ================================================================
     Router
     ================================================================ */

  function routeLesen() {
    const roh = location.hash.replace(/^#\/?/, '') || 'start';
    const [pfad, query] = roh.split('?');
    const teile = pfad.split('/').filter(Boolean);
    const params = {};
    if (query) query.split('&').forEach((p) => {
      const [k, v] = p.split('=');
      params[decodeURIComponent(k)] = decodeURIComponent(v || '');
    });
    return { name: teile[0] || 'start', arg: teile[1] ? decodeURIComponent(teile[1]) : null, params };
  }

  function gehe(ziel) {
    if (location.hash === '#/' + ziel) zeichnen();
    else location.hash = '#/' + ziel;
  }

  let letzteRoute = '';
  function zeichnen(erzwingen) {
    const r = routeLesen();
    const schluessel = r.name + '/' + r.arg + '/' + JSON.stringify(r.params);
    if (!erzwingen && schluessel === letzteRoute) return;
    const wechsel = letzteRoute.split('/')[0] !== r.name;
    letzteRoute = schluessel;

    /* Ein Verweis im Dialog hat die Seite darunter gewechselt, während der
       Dialog stehen blieb. Bei einem echten Routenwechsel schließt er. */
    if (!erzwingen) dialogZu();

    /* Die Anmeldesperre. Was ohne Anmeldung erreichbar bleiben muss:
       Impressum, Datenschutzerklärung und AGB, weil § 5 DDG „ständig
       verfügbar“ verlangt und hinter einer Anmeldung nichts ständig
       verfügbar ist – dazu Widerruf, Meldeweg und die Hilfe. Wer nicht
       hereinkommt, braucht die Hilfe am dringendsten. */
    const OHNE_ANMELDUNG = ['anmelden', 'recht', 'hilfe', 'freigabe'];
    const gesperrt = NW.konto && !NW.konto.angemeldet() && OHNE_ANMELDUNG.indexOf(r.name) < 0;
    const name = gesperrt ? 'anmelden' : r.name;

    const ansicht = ui.ansichten[name] || ui.ansichten.start;
    ui.aktuell = name;
    ui.params = r;
    document.body.classList.toggle('ist-angemeldet', !(NW.konto && !NW.konto.angemeldet()));

    const haupt = U.$('#haupt');
    const ergebnis = ansicht(r) || {};
    document.title = (ergebnis.titel ? ergebnis.titel + ' – ' : '') + 'Nestwerk';
    haupt.innerHTML = ergebnis.html || '';
    haupt.dataset.ansicht = name;

    U.$$('[data-route]').forEach((a) => {
      a.classList.toggle('is-aktiv', a.dataset.route === name);
      if (a.dataset.route === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });

    if (ergebnis.danach) ergebnis.danach(haupt);
    bandZeichnen();
    if (NW.viewHilfe) NW.viewHilfe.zeichnen(false);
    /* Nur bei einem echten Ansichtswechsel nach oben – nicht bei jedem
       Neuaufbau derselben Seite. */
    if (wechsel && !erzwingen) scrolleSofort(0);
    aktualisiereZaehler();
  }

  /* Wiederaufbau der aktuellen Ansicht nach einer Zustandsänderung.

     Die Ansicht wird komplett neu gebaut – deshalb muss hier bewahrt
     werden, was sonst verlorenginge: die Stelle, an der jemand gerade
     liest, und der Tastaturfokus. Ohne das springt die Seite bei jedem
     Klick aufs Herz, und wer mit der Tastatur bedient, landet wieder
     ganz am Anfang. */
  function merkmalDesFokus() {
    const el = document.activeElement;
    if (!el || el === document.body || !document.getElementById('haupt')) return null;
    if (!document.getElementById('haupt').contains(el)) return null;
    const d = el.dataset || {};
    return {
      id: el.id || null,
      tu: d.tu || d.tuChange || d.tuInput || null,
      datenId: d.id || null,
      feld: d.feld || null,
      wert: d.wert || null,
      auswahl: el.selectionStart != null ? [el.selectionStart, el.selectionEnd] : null
    };
  }

  function fokusWiederherstellen(m) {
    if (!m) return;
    let ziel = null;
    if (m.id) ziel = document.getElementById(m.id);
    if (!ziel && m.tu) {
      const kandidaten = U.$$('[data-tu="' + m.tu + '"],[data-tu-change="' + m.tu + '"],[data-tu-input="' + m.tu + '"]');
      ziel = kandidaten.find((el) => {
        const d = el.dataset;
        return (!m.datenId || d.id === m.datenId) && (!m.feld || d.feld === m.feld) && (!m.wert || d.wert === m.wert);
      }) || null;
    }
    if (!ziel) return;
    try {
      ziel.focus({ preventScroll: true });
      if (m.auswahl && ziel.setSelectionRange) ziel.setSelectionRange(m.auswahl[0], m.auswahl[1]);
    } catch (e) { /* manche Elemente lassen sich nicht fokussieren */ }
  }

  /* Sprungfrei scrollen: Für Sprungmarken ist weiches Scrollen richtig,
     beim Wiederherstellen nach einem Neuaufbau wäre es eine sichtbare
     Rutschpartie. Deshalb hier ausdrücklich ohne Animation. */
  function scrolleSofort(y) {
    try {
      window.scrollTo({ top: y, left: 0, behavior: 'instant' });
    } catch (e) {
      const wurzel = document.documentElement;
      const alt = wurzel.style.scrollBehavior;
      wurzel.style.scrollBehavior = 'auto';
      window.scrollTo(0, y);
      wurzel.style.scrollBehavior = alt;
    }
  }

  function neuZeichnen() {
    const y = window.scrollY;
    const fokus = merkmalDesFokus();
    zeichnen(true);
    scrolleSofort(y);
    fokusWiederherstellen(fokus);
  }

  /* Ein schmales Band unter der Kopfzeile für Dinge, die ihre Zeit haben:
     derzeit nur der Hinweis, dass ein Gründerjahr zu Ende geht. Wer vier
     Wochen vorher Bescheid weiß, wird von nichts überrascht – und genau
     das ist der Unterschied zu einem Abo, das sich still verlängert. */
  function bandZeichnen() {
    const el = U.$('#band');
    if (!el) return;
    const P = NW.plan;
    const s = NW.store.get();
    const g = P.gruender();
    let inhalt = '';

    if (g.nummer && P.gruenderAktiv() && P.gruenderTageRest() <= 28) {
      const tage = P.gruenderTageRest();
      const weg = s.hinweiseGelesen['gruenderEnde'];
      /* „in 12 Tagen“, nicht „in 12 Tage“ – die Zeitangabe steht im Dativ. */
      const wann = tage <= 1 ? 'morgen' : 'in ' + tage + ' Tagen';
      if (!weg || U.daysSince(weg) >= 7) {
        inhalt = h`<div class="band band--hinweis">
          ${ico('verlauf')}
          <p><b>Dein Gründerjahr endet ${wann}</b>, am ${U.dateDE(g.bis)}.
            Danach läuft nichts weiter und es wird nichts abgebucht – der freie Tarif steht dir offen, Plus nur,
            wenn du dich aktiv dafür entscheidest.</p>
          <a class="knopf knopf--klein" href="#/plus">Tarife ansehen</a>
          <button type="button" class="ikon-btn" data-tu="band-zu" data-was="gruenderEnde"
            aria-label="Hinweis ausblenden">${ico('x')}</button>
        </div>`;
      }
    } else if (g.nummer && !P.gruenderAktiv() && !s.hinweiseGelesen['gruenderVorbei']) {
      inhalt = h`<div class="band">
        ${ico('info')}
        <p><b>Dein Gründerjahr ist abgelaufen.</b> Merkliste, Profil und Notizen sind vollständig erhalten;

          aria-label="Hinweis ausblenden">${ico('x')}</button>
      </div>`;
    }
    el.innerHTML = String(inhalt);
  }

  function aktualisiereZaehler() {
    const s = NW.store.get();

    /* Der Kopf entsteht nur einmal beim Start; der Tarifknopf darin muss
       einem Wechsel trotzdem folgen. */
    const tarifknopf = U.$('.tarifknopf');
    if (tarifknopf) {
      const plus = NW.plan.istPlus();
      tarifknopf.classList.toggle('is-plus', plus);
      tarifknopf.title = plus ? 'Nestwerk Plus aktiv' : 'Tarife ansehen';
      tarifknopf.innerHTML = plus
        ? ico('plus5').__raw + '<span>Plus</span>'
        : '<span>Plus entdecken</span>';
    }

    const setze = (name, wert) => {
      U.$$('[data-zaehler="' + name + '"]').forEach((el) => {
        el.textContent = wert > 99 ? '99+' : wert;
        el.hidden = !wert;
      });
    };
    setze('merkliste', Object.keys(s.merkliste).length);
    setze('vergleich', s.vergleich.length);
    setze('nachrichten', U.sum(s.threads.map((t) => t.ungelesen)));
    let neu = 0;
    s.agenten.forEach((a) => { if (a.aktiv) neu += NW.store.agentTreffer(a).neu.length; });
    setze('agenten', neu);
  }

  /* ================================================================
     Darstellung hell/dunkel
     ================================================================ */

  function themeSetzen(wert) {
    const wurzel = document.documentElement;
    if (wert === 'auto') {
      wurzel.removeAttribute('data-theme');
    } else {
      wurzel.setAttribute('data-theme', wert);
    }
    NW.store.set({ theme: wert }, 'theme');
  }

  function themeWechseln() {
    const jetzt = NW.store.get().theme;
    const dunkelSystem = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const reihenfolge = ['auto', dunkelSystem ? 'light' : 'dark', dunkelSystem ? 'dark' : 'light'];
    const i = reihenfolge.indexOf(jetzt);
    const neu = reihenfolge[(i + 1) % reihenfolge.length];
    themeSetzen(neu);
    toast(neu === 'auto' ? 'Darstellung folgt dem System.' : neu === 'dark' ? 'Dunkle Darstellung.' : 'Helle Darstellung.');
  }

        { route: 'recht/widerruf', label: 'Widerruf', icon: 'zurueck' },
        { route: 'recht/kuendigen', label: 'Verträge kündigen', icon: 'x' },
        { route: 'hilfe', label: 'Hilfe und häufige Fragen', icon: 'nachricht' },
        { route: 'konto', label: 'Konto und Vertrauensstufe', icon: 'person' }
      ]).forEach((nav) => {
        if (!n || U.norm(nav.label).indexOf(n) >= 0) out.push({ art: 'bereich', label: nav.label, icon: nav.icon, ziel: nav.route });
      });
      if (n.length >= 2) {
        NW.geo.CITIES.forEach((c) => {
          if (U.norm(c.name).indexOf(n) >= 0) out.push({ art: 'stadt', label: c.name, unter: 'Stadt', icon: 'karte', ziel: 'suche?stadt=' + encodeURIComponent(c.name) });
        });
        NW.geo.DISTRICTS.forEach((d) => {
          if (U.norm(d.name).indexOf(n) >= 0) out.push({ art: 'viertel', label: d.name, unter: d.city + ' · ' + d.charakter, icon: 'karte', ziel: 'suche?viertel=' + encodeURIComponent(d.key) });
        });
        const objekte = NW.data.listings.filter((l) => NW.analyse.passtText(l, q)).slice(0, 6);
        objekte.forEach((l) => out.push({
          art: 'objekt', label: l.titel, unter: l.stadt + ' · ' + (l.kind === 'kauf' ? U.eur(l.kaufpreis) : U.eur(l.warm) + ' warm'),
          icon: ART_ICON[l.kind], ziel: 'objekt/' + l.id
        }));
        if (q.trim()) out.push({ art: 'suche', label: 'Alles zu „' + q.trim() + '“ durchsuchen', icon: 'suche', ziel: 'suche?q=' + encodeURIComponent(q.trim()) });
      }
      return out.slice(0, 12);
    }

    function malen() {
      liste.innerHTML = treffer.length
        ? treffer.map((t, i) => h`<button type="button" class="palette__eintrag ${i === markiert ? 'is-markiert' : ''}"
            role="option" aria-selected="${i === markiert ? 'true' : 'false'}" data-ziel="${t.ziel}">
            ${ico(t.icon)}<span><b>${t.label}</b>${t.unter ? h`<i>${t.unter}</i>` : ''}</span></button>`).join('')
        : '<p class="palette__leer">Nichts gefunden. Versuch es mit einer Stadt, einem Viertel oder einem Stichwort.</p>';
    }

    function aktualisieren() { treffer = vorschlaege(eingabe.value); markiert = 0; malen(); }

    eingabe.addEventListener('input', aktualisieren);
    eingabe.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); markiert = Math.min(treffer.length - 1, markiert + 1); malen(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); markiert = Math.max(0, markiert - 1); malen(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (treffer[markiert]) { paletteZu(); gehe(treffer[markiert].ziel); } }
      else if (e.key === 'Escape') { e.preventDefault(); paletteZu(); }
    });
    box.addEventListener('click', (e) => {
      const eintrag = e.target.closest('[data-ziel]');
      if (eintrag) { paletteZu(); gehe(eintrag.dataset.ziel); }
    });
    aktualisieren();
    setTimeout(() => eingabe.focus(), 20);
  }

  function paletteZu() {
    const box = U.$('#palette');
    box.hidden = true;
    box.innerHTML = '';
  }

  /* ================================================================
     Globale Aktionen
     ================================================================ */

  const AKTIONEN = {
    merken(el) {
      const id = el.dataset.id;
      const jetzt = NW.store.merken(id);
      toast(jetzt ? 'Gemerkt. Du findest es unter Merkliste.' : 'Aus der Merkliste entfernt.', jetzt ? 'gut' : 'info');

    vergleich(el) {
      const meldung = NW.store.vergleichen(el.dataset.id);
      if (meldung === 'gesperrt:vergleich') {
        AKTIONEN.sperre({ dataset: { leistung: 'vergleich' } });
        return;
      }
      toast(meldung, 'info');
      neuZeichnen();
    },
    theme() { themeWechseln(); },

    sperre(el) {
      const id = el.dataset.leistung;
      const l = NW.plan.leistung(id) || { name: 'Diese Funktion' };
      const t = NW.plan.TARIFE.plus;
      dialog({
        titel: l.name,
        inhalt: h`<p class="sperre__gross">${ico('schloss')}</p>
          <p><b>Im freien Tarif:</b> ${l.frei}<br><b>Mit Plus:</b> ${l.plus}</p>
          ${l.warum ? h`<p class="fein">${l.warum}</p>` : ''}
          <p>${t.zeile}</p>
          <p class="sperre__preis"><b>${U.eur2(t.preisMonat)}</b> im Monat, monatlich kündbar –

          <div class="hinweisbox">${ico('info')}
            <div><b>Was Plus nicht kauft</b>
            <p>Keine bessere Platzierung, keinen Vorrang bei Vermietern und keinen Frühzugang zu Inseraten.
              Alle sehen jedes Inserat in derselben Sekunde.</p></div>
          </div>`,
        fuss: h`<a class="knopf knopf--still" href="#/plus" data-tu="dialog-zu">Alle Unterschiede ansehen</a>
          <button type="button" class="knopf" data-tu="plus-testen">${ico('plus5')}Plus in dieser Vorführung aktivieren</button>`
      });
    },

    'plus-testen'() {
      NW.plan.wechseln('plus', 'monat');
      dialogZu();
      toast('Plus ist aktiv. In der Vorführung kostenlos und jederzeit umschaltbar.', 'gut');

    'plus-beenden'() {

      } else {
