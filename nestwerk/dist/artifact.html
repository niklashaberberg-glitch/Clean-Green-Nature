        if (f.wgAlter && (l.wg.durchschnittsalter < f.wgAlter[0] || l.wg.durchschnittsalter > f.wgAlter[1])) return false;

        const pz = pendelZeit(l, p);

      }

    });
  }

  function sortieren(treffer, sort, profil) {
    const mitScore = treffer.map((l) => ({ l, b: bewerten(l, profil) }));
    const cmp = {
      passung: (a, b) => b.b.score - a.b.score,
      preis: (a, b) => (a.l.kind === 'kauf' ? a.l.kaufpreis : a.l.warm) - (b.l.kind === 'kauf' ? b.l.kaufpreis : b.l.warm),
      preisAb: (a, b) => (b.l.kind === 'kauf' ? b.l.kaufpreis : b.l.warm) - (a.l.kind === 'kauf' ? a.l.kaufpreis : a.l.warm),
      preisqm: (a, b) => (a.l.kind === 'kauf' ? a.l.kaufpreis : a.l.kalt) / a.l.flaeche - (b.l.kind === 'kauf' ? b.l.kaufpreis : b.l.kalt) / b.l.flaeche,
      neu: (a, b) => b.l.stats.online.localeCompare(a.l.stats.online),
      flaeche: (a, b) => b.l.flaeche - a.l.flaeche,
      zimmer: (a, b) => b.l.zimmer - a.l.zimmer,
      fairness: (a, b) => {

        const fb = b.b.mietCheck ? b.b.mietCheck.diff : b.b.kaufCheck ? b.b.kaufCheck.diff : 0;

      chance: (a, b) => a.l.stats.bewerber - b.l.stats.bewerber,
      energie: (a, b) => ENERGIE_RANG[a.l.energie.klasse] - ENERGIE_RANG[b.l.energie.klasse],

(function (NW) {
  'use strict';

  const U = NW.util;

  /* ================================================================
     WG-Passung
     ================================================================ */

  const DIMENSIONEN = [
    { key: 'sauber', label: 'Ordnung', links: 'entspannt', rechts: 'sehr ordentlich', gewicht: 3 },
    { key: 'ruhe', label: 'Lautstärke', links: 'ruhig', rechts: 'lebhaft', gewicht: 2.5 },
    { key: 'gaeste', label: 'Besuch', links: 'selten', rechts: 'ständig offen', gewicht: 2 },
    { key: 'gemeinsam', label: 'Nähe', links: 'Zweck-WG', links2: 'jeder für sich', rechts: 'echte Wohngemeinschaft', gewicht: 3 },
    { key: 'chrono', label: 'Rhythmus', links: 'Frühaufsteher', rechts: 'Nachtmensch', gewicht: 1.5 },

  ];

  function wgPassung(listing, profil) {
    if (!listing.wg || !profil) return null;
    const meins = profil.lifestyle;
    if (!meins) return null;
    const wg = listing.wg;

    /* Weiche Übereinstimmung über die sechs Dimensionen */
    let summe = 0, gewichte = 0;
    const details = DIMENSIONEN.map((d) => {
      const a = U.clamp(Number(meins[d.key]), 0, 10);
      const b = U.clamp(Number(wg.lifestyle[d.key]), 0, 10);
      const abw = Math.abs(a - b);
      const wert = 1 - abw / 10;
      summe += wert * d.gewicht;
      gewichte += d.gewicht;
      return { key: d.key, label: d.label, links: d.links, rechts: d.rechts, du: a, wg: b, abweichung: abw, wert };
    });
    let score = summe / gewichte * 100;

    /* Harte Punkte: Wo die WG eine klare Grenze zieht. */
    const ausschluss = [], hinweise = [];

    if (profil.alter) {
      if (profil.alter < wg.sucht.alterVon || profil.alter > wg.sucht.alterBis) {
        ausschluss.push('Gesucht wird ' + wg.sucht.alterVon + ' bis ' + wg.sucht.alterBis + ' Jahre – du bist ' + profil.alter + '.');
      }
    }
    if (wg.sucht.geschlecht !== 'egal' && profil.geschlecht && profil.geschlecht !== 'egal' && wg.sucht.geschlecht !== profil.geschlecht) {
      const label = { w: 'eine Mitbewohnerin', m: 'einen Mitbewohner', d: 'eine nichtbinäre Person' };
      ausschluss.push('Die WG sucht ausdrücklich ' + (label[wg.sucht.geschlecht] || 'jemand Bestimmtes') + '.');
    }
    if (profil.raucher && wg.rauchen === 'nicht erwünscht') {
      ausschluss.push('In der Wohnung wird nicht geraucht.');
    } else if (profil.raucher && wg.rauchen === 'auf dem Balkon') {
      hinweise.push('Rauchen ist nur auf dem Balkon möglich.');
    }
    if (profil.haustiere && profil.haustiere !== 'keine') {
      if (wg.haustiere === 'nicht erlaubt') ausschluss.push('Haustiere sind nicht erlaubt.');
      else if (wg.haustiere === 'vorhanden') hinweise.push('In der WG leben bereits Tiere.');
    }
    if (profil.budgetWarm && listing.warm > profil.budgetWarm) {
      hinweise.push('Das Zimmer liegt ' + U.eur(listing.warm - profil.budgetWarm) + ' über deinem Budget.');
    }

    if (ausschluss.length) score = Math.min(score, 34);

    /* Gemeinsame Sprachen und Altersnähe geben einen kleinen Schub. */
    const altersnaehe = profil.alter ? 1 - U.clamp(Math.abs(profil.alter - wg.durchschnittsalter) / 20, 0, 1) : 0.5;
    score = score * 0.88 + altersnaehe * 12;

    score = Math.round(U.clamp(score, 0, 100));
    const groesste = details.slice().sort((a, b) => b.abweichung * 1 - a.abweichung * 1)[0];
    const beste = details.slice().sort((a, b) => a.abweichung - b.abweichung)[0];

    return {
      score, details, ausschluss, hinweise,
      staerke: beste, schwaeche: groesste,
      kurz: ausschluss.length ? 'Ausschlusskriterium' :
        score >= 80 ? 'passt sehr gut' : score >= 65 ? 'passt gut' : score >= 50 ? 'teils passend' : 'passt eher nicht'
    };
  }

  /* ================================================================
     Tausch: Kante zwischen zwei Angeboten
     A → B heißt: Bs Wohnung erfüllt As Suche.
     ================================================================ */

  function kante(a, b) {
    if (!a.tausch || !b.tausch || a.id === b.id) return null;
    const s = a.tausch.suche;
    const maengel = [];
    let wert = 1;

    /* Stadt ist die harte Bedingung – wer nach Hamburg will, zieht nicht
       nach Dresden. */
    if (s.staedte && s.staedte.length && s.staedte.indexOf(b.stadt) < 0) return null;

    if (s.zimmerMin && b.zimmer < s.zimmerMin) {
      const fehl = s.zimmerMin - b.zimmer;
      if (fehl > 1) return null;

      const ueber = (b.warm - s.warmMax) / s.warmMax;
      if (ueber > 0.15) return null;

      maengel.push(U.eur(b.warm - s.warmMax) + ' über der Preisgrenze');

    const tageDiff = Math.abs(U.daysSince(a.freiAb) - U.daysSince(b.freiAb));

  function ringe(angebote, optionen) {
    const opt = optionen || {};
    const maxLen = opt.maxLen || 4;
    const minWert = opt.minWert != null ? opt.minWert : 0.55;
    const nodes = angebote.filter((a) => a.tausch);
    const index = {};
    nodes.forEach((n, i) => { index[n.id] = i; });

    /* Nachbarschaftsliste vorab bauen – das spart bei jeder Tiefensuche. */
    const adj = nodes.map(() => []);
    nodes.forEach((a, i) => {
      nodes.forEach((b, j) => {
        if (i === j) return;
        const k = kante(a, b);
        if (k && k.wert >= minWert) adj[i].push({ j, k });

    function dfs(start, aktuell, pfad, kanten) {
      if (pfad.length > maxLen) return;
      adj[aktuell].forEach((e) => {
        if (e.j === start) {
          const laenge = pfad.length;
          if (laenge < 2) return;
          if (laenge > 2 && !pfad.every((p) => nodes[p].tausch.dreiecktauschOk)) return;
          const schluessel = pfad.slice().join('-');
          if (gesehen.has(schluessel)) return;
          gesehen.add(schluessel);
          const alleKanten = kanten.concat([e.k]);
          const werte = alleKanten.map((k) => k.wert);

            knoten: pfad.map((p) => nodes[p]),

            wert: U.sum(werte) / werte.length,
            schwaechste: Math.min.apply(null, werte),
            maengel: alleKanten.reduce((acc, k) => acc.concat(k.maengel), [])

        if (pfad.indexOf(e.j) >= 0) return;
        dfs(start, e.j, pfad.concat([e.j]), kanten.concat([e.k]));
      });
    }

    nodes.forEach((n, i) => dfs(i, i, [i], []));

    gefunden.sort((a, b) => (b.wert - a.wert) || (a.laenge - b.laenge));

  }

  function ringeFuer(angebote, id, optionen) {
    return ringe(angebote, optionen).filter((r) => r.knoten.some((k) => k.id === id));
  }

  function einseitig(angebote, mein) {

    angebote.forEach((a) => {

      state.profil = Object.assign({}, NW.data.profilVorlage, state.profil);
      state.profil.gewichtung = Object.assign({}, NW.data.profilVorlage.gewichtung, state.profil.gewichtung);
      state.profil.lifestyle = Object.assign({}, NW.data.profilVorlage.lifestyle, state.profil.lifestyle);
      state.profil.unterlagen = Object.assign({}, NW.data.profilVorlage.unterlagen, state.profil.unterlagen);

        delete s.merkliste[id];
      } else {
        s.merkliste[id] = Object.assign(
          { status: 'gemerkt', notiz: '', hinzu: U.isoDate(NW.now()), checkliste: {}, termin: null },
          s.merkliste[id] || {},
          status ? { status } : {}
        );
      }
    }, 'merkliste');
    return gemerkt(id);
  }

  function setStatus(id, status) {
    update((s) => {
      if (!s.merkliste[id]) s.merkliste[id] = { status, notiz: '', hinzu: U.isoDate(NW.now()), checkliste: {}, termin: null };
      else s.merkliste[id].status = status;
    }, 'merkliste');
  }

  function setNotiz(id, text) {
    update((s) => {
      if (!s.merkliste[id]) s.merkliste[id] = { status: 'gemerkt', notiz: text, hinzu: U.isoDate(NW.now()), checkliste: {}, termin: null };
      else s.merkliste[id].notiz = text;

  function imVergleich(id) { return get().vergleich.indexOf(id) >= 0; }

    const s = get();
    const i = s.vergleich.indexOf(id);
    let meldung = '';
    update((st) => {
      if (i >= 0) { st.vergleich.splice(i, 1); meldung = 'Aus dem Vergleich entfernt.'; }
      else if (st.vergleich.length >= MAX_VERGLEICH) { meldung = 'Es lassen sich höchstens ' + MAX_VERGLEICH + ' Objekte vergleichen.'; }

  }

  function threadFuer(listingId) {
    return get().threads.find((t) => t.listingId === listingId);
  }

  function anschreiben(listingId, text) {
    const l = NW.data.byId[listingId];
    update((s) => {
      let t = s.threads.find((x) => x.listingId === listingId);
      if (!t) {
        t = { id: 'th-' + Date.now().toString(36), listingId, partner: l.anbieter.name, ungelesen: 0, nachrichten: [] };

      t.wartetSeit = new Date().toISOString();

    update((s) => {
      const t = s.threads.find((x) => x.id === id);
      if (t) t.ungelesen = 0;
    }, 'nachrichten');
  }

  function terminBuchen(listingId, terminId) {
    const l = NW.data.byId[listingId];
    const t = l.besichtigungen.find((x) => x.id === terminId);
    if (!t) return null;
    update((s) => {
      if (!s.merkliste[listingId]) s.merkliste[listingId] = { status: 'termin', notiz: '', hinzu: U.isoDate(NW.now()), checkliste: {} };
      s.merkliste[listingId].termin = { id: t.id, datum: t.datum, zeit: t.zeit, art: t.art };
      s.merkliste[listingId].status = 'termin';
    }, 'termin');
    return t;
  }

  function terminAbsagen(listingId) {
    update((s) => {
      if (s.merkliste[listingId]) {

        if (s.merkliste[listingId].status === 'termin') s.merkliste[listingId].status = 'kontakt';

  }

  function checkSetzen(listingId, frageId, wert) {
    update((s) => {
      if (!s.merkliste[listingId]) s.merkliste[listingId] = { status: 'termin', notiz: '', hinzu: U.isoDate(NW.now()), checkliste: {} };
      if (!s.merkliste[listingId].checkliste) s.merkliste[listingId].checkliste = {};
      s.merkliste[listingId].checkliste[frageId] = wert;

  }

  /* ------------------------- Eigene Inserate ------------------------- */

  function inseratAnlegen(daten) {
    const id = 'mein-' + Date.now().toString(36);
    const eintrag = Object.assign({ id, eigen: true, erstellt: U.isoDate(NW.now()) }, daten);
    update((s) => { s.eigeneInserate.push(eintrag); if (eintrag.kind === 'tausch') s.meinTausch = eintrag; }, 'inserate');
    NW.data.byId[id] = eintrag;
    return id;
  }

  function inseratLoeschen(id) {
    update((s) => {
      s.eigeneInserate = s.eigeneInserate.filter((x) => x.id !== id);
      if (s.meinTausch && s.meinTausch.id === id) s.meinTausch = null;

  }

  /* ------------------------- Verlauf ------------------------- */

  function gesehenMerken(id) {
    update((s) => {
      s.gesehen = [id].concat(s.gesehen.filter((x) => x !== id)).slice(0, 40);
    }, 'gesehen');
  }

  /* ------------------------- Umzug ------------------------- */

  function umzugsPlan() {
    const s = get();
    const datum = s.einzugsdatum ? new Date(s.einzugsdatum + 'T12:00:00') : null;
    return UMZUG_VORLAGE.map((a) => ({
      id: a.id, label: a.label, gruppe: a.gruppe, hinweis: a.hinweis, wann: a.wann,
      faellig: datum ? U.isoDate(U.addDays(datum, a.wann)) : null,

    }));
  }

  function umzugSetzen(id, wert) {
    update((s) => { s.umzug[id] = wert; }, 'umzug');
  }

  /* ------------------------- Zurücksetzen ------------------------- */

  function zuruecksetzen() {
    U.clearStore();
    state = leer();
    speichern();
    melden('reset');
  }

    gemerkt, merken, setStatus, setNotiz,

      this.gUmkreis.innerHTML = '';

    const zellen = {};
    sichtbar.forEach((s) => {
      const key = Math.round(s.p.x / zellgroesse) + '_' + Math.round(s.p.y / zellgroesse);

          '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) + '"/>' +
          '<text x="' + x.toFixed(1) + '" y="' + (y + 4).toFixed(1) + '">' + gruppe.length + '</text></g>';

            '<rect x="' + (x - breite / 2).toFixed(1) + '" y="' + (y - 12).toFixed(1) + '" width="' + breite.toFixed(1) + '" height="24" rx="12" style="fill:' + FARBEN[l.kind] + '"/>' +
            '<text x="' + x.toFixed(1) + '" y="' + (y + 5).toFixed(1) + '">' + U.esc(preis) + '</text></g>';

            ${n.route === 'merkliste' ? raw('<b class="zaehler" data-zaehler="merkliste" hidden></b>') : ''}
            ${n.route === 'nachrichten' ? raw('<b class="zaehler" data-zaehler="nachrichten" hidden></b>') : ''}</a>`)}
        </nav>
        <div class="kopf__tun">
          <button type="button" class="ikon-btn" data-tu="palette" title="Schnellsuche (Strg + K)" aria-label="Schnellsuche">${ico('lupe')}</button>
          <a class="ikon-btn" href="#/agenten" title="Suchaufträge" aria-label="Suchaufträge">${ico('glocke')}<b class="zaehler" data-zaehler="agenten" hidden></b></a>
          <a class="ikon-btn" href="#/vergleich" title="Vergleich" aria-label="Vergleich">${ico('waage')}<b class="zaehler" data-zaehler="vergleich" hidden></b></a>
          <button type="button" class="ikon-btn" data-tu="theme" title="Hell oder dunkel" aria-label="Darstellung wechseln">
            ${ico('sonne', 'nur-hell')}${ico('mond', 'nur-dunkel')}</button>
          <a class="knopf knopf--klein" href="#/inserieren">${ico('plus')}<span>Inserieren</span></a>
        </div>
      </div>
    </header>
    <main id="haupt" tabindex="-1"></main>
    <nav class="unten" aria-label="Hauptbereiche">
      ${NAV.map((n) => h`<a href="#/${n.route}" data-route="${n.route}">${ico(n.icon)}<span>${n.label}</span></a>`)}
    </nav>
    <footer class="fuss">
      <p><b>Nestwerk</b> führt Mietmarkt, WG-Suche und Wohnungstausch in einer Oberfläche zusammen.</p>
      <p class="fuss__hinweis">Vorführfassung mit erzeugtem Beispielbestand. Alle Angaben, Anbieter und Adressen sind erfunden.
      Rechtliche Erläuterungen sind allgemeine Hinweise und ersetzen keine Beratung.
      Deine Eingaben bleiben im Browser dieses Geräts.</p>
      <p class="fuss__links">
        <button type="button" class="link" data-tu="hilfe">Tastaturbefehle</button>
        <button type="button" class="link" data-tu="daten">Meine Daten</button>
      </p>
    </footer>
    <div id="dialog" class="dialog" hidden></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="palette" class="palette" hidden></div>`;
  }

  function aktualisiereZaehler() {
    const s = NW.store.get();
    const setze = (name, wert) => {
      U.$$('[data-zaehler="' + name + '"]').forEach((el) => {
        el.textContent = wert > 99 ? '99+' : wert;
        el.hidden = !wert;
      });
    };
    setze('merkliste', Object.keys(s.merkliste).length);
    setze('vergleich', s.vergleich.length);
    setze('nachrichten', U.sum(s.threads.map((t) => t.ungelesen)));
    let neu = 0;
    s.agenten.forEach((a) => { if (a.aktiv) neu += NW.store.agentTreffer(a).neu.length; });
    setze('agenten', neu);
  }

  /* ================================================================
     Darstellung hell/dunkel
     ================================================================ */

  function themeSetzen(wert) {
    const wurzel = document.documentElement;
    if (wert === 'auto') {
      wurzel.removeAttribute('data-theme');
    } else {
      wurzel.setAttribute('data-theme', wert);
    }
    NW.store.set({ theme: wert }, 'theme');
  }

  function themeWechseln() {
    const jetzt = NW.store.get().theme;
    const dunkelSystem = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const reihenfolge = ['auto', dunkelSystem ? 'light' : 'dark', dunkelSystem ? 'dark' : 'light'];
    const i = reihenfolge.indexOf(jetzt);
    const neu = reihenfolge[(i + 1) % reihenfolge.length];
    themeSetzen(neu);
    toast(neu === 'auto' ? 'Darstellung folgt dem System.' : neu === 'dark' ? 'Dunkle Darstellung.' : 'Helle Darstellung.');
  }

  /* ================================================================
     Schnellsuche
     ================================================================ */

  function paletteOeffnen(vorgabe) {
    const box = U.$('#palette');
    box.hidden = false;
    box.innerHTML = h`<div class="palette__flaeche" data-tu="palette-zu"></div>
      <div class="palette__box" role="dialog" aria-modal="true" aria-label="Schnellsuche">
        <div class="palette__feld">
          ${ico('lupe')}
          <input type="search" id="palette-eingabe" placeholder="Stadt, Viertel, Stichwort oder Bereich…" autocomplete="off" value="${vorgabe || ''}">
          <kbd>Esc</kbd>
        </div>
        <div class="palette__liste" id="palette-liste" role="listbox"></div>
      </div>`;
    const eingabe = U.$('#palette-eingabe');
    const liste = U.$('#palette-liste');
    let treffer = [], markiert = 0;

    function vorschlaege(q) {
      const n = U.norm(q);
      const out = [];
      NAV.concat([
        { route: 'vergleich', label: 'Vergleich', icon: 'waage' },
        { route: 'agenten', label: 'Suchaufträge', icon: 'glocke' },
        { route: 'umzug', label: 'Umzugsplan', icon: 'umzug' },
        { route: 'inserieren', label: 'Inserat aufgeben', icon: 'plus' },
        { route: 'rechner', label: 'Kostenrechner', icon: 'rechner' }
      ]).forEach((nav) => {
        if (!n || U.norm(nav.label).indexOf(n) >= 0) out.push({ art: 'bereich', label: nav.label, icon: nav.icon, ziel: nav.route });
      });
      if (n.length >= 2) {
        NW.geo.CITIES.forEach((c) => {
          if (U.norm(c.name).indexOf(n) >= 0) out.push({ art: 'stadt', label: c.name, unter: 'Stadt', icon: 'karte', ziel: 'suche?stadt=' + encodeURIComponent(c.name) });
        });
        NW.geo.DISTRICTS.forEach((d) => {
          if (U.norm(d.name).indexOf(n) >= 0) out.push({ art: 'viertel', label: d.name, unter: d.city + ' · ' + d.charakter, icon: 'karte', ziel: 'suche?viertel=' + encodeURIComponent(d.key) });
        });
        const objekte = NW.data.listings.filter((l) => NW.analyse.passtText(l, q)).slice(0, 6);
        objekte.forEach((l) => out.push({
          art: 'objekt', label: l.titel, unter: l.stadt + ' · ' + (l.kind === 'kauf' ? U.eur(l.kaufpreis) : U.eur(l.warm) + ' warm'),
          icon: ART_ICON[l.kind], ziel: 'objekt/' + l.id
        }));
        if (q.trim()) out.push({ art: 'suche', label: 'Alles zu „' + q.trim() + '“ durchsuchen', icon: 'suche', ziel: 'suche?q=' + encodeURIComponent(q.trim()) });
      }
      return out.slice(0, 12);
    }

    function malen() {
      liste.innerHTML = treffer.length
        ? treffer.map((t, i) => h`<button type="button" class="palette__eintrag ${i === markiert ? 'is-markiert' : ''}"
            role="option" aria-selected="${i === markiert ? 'true' : 'false'}" data-ziel="${t.ziel}">
            ${ico(t.icon)}<span><b>${t.label}</b>${t.unter ? h`<i>${t.unter}</i>` : ''}</span></button>`).join('')
        : '<p class="palette__leer">Nichts gefunden. Versuch es mit einer Stadt, einem Viertel oder einem Stichwort.</p>';
    }

    function aktualisieren() { treffer = vorschlaege(eingabe.value); markiert = 0; malen(); }

    eingabe.addEventListener('input', aktualisieren);
    eingabe.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); markiert = Math.min(treffer.length - 1, markiert + 1); malen(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); markiert = Math.max(0, markiert - 1); malen(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (treffer[markiert]) { paletteZu(); gehe(treffer[markiert].ziel); } }
      else if (e.key === 'Escape') { e.preventDefault(); paletteZu(); }
    });
    box.addEventListener('click', (e) => {
      const eintrag = e.target.closest('[data-ziel]');
      if (eintrag) { paletteZu(); gehe(eintrag.dataset.ziel); }
    });
    aktualisieren();
    setTimeout(() => eingabe.focus(), 20);
  }

  function paletteZu() {
    const box = U.$('#palette');
    box.hidden = true;
    box.innerHTML = '';
  }

  /* ================================================================
     Globale Aktionen
     ================================================================ */

  const AKTIONEN = {
    merken(el) {
      const id = el.dataset.id;
      const jetzt = NW.store.merken(id);
      toast(jetzt ? 'Gemerkt. Du findest es unter Merkliste.' : 'Aus der Merkliste entfernt.', jetzt ? 'gut' : 'info');
      neuZeichnen();
    },
    vergleich(el) {
      const meldung = NW.store.vergleichen(el.dataset.id);
      toast(meldung, meldung.indexOf('höchstens') >= 0 ? 'schlecht' : 'info');
      neuZeichnen();
    },
    theme() { themeWechseln(); },
    palette() { paletteOeffnen(); },
    'palette-zu'() { paletteZu(); },
    'dialog-zu'() { dialogZu(); },
    hilfe() {
      dialog({
        titel: 'Tastatur und Bedienung',
        inhalt: h`<dl class="tastatur">
          <dt><kbd>Strg</kbd>+<kbd>K</kbd></dt><dd>Schnellsuche über Bereiche, Städte, Viertel und Inserate</dd>
          <dt><kbd>/</kbd></dt><dd>Schnellsuche, wenn kein Eingabefeld aktiv ist</dd>
          <dt><kbd>Esc</kbd></dt><dd>Fenster und Schnellsuche schließen</dd>
          <dt><kbd>1</kbd>…<kbd>6</kbd></dt><dd>Direkt in einen Hauptbereich springen</dd>
          <dt><kbd>M</kbd></dt><dd>Auf einer Objektseite: merken</dd>
          <dt><kbd>V</kbd></dt><dd>Auf einer Objektseite: zum Vergleich</dd>
          <dt>Karte</dt><dd>Ziehen zum Verschieben, Mausrad oder <kbd>+</kbd>/<kbd>−</kbd> zum Zoomen, Pfeiltasten bei Fokus</dd>
        </dl>`
      });
    },
    daten() {
      const s = NW.store.get();
      const groesse = new Blob([JSON.stringify(s)]).size;
      dialog({
        titel: 'Meine Daten',
        inhalt: h`<p>Nestwerk speichert alles ausschließlich im Speicher dieses Browsers. Es gibt keinen Server,
          kein Konto und keine Übertragung an Dritte.</p>
        <ul class="liste-schlicht">
          <li>${Object.keys(s.merkliste).length} Merkungen</li>
          <li>${s.agenten.length} Suchaufträge</li>
          <li>${s.threads.length} Nachrichtenverläufe</li>
          <li>${s.eigeneInserate.length} eigene Inserate</li>
          <li>Belegter Speicher: rund ${U.num(Math.ceil(groesse / 1024))} kB</li>
        </ul>
        <p>Beim Leeren der Browserdaten verschwindet auch dieser Stand.</p>`,
        fuss: h`<button type="button" class="knopf knopf--still" data-tu="daten-export">${ico('speichern')}Als Datei sichern</button>
          <button type="button" class="knopf knopf--gefahr" data-tu="daten-loeschen">${ico('muell')}Alles zurücksetzen</button>`
      });
    },
    'daten-export'() {
      const daten = JSON.stringify(NW.store.get(), null, 2);
      const blob = new Blob([daten], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'nestwerk-daten.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast('Datei gesichert.', 'gut');
    },
    'daten-loeschen'() {
      if (!confirm('Merkliste, Profil, Suchaufträge und Nachrichten werden gelöscht. Fortfahren?')) return;
      NW.store.zuruecksetzen();
      dialogZu();
      toast('Alles zurückgesetzt.', 'info');
      neuZeichnen();
    },
    kopieren(el) {
      const quelle = el.dataset.quelle ? U.$(el.dataset.quelle) : null;
      const text = el.dataset.text || (quelle ? (quelle.value !== undefined ? quelle.value : quelle.textContent) : '');
      const fertig = () => toast('In die Zwischenablage kopiert.', 'gut');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(fertig, () => toast('Kopieren nicht möglich.', 'schlecht'));
      } else {
        const t = document.createElement('textarea');
        t.value = text; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); fertig(); } catch (e) { toast('Kopieren nicht möglich.', 'schlecht'); }
        t.remove();
      }
    }
  };

  function aktionRegistrieren(name, fn) { AKTIONEN[name] = fn; }

  /* ================================================================
     Start
     ================================================================ */

  function start() {
    NW.store.laden();
    document.body.innerHTML = schale();

    const s = NW.store.get();
    if (s.theme && s.theme !== 'auto') document.documentElement.setAttribute('data-theme', s.theme);

    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-tu]');
      if (!el) return;
      const fn = AKTIONEN[el.dataset.tu];
      if (!fn) return;
      e.preventDefault();
      fn(el, e);
    });

    document.addEventListener('change', (e) => {
      const el = e.target.closest('[data-tu-change]');
      if (!el) return;
      const fn = AKTIONEN[el.dataset.tuChange];
      if (fn) fn(el, e);
    });

    document.addEventListener('input', (e) => {
      const el = e.target.closest('[data-tu-input]');
      if (!el) return;
      const fn = AKTIONEN[el.dataset.tuInput];
      if (fn) fn(el, e);
    });

    document.addEventListener('submit', (e) => {
      const el = e.target.closest('[data-tu-submit]');
      if (!el) return;
      e.preventDefault();
      const fn = AKTIONEN[el.dataset.tuSubmit];
      if (fn) fn(el, e);
    });

    document.addEventListener('keydown', (e) => {
      const inFeld = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) ||
        document.activeElement.isContentEditable;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); paletteOeffnen(); return; }
      if (inFeld) return;
      if (e.key === '/') { e.preventDefault(); paletteOeffnen(); return; }
      if (e.key >= '1' && e.key <= '6' && !e.ctrlKey && !e.metaKey && !e.altKey) {
        const n = NAV[Number(e.key) - 1];
        if (n) { e.preventDefault(); gehe(n.route); }
      }
    });

    window.addEventListener('hashchange', () => zeichnen());
    if (!location.hash) location.hash = '#/start';
    zeichnen(true);
  }

  Object.assign(ui, {
    start, gehe, zeichnen, neuZeichnen, toast, dialog, dialogZu,
    badge, passungsRing, energieBalken, inseratsKarte, ampelFarbe,
    ART_LABEL, ART_ICON, ico, aktionRegistrieren, AKTIONEN,
    aktualisiereZaehler, themeSetzen, paletteOeffnen, kartenMarken, preisZeile
  });
})(window.NW = window.NW || {});

/* ===== view-start.js ===== */
/* =====================================================================
   Nestwerk – Ansicht: Start
   Kein Werbebanner, sondern ein Arbeitsplatz: Was ist neu, wo stehst du,
   was ist als Nächstes zu tun.
   ===================================================================== */
(function (NW) {
  'use strict';

  const U = NW.util, ui = NW.ui, A = NW.analyse, S = NW.store, M = NW.match;
  const h = U.html, raw = U.raw, ico = U.svg;

  function begruessung() {
    const std = NW.now().getHours();
    return std < 5 ? 'Noch wach' : std < 11 ? 'Guten Morgen' : std < 18 ? 'Guten Tag' : 'Guten Abend';
  }

  /* Was steht an? Aus Terminen, Suchaufträgen, Nachrichten und Profil. */
  function aufgaben() {
    const s = S.get();
    const out = [];

    const offeneTermine = Object.keys(s.merkliste)
      .map((id) => ({ id, e: s.merkliste[id] }))
      .filter((x) => x.e.termin && x.e.termin.datum >= U.isoDate(NW.now()))
      .sort((a, b) => a.e.termin.datum.localeCompare(b.e.termin.datum));
    offeneTermine.slice(0, 2).forEach((x) => {
      const l = NW.data.byId[x.id];
      if (!l) return;
      out.push({
        icon: 'kalender', dringend: U.daysSince(x.e.termin.datum) > -3,
        titel: 'Besichtigung ' + U.dateDE(x.e.termin.datum) + ' um ' + x.e.termin.zeit,
        text: l.titel + ', ' + l.viertel, ziel: 'objekt/' + l.id, knopf: 'Checkliste'
      });
    });

    let neu = 0;
    s.agenten.forEach((a) => { if (a.aktiv) neu += S.agentTreffer(a).neu.length; });
    if (neu) out.push({
      icon: 'glocke', dringend: true, titel: neu + ' neue Treffer in deinen Suchaufträgen',
      text: 'seit dem letzten Blick hinzugekommen', ziel: 'agenten', knopf: 'Ansehen'
    });

    const ungelesen = U.sum(s.threads.map((t) => t.ungelesen));
    if (ungelesen) out.push({
      icon: 'nachricht', dringend: true, titel: ungelesen + ' ' + U.plural(ungelesen, 'neue Nachricht', '{n} neue Nachrichten'),
      text: 'Anbieter warten auf eine Antwort', ziel: 'nachrichten', knopf: 'Öffnen'
    });

    if (!s.profilAngelegt) out.push({
      icon: 'person', dringend: false, titel: 'Profil ausfüllen',
      text: 'Erst damit sortiert Nestwerk nach deiner Passung statt nach Zufall.', ziel: 'profil', knopf: 'Ausfüllen'
    });

    const fehlend = Object.keys(s.profil.unterlagen).filter((k) => !s.profil.unterlagen[k] && k !== 'wbs' && k !== 'buergschaft');
    if (s.profilAngelegt && fehlend.length) out.push({
      icon: 'blatt', dringend: false, titel: 'Bewerbermappe unvollständig',
      text: fehlend.length + ' ' + U.plural(fehlend.length, 'Unterlage fehlt', '{n} Unterlagen fehlen') + ' – wer sie parat hat, ist schneller.',
      ziel: 'profil', knopf: 'Ergänzen'
    });

    if (!s.meinTausch && s.filter.arten.indexOf('tausch') >= 0) out.push({
      icon: 'tausch', dringend: false, titel: 'Tauschangebot fehlt',
      text: 'Ohne eigene Wohnung im Topf findet der Ringtausch dich nicht.', ziel: 'tausch', knopf: 'Anlegen'
    });

    if (s.einzugsdatum) {
      const plan = S.umzugsPlan().filter((a) => !a.erledigt && a.faellig <= U.isoDate(U.addDays(NW.now(), 14)));
      if (plan.length) out.push({
        icon: 'umzug', dringend: true, titel: plan.length + ' ' + U.plural(plan.length, 'Umzugsaufgabe', '{n} Umzugsaufgaben') + ' in den nächsten 14 Tagen',
        text: plan[0].label, ziel: 'umzug', knopf: 'Plan öffnen'
      });
    }

    return out;
  }

  function pipelineLeiste() {
    const s = S.get();
    const zahlen = {};
    S.PIPELINE.forEach((p) => { zahlen[p.id] = 0; });
    Object.keys(s.merkliste).forEach((id) => {
      const st = s.merkliste[id].status;
      if (zahlen[st] !== undefined) zahlen[st]++;
    });
    const gesamt = U.sum(Object.keys(zahlen).map((k) => zahlen[k]));
    if (!gesamt) return '';
    return h`<section class="block">
      <div class="block__kopfzeile">
        <h2>${ico('waage')}Deine Bewerbungen</h2>
        <a class="link" href="#/merkliste">alle ansehen</a>
      </div>
      <ol class="pipeline">
        ${S.PIPELINE.map((p) => h`<li class="pipeline__stufe pipeline__stufe--${p.farbe}">
          <b>${zahlen[p.id]}</b><span>${p.label}</span></li>`)}
      </ol>
    </section>`;
  }

  function neuesteTreffer() {
    const s = S.get();
    const passend = A.sortieren(
      A.filtern(NW.data.listings, Object.assign({}, s.filter, { sort: 'neu' }), s.profil),
      'neu', s.profil
    ).slice(0, 6);
    return passend;
  }

  function ansicht() {
    const s = S.get();
    const tun = aufgaben();
    const treffer = neuesteTreffer();
    const gesehen = s.gesehen.map((id) => NW.data.byId[id]).filter(Boolean).slice(0, 4);
    const tauschAngebote = NW.data.listings.filter((x) => x.kind === 'tausch');
    const ringZahl = M.ringe(tauschAngebote, { maxLen: 3 }).length;

    return {
      titel: 'Start',
      html: h`<div class="seite">
        <header class="start__kopf">
          <div>
            <h1>${begruessung()}${s.profil.name ? ', ' + s.profil.name.split(' ')[0] : ''}.</h1>
            <p class="seite__unter">Mietwohnungen, Eigentum, WG-Zimmer und Wohnungstausch – eine Suche, ein Profil,
              eine Bewerbermappe.</p>
          </div>
          <div class="start__suchfeld">
            <button type="button" class="grosseSuche" data-tu="palette">
              ${ico('lupe')}<span>Stadt, Viertel oder Stichwort suchen</span><kbd>Strg</kbd><kbd>K</kbd>
            </button>
            <div class="start__schnell">
              ${['Köln', 'Berlin', 'Hamburg', 'Leipzig', 'München'].map((c) =>
        h`<a class="chip" href="#/suche?stadt=${encodeURIComponent(c)}">${c}</a>`)}
            </div>
          </div>
        </header>

        ${tun.length ? h`<section class="block block--betont">
          <h2>${ico('check')}Als Nächstes</h2>
          <ul class="aufgaben">
            ${tun.map((a) => h`<li class="${a.dringend ? 'is-dringend' : ''}">
              ${ico(a.icon)}
              <div><b>${a.titel}</b><span>${a.text}</span></div>
              <a class="knopf knopf--klein knopf--still" href="#/${a.ziel}">${a.knopf}</a>
            </li>`)}
          </ul>
        </section>` : ''}

        ${pipelineLeiste()}

        <section class="block">
          <div class="block__kopfzeile">
            <h2>${ico('blitz')}Neu und passend</h2>
            <a class="link" href="#/suche">zur vollen Suche</a>
          </div>
          ${treffer.length ? h`<div class="ergebnisse__liste ergebnisse__liste--drei">
            ${treffer.map((x) => ui.inseratsKarte(x.l, x.b, { kompakt: true }))}
          </div>` : h`<p class="info-meldung">${ico('info')}Deine Filter lassen aktuell nichts durch.
            <a href="#/suche">In der Suche anpassen</a></p>`}
        </section>

        <section class="block">
          <h2>${ico('ring')}Was Nestwerk anders macht</h2>
          <div class="vorteile">

  function chipGruppe(titel, feld, werte, beschriftung) {

      const wert = typeof w === 'string' ? w : w[0];

      ${chipGruppe('Ausstattung', 'ausstattung', AUSSTATTUNG_FILTER)}

      ${wgAktiv ? h`<fieldset class="filter__gruppe filter__gruppe--wg">

        </div>
        <label class="schalter">

      <fieldset class="filter__gruppe">

      <div class="filter__fuss">

  function marktLeiste(treffer) {

      ${m.medianWarm ? h`<span><b>${U.eur(m.medianWarm)}</b> mittlere Warmmiete</span>` : ''}

    </div>`;
  }

  /* ------------------------- Ergebnisliste ------------------------- */

  function leerHinweis(f) {
    const vorschlaege = [];

    if (f.ausstattung.length) vorschlaege.push({ label: 'Ausstattungswünsche zurücksetzen', tu: 'lockern-ausstattung' });
    if (f.viertel.length) vorschlaege.push({ label: 'ganze Stadt statt einzelner Viertel', tu: 'lockern-viertel' });
    if (f.maxPendel) vorschlaege.push({ label: 'längeren Arbeitsweg zulassen', tu: 'lockern-pendel' });
    if (f.umkreis) vorschlaege.push({ label: 'Umkreis verdoppeln', tu: 'lockern-umkreis' });

  function ergebnisListe(bewertet) {
    if (!bewertet.length) return leerHinweis(S.get().filter);
    const teil = bewertet.slice(0, sichtbar);
    const rest = bewertet.length - teil.length;
    return h`<div class="ergebnisse__liste">

      <p class="fein">${U.num(teil.length)} von ${U.num(bewertet.length)} Treffern geladen</p>
    </div>` : bewertet.length > SEITE ? h`<p class="mehr__fertig fein">Alle ${U.num(bewertet.length)} Treffer geladen.</p>` : ''}`;
  }

  /* Erklärt, warum das erste Ergebnis vorne steht. */
  function rankingErklaerung(bewertet) {
    if (!bewertet.length || S.get().filter.sort !== 'passung') return '';
    const top = bewertet[0];
    const gruende = top.b.teile.slice(0, 3).map((t) =>
      t.label.toLowerCase() + ' (' + Math.round(t.anteil * 100) + ' %)');
    return h`<details class="erklaerung">
      <summary>${ico('info')}Warum steht „${U.truncate(top.l.titel, 46)}“ ganz oben?</summary>
      <p>Nestwerk sortiert nach deinem Profil, nicht nach bezahlter Platzierung. Für dieses Inserat zählen vor allem
        ${raw(gruende.join(', '))}. Insgesamt ergibt das ${top.b.score} von 100 Punkten.</p>
      <p class="erklaerung__mehr"><a href="#/profil">Gewichtung im Profil ändern</a> – dann ändert sich auch die Reihenfolge.</p>
    </details>`;
  }

  /* ------------------------- Ansicht ------------------------- */

  function rechnen() {
    const s = S.get();
    const gefiltert = A.filtern(NW.data.listings.concat(s.eigeneInserate), s.filter, s.profil);
    const bewertet = A.sortieren(gefiltert, s.filter.sort, s.profil);
    letzteTreffer = bewertet.map((x) => x.l);
    return bewertet;
  }

  function aktualisieren() {
    const bewertet = rechnen();
    const box = U.$('#ergebnisse');
    if (box) box.innerHTML = ergebnisListe(bewertet);
    const kopf = U.$('#markt');
    if (kopf) kopf.innerHTML = marktLeiste(letzteTreffer);
    const erkl = U.$('#erklaerung');
    if (erkl) erkl.innerHTML = rankingErklaerung(bewertet);
    if (karte) karte.setzen(letzteTreffer, null, S.get().filter.umkreis);
    const anzahl = U.$('#treffer-anzahl');
    if (anzahl) anzahl.textContent = U.num(letzteTreffer.length);
    ui.aktualisiereZaehler();
  }

    return {
      titel: 'Suchen',
      html: h`<div class="suche" data-ansicht="${ansichtsart}">

        const an = f.arten.indexOf(a.id) >= 0;
        return h`<button type="button" class="art ${an ? 'is-an' : ''}" aria-pressed="${an ? 'true' : 'false'}"

      })}
          </div>

            ${f.q ? h`<button type="button" class="ikon-btn" data-tu="such-leeren" aria-label="Suchtext löschen">${ico('x')}</button>` : ''}
          </div>
          <div class="suche__stellen">
            <label class="feld feld--flach">
              <span class="nur-sr">Sortierung</span>
              <select data-tu-change="sortieren" aria-label="Sortierung">
                ${SORTIERUNG.map((so) => h`<option value="${so[0]}" ${f.sort === so[0] ? 'selected' : ''}>${so[1]}</option>`)}
              </select>
            </label>
            <div class="umschalter" role="group" aria-label="Darstellung">
              <button type="button" class="${ansichtsart === 'liste' ? 'is-an' : ''}" data-tu="ansicht" data-wert="liste" title="Nur Liste">${ico('liste')}</button>
              <button type="button" class="${ansichtsart === 'beides' ? 'is-an' : ''}" data-tu="ansicht" data-wert="beides" title="Liste und Karte">${ico('waage')}</button>
              <button type="button" class="${ansichtsart === 'karte' ? 'is-an' : ''}" data-tu="ansicht" data-wert="karte" title="Nur Karte">${ico('karte')}</button>
            </div>
            <button type="button" class="knopf knopf--still nur-schmal" data-tu="filter-auf">${ico('filter')}Filter</button>
          </div>
        </div>

        <div class="suche__raster">

          <section class="suche__ergebnis" aria-label="Suchergebnisse">

  function filterAendern(patch) {

  }

  const A_ = ui.aktionRegistrieren;

  A_('mehr-zeigen', () => {
    sichtbar += SEITE;
    aktualisieren();
    /* Fokus auf die erste neu geladene Karte, damit die Tastatur nicht springt. */
    const karten = U.$$('#ergebnisse .karte-inserat');
    const ziel = karten[Math.max(0, sichtbar - SEITE)];
    if (ziel) { const a = ziel.querySelector('a'); if (a) a.focus(); }
  });

  A_('art-um', (el) => {
    sichtbar = SEITE;
    const f = S.get().filter;
    const i = f.arten.indexOf(el.dataset.wert);
    if (i >= 0) { if (f.arten.length > 1) f.arten.splice(i, 1); }
    else f.arten.push(el.dataset.wert);
    S.set({ filter: f }, 'filter');
    ui.neuZeichnen();
  });

  A_('filter-zahl', U.debounce((el) => {
    const wert = el.value === '' ? null : Number(el.value);

/* ===== view-objekt.js ===== */
/* =====================================================================
   Nestwerk – Ansicht: ein Objekt
   Alles zu einem Inserat auf einer Seite: Kosten bis zum letzten Euro,

   ===================================================================== */
(function (NW) {

  const U = NW.util, ui = NW.ui, A = NW.analyse, S = NW.store, M = NW.match;
  const h = U.html, raw = U.raw, ico = U.svg;

  let bildIndex = 0;

  /* ------------------------- Galerie ------------------------- */

  function galerie(l) {

      </div>
      <div class="galerie__streifen" role="tablist" aria-label="Bildauswahl">
        ${Array.from({ length: anzahl }, (_, i) => h`<button type="button" role="tab" class="galerie__mini ${i === bildIndex ? 'is-an' : ''}"

  /* ------------------------- Kostenblock ------------------------- */

  function kostenBlock(l, k) {
    const ampel = { gut: 'Das passt zur Faustregel: höchstens 30 % des Nettoeinkommens fürs Wohnen.',
      mittel: 'Über der 30-Prozent-Faustregel. Machbar, aber ohne großen Puffer.',
      schlecht: 'Deutlich über der Faustregel. Rechne genau, ob der Rest zum Leben reicht.',
      unbekannt: 'Trag dein Nettoeinkommen im Profil ein, dann zeigt Nestwerk die Belastungsquote.' };
    return h`<section class="block" id="kosten">
      <h2>${ico('rechner')}Was es wirklich kostet</h2>
      <p class="block__unter">Nicht nur die Warmmiete – auch Strom, Internet, Rundfunkbeitrag und der Einzug selbst.</p>
      <div class="kosten">
        <div class="kosten__spalte">
          <h3>Jeden Monat</h3>
          <ul class="kosten__liste">
            ${k.monatlich.map((m) => h`<li><span>${m.label}${m.hinweis ? h`<i>${m.hinweis}</i>` : ''}</span><b>${U.eur(m.betrag)}</b></li>`)}

          <p class="kosten__summe"><span>Summe</span><b>${U.eur(k.einmalSumme)}</b></p>

  function klauselBlock(l) {

          ${ringe.map((r) => h`<li>
            <b>${r.laenge === 2 ? 'Direkter Tausch' : r.laenge + 'er-Ring'}</b>
            <span>${r.knoten.map((k) => k.stadt + '/' + k.viertel).join(' → ')} → ${r.knoten[0].stadt}</span>
            <em>${Math.round(r.wert * 100)} % Güte</em>
          </li>`)}
        </ul>
        <p><a class="knopf knopf--still" href="#/tausch">${ico('ring')}Alle Ketten im Ringtausch ansehen</a></p>`
      : h`<p class="info-meldung">${ico('info')}Für dieses Angebot gibt es aktuell keine geschlossene Kette.
        Lege im <a href="#/tausch">Ringtausch</a> dein eigenes Angebot an – vielleicht schließt du den Ring.</p>`}
      <div class="hinweisbox">${ico('info')}
        <div><b>Wohnungstausch geht nur mit der Vermieterseite</b>
        <p>Ein Tausch ist rechtlich kein Übergang des Mietvertrags, sondern zweimal Kündigung und zweimal Neuabschluss.
        Beide Vermieter müssen mitspielen. Viele Genossenschaften und kommunale Gesellschaften unterstützen das
        ausdrücklich, private Eigentümer selten. Frag früh nach – nicht erst, wenn die Kette steht.</p></div>
      </div>
    </section>`;
  }

  /* ------------------------- Lage ------------------------- */

  function lageBlock(l, b) {
    const d = NW.geo.districtByKey[l.viertelKey];
    const werte = d ? [['ÖPNV', d.oepnv], ['Grün', d.gruen], ['Ruhe', d.ruhe], ['Einkauf', d.einkauf], ['Ausgehen', d.ausgehen]] : [];
    const profil = S.get().profil;
    const wege = (profil.anker || []).map((a) => ({
      name: a.name,
      zeiten: Object.keys(U.TRAVEL).map((mo) => ({ mo, label: U.TRAVEL[mo].label, min: U.travelMin(l, a, mo) }))
    }));
    return h`<section class="block" id="lage">
      <h2>${ico('karte')}Lage</h2>
      <p class="block__unter">${l.viertel}, ${l.stadt}${d ? ' – ' + d.charakter : ''}. ${l.strasse}.</p>
      <div class="lage">
        <div class="lage__karte" id="objekt-karte"></div>
        <div class="lage__werte">
          ${werte.map((w) => h`<div class="balkenzeile">
            <span>${w[0]}</span>
            <span class="balken"><i style="width:${w[1] * 20}%"></i></span>
            <b>${w[1]}/5</b>
          </div>`)}
        </div>
      </div>
      ${wege.length ? h`<h3>Wege</h3>
        <table class="tabelle">
          <thead><tr><th>Ziel</th>${Object.keys(U.TRAVEL).map((mo) => h`<th>${U.TRAVEL[mo].label}</th>`)}</tr></thead>
          <tbody>
            ${wege.map((w) => h`<tr><th scope="row">${w.name}</th>
              ${w.zeiten.map((z) => h`<td>${U.minutesLabel(z.min)}</td>`)}</tr>`)}
          </tbody>
        </table>
        <p class="fein">Geschätzt aus Entfernung, Umwegfaktor und Zu-/Abgang – kein Fahrplan.</p>`
      : h`<p class="info-meldung">${ico('info')}Trag im <a href="#/profil">Profil</a> deine Arbeits- oder Studienadresse ein,
        dann zeigt Nestwerk hier die Fahrzeiten.</p>`}
    </section>`;
  }

  /* ------------------------- Anbieter ------------------------- */

  function anbieterBlock(l) {
    const a = l.anbieter;
    const tage = U.daysSince(a.seit);
    const artLabel = { privat: 'Privatperson', makler: 'Maklerbüro', verwaltung: 'Hausverwaltung', genossenschaft: 'Genossenschaft' };
    return h`<section class="block" id="anbieter">
      <h2>${ico('person')}Anbieter</h2>
      <div class="anbieter">
        ${raw(NW.img.avatar(a.name, 56))}
        <div class="anbieter__text">
          <b>${a.name} ${a.verifiziert ? raw('<span class="pruefzeichen" title="Identität bestätigt">' + U.svg('pruefen').__raw + '</span>') : ''}</b>
          <span>${artLabel[a.art]} · aktiv seit ${tage > 365 ? Math.round(tage / 365) + ' Jahren' : tage + ' Tagen'}
            · ${a.inserate} ${U.plural(a.inserate, 'Inserat', 'Inserate')}</span>
        </div>
        <div class="anbieter__zahlen">
          <div><b>${a.quote} %</b><span>antwortet</span></div>
          <div><b>${a.antwortStd < 24 ? a.antwortStd + ' Std.' : Math.round(a.antwortStd / 24) + ' Tage'}</b><span>im Schnitt</span></div>
        </div>
      </div>
      <p class="fein">Antwortquote und Reaktionszeit stammen aus dem bisherigen Verhalten auf der Plattform.
        Unter 50 % lohnt sich eine zweite Option.</p>
    </section>`;
  }

  /* ------------------------- Termine ------------------------- */

  function termineBlock(l) {
    const eintrag = S.get().merkliste[l.id];
    const gebucht = eintrag && eintrag.termin;
    if (!l.besichtigungen || !l.besichtigungen.length) {
      return h`<section class="block" id="termine">
        <h2>${ico('kalender')}Besichtigung</h2>
        <p class="info-meldung">${ico('info')}Für dieses Objekt sind keine Termine hinterlegt.
          Frag beim Anschreiben direkt nach zwei konkreten Zeitfenstern – das spart eine Runde.</p>
      </section>`;
    }
    return h`<section class="block" id="termine">
      <h2>${ico('kalender')}Besichtigung buchen</h2>
      <p class="block__unter">Feste Zeitfenster statt Massenandrang. Ein Platz gehört dir, sobald du ihn nimmst.</p>
      ${gebucht ? h`<div class="gut-meldung">${ico('pruefen')}
        Du hast <b>${U.dateDE(gebucht.datum)} um ${gebucht.zeit}</b> gebucht (${gebucht.art}).
        <button type="button" class="link" data-tu="termin-ab" data-id="${l.id}">Termin absagen</button></div>` : ''}
      <ul class="termine">
        ${l.besichtigungen.map((t) => {
      const frei = t.plaetze - t.belegt;
      const dieser = gebucht && gebucht.id === t.id;
      return h`<li class="${dieser ? 'is-gebucht' : ''}">
            <div><b>${U.dateDE(t.datum)}</b><span>${t.zeit} Uhr · ${t.art}</span></div>
            <span class="termine__frei">${frei} ${U.plural(frei, 'Platz frei', '{n} Plätze frei')}</span>
            <button type="button" class="knopf knopf--klein ${dieser ? 'knopf--still' : ''}"
              data-tu="termin-buchen" data-id="${l.id}" data-termin="${t.id}" ${dieser ? 'disabled' : ''}>
              ${dieser ? 'gebucht' : 'nehmen'}</button>
          </li>`;
    })}
      </ul>
      <p><button type="button" class="link" data-tu="checkliste" data-id="${l.id}">${ico('blatt')}Besichtigungs-Checkliste öffnen</button></p>
    </section>`;
  }

  /* ------------------------- Finanzierung ------------------------- */

  function finanzBlock(l, k) {
    if (l.kind !== 'kauf') return '';
    const s = S.get();
    const ek = s.profil.eigenkapital || Math.round(l.kaufpreis * 0.2);
    const zins = s.profil.zins || 3.7;
    const tilgung = s.profil.tilgung || 2;
    const f = A.finanzierung(l.kaufpreis, k.einmalSumme, ek, zins, tilgung, 10);
    return h`<section class="block" id="finanz">
      <h2>${ico('euro')}Finanzierung überschlagen</h2>
      <div class="regler">
        <label class="feld feld--regler"><span>Eigenkapital <b>${U.eur(ek)}</b></span>
          <input type="range" min="0" max="${Math.round(l.kaufpreis * 0.6)}" step="5000" value="${ek}" data-tu-input="finanz" data-feld="eigenkapital"></label>
        <label class="feld feld--regler"><span>Sollzins <b>${U.dec(zins)} %</b></span>
          <input type="range" min="1" max="7" step="0.1" value="${zins}" data-tu-input="finanz" data-feld="zins"></label>
        <label class="feld feld--regler"><span>Anfangstilgung <b>${U.dec(tilgung)} %</b></span>
          <input type="range" min="1" max="5" step="0.5" value="${tilgung}" data-tu-input="finanz" data-feld="tilgung"></label>
      </div>
      <div class="kennzahlen">
        <div><b>${U.eur(f.gesamt)}</b><span>Gesamtkosten mit Nebenkosten</span></div>
        <div><b>${U.eur(f.darlehen)}</b><span>Darlehen</span></div>
        <div><b>${U.eur(f.rate)}</b><span>Rate im Monat</span></div>
        <div><b>${U.eur(f.restschuld)}</b><span>Restschuld nach 10 Jahren</span></div>
        <div><b>${U.dec(f.laufzeitJahre)} Jahre</b><span>bis zur Volltilgung</span></div>
        <div><b>${f.eigenkapitalQuote} %</b><span>Eigenkapitalquote</span></div>
      </div>
      <p class="fein">Annuitätendarlehen ohne Sondertilgung. Banken erwarten meist mindestens die Kaufnebenkosten
        als Eigenkapital, besser 20 % des Kaufpreises dazu.</p>
    </section>`;
  }

  /* ------------------------- Ähnliche ------------------------- */

  function aehnliche(l) {
    const profil = S.get().profil;
    const kandidaten = NW.data.listings
      .filter((x) => x.id !== l.id && x.kind === l.kind && x.stadt === l.stadt)
      .map((x) => {
        const preis = l.kind === 'kauf' ? Math.abs(x.kaufpreis - l.kaufpreis) / Math.max(1, l.kaufpreis)
          : Math.abs(x.warm - l.warm) / Math.max(1, l.warm);
        const flaeche = Math.abs(x.flaeche - l.flaeche) / Math.max(1, l.flaeche);
        const ort = U.distKm(x, l);
        return { x, d: preis * 2 + flaeche * 1.5 + ort * 0.12 };
      })
      .sort((a, b) => a.d - b.d).slice(0, 3);
    if (!kandidaten.length) return '';
    return h`<section class="block" id="aehnlich">
      <h2>${ico('liste')}Ähnliche Angebote</h2>
      <div class="ergebnisse__liste ergebnisse__liste--drei">
        ${kandidaten.map((k) => ui.inseratsKarte(k.x, A.bewerten(k.x, profil), { kompakt: true }))}
      </div>
    </section>`;
  }

  /* ------------------------- Seite ------------------------- */

  function ansicht(route) {
    const l = NW.data.byId[route.arg];
    if (!l) {
      return { titel: 'Nicht gefunden', html: h`<div class="leer">${ico('warnung')}<h2>Dieses Inserat gibt es nicht (mehr)</h2>
        <p><a class="knopf" href="#/suche">Zur Suche</a></p></div>` };
    }
    S.gesehenMerken(l.id);
    const s = S.get();
    const b = A.bewerten(l, s.profil);
    const k = A.kosten(l, s.profil);
    const gemerkt = S.gemerkt(l.id), imVergleich = S.imVergleich(l.id);
    const eintrag = s.merkliste[l.id];

    return {
      titel: l.titel,
      html: h`<div class="objekt">
        <nav class="brotkrumen" aria-label="Pfad">
          <a href="#/suche">Suche</a>${ico('chevron')}<a href="#/suche?stadt=${encodeURIComponent(l.stadt)}">${l.stadt}</a>
          ${ico('chevron')}<span>${l.viertel}</span>
        </nav>

        <div class="objekt__kopf">
          <div class="objekt__titel">
            <div class="karte-inserat__marken">${ui.kartenMarken(l, b)}</div>
            <h1>${l.titel}</h1>
            <p class="objekt__ort">${ico('karte')}${l.strasse}, ${l.viertel}, ${l.stadt}</p>
          </div>
          <div class="objekt__preis">
            <b>${l.kind === 'kauf' ? U.eur(l.kaufpreis) : U.eur(l.warm)}</b>
            <span>${l.kind === 'kauf' ? U.eur(Math.round(l.kaufpreis / l.flaeche)) + ' je m²' : 'warm · ' + U.eur(l.kalt) + ' kalt'}</span>
          </div>
        </div>

        ${galerie(l)}

        <div class="objekt__tun">
          <button type="button" class="knopf" data-tu="anschreiben" data-id="${l.id}">${ico('nachricht')}Anschreiben</button>
          <button type="button" class="knopf knopf--still ${gemerkt ? 'is-an' : ''}" data-tu="merken" data-id="${l.id}"
            aria-pressed="${gemerkt ? 'true' : 'false'}">${ico('herz')}${gemerkt ? 'Gemerkt' : 'Merken'}</button>
          <button type="button" class="knopf knopf--still ${imVergleich ? 'is-an' : ''}" data-tu="vergleich" data-id="${l.id}"
            aria-pressed="${imVergleich ? 'true' : 'false'}">${ico('waage')}Vergleichen</button>
          <button type="button" class="knopf knopf--still" data-tu="objekt-teilen" data-id="${l.id}">${ico('teilen')}Teilen</button>
          ${eintrag ? h`<label class="feld feld--flach objekt__status">
            <span class="nur-sr">Status</span>
            <select data-tu-change="status-setzen" data-id="${l.id}">
              ${S.PIPELINE.map((p) => h`<option value="${p.id}" ${eintrag.status === p.id ? 'selected' : ''}>${p.label}</option>`)}
            </select></label>` : ''}
        </div>

        <div class="objekt__raster">
          <div class="objekt__haupt">
            <section class="block" id="eckdaten">
              <h2>${ico('haus')}Eckdaten</h2>
              <dl class="fakten">
                <div><dt>Zimmer</dt><dd>${U.dec(l.zimmer)}</dd></div>
                <div><dt>${l.kind === 'wg' ? 'Zimmergröße' : 'Wohnfläche'}</dt><dd>${l.flaeche} m²</dd></div>
                ${l.kind === 'wg' ? h`<div><dt>Wohnung gesamt</dt><dd>${l.wohnflaeche} m²</dd></div>` : ''}
                <div><dt>Etage</dt><dd>${l.etage === 0 ? 'Erdgeschoss' : l.etage >= l.etagen ? 'Dachgeschoss' : l.etage + '. OG'} von ${l.etagen}</dd></div>
                <div><dt>Baujahr</dt><dd>${l.baujahr}${l.saniert ? ' · saniert' : ''}</dd></div>
                <div><dt>Frei ab</dt><dd>${U.daysSince(l.freiAb) > 0 ? 'sofort' : U.dateDE(l.freiAb)}</dd></div>
                ${l.befristetBis ? h`<div><dt>Befristet bis</dt><dd>${U.dateDE(l.befristetBis)}</dd></div>` : ''}
                <div><dt>Heizung</dt><dd>${l.energie.heizung}</dd></div>
                <div><dt>Energie</dt><dd>${ui.energieBalken(l.energie.klasse)} ${l.energie.kwh} kWh/(m²·a), ${l.energie.art}</dd></div>
                ${l.kind !== 'kauf' ? h`<div><dt>Kaution</dt><dd>${l.kaution ? l.kaution + ' ' + U.plural(l.kaution, 'Kaltmiete', '{n} Kaltmieten') + ' (' + U.eur(l.kalt * l.kaution) + ')' : 'keine'}</dd></div>` : ''}
                ${l.kind === 'kauf' && l.hausgeld ? h`<div><dt>Hausgeld</dt><dd>${U.eur(l.hausgeld)} im Monat</dd></div>` : ''}
                <div><dt>Provision</dt><dd>${l.provision ? U.dec(l.provision) + (l.kind === 'kauf' ? ' % des Kaufpreises' : ' Kaltmieten') : 'provisionsfrei'}</dd></div>
                <div><dt>Online seit</dt><dd>${U.since(l.stats.online)}</dd></div>
                <div><dt>Interessenten</dt><dd>${l.stats.bewerber} bei ${U.num(l.stats.aufrufe)} Aufrufen</dd></div>
              </dl>
            </section>

            <section class="block" id="ausstattung">
              <h2>${ico('check')}Ausstattung</h2>
              <ul class="merkmale">
                ${l.ausstattung.map((a) => h`<li>${ico('check')}${a}</li>`)}
              </ul>
            </section>

            <section class="block" id="beschreibung">
              <h2>${ico('blatt')}Beschreibung</h2>
              <p class="fliesstext">${l.beschreibung}</p>
            </section>

            ${risikoBlock(l, b.risiko)}
            ${spiegelBlock(l, b.mietCheck, b.kaufCheck)}
            ${klauselBlock(l)}
            ${kostenBlock(l, k)}
            ${finanzBlock(l, k)}
            ${wgBlock(l, b)}
            ${tauschBlock(l)}
            ${lageBlock(l, b)}
            ${termineBlock(l)}
            ${anbieterBlock(l)}
            ${aehnliche(l)}
          </div>

          <aside class="objekt__seite">
            <div class="haftbox">
              ${passungBlock(l, b)}
              <div class="haftbox__tun">
                <button type="button" class="knopf knopf--voll" data-tu="anschreiben" data-id="${l.id}">${ico('nachricht')}Anschreiben</button>
                <a class="knopf knopf--still knopf--voll" href="#kosten">${ico('rechner')}${U.eur(k.monatSumme)} echte Monatskosten</a>
              </div>
              ${eintrag ? h`<label class="feld"><span>Deine Notiz</span>
                <textarea rows="3" data-tu-input="notiz" data-id="${l.id}" placeholder="Was ist dir aufgefallen?">${eintrag.notiz || ''}</textarea></label>` : ''}
            </div>
          </aside>
        </div>
      </div>`,
      danach() {
        const flaeche = U.$('#objekt-karte');
        if (flaeche) {
          const umgebung = NW.data.listings.filter((x) => x.stadt === l.stadt && U.distKm(x, l) < 3.2);
          const k2 = NW.karte.erzeugen(flaeche, { onSelect: (id) => ui.gehe('objekt/' + id) });
          k2.setzen(umgebung.length > 1 ? umgebung : [l], l.id, null);
        }
      }
    };
  }

  /* ------------------------- Aktionen ------------------------- */

  const A_ = ui.aktionRegistrieren;

  A_('bild', (el) => {
    const l = NW.data.byId[ui.params.arg];
    if (!l) return;
    const n = NW.img.count(l);
    bildIndex = (bildIndex + Number(el.dataset.schritt) + n) % n;
    ui.neuZeichnen();
  });

  A_('bild-zu', (el) => { bildIndex = Number(el.dataset.i); ui.neuZeichnen(); });

  A_('status-setzen', (el) => {
    S.setStatus(el.dataset.id, el.value);
    ui.toast('Status auf „' + (S.PIPELINE.find((p) => p.id === el.value) || {}).label + '“ gesetzt.');
    ui.aktualisiereZaehler();
  });

  A_('notiz', U.debounce((el) => { S.setNotiz(el.dataset.id, el.value); }, 500));

  A_('termin-buchen', (el) => {
    const t = S.terminBuchen(el.dataset.id, el.dataset.termin);
    if (t) ui.toast('Termin am ' + U.dateDE(t.datum) + ' um ' + t.zeit + ' gebucht.', 'gut');
    ui.neuZeichnen();
  });

  A_('termin-ab', (el) => { S.terminAbsagen(el.dataset.id); ui.toast('Termin abgesagt.'); ui.neuZeichnen(); });

  A_('objekt-teilen', (el) => {
    const l = NW.data.byId[el.dataset.id];
    const text = l.titel + ' – ' + (l.kind === 'kauf' ? U.eur(l.kaufpreis) : U.eur(l.warm) + ' warm') +
      ', ' + U.dec(l.zimmer) + ' Zi., ' + l.flaeche + ' m², ' + l.viertel + ' (' + l.stadt + ')\n' +
      location.href.split('#')[0] + '#/objekt/' + l.id;
    if (navigator.share) {
      navigator.share({ title: l.titel, text }).catch(() => { });
    } else {
      ui.AKTIONEN.kopieren({ dataset: { text } });
    }
  });

  A_('kosten-anpassen', () => {
    const p = S.get().profil;
    ui.dialog({
      titel: 'Angaben für die Kostenrechnung',
      inhalt: h`<label class="feld"><span>Personen im Haushalt</span>
          <input type="number" min="1" max="6" id="k-haushalt" value="${p.haushalt}"></label>
        <label class="feld"><span>Nettoeinkommen im Monat (Haushalt)</span>
          <input type="number" min="0" step="50" id="k-netto" value="${p.nettoEinkommen}"></label>
        <p class="fein">Beides fließt nur in die Rechnung auf diesem Gerät ein.</p>`,
      fuss: h`<button type="button" class="knopf" data-tu="kosten-uebernehmen">Übernehmen</button>`
    });
  });

  A_('kosten-uebernehmen', () => {
    const p = S.get().profil;
    p.haushalt = Number(U.$('#k-haushalt').value) || 1;
    p.nettoEinkommen = Number(U.$('#k-netto').value) || 0;
    S.set({ profil: p }, 'profil');
    ui.dialogZu();
    ui.neuZeichnen();
  });

  A_('finanz', U.debounce((el) => {
    const p = S.get().profil;
    p[el.dataset.feld] = Number(el.value);
    S.set({ profil: p }, 'profil');
    ui.neuZeichnen();
  }, 200));

  A_('checkliste', (el) => {
    const id = el.dataset.id;
    const eintrag = S.get().merkliste[id] || { checkliste: {} };
    const gruppen = {};
    S.BESICHTIGUNG_FRAGEN.forEach((f) => { (gruppen[f.gruppe] = gruppen[f.gruppe] || []).push(f); });
    ui.dialog({
      titel: 'Besichtigungs-Checkliste',
      breit: true,
      inhalt: h`<p>Abhaken, was du geprüft hast. Alles bleibt bei diesem Objekt gespeichert und lässt sich
        am Ende als Text kopieren.</p>
        ${Object.keys(gruppen).map((g) => h`<fieldset class="filter__gruppe"><legend>${g}</legend>
          ${gruppen[g].map((f) => h`<label class="schalter">
            <input type="checkbox" data-tu-change="check" data-id="${id}" data-frage="${f.id}"
              ${(eintrag.checkliste || {})[f.id] ? 'checked' : ''}>
            <span>${f.text}</span></label>`)}
        </fieldset>`)}
        <label class="feld"><span>Notizen vor Ort</span>
          <textarea rows="4" data-tu-input="notiz" data-id="${id}">${eintrag.notiz || ''}</textarea></label>`,
      fuss: h`<button type="button" class="knopf knopf--still" data-tu="check-kopieren" data-id="${id}">${ico('kopieren')}Als Text kopieren</button>
        <button type="button" class="knopf" data-tu="dialog-zu">Fertig</button>`
    });
  });

  A_('check', (el) => { S.checkSetzen(el.dataset.id, el.dataset.frage, el.checked); });

  A_('check-kopieren', (el) => {
    const id = el.dataset.id, l = NW.data.byId[id];
    const e = S.get().merkliste[id] || { checkliste: {} };
    const zeilen = ['Besichtigung: ' + l.titel, l.strasse + ', ' + l.viertel + ', ' + l.stadt, ''];
    S.BESICHTIGUNG_FRAGEN.forEach((f) => {
      zeilen.push(((e.checkliste || {})[f.id] ? '[x] ' : '[ ] ') + f.text);
    });
    if (e.notiz) { zeilen.push('', 'Notizen:', e.notiz); }
    ui.AKTIONEN.kopieren({ dataset: { text: zeilen.join('\n') } });
  });

  /* Bewerbung mit Mieterprofil */
  A_('anschreiben', (el) => {
    const l = NW.data.byId[el.dataset.id];
    const p = S.get().profil;
    const fehlt = Object.keys(p.unterlagen).filter((k) => !p.unterlagen[k] && k !== 'wbs' && k !== 'buergschaft');
    const namen = { schufa: 'Schufa-Auskunft', gehaltsnachweise: 'Gehaltsnachweise', ausweis: 'Ausweiskopie',
      mietschuldenfrei: 'Mietschuldenfreiheit', buergschaft: 'Bürgschaft', selbstauskunft: 'Selbstauskunft', wbs: 'WBS' };
    const vorlage = anschreibenText(l, p);
    ui.dialog({
      titel: 'Anschreiben',
      breit: true,
      inhalt: h`<p class="block__unter">Nestwerk hat aus deinem Profil einen Vorschlag geschrieben. Ändere ihn, bis er nach dir klingt.</p>
        <label class="feld"><span>Nachricht</span>
          <textarea rows="12" id="anschreiben-text">${vorlage}</textarea></label>
        <fieldset class="filter__gruppe"><legend>Bewerbermappe</legend>
          <p class="fein">Was du mitschickst, entscheidet oft mehr als der Text. Fehlende Unterlagen erst
            nach der Besichtigung nachreichen – vorher gehören Ausweis und Schufa niemandem.</p>
          <ul class="mappe">
            ${Object.keys(p.unterlagen).map((kk) => h`<li class="${p.unterlagen[kk] ? 'is-da' : ''}">
              ${ico(p.unterlagen[kk] ? 'check' : 'x')}${namen[kk]}</li>`)}
          </ul>
          ${fehlt.length ? h`<p class="warn-meldung">${ico('warnung')}Es fehlen: ${fehlt.map((f) => namen[f]).join(', ')}.
            <a href="#/profil">Im Profil ergänzen</a></p>` : h`<p class="gut-meldung">${ico('pruefen')}Deine Mappe ist vollständig.</p>`}
        </fieldset>`,
      fuss: h`<button type="button" class="knopf knopf--still" data-tu="anschreiben-kopieren">${ico('kopieren')}Text kopieren</button>
        <button type="button" class="knopf" data-tu="anschreiben-senden" data-id="${l.id}">${ico('nachricht')}Absenden</button>`
    });
  });

  function anschreibenText(l, p) {
    const anrede = l.anbieter.art === 'privat' ? 'Hallo ' + l.anbieter.name.split(' ')[0] + ','
      : 'Guten Tag,';
    const wer = [];
    if (p.name) wer.push('ich heiße ' + p.name);
    if (p.alter) wer.push('bin ' + p.alter);
    if (p.beruf) wer.push('arbeite ' + (/^(als|im|in|bei)\b/.test(p.beruf) ? p.beruf : 'als ' + p.beruf));
    const haushalt = p.haushalt > 1 ? 'Wir sind ' + p.haushalt + ' Personen.' : 'Ich würde allein einziehen.';
    const einkommen = p.nettoEinkommen ? 'Mein Nettoeinkommen liegt bei rund ' + U.eur(p.nettoEinkommen) + ' im Monat.' : '';
    const wann = p.einzugAb ? 'Einziehen könnte ich ab ' + U.dateDE(p.einzugAb) + '.'
      : 'Beim Einzugstermin bin ich flexibel.';
    const wg = l.kind === 'wg' ? ' Über ein Kennenlernen mit euch würde ich mich freuen.' : '';
    return anrede + '\n\n' +
      'Ihr Inserat „' + l.titel + '“ passt sehr gut zu dem, was ich suche. ' +
      (wer.length ? wer.join(', ').replace(/^i/, 'I') + '. ' : '') + haushalt + ' ' + einkommen + ' ' + wann + wg + '\n\n' +
      (p.vorstellung ? p.vorstellung + '\n\n' : '') +
      'Selbstauskunft, Einkommensnachweise und Mietschuldenfreiheitsbescheinigung bringe ich zur Besichtigung mit. ' +
      'Nennen Sie mir gern zwei Termine, die Ihnen passen.\n\n' +
      'Viele Grüße\n' + (p.name || '');
