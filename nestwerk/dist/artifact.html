    },

    'band-zu'(el) {
      NW.store.update((s) => { s.hinweiseGelesen[el.dataset.was] = U.isoDate(NW.now()); }, 'hinweis');
      bandZeichnen();
    },

    'warum-top'() {
      dialog({
        titel: 'Warum steht das oben?',
        inhalt: h`<p>Diese Inserate stehen dort, weil die anbietende Seite für den Platz bezahlt hat. Nestwerk
            zeigt bezahlte Plätze <b>getrennt und beschriftet</b> – nie zwischen den Treffern.</p>
          <p><b>Was das nicht bedeutet:</b></p>
          <ul class="liste-schlicht">
            <li>Die Reihenfolge deiner Treffer darunter ändert sich dadurch nicht. Sie folgt weiter deinem Profil.</li>
            <li>Ein bezahlter Platz sagt nichts über die Wohnung. Prüfhinweis, Vergleichsmiete und Chancen
              rechnet Nestwerk hier genauso wie überall.</li>
            <li>Kein Inserat verschwindet, weil ein anderes bezahlt hat. Die Liste bleibt vollständig.</li>
          </ul>
          <p class="fein">Höchstens ${NW.plan.TOP_MAX} bezahlte Plätze über einer Trefferliste. Mehr, und der
            eigentliche Inhalt begänne unterhalb des Bildschirmrands.</p>`,
        fuss: h`<a class="knopf knopf--still" href="#/inserieren" data-tu="dialog-zu">Eigenes Inserat hervorheben</a>
          <button type="button" class="knopf" data-tu="dialog-zu">Verstanden</button>`
      });
    },

    'warum-werbung'() {
      dialog({
        titel: 'Warum sehe ich Anzeigen?',
        inhalt: h`<p>Nestwerk ist im freien Tarif vollständig nutzbar – die Suche, die Karte, der Prüfhinweis,

          <p><b>Was wir dabei nicht tun:</b></p>
          <ul class="liste-schlicht">
            <li>Anzeigen sehen nie aus wie ein Inserat und stehen nie in der Trefferreihenfolge.</li>
            <li>Kein Werbetreibender bekommt Einfluss darauf, welche Wohnungen dir angezeigt werden.</li>
            <li>Es werden keine Daten über dich an Werbetreibende gegeben – die Auswahl entsteht im Browser.</li>
          </ul>
          <p class="fein">In dieser Vorführung sind alle Anzeigen erfunden und führen nirgendwohin.</p>`,
        fuss: h`<button type="button" class="knopf knopf--still" data-tu="dialog-zu">Verstanden</button>
          <a class="knopf" href="#/plus" data-tu="dialog-zu">Ohne Anzeigen lesen</a>`
      });
    },

    'anzeige-klick'() {
      toast('Beispielanzeige – sie führt in dieser Vorführung nirgendwohin.');
    },
    palette() { paletteOeffnen(); },
    'palette-zu'() { paletteZu(); },
    'dialog-zu'() { dialogZu(); },
    hilfe() {
      dialog({
        titel: 'Tastatur und Bedienung',
        inhalt: h`<dl class="tastatur">
          <dt><kbd>Strg</kbd>+<kbd>K</kbd></dt><dd>Schnellsuche über Bereiche, Städte, Viertel und Inserate</dd>
          <dt><kbd>/</kbd></dt><dd>Schnellsuche, wenn kein Eingabefeld aktiv ist</dd>
          <dt><kbd>Esc</kbd></dt><dd>Fenster und Schnellsuche schließen</dd>
          <dt><kbd>1</kbd>…<kbd>7</kbd></dt><dd>Direkt in einen Hauptbereich springen</dd>
          <dt><kbd>M</kbd></dt><dd>Auf einer Objektseite: merken</dd>
          <dt><kbd>V</kbd></dt><dd>Auf einer Objektseite: zum Vergleich</dd>
          <dt>Karte</dt><dd>Ziehen zum Verschieben, Mausrad oder <kbd>+</kbd>/<kbd>−</kbd> zum Zoomen, Pfeiltasten bei Fokus</dd>
        </dl>`
      });
    },
    daten() {
      const s = NW.store.get();
      const groesse = new Blob([JSON.stringify(s)]).size;
      dialog({
        titel: 'Meine Daten',
        inhalt: h`<p>Nestwerk speichert alles ausschließlich im Speicher dieses Browsers. Es gibt keinen Server,
          kein Konto und keine Übertragung an Dritte.</p>
        <ul class="liste-schlicht">
          <li>${Object.keys(s.merkliste).length} Merkungen</li>
          <li>${s.agenten.length} Suchaufträge</li>
          <li>${s.threads.length} Nachrichtenverläufe</li>
          <li>${s.eigeneInserate.length} eigene Inserate</li>
          <li>Belegter Speicher: rund ${U.num(Math.ceil(groesse / 1024))} kB</li>
        </ul>
        <p>Beim Leeren der Browserdaten verschwindet auch dieser Stand.</p>
        ${NW.tresor && NW.tresor.eingerichtet() ? h`<div class="hinweisbox">${ico('schloss')}
          <div><b>Der Dokumententresor liegt getrennt davon</b>
          <p>Er wird hier weder gesichert noch gelöscht: Verschlüsselte Unterlagen in eine Klartextdatei zu
            exportieren wäre das Gegenteil dessen, wofür er da ist. Leeren lässt er sich im
            <a href="#/tresor">Tresor</a> selbst.</p></div>

        fuss: h`<button type="button" class="knopf knopf--still" data-tu="daten-export">${ico('speichern')}Als Datei sichern</button>
          <button type="button" class="knopf knopf--gefahr" data-tu="daten-loeschen">${ico('muell')}Alles zurücksetzen</button>`
      });
    },
    'daten-export'() {
      dateiSichern('nestwerk-daten.json', JSON.stringify(NW.store.get(), null, 2), 'application/json');
    },

    'daten-loeschen'() {
      if (!confirm('Merkliste, Profil, Suchaufträge und Nachrichten werden gelöscht. '
        + 'Der Dokumententresor bleibt bestehen – ihn leerst du dort. Fortfahren?')) return;
      NW.store.zuruecksetzen();
      dialogZu();
      toast('Alles zurückgesetzt.', 'info');
      neuZeichnen();
    },
    kopieren(el) {
      const quelle = el.dataset.quelle ? U.$(el.dataset.quelle) : null;
      const text = el.dataset.text || (quelle ? (quelle.value !== undefined ? quelle.value : quelle.textContent) : '');
      const fertig = () => toast('In die Zwischenablage kopiert.', 'gut');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(fertig, () => toast('Kopieren nicht möglich.', 'schlecht'));
      } else {
        const t = document.createElement('textarea');
        t.value = text; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); fertig(); } catch (e) { toast('Kopieren nicht möglich.', 'schlecht'); }
        t.remove();
      }
    }
  };

  function aktionRegistrieren(name, fn) { AKTIONEN[name] = fn; }

  /* ================================================================
     Start
     ================================================================ */

  function start() {
    NW.store.laden();
    if (NW.konto) NW.konto.laden();

    /* Die App bekommt einen eigenen Wurzelknoten und rührt den Rest des
       Dokuments nicht an. In der Einzeldatei stehen Stil und Skript im
       body – ein Überschreiben von body.innerHTML würde beides mitreißen. */
    let wurzel = document.getElementById('nestwerk');
    if (!wurzel) {
      wurzel = document.createElement('div');
      wurzel.id = 'nestwerk';
      document.body.appendChild(wurzel);
    }
    wurzel.innerHTML = schale();

    const s = NW.store.get();
    if (s.theme && s.theme !== 'auto') document.documentElement.setAttribute('data-theme', s.theme);

    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-tu]');
      if (!el) return;
      const fn = AKTIONEN[el.dataset.tu];
      if (!fn) return;
      e.preventDefault();
      fn(el, e);
    });

    document.addEventListener('change', (e) => {
      const el = e.target.closest('[data-tu-change]');
      if (!el) return;
      const fn = AKTIONEN[el.dataset.tuChange];
      if (fn) fn(el, e);
    });

    document.addEventListener('input', (e) => {
      const el = e.target.closest('[data-tu-input]');
      if (!el) return;
      const fn = AKTIONEN[el.dataset.tuInput];
      if (fn) fn(el, e);
    });

    document.addEventListener('submit', (e) => {
      const el = e.target.closest('[data-tu-submit]');
      if (!el) return;
      e.preventDefault();
      const fn = AKTIONEN[el.dataset.tuSubmit];
      if (fn) fn(el, e);
    });

    document.addEventListener('keydown', (e) => {
      const inFeld = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) ||
        document.activeElement.isContentEditable;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); paletteOeffnen(); return; }
      if (inFeld) return;
      if (e.key === '/') { e.preventDefault(); paletteOeffnen(); return; }
      if (e.key >= '1' && e.key <= '7' && !e.ctrlKey && !e.metaKey && !e.altKey) {
        const n = NAV[Number(e.key) - 1];
        if (n) { e.preventDefault(); gehe(n.route); }
      }
    });

    window.addEventListener('hashchange', () => zeichnen());

    /* Endet die Sitzung – hier, oder in einem zweiten Fenster desselben
       Browsers –, muss die Oberfläche sofort zusperren. Eine Anwendung,
       die nach dem Abmelden noch offensteht, hat nicht abgemeldet. */
    if (NW.konto) {
      NW.konto.on((k, grund) => {
        if (grund === 'abmeldung' || grund === 'anmeldung') neuZeichnen();
      });
      window.addEventListener('storage', (e) => {
        if (e.key !== 'nestwerk.konto.v1') return;
        NW.konto.laden();
        neuZeichnen();
      });
    }
    if (!location.hash) location.hash = '#/start';
    zeichnen(true);
  }

  Object.assign(ui, {
    start, gehe, zeichnen, neuZeichnen, toast, dialog, dialogZu,
    badge, passungsRing, energieBalken, inseratsKarte, ampelFarbe,
    ART_LABEL, ART_ICON, artLabel, artIcon, ico, aktionRegistrieren, AKTIONEN,
    sperrHinweis, anzeige, NAV, dateiSichern,
    aktualisiereZaehler, themeSetzen, paletteOeffnen, kartenMarken, preisZeile
  });
})(window.NW = window.NW || {});

/* ===== view-start.js ===== */
/* =====================================================================
   Nestwerk – Ansicht: Start
   Kein Werbebanner, sondern ein Arbeitsplatz: Was ist neu, wo stehst du,
   was ist als Nächstes zu tun.
   ===================================================================== */
(function (NW) {
  'use strict';

  const U = NW.util, ui = NW.ui, A = NW.analyse, S = NW.store, M = NW.match, P = NW.plan;
  const h = U.html, raw = U.raw, ico = U.svg;

  function begruessung() {
    const std = NW.now().getHours();
    return std < 5 ? 'Noch wach' : std < 11 ? 'Guten Morgen' : std < 18 ? 'Guten Tag' : 'Guten Abend';
  }

  /* Was steht an? Aus Terminen, Suchaufträgen, Nachrichten und Profil. */
  function aufgaben() {
    const s = S.get();
    const out = [];

    const offeneTermine = Object.keys(s.merkliste)
      .map((id) => ({ id, e: s.merkliste[id] }))
      .filter((x) => x.e.termin && x.e.termin.datum >= U.isoDate(NW.now()))
      .sort((a, b) => a.e.termin.datum.localeCompare(b.e.termin.datum));
    offeneTermine.slice(0, 2).forEach((x) => {
      const l = NW.data.byId[x.id];
      if (!l) return;
      out.push({
        icon: 'kalender', dringend: U.daysSince(x.e.termin.datum) > -3,
        titel: 'Besichtigung ' + U.dateDE(x.e.termin.datum) + ' um ' + x.e.termin.zeit,
        text: l.titel + ', ' + l.viertel, ziel: 'objekt/' + l.id, knopf: 'Checkliste'
      });
    });

    let neu = 0;
    s.agenten.forEach((a) => { if (a.aktiv) neu += S.agentTreffer(a).neu.length; });
    if (neu) out.push({
      icon: 'glocke', dringend: true, titel: neu + ' neue Treffer in deinen Suchaufträgen',
      text: 'seit dem letzten Blick hinzugekommen', ziel: 'agenten', knopf: 'Ansehen'
    });

    const faellig = S.nachfassFaellig();
    if (faellig.length) out.push({
      icon: 'verlauf', dringend: true,
      titel: faellig.length + ' ' + U.plural(faellig.length, 'Anfrage wartet', 'Anfragen warten') + ' seit Tagen auf Antwort',
      text: 'Die älteste liegt ' + faellig[0].tage + ' Tage – eine kurze Nachfrage kostet nichts.',
      ziel: 'merkliste', knopf: 'Ansehen'
    });

    const ungelesen = U.sum(s.threads.map((t) => t.ungelesen));
    if (ungelesen) out.push({
      icon: 'nachricht', dringend: true, titel: ungelesen + ' ' + U.plural(ungelesen, 'neue Nachricht', 'neue Nachrichten'),
      text: 'Anbieter warten auf eine Antwort', ziel: 'nachrichten', knopf: 'Öffnen'
    });

    if (!s.profilAngelegt) out.push({
      icon: 'person', dringend: false, titel: 'Profil ausfüllen',
      text: 'Erst damit sortiert Nestwerk nach deiner Passung statt nach Zufall.', ziel: 'profil', knopf: 'Ausfüllen'
    });

    const fehlend = Object.keys(s.profil.unterlagen).filter((k) => !s.profil.unterlagen[k] && k !== 'wbs' && k !== 'buergschaft');
    if (s.profilAngelegt && fehlend.length) out.push({
      icon: 'blatt', dringend: false, titel: 'Bewerbermappe unvollständig',
      text: fehlend.length + ' ' + U.plural(fehlend.length, 'Unterlage fehlt', 'Unterlagen fehlen') + ' – wer sie parat hat, ist schneller.',
      ziel: 'profil', knopf: 'Ergänzen'
    });

    if (!s.profil.nettoEinkommen) out.push({
      icon: 'euro', dringend: false, titel: 'Wie viel Miete kannst du tragen?',
      text: 'Zwei Grenzen entscheiden: dein Budget und die Regel, die Vermieter anwenden.',
      ziel: 'leistbarkeit', knopf: 'Ausrechnen'
    });

    if (!s.meinTausch && s.filter.arten.indexOf('tausch') >= 0) out.push({
      icon: 'tausch', dringend: false, titel: 'Tauschangebot fehlt',
      text: 'Ohne eigene Wohnung im Topf findet der Ringtausch dich nicht.', ziel: 'tausch', knopf: 'Anlegen'
    });

    if (s.einzugsdatum) {
      const plan = S.umzugsPlan().filter((a) => !a.erledigt && a.faellig <= U.isoDate(U.addDays(NW.now(), 14)));
      if (plan.length) out.push({
        icon: 'umzug', dringend: true, titel: plan.length + ' ' + U.plural(plan.length, 'Umzugsaufgabe', 'Umzugsaufgaben') + ' in den nächsten 14 Tagen',
        text: plan[0].label, ziel: 'umzug', knopf: 'Plan öffnen'
      });
    }

    return out;
  }

  function pipelineLeiste() {
    const s = S.get();
    const zahlen = {};
    S.PIPELINE.forEach((p) => { zahlen[p.id] = 0; });
    Object.keys(s.merkliste).forEach((id) => {
      const st = s.merkliste[id].status;
      if (zahlen[st] !== undefined) zahlen[st]++;
    });
    const gesamt = U.sum(Object.keys(zahlen).map((k) => zahlen[k]));
    if (!gesamt) return '';
    return h`<section class="block">
      <div class="block__kopfzeile">
        <h2>${ico('waage')}Deine Bewerbungen</h2>
        <a class="link" href="#/merkliste">alle ansehen</a>
      </div>
      <ol class="pipeline">
        ${S.PIPELINE.map((p) => h`<li class="pipeline__stufe pipeline__stufe--${p.farbe}">
          <b>${zahlen[p.id]}</b><span>${p.label}</span></li>`)}
      </ol>
    </section>`;
  }

  function neuesteTreffer() {
    const s = S.get();
    const passend = A.sortieren(
      A.filtern(NW.data.listings, Object.assign({}, s.filter, { sort: 'neu' }), s.profil),
      'neu', s.profil
    ).slice(0, 6);
    return passend;
  }

  function ansicht() {
    const s = S.get();
    const tun = aufgaben();
    const treffer = neuesteTreffer();
    const gesehen = s.gesehen.map((id) => NW.data.byId[id]).filter(Boolean).slice(0, 4);
    const tauschAngebote = NW.data.listings.filter((x) => x.kind === 'tausch');
    const ringZahl = M.ringe(tauschAngebote, { maxLen: 3 }).length;

    return {
      titel: 'Start',
      html: h`<div class="seite">
        <header class="start__kopf">
          <div>
            <h1>${begruessung()}${s.profil.name ? ', ' + s.profil.name.split(' ')[0] : ''}.</h1>
            <p class="seite__unter">Mietwohnungen, Eigentum, WG-Zimmer und Wohnungstausch – eine Suche, ein Profil,
              eine Bewerbermappe.</p>
          </div>

      label: () => 'auch Inserate mit Provision zeigen', aendern: (k) => { k.provisionsfrei = false; } },
    { tu: 'lockern-anbieter', gilt: (f) => f.anbieterArt.length > 0, schmerz: 2,
      label: () => 'alle Anbieterarten zulassen', aendern: (k) => { k.anbieterArt = []; } }
    /* Bewusst nicht dabei: den Prüfhinweis abschalten. Betrugsschutz ist
       keine Stellschraube, an der man dreht, um mehr Treffer zu bekommen. */
  ];

  function zaehle(f) {
    const s = S.get();
    return A.filtern(NW.data.listings.concat(s.eigeneInserate), f, s.profil).length;
  }

  /* Liefert für eine Lockerung den konkreten Zielwert und den Ertrag –
     oder null, wenn sie nichts ändert. */
  function pruefeLockerung(eintrag, f, jetzt) {
    if (!eintrag.gilt(f)) return null;
    const stufen = eintrag.stufen || [null];
    for (let i = 0; i < stufen.length; i++) {
      const wert = eintrag.wert ? eintrag.wert(f, stufen[i]) : null;
      const kopie = JSON.parse(JSON.stringify(f));
      eintrag.aendern(kopie, wert, f);
      const neu = zaehle(kopie);
      if (neu > jetzt) {
        return {
          tu: eintrag.tu, label: eintrag.label(f, wert), wert,
          gewinn: neu - jetzt, danach: neu,
          schmerz: eintrag.schmerz || 2, gross: !!eintrag.gross
        };
      }
    }
    return null;
  }

  function lockerungen(f) {
    const jetzt = zaehle(f);
    const alle = LOCKERUNGEN.map((e) => pruefeLockerung(e, f, jetzt)).filter(Boolean);
    /* Ertrag je Einheit Schmerz. Was die Suche grundlegend umdeutet
       (andere Stadt, andere Wohnform), rutscht ans Ende. */
    const sanft = alle.filter((x) => !x.gross).sort((a, b) => b.gewinn / b.schmerz - a.gewinn / a.schmerz);
    const gross = alle.filter((x) => x.gross).sort((a, b) => b.gewinn - a.gewinn);
    return sanft.slice(0, 3).concat(gross.slice(0, sanft.length ? 1 : 2));
  }

  function lockerungsKnoepfe(f) {
    const vorschlaege = lockerungen(f);
    if (!vorschlaege.length) return '';
    const sanft = vorschlaege.filter((v) => !v.gross);
    const gross = vorschlaege.filter((v) => v.gross);
    return h`${sanft.length ? h`<div class="leer__tun">
        ${sanft.map((v) => h`<button type="button" class="knopf knopf--still" data-tu="${v.tu}">
          ${v.label}<em>+${v.gewinn}</em></button>`)}
      </div>` : ''}
      ${gross.length ? h`<div class="leer__gross">
        <p>${sanft.length ? 'Wenn das nicht reicht' : 'Es hilft nur noch'} – das ändert deine Suche allerdings grundlegend:</p>
        <div class="leer__tun">
          ${gross.map((v) => h`<button type="button" class="knopf knopf--still" data-tu="${v.tu}">
            ${v.label}<em>+${v.gewinn}</em></button>`)}
        </div>
      </div>` : ''}`;
  }

  function leerHinweis(f) {
    const vorschlaege = lockerungen(f);
    return h`<div class="leer">
      ${ico('lupe')}
      <h3>Keine Treffer</h3>
      <p>${vorschlaege.length
        ? 'Die Filter zusammen lassen nichts übrig. Diese Änderungen bringen sofort Treffer – die Zahl dahinter sagt, wie viele:'
        : 'Die Filter zusammen lassen nichts übrig, und keine einzelne Lockerung reicht aus. Setz die Filter zurück und fang enger an.'}</p>
      ${lockerungsKnoepfe(f)}
      ${!vorschlaege.length ? h`<p><button type="button" class="knopf" data-tu="filter-leeren">Filter zurücksetzen</button></p>` : ''}
    </div>`;
  }

  const WENIG = 4;

  /* Bezahlte Plätze stehen über den Treffern, in einem eigenen Block mit
     eigener Überschrift – nicht zwischen ihnen. Untergemischt wären sie
     nach § 5b Abs. 1 Nr. 6 UWG kennzeichnungspflichtig und würden die
     Erklärung „sortiert nach deinem Profil“ zu einer Halbwahrheit machen.
     Hier bleibt beides wahr: oben bezahlt und beschriftet, darunter die
     Reihenfolge aus dem Profil. */
  function topBlock(bewertet) {
    const top = bewertet.filter((x) => NW.plan.istTop(x.l)).slice(0, NW.plan.TOP_MAX);
    if (!top.length) return '';
    return h`<section class="topanzeigen" aria-label="Bezahlte Platzierungen">
      <p class="topanzeigen__kopf">
        <span class="topanzeigen__marke">${ico('blitz')}Top-Anzeigen</span>
        <button type="button" class="anzeige__warum" data-tu="warum-top"
          title="Warum steht das hier?" aria-label="Warum steht das hier?">?</button>
      </p>
      <div class="ergebnisse__liste">
        ${top.map((x) => ui.inseratsKarte(x.l, x.b))}
      </div>
      <p class="topanzeigen__fuss">Bezahlte Platzierung der anbietenden Seite. Sie ändert nichts an der
        Reihenfolge darunter – die folgt weiter deinem Profil.</p>
    </section>`;
  }

  function ergebnisListe(bewertet) {
    const f = S.get().filter;
    if (!bewertet.length) return leerHinweis(f);
    /* Ein Inserat steht entweder oben im bezahlten Block oder unten in
       der Liste, nie zweimal. */
    const top = bewertet.filter((x) => NW.plan.istTop(x.l)).slice(0, NW.plan.TOP_MAX);
    const topIds = top.map((x) => x.l.id);
    const organisch = bewertet.filter((x) => topIds.indexOf(x.l.id) < 0);
    const teil = organisch.slice(0, sichtbar);
    const rest = organisch.length - teil.length;
    /* Zwei Treffer sind fast so wenig wie keiner – die Hilfe darf nicht
       erst bei null erscheinen. */
    const knapp = bewertet.length < WENIG ? lockerungsKnoepfe(f) : '';
    /* Anzeigen sitzen zwischen den Treffern, nie in der Reihenfolge:
       sie haben eine eigene Gestalt und tragen immer ihre Kennzeichnung. */
    const abstand = NW.plan.ANZEIGE_ABSTAND;
    return h`${topBlock(bewertet)}
    <div class="ergebnisse__liste">
      ${teil.map((x, i) => h`${ui.inseratsKarte(x.l, x.b)}${(i + 1) % abstand === 0 && i + 1 < teil.length
        ? ui.anzeige('treffer-' + Math.floor(i / abstand), 'breit') : ''}`)}
    </div>
    ${knapp ? h`<div class="wenig">
      ${ico('lupe')}
      <div>
        <b>Nur ${bewertet.length} ${U.plural(bewertet.length, 'Treffer', 'Treffer')}</b>
        <p>So findest du mehr – die Zahl sagt, wie viele dazukommen:</p>
      </div>
    </div>${knapp}` : ''}
    ${rest > 0 ? h`<div class="mehr">
      <button type="button" class="knopf knopf--still" data-tu="mehr-zeigen">
        ${ico('pfeilUnten')}Weitere ${Math.min(SEITE, rest)} von ${U.num(rest)} zeigen</button>
      <p class="fein">${U.num(teil.length)} von ${U.num(organisch.length)} Treffern geladen</p>
    </div>` : organisch.length > SEITE ? h`<p class="mehr__fertig fein">Alle ${U.num(organisch.length)} Treffer geladen.</p>` : ''}`;
  }

  /* Erklärt, warum das erste Ergebnis vorne steht. */
  function rankingErklaerung(bewertet) {
    if (!bewertet.length || S.get().filter.sort !== 'passung') return '';
    const top = bewertet[0];
    const gruende = top.b.teile.slice(0, 3).map((t) =>
      t.label.toLowerCase() + ' (' + Math.round(t.anteil * 100) + ' %)');
    return h`<details class="erklaerung">
      <summary>${ico('info')}Warum steht „${U.truncate(top.l.titel, 46)}“ ganz oben?</summary>
      <p>Nestwerk sortiert nach deinem Profil, nicht nach bezahlter Platzierung. Für dieses Inserat zählen vor allem
        ${raw(gruende.join(', '))}. Insgesamt ergibt das ${top.b.score} von 100 Punkten.</p>
      <p>Bezahlte Plätze gibt es getrennt davon: Sie stehen über der Liste, tragen die Überschrift
        „Top-Anzeigen“ und verschieben in der Liste darunter nichts.</p>
      <p class="erklaerung__mehr"><a href="#/profil">Gewichtung im Profil ändern</a> – dann ändert sich auch die Reihenfolge.</p>
    </details>`;
  }

  /* ------------------------- Ansicht ------------------------- */

  function rechnen() {
    const s = S.get();
    const gefiltert = A.filtern(NW.data.listings.concat(s.eigeneInserate), s.filter, s.profil);
    const bewertet = A.sortieren(gefiltert, s.filter.sort, s.profil);
    letzteTreffer = bewertet.map((x) => x.l);
    return bewertet;
  }

  function aktualisieren() {
    const bewertet = rechnen();
    const box = U.$('#ergebnisse');
    if (box) box.innerHTML = ergebnisListe(bewertet);
    const kopf = U.$('#markt');
    if (kopf) kopf.innerHTML = marktLeiste(letzteTreffer);
    const erkl = U.$('#erklaerung');
    if (erkl) erkl.innerHTML = rankingErklaerung(bewertet);
    if (karte) karte.setzen(letzteTreffer, null, S.get().filter.umkreis);
    const anzahl = U.$('#treffer-anzahl');
    if (anzahl) anzahl.textContent = U.num(letzteTreffer.length);
    ui.aktualisiereZaehler();
  }

  function ansicht(route) {
    const s = S.get();
    const f = s.filter;

    /* Solange niemand die Filter angefasst hat, folgt die Suche dem
       Profil. Wer einmal selbst filtert, behält die Kontrolle. */
    if (!s.filterBeruehrt && s.profilAngelegt) {
      const abgeleitet = A.filterAusProfil(s.profil, f);
      Object.assign(f, abgeleitet);
      S.set({ filter: f }, 'filter');
    }

    /* Parameter aus der Adresse übernehmen, z. B. aus der Schnellsuche. */
    if (route.params.stadt) { f.staedte = [route.params.stadt]; f.viertel = []; }
    if (route.params.viertel) {
      const d = NW.geo.districtByKey[route.params.viertel];
      if (d) { f.staedte = [d.city]; f.viertel = [route.params.viertel]; }
    }
    if (route.params.q !== undefined) f.q = route.params.q;
    if (route.params.art) f.arten = route.params.art.split(',');
    if (Object.keys(route.params).length) S.set({ filter: f, filterBeruehrt: true }, 'filter');

    const bewertet = rechnen();
    const ansichtsart = s.ansicht;

    return {
      titel: 'Suchen',
      html: h`<div class="suche" data-ansicht="${ansichtsart}">
        <h1 class="nur-sr">Wohnungen, WG-Zimmer und Tauschangebote suchen</h1>
        <div class="suche__leiste">
          <div class="suche__arten" role="group" aria-label="Angebotsart">
            ${ARTEN.map((a) => {
        const an = f.arten.indexOf(a.id) >= 0;
        return h`<button type="button" class="art ${an ? 'is-an' : ''}" aria-pressed="${an ? 'true' : 'false'}"
                data-tu="art-um" data-wert="${a.id}">${ico(a.icon)}<span>${a.label}</span></button>`;
      })}
          </div>
          <div class="suche__feld">
            ${ico('suche')}
            <input type="search" id="suchfeld" value="${f.q}" data-tu-input="such-text"
              placeholder="Stichwort, Straße, Viertel, Anbieter…" aria-label="Freitextsuche">
            ${f.q ? h`<button type="button" class="ikon-btn" data-tu="such-leeren" aria-label="Suchtext löschen">${ico('x')}</button>` : ''}
          </div>
          <div class="suche__stellen">
            <label class="feld feld--flach">
              <span class="nur-sr">Sortierung</span>
              <select data-tu-change="sortieren" aria-label="Sortierung">
                ${SORTIERUNG.map((so) => h`<option value="${so[0]}" ${f.sort === so[0] ? 'selected' : ''}>${so[1]}</option>`)}
              </select>
            </label>
            <div class="umschalter" role="group" aria-label="Darstellung">
              <button type="button" class="${ansichtsart === 'liste' ? 'is-an' : ''}" data-tu="ansicht" data-wert="liste" title="Nur Liste">${ico('liste')}</button>
              <button type="button" class="${ansichtsart === 'beides' ? 'is-an' : ''}" data-tu="ansicht" data-wert="beides" title="Liste und Karte">${ico('waage')}</button>
              <button type="button" class="${ansichtsart === 'karte' ? 'is-an' : ''}" data-tu="ansicht" data-wert="karte" title="Nur Karte">${ico('karte')}</button>
            </div>
            <button type="button" class="knopf knopf--still nur-schmal" data-tu="filter-auf">${ico('filter')}Filter</button>
          </div>
        </div>

        <div class="suche__raster">
          <aside class="suche__filter" id="filterspalte">${filterPanel()}</aside>

          <section class="suche__ergebnis" aria-label="Suchergebnisse">
            <div id="markt">${marktLeiste(letzteTreffer)}</div>
            <div id="erklaerung">${rankingErklaerung(bewertet)}</div>
            <div id="ergebnisse">${ergebnisListe(bewertet)}</div>
          </section>

          <section class="suche__karte" aria-label="Karte">
            <div class="karte__rahmen">
              <div id="kartenflaeche"></div>
              <div class="karte__werkzeug">
                <button type="button" class="knopf knopf--still knopf--klein" data-tu="umkreis-modus">
                  ${ico('ziel')}${umkreisModus ? 'Punkt setzen: klicke in die Karte' : 'Umkreis festlegen'}</button>
              </div>
            </div>
          </section>
        </div>
      </div>`,
      danach() {
        const flaeche = U.$('#kartenflaeche');
        if (!flaeche) return;
        karte = NW.karte.erzeugen(flaeche, {
          onSelect: (id) => ui.gehe('objekt/' + id),
          onUmkreis: (p) => {
            const filter = S.get().filter;
            filter.umkreis = { lat: p.lat, lng: p.lng, km: filter.umkreis ? filter.umkreis.km : 3 };
            umkreisModus = false;
            S.set({ filter }, 'filter');
            ui.neuZeichnen();
          },
          umkreisModus
        });
        karte.setzen(letzteTreffer, null, S.get().filter.umkreis);
      }
    };
  }

  /* ------------------------- Aktionen ------------------------- */

  function filterAendern(patch) {
    const f = Object.assign(S.get().filter, patch);
    sichtbar = SEITE;
    S.set({ filter: f, filterBeruehrt: true }, 'filter');
  }

  const A_ = ui.aktionRegistrieren;

  A_('mehr-zeigen', () => {
    sichtbar += SEITE;
    aktualisieren();
    /* Fokus auf die erste neu geladene Karte, damit die Tastatur nicht springt. */
    const karten = U.$$('#ergebnisse .karte-inserat');
    const ziel = karten[Math.max(0, sichtbar - SEITE)];
    if (ziel) { const a = ziel.querySelector('a'); if (a) a.focus(); }
  });

  A_('art-um', (el) => {
    sichtbar = SEITE;
    const f = S.get().filter;
    const i = f.arten.indexOf(el.dataset.wert);
    if (i >= 0) { if (f.arten.length > 1) f.arten.splice(i, 1); }
    else f.arten.push(el.dataset.wert);
    S.set({ filter: f, filterBeruehrt: true }, 'filter');
    ui.neuZeichnen();
  });

  A_('such-text', U.debounce((el) => { filterAendern({ q: el.value }); aktualisieren(); }, 260));
  A_('such-leeren', () => { filterAendern({ q: '' }); ui.neuZeichnen(); });

  A_('filter-zahl', U.debounce((el) => {
    const wert = el.value === '' ? null : Number(el.value);
    const patch = {}; patch[el.dataset.feld] = (wert !== null && isNaN(wert)) ? null : wert;
    filterAendern(patch);
    aktualisieren();
  }, 300));

  A_('filter-wert', (el) => {
    const patch = {}; patch[el.dataset.feld] = el.value || null;
    filterAendern(patch);
    aktualisieren();
  });

  A_('filter-schalter', (el) => {
    const patch = {}; patch[el.dataset.feld] = el.checked;
    filterAendern(patch);
    aktualisieren();
  });

  A_('filter-chip', (el) => {
    sichtbar = SEITE;
    const f = S.get().filter;
    const feld = el.dataset.feld, wert = el.dataset.wert;
    const liste = f[feld] || [];
    const i = liste.indexOf(wert);
    if (i >= 0) liste.splice(i, 1); else liste.push(wert);
    f[feld] = liste;
    if (feld === 'staedte') f.viertel = f.viertel.filter((v) => f.staedte.indexOf(v.split('|')[0]) >= 0);
    S.set({ filter: f, filterBeruehrt: true }, 'filter');
    if (feld === 'staedte') ui.neuZeichnen();
    else { el.classList.toggle('is-an'); el.setAttribute('aria-pressed', el.classList.contains('is-an') ? 'true' : 'false'); aktualisieren(); }
  });

  A_('filter-wgrauchen', (el) => { filterAendern({ wgRauchen: el.checked ? 'rauchfrei' : null }); aktualisieren(); });
  A_('filter-wgtiere', (el) => { filterAendern({ wgHaustiere: el.checked ? 'erlaubt' : null }); aktualisieren(); });

  A_('filter-leeren', () => {
    const arten = S.get().filter.arten;
    const neu = A.leerFilter();
    neu.arten = arten;
    sichtbar = SEITE;
    S.set({ filter: neu, filterBeruehrt: false }, 'filter');
    ui.neuZeichnen();
    ui.toast('Filter zurückgesetzt.');
  });

  A_('filter-aus-profil', () => {
    const s = S.get();
    const neu = A.filterAusProfil(s.profil, s.filter);
    sichtbar = SEITE;
    S.set({ filter: neu, filterBeruehrt: true }, 'filter');
    ui.neuZeichnen();
    const treffer = A.filtern(NW.data.listings.concat(s.eigeneInserate), neu, s.profil).length;
    ui.toast('Filter aus deinem Profil übernommen – ' + treffer + ' ' + U.plural(treffer, 'Treffer', 'Treffer') + '.', 'gut');
  });

  A_('filter-abschicken', () => aktualisieren());

  A_('sortieren', (el) => { filterAendern({ sort: el.value }); ui.neuZeichnen(); });

  A_('ansicht', (el) => { S.set({ ansicht: el.dataset.wert }, 'ansicht'); ui.neuZeichnen(); });

  A_('filter-auf', () => {
    ui.dialog({
      titel: 'Filter',
      breit: true,
      inhalt: filterPanel(),
      fuss: h`<button type="button" class="knopf knopf--voll" data-tu="dialog-zu"><span
        id="treffer-anzahl">${U.num(letzteTreffer.length)}</span>&nbsp;Treffer zeigen</button>`,
      beimSchliessen: () => ui.neuZeichnen()
    });
  });

  A_('umkreis-modus', () => { umkreisModus = !umkreisModus; ui.neuZeichnen(); });
  A_('umkreis-weg', () => { filterAendern({ umkreis: null }); ui.neuZeichnen(); });
  A_('umkreis-radius', U.debounce((el) => {
    const f = S.get().filter;
    if (!f.umkreis) return;
    f.umkreis.km = Number(el.value);
    S.set({ filter: f }, 'filter');
    aktualisieren();
    const anzeige = el.closest('label').querySelector('span');
    if (anzeige) anzeige.textContent = U.dec(f.umkreis.km) + ' km um den gesetzten Punkt';
  }, 120));

  /* Eine Aktion für alle Lockerungen – sie rechnet dieselbe Änderung
     noch einmal, damit Knopf und Beschriftung nicht auseinanderfallen. */
  LOCKERUNGEN.forEach((eintrag) => {
    A_(eintrag.tu, () => {
      const f = S.get().filter;
      const treffer = pruefeLockerung(eintrag, f, zaehle(f));
      if (!treffer) { ui.toast('Das allein bringt keine weiteren Treffer.'); return; }
      eintrag.aendern(f, treffer.wert, JSON.parse(JSON.stringify(f)));
      sichtbar = SEITE;
      S.set({ filter: f, filterBeruehrt: true }, 'filter');
      ui.neuZeichnen();
      ui.toast(treffer.danach + ' ' + U.plural(treffer.danach, 'Treffer', 'Treffer') + ' nach der Änderung.', 'gut');
    });
  });

  A_('agent-aus-filter', () => {
    if (S.get().agenten.length >= P.grenze('suchauftraege')) {
      ui.AKTIONEN.sperre({ dataset: { leistung: 'suchauftraege' } });
      return;
    }
    const f = S.get().filter;
    const teile = [];
    if (f.staedte.length) teile.push(f.staedte.join('/'));
    if (f.viertel.length) teile.push(f.viertel.map((v) => v.split('|')[1]).join(', '));
    teile.push(f.arten.map((a) => ui.ART_LABEL[a]).join(' + '));
    if (f.preisMax) teile.push('bis ' + U.eur(f.preisMax));
    const vorschlag = teile.join(' · ') || 'Mein Suchauftrag';
    ui.dialog({
      titel: 'Suchauftrag anlegen',
      inhalt: h`<p>Nestwerk merkt sich diese Filter und zeigt dir beim nächsten Besuch, was seither neu hinzugekommen ist.</p>
        <label class="feld"><span>Name</span><input type="text" id="agent-name" value="${vorschlag}" maxlength="80"></label>
        <p class="hinweis">${A.filtern(NW.data.listings, f, S.get().profil).length} Objekte passen aktuell.</p>`,
      fuss: h`<button type="button" class="knopf knopf--still" data-tu="dialog-zu">Abbrechen</button>
        <button type="button" class="knopf" data-tu="agent-speichern">${ico('glocke')}Anlegen</button>`
    });
  });

  A_('agent-speichern', () => {
    const name = (U.$('#agent-name') || {}).value || 'Suchauftrag';
    if (!S.agentAnlegen(name, S.get().filter)) {
      ui.dialogZu();
      ui.AKTIONEN.sperre({ dataset: { leistung: 'suchauftraege' } });
      return;
    }
    ui.dialogZu();
    ui.toast('Suchauftrag angelegt. Beim nächsten Besuch steht hier, was neu ist.', 'gut');
    ui.aktualisiereZaehler();
  });

  ui.ansichten.suche = ansicht;
  NW.viewSuche = { aktualisieren };
})(window.NW = window.NW || {});

/* ===== view-objekt.js ===== */
/* =====================================================================
   Nestwerk – Ansicht: ein Objekt
   Alles zu einem Inserat auf einer Seite: Kosten bis zum letzten Euro,
   Vergleichsmiete, Vertragslupe, Prüfhinweis, Lage, Anbieter, Termine.
   ===================================================================== */
(function (NW) {
  'use strict';

  const U = NW.util, ui = NW.ui, A = NW.analyse, S = NW.store, M = NW.match, P = NW.plan, W = NW.werkzeuge;
  const h = U.html, raw = U.raw, ico = U.svg;

  let bildIndex = 0;

  /* ------------------------- Galerie ------------------------- */

  function galerie(l) {
    const anzahl = NW.img.count(l);
    return h`<div class="galerie">
      <div class="galerie__gross" id="galerie-gross">
        ${raw(NW.img.make(l, bildIndex))}
        <span class="galerie__bu">${NW.img.caption(l, bildIndex)} · ${bildIndex + 1} von ${anzahl}</span>
        <button type="button" class="galerie__pfeil galerie__pfeil--links" data-tu="bild" data-schritt="-1" aria-label="Vorheriges Bild">${ico('zurueck')}</button>
        <button type="button" class="galerie__pfeil galerie__pfeil--rechts" data-tu="bild" data-schritt="1" aria-label="Nächstes Bild">${ico('chevron')}</button>
      </div>
      <div class="galerie__streifen" role="tablist" aria-label="Bildauswahl">
        ${Array.from({ length: anzahl }, (_, i) => h`<button type="button" role="tab" class="galerie__mini ${i === bildIndex ? 'is-an' : ''}"
          aria-selected="${i === bildIndex ? 'true' : 'false'}" data-tu="bild-zu" data-i="${i}"
          aria-label="${NW.img.caption(l, i)}">${raw(NW.img.make(l, i))}</button>`)}
      </div>
      ${NW.img.istGezeichnet(l)
      ? h`<p class="galerie__hinweis">${ico('info')}Die Ansichten sind schematische Zeichnungen aus den Objektdaten, keine Fotos.</p>`
      : h`<p class="galerie__hinweis">${ico('info')}Fotos aus dem Inserat. Sie liegen im Speicher dieses Geräts und wurden vor dem Ablegen verkleinert.</p>`}
    </div>`;
  }

  /* ------------------------- Kostenblock ------------------------- */

  function kostenBlock(l, k) {
    const ampel = { gut: 'Das passt zur Faustregel: höchstens 30 % des Nettoeinkommens fürs Wohnen.',
      mittel: 'Über der 30-Prozent-Faustregel. Machbar, aber ohne großen Puffer.',
      schlecht: 'Deutlich über der Faustregel. Rechne genau, ob der Rest zum Leben reicht.',
      unbekannt: 'Trag dein Nettoeinkommen im Profil ein, dann zeigt Nestwerk die Belastungsquote.' };
    return h`<section class="block" id="kosten">
      <h2>${ico('rechner')}Was es wirklich kostet</h2>
      <p class="block__unter">Nicht nur die Warmmiete – auch Strom, Internet, Rundfunkbeitrag und der Einzug selbst.</p>
      <div class="kosten">
        <div class="kosten__spalte">
          <h3>Jeden Monat</h3>
          <ul class="kosten__liste">
            ${k.monatlich.map((m) => h`<li><span>${m.label}${m.hinweis ? h`<i>${m.hinweis}</i>` : ''}</span><b>${U.eur(m.betrag)}</b></li>`)}
          </ul>
          <p class="kosten__summe"><span>Summe</span><b>${U.eur(k.monatSumme)}</b></p>
        </div>
        <div class="kosten__spalte">
          <h3>Einmalig beim Einzug</h3>
          <ul class="kosten__liste">
            ${k.einmalig.map((m) => h`<li><span>${m.label}${m.rueck ? raw('<i>wird bei Auszug zurückgezahlt</i>') : ''}</span><b>${U.eur(m.betrag)}</b></li>`)}
          </ul>
          <p class="kosten__summe"><span>Summe</span><b>${U.eur(k.einmalSumme)}</b></p>
          ${k.rueckzahlbar ? h`<p class="kosten__fein">davon ${U.eur(k.rueckzahlbar)} rückzahlbar</p>` : ''}
        </div>
      </div>
      <div class="ampel ampel--${ui.ampelFarbe(k.ampel === 'gut' ? 'gut' : k.ampel === 'mittel' ? 'mittel' : k.ampel === 'schlecht' ? 'schlecht' : 'neutral')}">
        <div class="ampel__zahl">${k.quote ? k.quote + ' %' : '–'}</div>
        <div>
          <b>Mietbelastungsquote</b>
          <p>${ampel[k.ampel]}</p>
        </div>
      </div>
      <p class="kosten__jahr">Erstes Jahr insgesamt: <b>${U.eur(k.erstesJahr)}</b>
        <button type="button" class="link" data-tu="kosten-anpassen">Haushaltsgröße und Einkommen anpassen</button></p>
    </section>`;
  }

  /* ------------------------- Vergleichsmiete ------------------------- */

  function spiegelBlock(l, mc, kc, bc) {
    if (bc) {
      const g = l.grund || {};
      return h`<section class="block" id="spiegel">
        <h2>${ico('waage')}Preis im Vergleich</h2>
        <div class="kennzahlen">
          <div><b>${U.num(bc.proQm)} €</b><span>je m² Grundstück</span></div>
          <div><b>${U.num(bc.referenz)} €</b><span>abgeleiteter Bodenwert ${l.viertel}</span></div>
          <div><b class="ton ton--${ui.ampelFarbe(bc.ton)}">${bc.diff >= 0 ? '+' : ''}${bc.diff} %</b><span>${bc.urteil}</span></div>
          <div><b>${U.num(bc.bebaubar)} m²</b><span>überbaubar bei GRZ ${U.dec(g.grz || 0)}</span></div>
          <div><b>${U.num(bc.geschossflaeche)} m²</b><span>Geschossfläche bei GFZ ${U.dec(g.gfz || 0)}</span></div>
        </div>
        ${bc.abschlag ? h`<p class="warn-meldung">${ico('warnung')}
          <span><b>${bc.abschlag} % Abschlag üblich.</b> „${g.baulandArt}“ ist nicht dasselbe wie
          voll erschlossenes Bauland: Bis zur Bebaubarkeit fehlen hier noch Schritte, deren Dauer und Kosten
          niemand zusagen kann.</span></p>` : ''}
        ${/kein Bebauungsplan|Außenbereich/.test(g.bplan || '') ? h`<div class="hinweisbox">${ico('warnung')}
          <div><b>Ohne Bebauungsplan entscheidet die Umgebung</b>
          <p>Innerhalb eines im Zusammenhang bebauten Ortsteils richtet sich die Zulässigkeit nach § 34 BauGB –
            das Vorhaben muss sich in die Eigenart der näheren Umgebung einfügen. Im Außenbereich nach § 35 BauGB
            ist Wohnbebauung nur ausnahmsweise zulässig. Vor dem Kauf gehört eine <b>Bauvoranfrage</b> gestellt;
            sie kostet wenig und beantwortet verbindlich, was gebaut werden darf.</p></div>
        </div>` : ''}
        <p class="fein">Der Bodenwert ist hier aus dem örtlichen Kaufpreisniveau abgeleitet, kein amtlicher
          Bodenrichtwert. Den führt der Gutachterausschuss der Gemeinde; die Auskunft ist meist kostenlos und
          in den meisten Bundesländern online abrufbar.</p>
      </section>`;
    }
    if (mc) {
      const pos = U.clamp(50 + mc.diff * 1.4, 3, 97);
      return h`<section class="block" id="spiegel">
        <h2>${ico('waage')}Preis im Vergleich</h2>
        <div class="spiegel">
          <div class="spiegel__balken">
            <span class="spiegel__zone spiegel__zone--gut"></span>
            <span class="spiegel__zone spiegel__zone--ok"></span>
            <span class="spiegel__zone spiegel__zone--teuer"></span>
            <span class="spiegel__marke" style="left:${U.dec(pos)}%">
              <b>${U.dec(mc.proQm)} €/m²</b>
            </span>
          </div>
          <div class="spiegel__skala"><span>günstig</span><span>ortsüblich</span><span>teuer</span></div>
        </div>
        <p class="spiegel__satz">
          <b class="ton ton--${ui.ampelFarbe(mc.ton)}">${mc.urteil}</b> –
          ${U.dec(mc.proQm)} €/m² gegenüber ${U.dec(mc.referenz)} €/m² Vergleichswert für ${l.viertel},
          Baujahr ${l.baujahr}${l.saniert ? ' (saniert)' : ''}, ${l.flaeche} m².
          Das sind ${mc.diff >= 0 ? '+' : ''}${mc.diff} %.
        </p>
        ${mc.mietpreisbremse ? h`<div class="hinweisbox">
          ${ico('info')}
          <div><b>Mietpreisbremse prüfen</b>
          <p>In Gebieten mit angespanntem Wohnungsmarkt darf die Miete bei Neuvermietung höchstens 10 % über der
          ortsüblichen Vergleichsmiete liegen. Danach wären hier rund <b>${U.eur(mc.zulaessig)}</b> Kaltmiete zulässig
          statt ${U.eur(l.kalt)}. Ausnahmen gelten unter anderem für Neubauten ab 2014 und umfassend modernisierte Wohnungen.
          Die Vermieterseite muss vor Vertragsschluss über eine Ausnahme informieren.</p></div>
        </div>` : ''}
        <p class="fein">Der Vergleichswert ist eine Rechengröße dieser Vorführung, kein amtlicher Mietspiegel.</p>
      </section>`;
    }
    if (kc) {
      return h`<section class="block" id="spiegel">
        <h2>${ico('waage')}Preis im Vergleich</h2>
        <div class="kennzahlen">
          <div><b>${U.num(kc.proQm)} €</b><span>je m² Kaufpreis</span></div>
          <div><b>${U.num(kc.referenz)} €</b><span>Vergleichswert ${l.viertel}</span></div>
          <div><b class="ton ton--${ui.ampelFarbe(kc.ton)}">${kc.diff >= 0 ? '+' : ''}${kc.diff} %</b><span>${kc.urteil}</span></div>
          <div><b>${U.dec(kc.faktor)}</b><span>Jahresmieten (Kaufpreisfaktor)</span></div>
          <div><b>${U.dec(kc.mietrendite)} %</b><span>Bruttomietrendite</span></div>
        </div>
        <p class="fein">Ein Faktor unter 25 gilt als günstig, über 35 als ambitioniert. Er sagt, wie viele Jahre
          Nettokaltmiete den Kaufpreis decken – ohne Nebenkosten und Instandhaltung.</p>
      </section>`;
    }
    return '';
  }

  /* ------------------------- Vertragslupe ------------------------- */

  function klauselBlock(l) {
    const funde = A.klauselCheck(l);
    if (!funde.length) {
      return h`<section class="block" id="lupe">
        <h2>${ico('blatt')}Vertragslupe</h2>
        <p class="gut-meldung">${ico('pruefen')}Im Inseratstext stehen keine der typischen Klauseln, die später Ärger machen.</p>
      </section>`;
    }
    const zahl = { kritisch: 'schlecht', achtung: 'warn', info: 'info' };
    const grenze = P.grenze('lupeFunde');
    const gezeigt = funde.slice(0, grenze === Infinity ? funde.length : grenze);
    const versteckt = funde.length - gezeigt.length;
    return h`<section class="block" id="lupe">
      <h2>${ico('blatt')}Vertragslupe</h2>
      <p class="block__unter">Nestwerk liest den Inseratstext auf Formulierungen, die im Mietvertrag Geld oder Rechte kosten können.
        ${funde.length} ${U.plural(funde.length, 'Fund', 'Funde')} in diesem Inserat.</p>
      <ul class="lupe">
        ${gezeigt.map((f) => h`<li class="lupe__fund lupe__fund--${zahl[f.bewertung]}">
          <details ${f.bewertung === 'kritisch' ? 'open' : ''}>
            <summary>
              ${ui.badge(f.bewertung === 'kritisch' ? 'kritisch' : f.bewertung === 'achtung' ? 'genau lesen' : 'zur Kenntnis', zahl[f.bewertung])}
              <b>${f.titel}</b>
            </summary>
            <blockquote>„${f.fundstelle}“</blockquote>
            <p>${f.erklaerung}</p>
            <p class="fein">${f.quelle}</p>
          </details>
        </li>`)}
        ${versteckt > 0 ? h`<li class="lupe__fund lupe__fund--gesperrt">
          <div class="lupe__verdeckt">
            ${funde.slice(gezeigt.length).map((f) => h`<span class="lupe__titel-verdeckt">
              ${ui.badge(f.bewertung === 'kritisch' ? 'kritisch' : f.bewertung === 'achtung' ? 'genau lesen' : 'zur Kenntnis',
        zahl[f.bewertung])}<b>${f.titel}</b></span>`)}
          </div>
          ${ui.sperrHinweis('lupe', versteckt + ' weitere ' + U.plural(versteckt, 'Klausel wurde', 'Klauseln wurden')
        + ' gefunden. Die Titel siehst du oben – die Erläuterung, warum das Geld kostet und was dagegen hilft, gehört zu Plus.')}
        </li>` : ''}
      </ul>
      <p class="fein">Allgemeine Hinweise zur Einordnung, keine Rechtsberatung. Im Zweifel hilft ein Mieterverein
        oder eine Anwältin für Mietrecht.</p>
    </section>`;
  }

  /* ------------------------- Prüfhinweis ------------------------- */

  function risikoBlock(l, risiko) {
    if (risiko.stufe === 'ok' && !risiko.gruende.length) return '';
    const art = risiko.stufe === 'warnung' ? 'schlecht' : risiko.stufe === 'achtung' ? 'warn' : 'info';
    return h`<section class="block block--${art}" id="pruefung">
      <h2>${ico('warnung')}Prüfhinweis</h2>
      <p class="block__unter">
        ${risiko.stufe === 'warnung'
        ? 'Dieses Inserat zeigt mehrere Merkmale, die typisch für erfundene Wohnungsangebote sind. Zahl nichts, bevor du die Wohnung gesehen und einen Vertrag unterschrieben hast.'
        : risiko.stufe === 'achtung'
          ? 'Einzelne Punkte solltest du vor dem Kontakt genau ansehen.'
          : 'Kleinere Auffälligkeiten, nichts Dramatisches.'}
      </p>
      <ul class="pruef">
        ${risiko.gruende.map((g) => h`<li>${ico('warnung')}<span>${g.grund}</span></li>`)}
      </ul>
      ${risiko.stufe === 'warnung' ? h`<div class="hinweisbox">
        ${ico('info')}
        <div><b>Drei Regeln, die zuverlässig schützen</b>
        <ul class="liste-schlicht">
          <li>Nie Geld überweisen, bevor du drin warst und unterschrieben hast – auch keine „Reservierung“.</li>
          <li>Keine Ausweiskopie und keine Schufa vor der Besichtigung verschicken.</li>
          <li>Wer nur schriftlich kommuniziert und Termine ablehnt, hat meist keine Wohnung.</li>
        </ul></div>
      </div>` : ''}
    </section>`;
  }

  /* ------------------------- Chancen ------------------------- */

  function chancenBlock(l) {
    if (l.kind === 'kauf') return '';
    const c = W.chancen(l, S.get().profil);
    const ton = { gut: 'gut', mittel: 'warn', schwach: 'schlecht', unbekannt: 'neutral' }[c.stufe];
    const andrangTon = { keiner: 'gut', gering: 'gut', 'spürbar': 'neutral', hoch: 'warn', 'sehr hoch': 'schlecht' }[c.andrang];
    return h`<section class="block" id="chancen">
      <h2>${ico('ziel')}Wie stehen deine Chancen?</h2>
      <p class="block__unter">Zwei Dinge entscheiden, und nur eines davon hast du in der Hand.
        Deshalb stehen sie hier getrennt.</p>
      <div class="chancenkopf">
        <div class="ampel ampel--${ui.ampelFarbe(ton)}">
          <div class="ampel__zahl">${ico(c.staerke === 'schwach' ? 'warnung' : c.staerke === 'unbekannt' ? 'info' : 'pruefen')}</div>
          <div>
            <b>${c.staerke === 'unbekannt' ? 'Deine Bewerbung: noch nicht einschätzbar' : 'Deine Bewerbung: ' + c.staerke}</b>
            <p>${c.staerke === 'unbekannt'
        ? 'Dafür fehlen Nestwerk noch Angaben aus deinem Profil.'
        : 'Das kannst du ändern – die Punkte unten sagen wie.'}</p>
          </div>
        </div>
        <div class="ampel ampel--${ui.ampelFarbe(andrangTon)}">
          <div class="ampel__zahl">${c.mitbewerber}</div>
          <div>
            <b>Andrang: ${c.andrang}</b>
            <p>Darauf hast du keinen Einfluss${c.mitbewerber > 1 ? ' – rechnerisch ' + c.prozent + ' von 100' : ''}.</p>
          </div>
        </div>
      </div>
      <p class="chancen__satz">${c.satz}</p>
      <ul class="chancen">
        ${c.faktoren.map((f) => h`<li class="chancen__${f.wirkung}">
          ${ico(f.wirkung === 'plus' ? 'pruefen' : f.wirkung === 'minus' ? 'warnung' : 'info')}
          <span><b>${f.label}</b> ${f.text}</span>
        </li>`)}
      </ul>
      ${c.tipps.length ? h`<h3>Was du jetzt tun kannst</h3>
        <ul class="pruef">
          ${c.tipps.map((t) => h`<li>${ico('blitz')}<span>${t}</span></li>`)}
        </ul>` : ''}
      <p class="fein">Die Schätzung geht von der Zahl der Interessenten aus und gewichtet dein Profil dagegen.
        Sie kennt nicht, wen die Vermieterseite tatsächlich sympathisch findet – das entscheidet oft mehr als jede Zahl.
        Und sie ist kein Grund, es nicht zu versuchen: Auch eine Wohnung mit hundert Interessenten wird an genau
        eine Person vergeben.</p>
    </section>`;
  }

  /* ------------------------- Doppelte Inserate ------------------------- */

  function duplikatBlock(l) {
    const treffer = W.duplikate(l);
    if (!treffer.length) return '';
    return h`<section class="block block--warn" id="duplikate">
      <h2>${ico('kopieren')}Diese Wohnung steht möglicherweise mehrfach im Angebot</h2>
      <p class="block__unter">Gleiche Fläche, gleicher Zuschnitt, fast gleicher Preis im selben Viertel.
        Bevor du dich zweimal auf dieselbe Wohnung bewirbst, vergleich die Angaben.</p>
      <ul class="duplikate">
        ${treffer.map((d) => h`<li>
          <a class="duplikate__bild" href="#/objekt/${d.listing.id}" aria-hidden="true" tabindex="-1">
            ${raw(NW.img.make(d.listing, 0))}</a>
          <div>
            <b><a href="#/objekt/${d.listing.id}">${d.listing.titel}</a></b>
            <span>${d.listing.anbieter.name} · ${U.eur(d.listing.kind === 'kauf' ? d.listing.kaufpreis : d.listing.warm)}
              ${d.listing.kind === 'kauf' ? '' : 'warm'} · ${d.merkmale.join(', ')}</span>
            <i>${d.deutung}</i>
          </div>
          <span class="duplikate__wert">${d.sicherheit} %</span>
        </li>`)}
      </ul>
      <p class="fein">Zwei Anfragen zum selben Objekt wirken bei der Vermieterseite unentschlossen. Such dir den
        Weg aus, der dir mehr Auskunft gibt – meist der direkte Eigentümer.</p>
    </section>`;
  }

  /* ------------------------- Passung ------------------------- */

  function passungBlock(l, b) {
    return h`<section class="block" id="passung">
      <h2>${ico('ziel')}Passung zu deinem Profil</h2>
      <div class="passung">
        <div class="passung__ring">${ui.passungsRing(b.score, 108)}</div>
        <div class="passung__balken">
          ${b.teile.map((t) => h`<div class="passung__zeile">
            <span class="passung__label">${t.label}</span>
            <span class="passung__spur"><i style="width:${Math.round(t.anteil * 100)}%"></i></span>
            <span class="passung__wert">${t.text}</span>
          </div>`)}
        </div>
      </div>
      ${b.fehlendePflicht.length ? h`<p class="warn-meldung">${ico('warnung')}Pflichtwunsch nicht erfüllt:
        ${b.fehlendePflicht.join(', ')}. Das zieht die Bewertung deutlich nach unten.</p>` : ''}
      <p class="fein">Die Reihenfolge deiner Suche entsteht ausschließlich aus diesen Werten.
        <a href="#/profil">Gewichtung ändern</a> – niemand kann sich hier nach oben kaufen.</p>
    </section>`;
  }

  /* ------------------------- WG ------------------------- */

  function wgBlock(l, b) {
    if (l.kind !== 'wg' || !l.wg) return '';
    const w = l.wg, m = b.wg;
    return h`<section class="block" id="wg">
      <h2>${ico('wg')}Die WG</h2>
      <div class="wg__kopf">
        <div class="wg__leute">
          ${w.bewohner.map((p) => h`<div class="wg__person">
            ${raw(NW.img.avatar(p.name, 44))}
            <div><b>${p.name}</b><span>${p.alter} Jahre · ${p.beruf}</span></div>
          </div>`)}
          <div class="wg__person wg__person--frei">
            <span class="wg__frei" aria-hidden="true">?</span>
            <div><b>Freies Zimmer</b><span>${l.flaeche} m² · ${U.eur(l.warm)} warm</span></div>
          </div>
        </div>
        ${m ? h`<div class="wg__score">${ui.passungsRing(m.score, 92)}<b>${m.kurz}</b></div>` : ''}
      </div>

      <dl class="fakten fakten--dicht">
        <div><dt>WG-Art</dt><dd>${w.art.join(', ')}</dd></div>
        <div><dt>Gesucht</dt><dd>${w.sucht.geschlecht === 'egal' ? 'alle Geschlechter' :
        w.sucht.geschlecht === 'w' ? 'eine Mitbewohnerin' : w.sucht.geschlecht === 'm' ? 'ein Mitbewohner' : 'nichtbinär'},
        ${w.sucht.alterVon}–${w.sucht.alterBis} Jahre</dd></div>
        <div><dt>Rauchen</dt><dd>${w.rauchen}</dd></div>
        <div><dt>Haustiere</dt><dd>${w.haustiere}</dd></div>
        <div><dt>Sprachen</dt><dd>${w.sprachen.join(', ')}</dd></div>
        <div><dt>Bad</dt><dd>${w.badGeteilt}</dd></div>
      </dl>

      ${m ? h`<h3>Wie ihr zusammenpasst</h3>
      <div class="lifestyle">
        ${m.details.map((d) => h`<div class="lifestyle__zeile">
          <span class="lifestyle__label">${d.label}</span>
          <span class="lifestyle__spur">
            <i class="lifestyle__wg" style="left:${d.wg * 10}%" title="WG: ${d.wg} von 10"></i>
            <i class="lifestyle__du" style="left:${d.du * 10}%" title="Du: ${d.du} von 10"></i>
            <em class="lifestyle__brueck" style="left:${Math.min(d.du, d.wg) * 10}%;width:${d.abweichung * 10}%"></em>
          </span>
          <span class="lifestyle__enden"><i>${d.links}</i><i>${d.rechts}</i></span>
        </div>`)}
        <p class="lifestyle__legende">
          <span class="lifestyle__punkt lifestyle__punkt--du"></span>du
          <span class="lifestyle__punkt lifestyle__punkt--wg"></span>diese WG
        </p>
      </div>
      ${m.ausschluss.length ? h`<p class="warn-meldung">${ico('warnung')}${m.ausschluss.join(' ')}</p>` : ''}
      ${m.hinweise.length ? h`<p class="info-meldung">${ico('info')}${m.hinweise.join(' ')}</p>` : ''}
      <p class="fein">Größte Übereinstimmung: ${m.staerke.label}. Größter Unterschied: ${m.schwaeche.label}.
        <a href="#/profil">Eigene Angaben ändern</a></p>` :
      h`<p class="info-meldung">${ico('info')}Fülle im <a href="#/profil">Profil</a> deine WG-Angaben aus,
        dann rechnet Nestwerk die Passung aus.</p>`}
    </section>`;
  }

  /* ------------------------- Tausch ------------------------- */

  function tauschBlock(l) {
    if (l.kind !== 'tausch' || !l.tausch) return '';
    const s = S.get();
    const alle = NW.data.listings.filter((x) => x.kind === 'tausch').concat(s.meinTausch ? [s.meinTausch] : []);
    const ringe = M.ringeFuer(alle, l.id).slice(0, 3);
    return h`<section class="block" id="tausch">
      <h2>${ico('tausch')}Tauschwunsch</h2>
      <p class="block__unter">${l.tausch.grund}</p>
      <dl class="fakten fakten--dicht">
        <div><dt>Wunschorte</dt><dd>${l.tausch.suche.staedte.join(', ')}</dd></div>
        <div><dt>Mindestens</dt><dd>${U.dec(l.tausch.suche.zimmerMin)} Zimmer, ${l.tausch.suche.flaecheMin} m²</dd></div>
        <div><dt>Warmmiete bis</dt><dd>${U.eur(l.tausch.suche.warmMax)}</dd></div>
        <div><dt>Wunschausstattung</dt><dd>${l.tausch.suche.wunschAusstattung.length ? l.tausch.suche.wunschAusstattung.join(', ') : 'keine Vorgabe'}</dd></div>
        <div><dt>Ringtausch</dt><dd>${l.tausch.dreiecktauschOk ? 'einverstanden' : 'nur direkter Tausch'}</dd></div>
        <div><dt>Vermieterzustimmung</dt><dd>${l.tausch.vermieterZustimmung}</dd></div>
      </dl>
      ${ringe.length ? h`<h3>${ringe.length} passende ${U.plural(ringe.length, 'Kette', 'Ketten')} im Bestand</h3>
        <ul class="ringliste">
          ${ringe.map((r) => h`<li>
            <b>${r.laenge === 2 ? 'Direkter Tausch' : r.laenge + 'er-Ring'}</b>
            <span>${r.knoten.map((k) => k.stadt + '/' + k.viertel).join(' → ')} → ${r.knoten[0].stadt}</span>
            <em>${Math.round(r.wert * 100)} % Güte</em>
          </li>`)}
        </ul>
        <p><a class="knopf knopf--still" href="#/tausch">${ico('ring')}Alle Ketten im Ringtausch ansehen</a></p>`
      : h`<p class="info-meldung">${ico('info')}Für dieses Angebot gibt es aktuell keine geschlossene Kette.
        Lege im <a href="#/tausch">Ringtausch</a> dein eigenes Angebot an – vielleicht schließt du den Ring.</p>`}
      <div class="hinweisbox">${ico('info')}
        <div><b>Wohnungstausch geht nur mit der Vermieterseite</b>
        <p>Ein Tausch ist rechtlich kein Übergang des Mietvertrags, sondern zweimal Kündigung und zweimal Neuabschluss.
        Beide Vermieter müssen mitspielen. Viele Genossenschaften und kommunale Gesellschaften unterstützen das
        ausdrücklich, private Eigentümer selten. Frag früh nach – nicht erst, wenn die Kette steht.</p></div>
      </div>
    </section>`;
  }

  /* ------------------------- Lage ------------------------- */

  function lageBlock(l, b) {
    const d = NW.geo.districtByKey[l.viertelKey];
    const werte = d ? [['ÖPNV', d.oepnv], ['Grün', d.gruen], ['Ruhe', d.ruhe], ['Einkauf', d.einkauf], ['Ausgehen', d.ausgehen]] : [];
    const profil = S.get().profil;
    const wege = (profil.anker || []).map((a) => ({
      name: a.name,
      zeiten: Object.keys(U.TRAVEL).map((mo) => ({ mo, label: U.TRAVEL[mo].label, min: U.travelMin(l, a, mo) }))
    }));
    return h`<section class="block" id="lage">
      <h2>${ico('karte')}Lage</h2>
      <p class="block__unter">${l.viertel}, ${l.stadt}${d ? ' – ' + d.charakter : ''}. ${l.strasse}.</p>
      <div class="lage">
        <div class="lage__karte" id="objekt-karte"></div>
        <div class="lage__werte">
          ${werte.map((w) => h`<div class="balkenzeile">
            <span>${w[0]}</span>
            <span class="balken"><i style="width:${w[1] * 20}%"></i></span>
            <b>${w[1]}/5</b>
          </div>`)}
        </div>
      </div>
      ${wege.length ? h`<h3>Wege</h3>
        <table class="tabelle">
          <thead><tr><th>Ziel</th>${Object.keys(U.TRAVEL).map((mo) => h`<th>${U.TRAVEL[mo].label}</th>`)}</tr></thead>
          <tbody>
            ${wege.map((w) => h`<tr><th scope="row">${w.name}</th>
              ${w.zeiten.map((z) => h`<td>${U.minutesLabel(z.min)}</td>`)}</tr>`)}
          </tbody>
        </table>
        <p class="fein">Geschätzt aus Entfernung, Umwegfaktor und Zu-/Abgang – kein Fahrplan.</p>`
      : h`<p class="info-meldung">${ico('info')}Trag im <a href="#/profil">Profil</a> deine Arbeits- oder Studienadresse ein,
        dann zeigt Nestwerk hier die Fahrzeiten.</p>`}
    </section>`;
  }

  /* ------------------------- Anbieter ------------------------- */

  function anbieterBlock(l) {
    const a = l.anbieter;
    const tage = U.daysSince(a.seit);
    const artLabel = { privat: 'Privatperson', makler: 'Maklerbüro', verwaltung: 'Hausverwaltung', genossenschaft: 'Genossenschaft' };
    return h`<section class="block" id="anbieter">
      <h2>${ico('person')}Anbieter</h2>
      <div class="anbieter">
        ${raw(NW.img.avatar(a.name, 56))}
        <div class="anbieter__text">
          <b>${a.name} ${a.verifiziert ? raw('<span class="pruefzeichen" title="Identität bestätigt">' + U.svg('pruefen').__raw + '</span>') : ''}</b>
          <span>${artLabel[a.art]} · aktiv seit ${tage > 365 ? Math.round(tage / 365) + ' Jahren' : tage + ' Tagen'}
            · ${a.inserate} ${U.plural(a.inserate, 'Inserat', 'Inserate')}</span>
        </div>
        <div class="anbieter__zahlen">
          <div><b>${a.quote} %</b><span>antwortet</span></div>
          <div><b>${a.antwortStd < 24 ? a.antwortStd + ' Std.' : Math.round(a.antwortStd / 24) + ' Tage'}</b><span>im Schnitt</span></div>
        </div>
      </div>
      ${(() => {
      const n = a.stufe === undefined ? (a.verifiziert ? 3 : 1) : a.stufe;
      const st = NW.konto.stufe(n);
      return h`<p class="anbieter__stufe ${n <= 1 ? 'is-schwach' : ''}">
        ${ico(n <= 1 ? 'warnung' : 'schloss')}
        <span><b>Vertrauensstufe ${n} – ${st.name}.</b> ${st.text}</span>
      </p>
      ${n <= 1 ? h`<div class="hinweisbox">${ico('warnung')}
        <div><b>Über diese Seite ist wenig bekannt</b>
        <p>Ein Konto ohne Gerätebindung und ohne bestätigte Nummer ist in Minuten angelegt – und nach einer
          Sperre genauso schnell wieder. Das heißt nicht, dass hier etwas nicht stimmt; es heißt, dass die
          üblichen Regeln besonders gelten: vor der Besichtigung nichts zahlen, keine Schufa und keine
          Ausweiskopie in der ersten Anfrage, und auf einer Besichtigung in der Wohnung bestehen.</p></div>
      </div>` : ''}`;
    })()}
      <p class="fein">Antwortquote und Reaktionszeit stammen aus dem bisherigen Verhalten auf der Plattform.
        Unter 50 % lohnt sich eine zweite Option.</p>
    </section>`;
  }

  /* ------------------------- Termine ------------------------- */

  function termineBlock(l) {
    const eintrag = S.get().merkliste[l.id];
    const gebucht = eintrag && eintrag.termin;
    if (!l.besichtigungen || !l.besichtigungen.length) {
      return h`<section class="block" id="termine">
        <h2>${ico('kalender')}Besichtigung</h2>
        <p class="info-meldung">${ico('info')}Für dieses Objekt sind keine Termine hinterlegt.
          Frag beim Anschreiben direkt nach zwei konkreten Zeitfenstern – das spart eine Runde.</p>
      </section>`;
    }
    return h`<section class="block" id="termine">
      <h2>${ico('kalender')}Besichtigung buchen</h2>
      <p class="block__unter">Feste Zeitfenster statt Massenandrang. Ein Platz gehört dir, sobald du ihn nimmst.</p>
      ${gebucht ? h`<div class="gut-meldung">${ico('pruefen')}
        Du hast <b>${U.dateDE(gebucht.datum)} um ${gebucht.zeit}</b> gebucht (${gebucht.art}).
        <button type="button" class="link" data-tu="termin-ab" data-id="${l.id}">Termin absagen</button></div>` : ''}
      <ul class="termine">
        ${l.besichtigungen.map((t) => {
      const frei = t.plaetze - t.belegt;
      const dieser = gebucht && gebucht.id === t.id;
      return h`<li class="${dieser ? 'is-gebucht' : ''}">
            <div><b>${U.dateDE(t.datum)}</b><span>${t.zeit} Uhr · ${t.art}</span></div>
            <span class="termine__frei">${frei} ${U.plural(frei, 'Platz frei', 'Plätze frei')}</span>
            <button type="button" class="knopf knopf--klein ${dieser ? 'knopf--still' : ''}"
              data-tu="termin-buchen" data-id="${l.id}" data-termin="${t.id}" ${dieser ? 'disabled' : ''}>
              ${dieser ? 'gebucht' : 'nehmen'}</button>
          </li>`;
    })}
      </ul>
      <p><button type="button" class="link" data-tu="checkliste" data-id="${l.id}">${ico('blatt')}Besichtigungs-Checkliste öffnen</button></p>
    </section>`;
  }

  /* ------------------------- Finanzierung ------------------------- */

  function finanzBlock(l, k) {
    if (l.kind !== 'kauf') return '';
    const s = S.get();
    const ek = s.profil.eigenkapital || Math.round(l.kaufpreis * 0.2);
    const zins = s.profil.zins || 3.7;
    const tilgung = s.profil.tilgung || 2;
    const f = A.finanzierung(l.kaufpreis, k.einmalSumme, ek, zins, tilgung, 10);
    return h`<section class="block" id="finanz">
      <h2>${ico('euro')}Finanzierung überschlagen</h2>
      <div class="regler">
        <label class="feld feld--regler"><span>Eigenkapital <b>${U.eur(ek)}</b></span>
          <input type="range" min="0" max="${Math.round(l.kaufpreis * 0.6)}" step="5000" value="${ek}" data-tu-input="finanz" data-feld="eigenkapital"></label>
        <label class="feld feld--regler"><span>Sollzins <b>${U.dec(zins)} %</b></span>
          <input type="range" min="1" max="7" step="0.1" value="${zins}" data-tu-input="finanz" data-feld="zins"></label>
        <label class="feld feld--regler"><span>Anfangstilgung <b>${U.dec(tilgung)} %</b></span>
          <input type="range" min="1" max="5" step="0.5" value="${tilgung}" data-tu-input="finanz" data-feld="tilgung"></label>
      </div>
      <div class="kennzahlen">
        <div><b>${U.eur(f.gesamt)}</b><span>Gesamtkosten mit Nebenkosten</span></div>
        <div><b>${U.eur(f.darlehen)}</b><span>Darlehen</span></div>
        <div><b>${U.eur(f.rate)}</b><span>Rate im Monat</span></div>
        <div><b>${U.eur(f.restschuld)}</b><span>Restschuld nach 10 Jahren</span></div>
        <div><b>${U.dec(f.laufzeitJahre)} Jahre</b><span>bis zur Volltilgung</span></div>
        <div><b>${f.eigenkapitalQuote} %</b><span>Eigenkapitalquote</span></div>
      </div>
      <p class="fein">Annuitätendarlehen ohne Sondertilgung. Banken erwarten meist mindestens die Kaufnebenkosten
        als Eigenkapital, besser 20 % des Kaufpreises dazu.</p>
    </section>`;
  }

  /* ------------------------- Ähnliche ------------------------- */

  function aehnliche(l) {
    const profil = S.get().profil;
    const kandidaten = NW.data.listings
      .filter((x) => x.id !== l.id && x.kind === l.kind && x.stadt === l.stadt)
      .map((x) => {
        const preis = l.kind === 'kauf' ? Math.abs(x.kaufpreis - l.kaufpreis) / Math.max(1, l.kaufpreis)
          : Math.abs(x.warm - l.warm) / Math.max(1, l.warm);
        const flaeche = Math.abs(x.flaeche - l.flaeche) / Math.max(1, l.flaeche);
        const ort = U.distKm(x, l);
        return { x, d: preis * 2 + flaeche * 1.5 + ort * 0.12 };
      })
      .sort((a, b) => a.d - b.d).slice(0, 3);
    if (!kandidaten.length) return '';
    return h`<section class="block" id="aehnlich">
      <h2>${ico('liste')}Ähnliche Angebote</h2>
      <div class="ergebnisse__liste ergebnisse__liste--drei">
        ${kandidaten.map((k) => ui.inseratsKarte(k.x, A.bewerten(k.x, profil), { kompakt: true }))}
      </div>
    </section>`;
  }

  /* ------------------------- Seite ------------------------- */

  function ansicht(route) {
    const l = NW.data.byId[route.arg];
    if (!l) {
      return { titel: 'Nicht gefunden', html: h`<div class="leer">${ico('warnung')}<h2>Dieses Inserat gibt es nicht (mehr)</h2>
        <p><a class="knopf" href="#/suche">Zur Suche</a></p></div>` };
    }
    S.gesehenMerken(l.id);
    const s = S.get();
    const b = A.bewerten(l, s.profil);
    const k = A.kosten(l, s.profil);
    const gemerkt = S.gemerkt(l.id), imVergleich = S.imVergleich(l.id);
    const eintrag = s.merkliste[l.id];

    return {
      titel: l.titel,
      html: h`<div class="objekt">
        <nav class="brotkrumen" aria-label="Pfad">
          <a href="#/suche">Suche</a>${ico('chevron')}<a href="#/suche?stadt=${encodeURIComponent(l.stadt)}">${l.stadt}</a>
          ${ico('chevron')}<span>${l.viertel}</span>
        </nav>

        <div class="objekt__kopf">
          <div class="objekt__titel">
            <div class="karte-inserat__marken">${ui.kartenMarken(l, b)}</div>
            <h1>${l.titel}</h1>
            <p class="objekt__ort">${ico('karte')}${l.strasse}, ${l.viertel}, ${l.stadt}</p>
          </div>
          <div class="objekt__preis">
            <b>${l.kind === 'kauf' ? U.eur(l.kaufpreis) : U.eur(l.warm)}</b>
            <span>${l.kind === 'kauf' ? U.eur(Math.round(l.kaufpreis / l.flaeche)) + ' je m²' : 'warm · ' + U.eur(l.kalt) + ' kalt'}</span>
          </div>
        </div>

        ${galerie(l)}

        <div class="objekt__tun">
          <button type="button" class="knopf" data-tu="anschreiben" data-id="${l.id}">${ico('nachricht')}${anfrageWort(l)}</button>
          <button type="button" class="knopf knopf--still ${gemerkt ? 'is-an' : ''}" data-tu="merken" data-id="${l.id}"
            aria-pressed="${gemerkt ? 'true' : 'false'}">${ico('herz')}${gemerkt ? 'Gemerkt' : 'Merken'}</button>
          <button type="button" class="knopf knopf--still ${imVergleich ? 'is-an' : ''}" data-tu="vergleich" data-id="${l.id}"
            aria-pressed="${imVergleich ? 'true' : 'false'}">${ico('waage')}Vergleichen</button>
          <button type="button" class="knopf knopf--still" data-tu="objekt-teilen" data-id="${l.id}">${ico('teilen')}Teilen</button>
          ${eintrag ? h`<label class="feld feld--flach objekt__status">
            <span class="nur-sr">Status</span>
            <select data-tu-change="status-setzen" data-id="${l.id}">
              ${S.PIPELINE.map((p) => h`<option value="${p.id}" ${eintrag.status === p.id ? 'selected' : ''}>${p.label}</option>`)}
            </select></label>` : ''}
        </div>

        <div class="objekt__raster">
          <div class="objekt__haupt">
            <section class="block" id="eckdaten">
              <h2>${ico('haus')}Eckdaten</h2>
              <dl class="fakten">
                ${l.type === 'grundstueck' ? h`
                <div><dt>Grundstück</dt><dd>${U.num(l.grundstueck || l.flaeche)} m²</dd></div>
                <div><dt>Art</dt><dd>${(l.grund || {}).baulandArt || 'Bauland'}</dd></div>
                <div><dt>Bebauungsplan</dt><dd>${(l.grund || {}).bplan || 'unbekannt'}</dd></div>
                <div><dt>GRZ / GFZ</dt><dd>${U.dec((l.grund || {}).grz || 0)} / ${U.dec((l.grund || {}).gfz || 0)}</dd></div>
                <div><dt>Erschließung</dt><dd>${(l.grund || {}).erschliessung || 'unbekannt'}</dd></div>
                <div><dt>Verfügbar ab</dt><dd>${U.daysSince(l.freiAb) > 0 ? 'sofort' : U.dateDE(l.freiAb)}</dd></div>` : h`
                <div><dt>Zimmer</dt><dd>${U.dec(l.zimmer)}</dd></div>
                <div><dt>${l.kind === 'wg' ? 'Zimmergröße' : 'Wohnfläche'}</dt><dd>${l.flaeche} m²</dd></div>
                ${l.kind === 'wg' ? h`<div><dt>Wohnung gesamt</dt><dd>${l.wohnflaeche} m²</dd></div>` : ''}
                ${l.grundstueck ? h`<div><dt>Grundstück</dt><dd>${U.num(l.grundstueck)} m²</dd></div>` : ''}
                ${l.bauweise ? h`<div><dt>Bauweise</dt><dd>${l.bauweise}</dd></div>` : ''}
                ${l.type === 'haus' ? '' : h`<div><dt>Etage</dt><dd>${l.etage === 0 ? 'Erdgeschoss' : l.etage >= l.etagen ? 'Dachgeschoss' : l.etage + '. OG'} von ${l.etagen}</dd></div>`}
                <div><dt>Baujahr</dt><dd>${l.baujahr}${l.saniert ? ' · saniert' : ''}</dd></div>
                <div><dt>Frei ab</dt><dd>${U.daysSince(l.freiAb) > 0 ? 'sofort' : U.dateDE(l.freiAb)}</dd></div>
                ${l.befristetBis ? h`<div><dt>Befristet bis</dt><dd>${U.dateDE(l.befristetBis)}</dd></div>` : ''}
                <div><dt>Heizung</dt><dd>${l.energie.heizung}</dd></div>
                <div><dt>Energie</dt><dd>${ui.energieBalken(l.energie.klasse)} ${l.energie.kwh} kWh/(m²·a), ${l.energie.art}</dd></div>`}
                ${l.kind !== 'kauf' ? h`<div><dt>Kaution</dt><dd>${l.kaution ? l.kaution + ' ' + U.plural(l.kaution, 'Kaltmiete', 'Kaltmieten') + ' (' + U.eur(l.kalt * l.kaution) + ')' : 'keine'}</dd></div>` : ''}
                ${l.kind === 'kauf' && l.hausgeld ? h`<div><dt>Hausgeld</dt><dd>${U.eur(l.hausgeld)} im Monat</dd></div>` : ''}
                <div><dt>Provision</dt><dd>${l.provision ? U.dec(l.provision) + (l.kind === 'kauf' ? ' % des Kaufpreises' : ' Kaltmieten') : 'provisionsfrei'}</dd></div>
                <div><dt>Online seit</dt><dd>${U.since(l.stats.online)}</dd></div>
                <div><dt>Interessenten</dt><dd>${l.stats.bewerber} bei ${U.num(l.stats.aufrufe)} Aufrufen</dd></div>
              </dl>
            </section>

            <section class="block" id="ausstattung">
              <h2>${ico('check')}Ausstattung</h2>
              <ul class="merkmale">
                ${l.ausstattung.map((a) => h`<li>${ico('check')}${a}</li>`)}
              </ul>
            </section>

            <section class="block" id="beschreibung">
              <h2>${ico('blatt')}Beschreibung</h2>
              <p class="fliesstext">${l.beschreibung}</p>
            </section>

            ${risikoBlock(l, b.risiko)}
            ${duplikatBlock(l)}
            ${spiegelBlock(l, b.mietCheck, b.kaufCheck, b.bodenCheck)}
            ${klauselBlock(l)}
            ${chancenBlock(l)}
            ${kostenBlock(l, k)}
            ${finanzBlock(l, k)}
            ${wgBlock(l, b)}
            ${tauschBlock(l)}
            ${lageBlock(l, b)}
            ${termineBlock(l)}
            ${anbieterBlock(l)}
            ${aehnliche(l)}
          </div>

          <aside class="objekt__seite">
            <div class="haftbox">
              ${passungBlock(l, b)}
              <div class="haftbox__tun">
                <button type="button" class="knopf knopf--voll" data-tu="anschreiben" data-id="${l.id}">${ico('nachricht')}${anfrageWort(l)}</button>
                <a class="knopf knopf--still knopf--voll" href="#kosten">${ico('rechner')}${U.eur(k.monatSumme)} echte Monatskosten</a>
              </div>
              ${eintrag ? h`<label class="feld"><span>Deine Notiz</span>
                <textarea rows="3" data-tu-input="notiz" data-id="${l.id}" placeholder="Was ist dir aufgefallen?">${eintrag.notiz || ''}</textarea></label>` : ''}
              <p class="haftbox__expose">
                <button type="button" class="link" data-tu="expose" data-id="${l.id}">
                  ${ico('blatt')}Exposé als Datei${P.darf('exposeExport') ? '' : ' (Plus)'}</button>
              </p>
            </div>
            ${ui.anzeige('objekt-' + l.id, 'schmal')}
          </aside>
        </div>
      </div>`,
      danach() {
        const flaeche = U.$('#objekt-karte');
        if (flaeche) {
          const umgebung = NW.data.listings.filter((x) => x.stadt === l.stadt && U.distKm(x, l) < 3.2);
          const k2 = NW.karte.erzeugen(flaeche, { onSelect: (id) => ui.gehe('objekt/' + id) });
          k2.setzen(umgebung.length > 1 ? umgebung : [l], l.id, null);
        }
      }
    };
  }

  /* ------------------------- Aktionen ------------------------- */

  const A_ = ui.aktionRegistrieren;

  A_('bild', (el) => {
    const l = NW.data.byId[ui.params.arg];
    if (!l) return;
    const n = NW.img.count(l);
    bildIndex = (bildIndex + Number(el.dataset.schritt) + n) % n;
    ui.neuZeichnen();
  });

  A_('bild-zu', (el) => { bildIndex = Number(el.dataset.i); ui.neuZeichnen(); });

  A_('status-setzen', (el) => {
    S.setStatus(el.dataset.id, el.value);
    ui.toast('Status auf „' + (S.PIPELINE.find((p) => p.id === el.value) || {}).label + '“ gesetzt.');
    ui.aktualisiereZaehler();
  });

  A_('notiz', U.debounce((el) => { S.setNotiz(el.dataset.id, el.value); }, 500));

  A_('termin-buchen', (el) => {
    const t = S.terminBuchen(el.dataset.id, el.dataset.termin);
    if (t) ui.toast('Termin am ' + U.dateDE(t.datum) + ' um ' + t.zeit + ' gebucht.', 'gut');
    ui.neuZeichnen();
  });

  A_('termin-ab', (el) => { S.terminAbsagen(el.dataset.id); ui.toast('Termin abgesagt.'); ui.neuZeichnen(); });
