  border-radius: var(--r-klein); background: var(--akzent-hell); color: var(--akzent); }
.werkzeugkachel b { display: flex; align-items: center; gap: .4em; flex-wrap: wrap; margin-bottom: .25em; }
.werkzeugkachel p { font-size: .85rem; color: var(--text-leise); margin: 0 0 .4em; }
.werkzeugkachel i { font-style: normal; font-size: .76rem; color: var(--text-still); }

.werkzeug__weiter { display: flex; gap: 8px; flex-wrap: wrap; }

.staedteliste { display: grid; gap: 3px; margin: 10px 0; }
.staedteliste__zeile { display: grid; grid-template-columns: 7em minmax(0, 1fr) 4.5em auto; gap: 10px; align-items: center; font-size: .88rem; }
.staedteliste__zeile b { font-variant-numeric: tabular-nums; text-align: right; }
.staedteliste__zeile.is-eng { opacity: .5; }

.nkraster { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 2px 18px; margin-top: 10px; }
.nkzeile { display: grid; grid-template-columns: minmax(0, 1fr) 7.5em; gap: 10px; align-items: center;
  padding: .4em 0; border-bottom: 1px dotted var(--rand); cursor: text; }
.nkzeile__label { font-size: .87rem; }
.nkzeile__label i { display: block; font-style: normal; font-size: .76rem; color: var(--text-still); }
.nkzeile__eingabe { position: relative; }
.nkzeile__eingabe input { padding: .35em 1.6em .35em .5em; font-size: .86rem; text-align: right; }
.nkzeile__eingabe i { position: absolute; right: .5em; top: 50%; transform: translateY(-50%);
  font-style: normal; font-size: .8rem; color: var(--text-still); pointer-events: none; }
.nkzeile.is-nicht .nkzeile__label { color: var(--text-leise); }

.zaehler__zeile { display: grid; grid-template-columns: 12em minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: center; margin-bottom: 6px; }
.zaehler__zeile > span { font-size: .88rem; font-weight: 550; }

.raeume { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px; margin-top: 10px; }
.raum { padding: .8em; background: var(--flaeche2); border-radius: var(--r-klein); display: grid; gap: 8px; }
.raum__kopf { display: flex; gap: 6px; align-items: center; }
.raum__kopf .feld { flex: 1; }
.raum__kopf input { font-weight: 600; }

.protokoll {
  margin: 10px 0; padding: 1em; overflow-x: auto;
  background: var(--flaeche2); border: 1px solid var(--rand); border-radius: var(--r-klein);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .8rem; line-height: 1.5; white-space: pre; color: var(--text);
}

/* =====================================================================
   Diagramme
   Farben geprüft: alle Paare, hell und dunkel, CVD ΔE ≥ 9.
   ===================================================================== */

.viz, .vizbalken, .viz__legende {
  --serie-1: #2a78d6;
  --serie-2: #eb6834;
  --serie-3: #1baf7a;
  --viz-raster: color-mix(in srgb, var(--text) 14%, transparent);
  --viz-mittel: color-mix(in srgb, var(--text) 34%, transparent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .viz,
  :root:not([data-theme="light"]) .vizbalken,
  :root:not([data-theme="light"]) .viz__legende {
    --serie-1: #3987e5;
    --serie-2: #d95926;
    --serie-3: #199e70;
  }
}
:root[data-theme="dark"] .viz,
:root[data-theme="dark"] .vizbalken,
:root[data-theme="dark"] .viz__legende {
  --serie-1: #3987e5;
  --serie-2: #d95926;
  --serie-3: #199e70;
}

.viz { position: relative; margin: 10px 0; }
.viz__svg { width: 100%; height: auto; touch-action: none; }
.viz__raster { stroke: var(--viz-raster); stroke-width: 1; }
.viz__achse { fill: var(--text-still); font-size: 11px; font-family: var(--schrift); }
.viz__linie { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.viz__mittel { fill: none; stroke: var(--viz-mittel); stroke-width: 1.6; stroke-dasharray: 5 4; }
.viz__ende { stroke: var(--flaeche); stroke-width: 2; }
.viz__endname { fill: var(--text); font-size: 12px; font-weight: 600; font-family: var(--schrift); }
.viz__endwert { fill: var(--text-leise); font-size: 11px; font-family: var(--schrift); font-variant-numeric: tabular-nums; }
.viz__endmittel { fill: var(--text-still); font-size: 11px; font-family: var(--schrift); }
.viz__faden { stroke: var(--text-still); stroke-width: 1; stroke-dasharray: 3 3; }
.viz__flaeche { cursor: crosshair; }

.viz__tip {
  position: absolute; top: 6px; transform: translateX(-50%);
  padding: .5em .7em; background: var(--text); color: var(--papier);
  border-radius: var(--r-klein); font-size: .78rem; line-height: 1.5;
  pointer-events: none; white-space: nowrap; box-shadow: var(--schatten-hoch); z-index: 4;
}
.viz__tip b { display: block; margin-bottom: .2em; }
.viz__tip span { display: flex; align-items: center; gap: .4em; }
.viz__tip i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.viz__tip em { font-style: normal; font-weight: 650; font-variant-numeric: tabular-nums; margin-left: auto; padding-left: .8em; }
.viz__tip-mittel i { background: var(--viz-mittel); }

.viz__legende { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 6px 0 2px; font-size: .82rem; color: var(--text-leise); }
.viz__legende-eintrag { display: flex; align-items: center; gap: .4em; }
.viz__legende-eintrag i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.viz__legende-eintrag--mittel i { background: var(--viz-mittel); }

.vizbalken { display: grid; gap: 2px; margin-top: 10px; }
.vizbalken__zeile {
  display: grid; grid-template-columns: 9em minmax(0, 1fr) 4.2em 4.2em; gap: 10px; align-items: center;
  padding: .3em .4em; border: 0; border-radius: var(--r-klein);
  background: none; color: var(--text); font: inherit; font-size: .86rem; text-align: left; cursor: pointer;
}
.vizbalken__zeile:hover { background: var(--flaeche2); }
.vizbalken__zeile.is-gewaehlt { background: var(--akzent-hell); }
.vizbalken__zeile.is-gewaehlt .vizbalken__name { font-weight: 700; }
.vizbalken__spur { height: 12px; background: var(--flaeche3); border-radius: 3px; overflow: hidden; }
.vizbalken__spur i { display: block; height: 100%; background: var(--serie-1); border-radius: 0 3px 3px 0; }
.vizbalken__wert { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.vizbalken__trend { font-variant-numeric: tabular-nums; text-align: right; font-size: .8rem; }
.vizbalken__trend.is-hoch { color: var(--schlecht); }
.vizbalken__trend.is-runter { color: var(--gut); }

.marktleiste { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 14px;
  padding: .7em .9em; background: var(--flaeche); border: 1px solid var(--rand); border-radius: var(--r); }
.marktleiste select { min-width: 150px; }

/* =====================================================================
   Chancen, Duplikate, Nachfassen, Route
   ===================================================================== */

.chancen { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 6px; }
.chancen li { display: flex; gap: .55em; align-items: flex-start; font-size: .88rem;
  padding: .45em .7em; border-radius: var(--r-klein); background: var(--flaeche2); }
.chancen .ico { flex: none; width: 16px; height: 16px; margin-top: .16em; }
.chancen__plus { background: var(--gut-hell); }
.chancen__plus .ico { color: var(--gut); }
.chancen__minus { background: var(--schlecht-hell); }
.chancen__minus .ico { color: var(--schlecht); }
.chancen__neutral .ico { color: var(--text-still); }

.duplikate { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 8px; }
.duplikate li { display: flex; gap: .8em; align-items: center; padding: .6em; background: var(--flaeche2); border-radius: var(--r-klein); }
.duplikate__bild { width: 84px; aspect-ratio: 4/3; flex: none; border-radius: var(--r-klein); overflow: hidden; background: var(--flaeche3); }
.duplikate__bild svg { width: 100%; height: 100%; object-fit: cover; }
.duplikate li > div { flex: 1; min-width: 0; }
.duplikate b { display: block; font-size: .9rem; }
.duplikate b a { color: var(--text); text-decoration: none; }
.duplikate b a:hover { color: var(--akzent); }
.duplikate span { display: block; font-size: .8rem; color: var(--text-leise); }
.duplikate i { display: block; font-style: normal; font-size: .79rem; color: var(--text-still); margin-top: .2em; }
.duplikate__wert { flex: none; font-weight: 700; color: var(--warn); font-variant-numeric: tabular-nums; }

.nachfass { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.nachfass li { display: flex; gap: .7em; align-items: center; flex-wrap: wrap;
  padding: .6em .8em; background: var(--flaeche); border-radius: var(--r-klein); }
.nachfass > li > .ico { color: var(--akzent); flex: none; }
.nachfass li > div { flex: 1; min-width: 170px; }
.nachfass b { display: block; font-size: .9rem; }
.nachfass b a { color: var(--text); text-decoration: none; }
.nachfass span { font-size: .8rem; color: var(--text-leise); }

.tagesplan { margin-top: 12px; }
.tagesplan h3 { margin: 0 0 .4em; font-size: .95rem; }
.tagesplan h3 i { font-style: normal; font-weight: 400; font-size: .82rem; color: var(--text-leise); }
.tagesplan__liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.tagesplan__liste li { display: flex; gap: .8em; align-items: center; padding: .5em .7em;
  background: var(--flaeche2); border-radius: var(--r-klein); flex-wrap: wrap; }
.tagesplan__zeit { font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
.tagesplan__liste li > div { flex: 1; min-width: 160px; }
.tagesplan__liste b { display: block; font-size: .89rem; }
.tagesplan__liste b a { color: var(--text); text-decoration: none; }
.tagesplan__liste span { font-size: .8rem; color: var(--text-leise); }
.tagesplan__fahrt { display: flex; align-items: center; gap: .3em; font-style: normal; font-size: .8rem; color: var(--akzent); }
.tagesplan__fahrt .ico { width: 14px; height: 14px; }

.serienliste { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 2px;
  max-height: 40vh; overflow-y: auto; }
.serienliste i { display: block; font-style: normal; font-size: .78rem; color: var(--text-still); }

.ringsperre { margin-top: 16px; padding: 1em; border: 1px dashed var(--rand-stark); border-radius: var(--r); background: var(--flaeche2); }
.ringsperre h3 { display: flex; align-items: center; gap: .4em; margin-bottom: .3em; }
.ringsperre p { font-size: .88rem; color: var(--text-leise); }
.ringsperre__liste { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 4px; }
.ringsperre__liste li { display: flex; gap: 12px; align-items: center; padding: .4em .7em;
  background: var(--flaeche); border-radius: var(--r-klein); font-size: .86rem; }
.ringsperre__liste span { flex: 1; color: var(--text-still); letter-spacing: .3em; }
.ringsperre__liste em { font-style: normal; font-weight: 650; color: var(--akzent); }

.schrauben--verdeckt li { color: var(--text-still); }
.schrauben--verdeckt b { color: var(--text-still); }

.lupe__fund--gesperrt { border-left-color: var(--rand-stark); }
.lupe__verdeckt { display: grid; gap: 4px; padding: .7em .9em .2em; }
.lupe__titel-verdeckt { display: flex; align-items: center; gap: .5em; font-size: .93rem; }
.lupe__fund--gesperrt .sperre { margin: .5em .9em .9em; }

.haftbox__expose { padding: 0 16px 14px; margin: 0; font-size: .85rem; }
.haftbox__expose .link { display: inline-flex; align-items: center; gap: .35em; }

.nur-breit { display: inline-flex; }
@media (max-width: 1100px) { .nur-breit { display: none; } }

@media (max-width: 620px) {
  .staedteliste__zeile { grid-template-columns: 5.5em 1fr 4em; }
  .staedteliste__zeile a { grid-column: 1 / -1; }
  .zaehler__zeile { grid-template-columns: 1fr; gap: 4px; }
  .vizbalken__zeile { grid-template-columns: 6.5em 1fr 3.6em; }
  .vizbalken__trend { grid-column: 2 / -1; text-align: left; }
  .nkzeile { grid-template-columns: 1fr 6em; }
}
.chancenkopf { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px; margin: 12px 0; }
.chancenkopf .ampel { margin: 0; }
.chancenkopf .ampel__zahl .ico { width: 30px; height: 30px; }
.chancen__satz { font-size: .95rem; }

/* Bezug zwischen Profil und Filter */
.profilbezug { padding: 10px 0; border-bottom: 1px solid var(--rand); margin-bottom: 4px; }
.profilbezug__abweichung { display: flex; gap: .4em; align-items: flex-start; margin: 8px 0 0; font-size: .78rem; color: var(--warn); }
.profilbezug__abweichung .ico { flex: none; width: 14px; height: 14px; margin-top: .12em; }

/* Wenige Treffer */
.wenig { display: flex; gap: .7em; align-items: flex-start; padding: .9em 1em; margin-top: 14px;
  background: var(--flaeche2); border: 1px dashed var(--rand-stark); border-radius: var(--r); }
.wenig > .ico { flex: none; color: var(--text-still); margin-top: .1em; }
.wenig b { display: block; }
.wenig p { margin: .1em 0 0; font-size: .87rem; color: var(--text-leise); }
.leer__tun .knopf em { font-style: normal; margin-left: .5em; padding: .05em .4em; border-radius: 999px;
  background: var(--gut-hell); color: var(--gut); font-size: .78rem; font-weight: 700; }
.markt__wenig { color: var(--text-still); font-style: italic; }
.leer__gross { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--rand-stark); }
.leer__gross p { font-size: .84rem; color: var(--text-still); margin-bottom: 8px; }
.toast.is-frisch { animation: toast-frisch 200ms ease-out; }
@keyframes toast-frisch { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
.gespeichert { display: inline-flex; align-items: center; gap: .35em; margin-top: .5em;
  font-size: .8rem; color: var(--text-still); transition: color var(--tempo); }
.gespeichert .ico { width: 14px; height: 14px; }
.gespeichert.is-frisch { color: var(--gut); }

/* =====================================================================
   Dokumententresor
   Die Listen tragen viel Text bei wenig Breite. Deshalb überall
   minmax(0, …) für die Textspalte – sonst drängt ein langer Dateiname
   die Knöpfe aus der Karte.
   ===================================================================== */

.tresor__erklaerung { margin-top: 16px; border: 1px solid var(--rand); border-radius: var(--r-klein);
  background: var(--flaeche2); }
.tresor__erklaerung > summary { display: flex; align-items: center; gap: .5em; padding: .7em .9em;
  cursor: pointer; font-weight: 650; font-size: .88rem; list-style: none; }
.tresor__erklaerung > summary::-webkit-details-marker { display: none; }
.tresor__erklaerung > summary::after { content: '▾'; margin-left: auto; color: var(--text-still);
  transition: transform var(--tempo); }
.tresor__erklaerung[open] > summary::after { transform: rotate(180deg); }
.tresor__erklaerung > summary .ico { flex: none; color: var(--akzent); }
.tresor__erklaerung p { margin: 0 .9em .8em; font-size: .84rem; line-height: 1.6; color: var(--text-leise); }
.tresor__erklaerung p:first-of-type { margin-top: .1em; }

.tresor__aufnahme { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
  gap: 12px; align-items: end; margin: 14px 0 6px; padding: 12px; border: 1px dashed var(--rand-stark);
  border-radius: var(--r); background: var(--flaeche2); }
.tresor__aufnahme .feld { margin: 0; }
/* Das native Dateifeld beschriftet sich selbst – auf Englisch, in der
   Sprache des Browsers, nicht in der der Seite. Deshalb hier ein eigenes
   Feld: Das echte Element bleibt bedienbar, nur unsichtbar. */
.dateiwahl { display: flex; flex-wrap: wrap; gap: .5em .7em; align-items: center; }
.dateiwahl > label { flex: none; cursor: pointer; }
.dateiwahl > i { flex: 1 1 8em; min-width: 0; font-style: normal; font-size: .82rem;
  color: var(--text-leise); overflow-wrap: anywhere; }
.dateiwahl > input:focus-visible + label { outline: 2px solid var(--akzent); outline-offset: 2px; }

.tresorliste { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
/* Flex statt Raster: Die Zeilen tragen mal zwei, mal vier Kinder – ein
   festes Spaltenraster würde das vierte in die nächste Zeile werfen. */
.tresorliste li { display: flex; flex-wrap: wrap; gap: .55em .7em; align-items: center;
  padding: .7em .85em; border: 1px solid var(--rand); border-radius: var(--r-klein);
  background: var(--flaeche); }
.tresorliste li > .ico { flex: none; color: var(--akzent); }
.tresorliste li > div { flex: 1 1 9em; min-width: 0; }
/* Nur die direkten Kinder: Ein `.tresorliste span` hätte auch die
   Kennzeichen darin auf Blockbreite gezogen. */
.tresorliste li > div > b { display: block; font-size: .92rem; overflow-wrap: anywhere; }
.tresorliste li > div > span { display: block; margin-top: .12em; font-size: .78rem; color: var(--text-leise); }
.tresorliste li > div > span .badge { margin-left: .4em; vertical-align: baseline; }
.tresorliste li > .ikon-btn, .tresorliste li > .knopf { flex: none; }
.tresorliste--gesperrt li { background: var(--flaeche2); border-style: dashed; }
.tresorliste--gesperrt li > .ico { color: var(--text-still); }

.tresor__vorschau { display: block; max-width: 100%; max-height: 62vh; margin: 0 auto;
  border-radius: var(--r-klein); background: var(--flaeche2); }

.freigabeliste { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
.freigabeliste li { padding: .8em .9em; border: 1px solid var(--rand); border-left: 3px solid var(--gut);
  border-radius: var(--r-klein); background: var(--flaeche); }
.freigabeliste li.is-tot { border-left-color: var(--rand-stark); background: var(--flaeche2); }
.freigabeliste li.is-tot .freigabeliste__kopf b { color: var(--text-leise); }
.freigabeliste__kopf { display: flex; flex-wrap: wrap; gap: .5em; align-items: center; }
.freigabeliste__kopf > b { font-size: .93rem; overflow-wrap: anywhere; }
.freigabeliste > li > span { display: block; margin-top: .25em; font-size: .8rem; color: var(--text-leise); }
.freigabeliste__protokoll { display: flex; gap: .4em; align-items: flex-start; margin-top: .35em;
  font-size: .78rem; font-style: normal; color: var(--text-still); }
.freigabeliste__protokoll .ico { flex: none; width: 14px; height: 14px; margin-top: .15em; color: var(--gut); }
.freigabeliste__tun { display: flex; flex-wrap: wrap; gap: .6em; align-items: center; margin-top: .6em; }

@media (max-width: 560px) {
  .tresor__aufnahme { padding: 10px; }
  .freigabeliste__tun { gap: .5em .8em; }
}

/* =====================================================================
   Rechtstexte
   Lange Fließtexte brauchen andere Regeln als Oberflächen: engeres Maß,
   mehr Zeilenabstand, klare Absatzabstände. Und Lücken, die man sieht.
   ===================================================================== */

.rechtspfad { margin: 0 0 .5em; font-size: .84rem; }
.rechtspfad a { display: inline-flex; align-items: center; gap: .3em; color: var(--text-leise); }
.rechtspfad a:hover { color: var(--akzent); }
.rechtspfad .ico { width: 15px; height: 15px; }

.rechtstext { max-width: 62ch; line-height: 1.72; }
.rechtstext h2 { margin: 1.7em 0 .5em; font-size: 1.02rem; padding-bottom: .3em;
  border-bottom: 1px solid var(--rand); }
.rechtstext h2:first-child { margin-top: 0; }
.rechtstext p { margin: 0 0 .85em; font-size: .92rem; }
.rechtstext .pruef { margin: .5em 0 1em; }
.rechtstext .pruef li { font-size: .9rem; line-height: 1.6; }
.rechtstext .pruef .ico { color: var(--text-still); }
.rechtstext__adresse { font-style: normal; padding: .8em 1em; border-left: 3px solid var(--akzent);
  background: var(--flaeche2); border-radius: 0 var(--r-klein) var(--r-klein) 0; }
.rechtstext__muster { margin: .6em 0 1em; padding: 1em; overflow-x: auto; white-space: pre;
  border: 1px dashed var(--rand-stark); border-radius: var(--r-klein); background: var(--flaeche2);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .78rem; line-height: 1.55; }

.rechtsliste { display: grid; grid-template-columns: minmax(min(140px, 40%), auto) minmax(0, 1fr);
  gap: .35em .9em; margin: .3em 0 1em; font-size: .92rem; }
.rechtsliste dt { font-weight: 600; color: var(--text-leise); }
.rechtsliste dd { margin: 0; overflow-wrap: anywhere; }

/* Eine fehlende Pflichtangabe darf nicht wie Text aussehen. */
/* Kein nowrap: Auf 320 Pixeln passt „[E-Mail-Adresse eintragen]“ nicht in
   eine Zeile und schob sich sonst über den rechten Rand hinaus. */
.luecke { padding: .06em .45em; border-radius: var(--r-klein); background: var(--schlecht-hell);
  color: var(--schlecht); font-weight: 600; font-size: .92em; overflow-wrap: anywhere; }
.pflicht { margin-left: .4em; padding: .05em .4em; border-radius: 999px; background: var(--schlecht-hell);
  color: var(--schlecht); font-size: .68rem; font-weight: 700; letter-spacing: .02em; }
.feld__hilfe { display: block; margin-top: .25em; font-style: normal; font-size: .76rem;
  color: var(--text-still); line-height: 1.45; }

.rechtsfrage { margin: 8px 0; border: 1px solid var(--rand); border-radius: var(--r-klein);
  background: var(--flaeche2); }
.rechtsfrage > summary { padding: .7em .9em; cursor: pointer; font-weight: 600; font-size: .9rem;
  list-style: none; display: flex; align-items: flex-start; gap: .5em; }
.rechtsfrage > summary::-webkit-details-marker { display: none; }
.rechtsfrage > summary::before { content: '›'; flex: none; color: var(--text-still); font-size: 1.1em;
  line-height: 1.2; transition: transform var(--tempo); }
.rechtsfrage[open] > summary::before { transform: rotate(90deg); }
.rechtsfrage p { margin: 0 .9em .9em 2em; font-size: .87rem; line-height: 1.65; color: var(--text-leise); }

.fuss__links--recht { font-size: .82rem; }
.fuss__links--recht a { color: var(--text-leise); }
.fuss__links--recht a:hover { color: var(--akzent); }

/* =====================================================================
   Ringtausch als Bild
   ===================================================================== */

.ringerklaerung { display: grid; gap: 12px; }
.ringerklaerung__punkte { display: flex; gap: 8px; justify-content: center; list-style: none;
  margin: 0; padding: 0; }
.ringerklaerung__punkte button { width: 34px; height: 8px; padding: 0; border: 0; border-radius: 999px;
  background: var(--rand-stark); cursor: pointer; transition: background var(--tempo); }
.ringerklaerung__punkte button:hover { background: var(--text-still); }
.ringerklaerung__punkte .is-an button { background: var(--akzent); }
.ringerklaerung__punkte .is-durch button { background: var(--akzent-hell); }
.ringerklaerung__bild { margin: 0; }
.ringerklaerung__bild figcaption { margin-top: 10px; padding: .85em 1em; border-radius: var(--r-klein);
  background: var(--flaeche2); font-size: .89rem; line-height: 1.65; color: var(--text-leise); }
.ringerklaerung__bild figcaption b { color: var(--text); }
.ringerklaerung__fuss { display: flex; align-items: center; gap: 12px; width: 100%; }
.ringerklaerung__fuss .fein { margin: 0 auto; }

.ringbild { display: block; width: 100%; height: auto; max-height: 48vh; }
.ringbild__titel { font-size: 15px; font-weight: 700; fill: var(--text); }
.ringbild__gross { font-size: 14px; font-weight: 600; fill: var(--text); }
.ringbild__klein { font-size: 11.5px; fill: var(--text-leise); }
.ringbild__schild { font-size: 11.5px; font-weight: 600; fill: var(--auf-akzent2); }
.ringbild__kante { font-size: 11px; font-weight: 600; fill: var(--akzent); }
.ringbild__fuss { font-size: 12.5px; fill: var(--text-leise); }

/* =====================================================================
   Gründerplätze
   ===================================================================== */

.gruender { position: relative; margin: 0 0 18px; padding: 20px 22px;
  border: 1px solid var(--akzent); border-radius: var(--r);
  background: linear-gradient(140deg, var(--akzent-hell) 0%, var(--flaeche) 70%); }
.gruender--schmal { margin-bottom: 16px; padding: 16px 18px; }
.gruender.is-abgelaufen, .gruender.is-leer { border-color: var(--rand-stark);
  background: var(--flaeche2); }
.gruender__marke { display: inline-flex; align-items: center; gap: .35em; margin-bottom: .5em;

    moebel: 'Für die Möblierung wird ein monatlicher Zuschlag von 180 € zusätzlich zur Kaltmiete erhoben.',
    vorkasse: 'Da ich beruflich im Ausland bin, erfolgt die Schlüsselübergabe per Kurier, nachdem die erste Miete und die Kaution überwiesen wurden.',
    keineBesichtigung: 'Eine Vorabbesichtigung ist leider nicht möglich; die Vergabe erfolgt nach Aktenlage.',
    tierverbot: 'Das Halten von Haustieren jeder Art ist ausnahmslos untersagt.',
    eigenbedarf: 'Der Vermieter behält sich vor, die Wohnung nach zwei Jahren wegen Eigenbedarf zu kündigen.'
  };

  /* ------------------------- Hilfen ------------------------- */

  let idCounter = 0;
  const nextId = (prefix) => prefix + '-' + (++idCounter).toString(36).padStart(3, '0');

  function personName(r, gender) {
    const pool = gender === 'w' ? VORNAMEN_W : gender === 'm' ? VORNAMEN_M : VORNAMEN_D;
    return U.pick(r, pool) + ' ' + U.pick(r, NACHNAMEN);
  }

  function energieKlasse(kwh) {
    if (kwh <= 30) return 'A+';
    if (kwh <= 50) return 'A';
    if (kwh <= 75) return 'B';
    if (kwh <= 100) return 'C';
    if (kwh <= 130) return 'D';
    if (kwh <= 160) return 'E';
    if (kwh <= 200) return 'F';
    if (kwh <= 250) return 'G';
    return 'H';
  }

  function dateOffset(days) {
    return U.isoDate(U.addDays(NW.now(), days));
  }

  /* ------------------------- Anbieter ------------------------- */

  function makeAnbieter(r, art, city) {
    let name, quote, std, verifiziert, seitTage, inserate;
    if (art === 'makler') {
      name = U.pick(r, MAKLER);
      quote = U.intBetween(r, 55, 96);
      std = U.intBetween(r, 4, 60);
      verifiziert = r() < 0.85;
      seitTage = U.intBetween(r, 400, 3200);
      inserate = U.intBetween(r, 6, 48);
    } else if (art === 'verwaltung') {
      name = U.pick(r, VERWALTUNG);
      quote = U.intBetween(r, 45, 88);
      std = U.intBetween(r, 12, 96);
      verifiziert = r() < 0.9;
      seitTage = U.intBetween(r, 600, 3600);
      inserate = U.intBetween(r, 3, 22);
    } else if (art === 'genossenschaft') {
      name = U.pick(r, GENOSSENSCHAFT);
      quote = U.intBetween(r, 78, 99);
      std = U.intBetween(r, 8, 48);
      verifiziert = true;
      seitTage = U.intBetween(r, 1200, 5000);
      inserate = U.intBetween(r, 2, 14);
    } else {
      name = personName(r, U.pick(r, ['w', 'm', 'm', 'w', 'd']));
      quote = U.intBetween(r, 30, 95);
      std = U.intBetween(r, 2, 120);
      verifiziert = r() < 0.55;
      seitTage = U.intBetween(r, 5, 2000);
      inserate = U.intBetween(r, 1, 3);
    }
    /* Die Vertrauensstufe ist der eigentliche Betrugsfilter: Ein Konto
       ohne Gerätebindung und ohne bestätigte Nummer ist in Minuten neu
       angelegt, ein ausweisgeprüftes nicht. Gewerbliche Anbieter stehen
       im Schnitt höher, weil sie sich ohnehin ausweisen müssen. */
    const stufe = verifiziert
      ? (art === 'privat' ? U.intBetween(r, 2, 3) : U.intBetween(r, 3, 4))
      : U.intBetween(r, 0, 2);
    return {
      name, art, stadt: city,
      quote, antwortStd: std, verifiziert, stufe,
      seit: dateOffset(-seitTage), inserate,
      bewertung: Math.round((3.1 + r() * 1.9) * 10) / 10,
      bewertungen: U.intBetween(r, 0, 140)
    };
  }

  /* ------------------------- Ein Inserat ------------------------- */

  function makeListing(r, city, district, kind) {
    const id = nextId(kind);
    const isHaus = kind === 'kauf' ? r() < 0.34 : kind === 'miete' ? r() < 0.07 : false;
    const isZimmer = kind === 'wg';

    /* Baujahr mit realistischer Verteilung */
    const jahrWurf = r();
    let year;
    if (jahrWurf < 0.24) year = U.intBetween(r, 1890, 1939);
    else if (jahrWurf < 0.52) year = U.intBetween(r, 1949, 1977);
    else if (jahrWurf < 0.74) year = U.intBetween(r, 1978, 2004);
    else if (jahrWurf < 0.90) year = U.intBetween(r, 2005, 2019);
    else year = U.intBetween(r, 2020, 2026);
    const saniert = year < 1990 && r() < 0.55;

    /* Größe und Zimmer */
    let rooms, area;
    if (isZimmer) {
      rooms = 1;
      area = U.intBetween(r, 9, 26);
    } else if (isHaus) {
      rooms = U.intBetween(r, 4, 7);
      area = U.intBetween(r, 105, 210);
    } else {
      const w = r();
      rooms = w < 0.16 ? 1 : w < 0.42 ? 2 : w < 0.72 ? 3 : w < 0.9 ? 4 : 5;
      const proZimmer = U.between(r, 20, 30);
      area = Math.round(rooms * proZimmer + U.between(r, -6, 12));
      area = U.clamp(area, 22, 190);
      if (rooms >= 2 && r() < 0.3) rooms += 0.5;
    }

    const wohnflaeche = isZimmer ? U.intBetween(r, 58, 140) : area;
    const floors = isHaus ? U.intBetween(r, 2, 3) : U.intBetween(r, 3, 7);
    const floor = isHaus ? 0 : U.intBetween(r, 0, floors);

    /* Ausstattung */
    const feats = [];
    const add = (name, p) => { if (r() < p) feats.push(name); };
    add('Balkon', isHaus ? 0.4 : year >= 1960 ? 0.66 : 0.38);
    if (!feats.includes('Balkon')) add('Loggia', 0.16);
    add('Terrasse', isHaus ? 0.85 : floor === 0 ? 0.35 : 0.05);
    add('Garten', isHaus ? 0.92 : floor === 0 ? 0.22 : 0.02);
    add('Dachterrasse', floor === floors ? 0.18 : 0.01);
    add('Einbauküche', isZimmer ? 0.95 : 0.55);
    add('Aufzug', floors >= 5 ? 0.72 : year >= 2005 ? 0.5 : 0.12);
    add('Barrierefrei', year >= 2010 ? 0.42 : 0.05);
    add('Stellplatz', 0.32);
    add('Garage', isHaus ? 0.6 : 0.1);
    add('Keller', 0.72);
    add('Fahrradkeller', 0.42);
    add('Waschmaschinenanschluss', 0.78);
    add('Badewanne', 0.46);
    add('Gäste-WC', isHaus ? 0.7 : rooms >= 3 ? 0.24 : 0.03);
    add(year < 1940 ? 'Dielenboden' : 'Parkett', 0.5);
    add('Fußbodenheizung', year >= 2005 ? 0.6 : 0.07);
    add('Glasfaser', year >= 2015 ? 0.55 : 0.2);
    add('Abstellraum', 0.36);
    add('Kamin', isHaus ? 0.24 : 0.05);
    if (year < 1940) add('Denkmalschutz', 0.16);
    add('Gemeinschaftsgarten', 0.18);
    add('Paketstation', 0.12);
    if (isZimmer) {
      if (r() < 0.5) feats.push('Möbliert'); else if (r() < 0.6) feats.push('Teilmöbliert');
    } else if (r() < 0.09) feats.push('Teilmöbliert');
    const haustiere = r() < 0.42;
    if (haustiere) feats.push('Haustiere erlaubt');

    /* Energie */
    /* Wärmepumpe und Pellets stecken selten in unsaniertem Altbestand. */
    const heizung = year >= 2020 ? U.pick(r, ['Wärmepumpe', 'Fernwärme', 'Wärmepumpe'])
      : year >= 2000 ? U.pick(r, ['Gas-Zentralheizung', 'Fernwärme', 'Wärmepumpe'])
        : U.pick(r, saniert
          ? ['Gas-Zentralheizung', 'Fernwärme', 'Gasetagenheizung', 'Pelletheizung', 'Wärmepumpe', 'Gas-Zentralheizung']
          : ['Gas-Zentralheizung', 'Gas-Zentralheizung', 'Fernwärme', 'Öl-Zentralheizung', 'Gasetagenheizung', 'Nachtspeicheröfen']);
    let kwh = HEIZ_KWH[heizung] * (year >= 2020 ? 0.55 : year >= 2005 ? 0.78 : year >= 1978 ? 1.0 : saniert ? 0.92 : 1.35);
    kwh = Math.round(kwh * U.between(r, 0.85, 1.15));
    const energie = {
      klasse: energieKlasse(kwh), kwh, art: r() < 0.6 ? 'Verbrauchsausweis' : 'Bedarfsausweis',
      heizung, ausweisBis: dateOffset(U.intBetween(r, -200, 2400))
    };

    /* Preise */
    const nutzflaeche = isZimmer ? area : area;
    const vergleich = G.vergleichsmiete(district, isZimmer ? wohnflaeche : area, year, saniert);
    let kalt, nebenkosten, heizkosten, kaufpreis = 0, hausgeld = 0, provision = 0, kaution = 3;

    if (kind === 'kauf') {
      const vk = G.vergleichskaufpreis(district, area, year);
      kaufpreis = Math.round(vk * area * U.between(r, 0.88, 1.16) / 1000) * 1000;
      hausgeld = isHaus ? 0 : Math.round(area * U.between(r, 3.2, 5.4));
      provision = U.pick(r, [0, 0, 2.38, 3.57, 3.57]);
      kalt = 0; nebenkosten = 0; heizkosten = 0;
    } else {
      let faktor = U.between(r, 0.88, 1.16);
      if (kind === 'wg') faktor *= U.between(r, 0.95, 1.35);
      kalt = Math.round(vergleich * (isZimmer ? area : area) * faktor);
      if (isZimmer) kalt = Math.round(kalt * U.between(r, 1.15, 1.75));
      /* Kalte Betriebskosten je m²; Heizkosten aus Kennwert × Fläche ×
         Arbeitspreis, auf zwölf Monate verteilt. */
      nebenkosten = Math.round(area * U.between(r, 1.5, 2.8));
      const arbeitspreis = heizung === 'Wärmepumpe' ? 0.28 : heizung === 'Nachtspeicheröfen' ? 0.30
        : heizung === 'Fernwärme' ? 0.135 : heizung === 'Pelletheizung' ? 0.085
          : heizung === 'Öl-Zentralheizung' ? 0.105 : 0.115;
      const wirkungsgrad = heizung === 'Wärmepumpe' ? 3.4 : 1;
      heizkosten = Math.round(area * kwh / wirkungsgrad * arbeitspreis / 12 * U.between(r, 0.9, 1.15));
      kaution = U.pick(r, [2, 3, 3, 3, 1, 0]);
      provision = kind === 'miete' && r() < 0.06 ? 2.38 : 0;
    }
    const warm = kalt + nebenkosten + heizkosten;

    /* Auffälligkeiten */
    const quirks = [];
    if (kind !== 'kauf') {
      if (r() < 0.14) quirks.push('staffel');
      if (r() < 0.07) quirks.push('index');
      if (r() < 0.22) quirks.push('schoenheit');
      if (r() < 0.09) quirks.push('abstand');
      if (kaution >= 4 || r() < 0.05) { quirks.push('kaution4'); kaution = 4; }
      if (provision > 0) quirks.push('provision');
      if (feats.includes('Möbliert') && r() < 0.4) quirks.push('moebel');
      if (r() < 0.1) quirks.push('tierverbot');
      if (r() < 0.05) quirks.push('eigenbedarf');
    }

    /* Anbieterart */
    let anbieterArt;
    if (kind === 'wg') anbieterArt = 'privat';
    else if (kind === 'tausch') anbieterArt = 'privat';
    else if (kind === 'kauf') anbieterArt = r() < 0.72 ? 'makler' : 'privat';
    else anbieterArt = r() < 0.34 ? 'makler' : r() < 0.6 ? 'verwaltung' : r() < 0.72 ? 'genossenschaft' : 'privat';
    const anbieter = makeAnbieter(r, anbieterArt, city.name);

    /* Betrugsverdacht bewusst streuen: sehr günstig, frisches Konto,
       Vorkasse, keine Besichtigung. */
    let fake = false;
    if (kind !== 'kauf' && r() < 0.045) {
      fake = true;
      kalt = Math.round(kalt * U.between(r, 0.38, 0.55));
      anbieter.verifiziert = false;
      anbieter.stufe = 0;
      anbieter.art = 'privat';
      anbieter.seit = dateOffset(-U.intBetween(r, 1, 12));
      anbieter.inserate = U.intBetween(r, 1, 2);
      anbieter.quote = U.intBetween(r, 95, 100);
      quirks.push('vorkasse');
      quirks.push('keineBesichtigung');
    }

    /* Text */
    const stil = isZimmer ? 'zimmer' : isHaus ? 'haus' : year < 1949 ? 'altbau' : year < 2000 ? 'nachkrieg' : 'modern';
    const teile = [U.pick(r, T_EROEFFNUNG[stil])];
    teile.push('Die ' + (isZimmer ? 'Wohnung' : isHaus ? 'Immobilie' : 'Wohnung') + ' liegt in ' + district.name +
      ' und umfasst ' + (isZimmer ? area + ' m² Zimmerfläche in einer ' + wohnflaeche + ' m² großen Wohnung'
        : U.dec(rooms) + ' Zimmer auf ' + area + ' m²') +
      (isHaus ? '' : floor === 0 ? ' im Erdgeschoss' : floor >= floors ? ' im Dachgeschoss' : ' im ' + floor + '. Obergeschoss') + '.');
    teile.push(U.pick(r, T_ZUSTAND));
    if (feats.length) {
      teile.push('Zur Ausstattung gehören ' + feats.slice(0, 4).join(', ').replace(/, ([^,]*)$/, ' und $1') + '.');
    }
    teile.push(U.pick(r, T_LAGE));
    quirks.forEach((q) => teile.push(QUIRKS[q]));
    if (!fake) teile.push(U.pick(r, T_FORMAL));
    const desc = teile.join(' ');

    /* Streuung der Koordinaten innerhalb des Viertels */
    const jitter = 0.012;
    const lat = Math.round((district.lat + (r() - 0.5) * jitter) * 100000) / 100000;
    const lng = Math.round((district.lng + (r() - 0.5) * jitter * 1.6) * 100000) / 100000;

    const onlineTage = U.intBetween(r, 0, 46);
    const freiTage = U.pick(r, [0, 0, 14, 30, 45, 60, 90, 120, -20]);

    const titelTeil = isZimmer
      ? area + ' m² Zimmer in ' + U.intBetween(r, 2, 4) + 'er-WG'
      : (isHaus ? 'Haus' : U.dec(rooms) + '-Zimmer-Wohnung') +
        (feats.includes('Balkon') ? ' mit Balkon' : feats.includes('Garten') ? ' mit Garten' : feats.includes('Terrasse') ? ' mit Terrasse' : '');

    const listing = {
      id, kind,
      type: isZimmer ? 'zimmer' : isHaus ? 'haus' : 'wohnung',
      titel: titelTeil + ' – ' + district.name,
      stadt: city.name, viertel: district.name, viertelKey: district.key,
      strasse: 'Nähe ' + U.pick(r, STRASSEN),
      lat, lng,
      zimmer: rooms, flaeche: area, wohnflaeche,
      etage: floor, etagen: floors, baujahr: year, saniert,
      kalt, nebenkosten, heizkosten, warm,
      kaufpreis, hausgeld, provision, kaution,
      energie, ausstattung: feats,
      freiAb: dateOffset(freiTage),
      befristetBis: null,
      beschreibung: desc,
      quirks,
      anbieter,
      stats: {
        /* Aufrufe und Bewerbungen wachsen mit der Zeit online – ein
           frisches Inserat hat noch keine 200 Interessenten. */
        aufrufe: Math.round((12 + onlineTage * U.between(r, 6, 55)) * (kind === 'kauf' ? 0.5 : 1)),
        bewerber: Math.round((onlineTage + 1) * U.between(r, 0.2, kind === 'kauf' ? 0.6 : 4.5)),
        online: dateOffset(-onlineTage)
      },
      vergleichsmiete: vergleich,
      besichtigungen: [],
      verdacht: fake
    };

    /* Besichtigungstermine – echte Slots statt Massenandrang */
    if (kind !== 'kauf' && r() < 0.62) {
      const anzahl = U.intBetween(r, 2, 5);
      for (let i = 0; i < anzahl; i++) {
        const tag = U.intBetween(r, 2, 18);
        const stunde = U.intBetween(r, 9, 18);
        listing.besichtigungen.push({
          id: id + '-t' + i,
          datum: dateOffset(tag),
          zeit: String(stunde).padStart(2, '0') + ':' + U.pick(r, ['00', '15', '30', '45']),
          plaetze: U.intBetween(r, 1, 3),
          belegt: 0,
          art: r() < 0.8 ? 'Einzeltermin' : 'Kleingruppe'
        });
      }
      listing.besichtigungen.sort((a, b) => a.datum.localeCompare(b.datum));
    }

    /* Zwischenmiete */
    if (kind === 'wg' && r() < 0.28) {
      listing.befristetBis = dateOffset(freiTage + U.intBetween(r, 60, 400));
    }

    return listing;
  }

  /* ------------------------- WG-Aufsatz ------------------------- */

  const LIFESTYLE_KEYS = ['sauber', 'ruhe', 'gaeste', 'gemeinsam', 'chrono', 'kochen'];

  function makeWG(r, listing) {
    const groesse = U.intBetween(r, 2, 5);
    const bewohner = [];
    for (let i = 0; i < groesse - 1; i++) {
      const g = U.pick(r, ['w', 'w', 'm', 'm', 'd']);
      bewohner.push({
        name: (g === 'w' ? U.pick(r, VORNAMEN_W) : g === 'm' ? U.pick(r, VORNAMEN_M) : U.pick(r, VORNAMEN_D)),
        alter: U.intBetween(r, 19, 44),
        geschlecht: g,
        beruf: berufFor(r, g)
      });
    }
    const durchschnitt = bewohner.length ? Math.round(U.sum(bewohner.map((b) => b.alter)) / bewohner.length) : 26;

    const lifestyle = {};
    LIFESTYLE_KEYS.forEach((k) => { lifestyle[k] = U.intBetween(r, 0, 10); });

    const gesuchtGeschlecht = U.pick(r, ['egal', 'egal', 'egal', 'w', 'm', 'd']);
    const artAnzahl = U.intBetween(r, 1, 3);

    listing.wg = {
      groesse,
      bewohner,
      durchschnittsalter: durchschnitt,
      sucht: {
        geschlecht: gesuchtGeschlecht,
        alterVon: Math.max(18, durchschnitt - U.intBetween(r, 3, 9)),
        alterBis: durchschnitt + U.intBetween(r, 4, 14)
      },
      art: U.pickN(r, WG_ART, artAnzahl),
      rauchen: U.pick(r, ['nicht erwünscht', 'nicht erwünscht', 'auf dem Balkon', 'überall erlaubt']),
      haustiere: listing.ausstattung.includes('Haustiere erlaubt')
        ? U.pick(r, ['erlaubt', 'vorhanden'])
        : 'nicht erlaubt',
      sprachen: U.pickN(r, SPRACHEN, U.intBetween(r, 1, 3)),
      lifestyle,
      putzplan: r() < 0.55,
      gemeinsamesEssen: r() < 0.4,
      badGeteilt: r() < 0.7 ? 'geteilt' : 'eigenes Bad'
    };

    if (!listing.wg.sprachen.includes('Deutsch')) listing.wg.sprachen.unshift('Deutsch');

    const beschreibungWG = 'Wir sind eine ' + listing.wg.groesse + 'er-WG (' +
      bewohner.map((b) => b.name + ', ' + b.alter).join('; ') + '). ' +
      'Wir verstehen uns als ' + listing.wg.art.join(' und ') + '. ' +
      (listing.wg.putzplan ? 'Es gibt einen Putzplan, an den sich alle halten. ' : 'Geputzt wird ohne festen Plan, aber es klappt. ') +
      (listing.wg.gemeinsamesEssen ? 'Ein- bis zweimal die Woche kochen wir zusammen. ' : 'Jeder kocht für sich, gemeinsam essen ist möglich, aber kein Muss. ') +
      'Rauchen: ' + listing.wg.rauchen + '. Haustiere: ' + listing.wg.haustiere + '.';
    listing.beschreibung = beschreibungWG + ' ' + listing.beschreibung;
    listing.titel = listing.flaeche + ' m² Zimmer in ' + groesse + 'er-WG – ' + listing.viertel;
    listing.anbieter.name = bewohner.length ? bewohner[0].name + ' & WG' : listing.anbieter.name;
    return listing;
  }

  /* ------------------------- Tausch-Aufsatz ------------------------- */

  function makeTausch(r, listing, alleStaedte) {
    const wunschStaedte = U.pickN(r, alleStaedte.filter((s) => s !== listing.stadt), U.intBetween(r, 1, 3));
    listing.tausch = {
      grund: U.pick(r, [
        'Neuer Job in einer anderen Stadt.',
        'Wir bekommen Nachwuchs und brauchen ein Zimmer mehr.',
        'Die Kinder sind aus dem Haus – die Wohnung ist zu groß geworden.',
        'Studienortwechsel zum kommenden Semester.',
        'Wir wollen näher zur Familie ziehen.',
        'Die Treppen werden beschwerlich, gesucht wird etwas Barrierefreies.',
        'Pendeln frisst zu viel Zeit, ich möchte näher an die Arbeit.',
        'Beziehung beendet – die Wohnung allein ist zu teuer.'
      ]),
      suche: {
        staedte: wunschStaedte,
        zimmerMin: Math.max(1, listing.zimmer + U.pick(r, [-1, 0, 0, 1, 1])),
        flaecheMin: Math.max(20, Math.round(listing.flaeche * U.between(r, 0.7, 1.1))),
        warmMax: Math.round(listing.warm * U.between(r, 1.0, 1.5) / 10) * 10,
        wunschAusstattung: U.pickN(r, ['Balkon', 'Aufzug', 'Barrierefrei', 'Garten', 'Haustiere erlaubt', 'Stellplatz', 'Einbauküche'], U.intBetween(r, 0, 2))
      },
      flexibelAb: listing.freiAb,
      dreiecktauschOk: r() < 0.78,
      vermieterZustimmung: U.pick(r, ['liegt vor', 'in Klärung', 'in Klärung', 'noch offen'])
    };
    listing.titel = U.dec(listing.zimmer) + '-Zimmer-Wohnung zum Tausch – ' + listing.viertel;
    listing.beschreibung = 'Tauschangebot: ' + listing.tausch.grund + ' ' + listing.beschreibung +
      ' Gesucht wird eine Wohnung in ' + wunschStaedte.join(' oder ') + ' mit mindestens ' +
      U.dec(listing.tausch.suche.zimmerMin) + ' Zimmern und ' + listing.tausch.suche.flaecheMin +
      ' m², warm bis ' + U.eur(listing.tausch.suche.warmMax) + '.' +
      ' Zustimmung des Vermieters: ' + listing.tausch.vermieterZustimmung + '.';
    return listing;
  }

  /* ------------------------- Bestand erzeugen ------------------------- */

  function build() {
    const r = U.rng(SEED);
    const listings = [];
    const staedte = G.CITIES.map((c) => c.name);

    G.CITIES.forEach((city) => {
      /* Menge grob nach Einwohnerzahl, aber überall genug zum Suchen. */
      const menge = U.clamp(Math.round(city.einwohner / 42000) + 8, 12, 34);
      for (let i = 0; i < menge; i++) {
        const district = U.pick(r, city.districtList);
        const w = r();
        const kind = w < 0.44 ? 'miete' : w < 0.60 ? 'kauf' : w < 0.86 ? 'wg' : 'tausch';
        const l = makeListing(r, city, district, kind);
        if (kind === 'wg') makeWG(r, l);
        if (kind === 'tausch') makeTausch(r, l, staedte);
        listings.push(l);
      }
    });

    /* Ringe pflanzen: ohne passende Ketten wäre der Ringtausch leer.
       Ein Dreier- und ein Viererring, dazu ein paar direkte Tausche. */

    const referenz = l.kind === 'wg' ? vergleich * 1.35 : vergleich;
    const diff = referenz > 0 ? (proQm - referenz) / referenz * 100 : 0;
    let urteil, ton;
    if (diff < -35) { urteil = 'auffällig günstig'; ton = 'warn'; }
    else if (diff < -12) { urteil = 'unter Vergleichsmiete'; ton = 'gut'; }
    else if (diff <= 10) { urteil = 'marktüblich'; ton = 'neutral'; }
    else if (diff <= 25) { urteil = 'über Vergleichsmiete'; ton = 'mittel'; }
    else { urteil = 'deutlich über Vergleichsmiete'; ton = 'schlecht'; }
    return {
      proQm: Math.round(proQm * 100) / 100,
      referenz: Math.round(referenz * 100) / 100,

      erklaerung: 'Die Wohnung ist gefördert. Der Schein wird beim Wohnungsamt beantragt und hängt von Haushaltsgröße und Einkommen ab. Die Bearbeitung dauert oft mehrere Wochen – frühzeitig kümmern.',
      quelle: '§ 5 WoBindG'
    },
    {
      id: 'keinebesichtigung', re: /Besichtigung ist leider nicht möglich|nach Aktenlage/i,
      titel: 'Vergabe ohne Besichtigung', bewertung: 'kritisch',
      erklaerung: 'Ohne Besichtigung lässt sich weder der Zustand noch die Existenz der Wohnung prüfen. Das ist das deutlichste Warnzeichen überhaupt.',
      quelle: 'Grundregel bei Wohnungsbetrug'
    }
  ];

  function klauselCheck(l) {
    const text = l.beschreibung || '';
    const funde = [];
    KLAUSELN.forEach((k) => {
      if (k.nurKind && l.kind !== k.nurKind) return;
      const m = text.match(k.re);
      if (!m) return;
      /* Fundstelle als Satz zeigen, damit der Bezug klar ist. */
      const idx = text.indexOf(m[0]);
      const start = Math.max(0, text.lastIndexOf('.', idx) + 1);
      let end = text.indexOf('.', idx + m[0].length);
      if (end < 0) end = text.length;
      funde.push({
        id: k.id, titel: k.titel, bewertung: k.bewertung,
        erklaerung: k.erklaerung, quelle: k.quelle,
        fundstelle: text.slice(start, end + 1).trim()
      });
    });
    const rang = { kritisch: 0, achtung: 1, info: 2 };
    funde.sort((a, b) => rang[a.bewertung] - rang[b.bewertung]);
    return funde;
  }

  /* ================================================================
     4. Was es wirklich kostet
     ================================================================ */

  function kosten(l, profil) {
    const p = profil || {};
    const personen = U.clamp(p.haushalt || 1, 1, 6);
    const strom = Math.round(STROM_KWH[personen] * STROMPREIS / 12);
    const monatlich = [];
    const einmalig = [];

    if (l.kind === 'kauf' && l.type === 'grundstueck') {
      /* Ein unbebautes Grundstück hat weder Hausgeld noch Strom, Internet
         oder Rundfunkbeitrag. Es kostet Grundsteuer und, je nach Lage,
         noch Erschließung – alles andere entsteht erst mit dem Haus. */
      const state = (G.cityByName[l.stadt] || {}).state || 'NRW';
      const grest = GRUNDERWERB[state] || 6.0;
      const flaeche = l.grundstueck || l.flaeche || 1;
      monatlich.push({ label: 'Grundsteuer (geschätzt)', betrag: Math.max(4, Math.round(l.kaufpreis * 0.0012 / 12)) });
      einmalig.push({ label: 'Grunderwerbsteuer (' + U.dec(grest) + ' % in ' + state + ')', betrag: Math.round(l.kaufpreis * grest / 100) });
      einmalig.push({ label: 'Notar und Grundbuch (rund 2 %)', betrag: Math.round(l.kaufpreis * 0.02) });
      if (l.provision > 0) einmalig.push({ label: 'Maklercourtage (' + U.dec(l.provision) + ' %)', betrag: Math.round(l.kaufpreis * l.provision / 100) });
      if ((l.grund || {}).erschliessung !== 'bereits bezahlt') {
        einmalig.push({ label: 'Erschließung (grobe Schätzung)', betrag: Math.round(flaeche * 55) });
      }
      einmalig.push({ label: 'Vermessung und Bodengutachten', betrag: 3200 });
    } else if (l.kind === 'kauf') {
      const state = (G.cityByName[l.stadt] || {}).state || 'NRW';
      const grest = GRUNDERWERB[state] || 6.0;
      monatlich.push({ label: 'Hausgeld / Rücklage', betrag: l.hausgeld || Math.round(l.flaeche * 3.4), hinweis: l.type === 'haus' ? 'geschätzte Instandhaltungsrücklage' : 'Wohngeld laut Angebot' });
      monatlich.push({ label: 'Strom (' + personen + ' ' + U.plural(personen, 'Person', 'Personen') + ')', betrag: strom });
      monatlich.push({ label: 'Internet', betrag: INTERNET });
      monatlich.push({ label: 'Rundfunkbeitrag', betrag: RUNDFUNK });
      monatlich.push({ label: 'Wohngebäude-/Hausratversicherung', betrag: l.type === 'haus' ? 42 : 14 });
      einmalig.push({ label: 'Grunderwerbsteuer (' + U.dec(grest) + ' % in ' + state + ')', betrag: Math.round(l.kaufpreis * grest / 100) });
      einmalig.push({ label: 'Notar und Grundbuch (rund 2 %)', betrag: Math.round(l.kaufpreis * 0.02) });
      if (l.provision > 0) einmalig.push({ label: 'Maklercourtage (' + U.dec(l.provision) + ' %)', betrag: Math.round(l.kaufpreis * l.provision / 100) });
      einmalig.push({ label: 'Umzug', betrag: 1400 });
    } else {
      monatlich.push({ label: 'Kaltmiete', betrag: l.kalt });
      monatlich.push({ label: 'Nebenkosten', betrag: l.nebenkosten });
      monatlich.push({ label: 'Heizkosten', betrag: l.heizkosten });
      monatlich.push({ label: 'Strom (' + personen + ' ' + U.plural(personen, 'Person', 'Personen') + ')', betrag: strom });
      if (l.kind !== 'wg') {
        monatlich.push({ label: 'Internet', betrag: INTERNET });
        monatlich.push({ label: 'Rundfunkbeitrag', betrag: RUNDFUNK });
        monatlich.push({ label: 'Hausratversicherung', betrag: HAUSRAT });
      } else {
        monatlich.push({ label: 'Anteil Internet und Rundfunk', betrag: Math.round((INTERNET + RUNDFUNK) / (l.wg ? l.wg.groesse : 3)) });
      }
      if (l.quirks && l.quirks.indexOf('moebel') >= 0) monatlich.push({ label: 'Möblierungszuschlag', betrag: 180 });
      einmalig.push({ label: 'Kaution (' + l.kaution + ' ' + U.plural(l.kaution, 'Kaltmiete', 'Kaltmieten') + ')', betrag: l.kalt * l.kaution, rueck: true });
      if (l.provision > 0) einmalig.push({ label: 'Courtage (' + U.dec(l.provision) + ' Kaltmieten)', betrag: Math.round(l.kalt * l.provision * 1.19) });
      if (l.quirks && l.quirks.indexOf('abstand') >= 0) einmalig.push({ label: 'Abstandszahlung Küche', betrag: 4500 });
      if (!l.ausstattung.includes('Einbauküche') && l.kind !== 'wg') einmalig.push({ label: 'Küche anschaffen', betrag: 2600 });
      einmalig.push({ label: 'Umzug', betrag: l.kind === 'wg' ? 450 : 1200 });
      einmalig.push({ label: 'Ummeldung, Nachsendung, Kleinkram', betrag: 120 });
    }

    const monatSumme = U.sum(monatlich.map((m) => m.betrag));
    const einmalSumme = U.sum(einmalig.map((m) => m.betrag));
    const rueckzahlbar = U.sum(einmalig.filter((m) => m.rueck).map((m) => m.betrag));
    const netto = p.nettoEinkommen || 0;
    const quote = netto > 0 ? Math.round(monatSumme / netto * 100) : 0;

    return {
      monatlich, einmalig,
      monatSumme, einmalSumme, rueckzahlbar,
      erstesJahr: monatSumme * 12 + einmalSumme,
      quote,
      ampel: quote === 0 ? 'unbekannt' : quote <= 30 ? 'gut' : quote <= 40 ? 'mittel' : 'schlecht'
    };
  }

  /* Annuitätendarlehen: monatliche Rate und Restschuld nach Zinsbindung. */
  function finanzierung(kaufpreis, nebenkostenSumme, eigenkapital, zins, tilgung, jahre) {
    const gesamt = kaufpreis + nebenkostenSumme;
    const darlehen = Math.max(0, gesamt - eigenkapital);
    const rate = darlehen * (zins + tilgung) / 100 / 12;
    let rest = darlehen;
    const monatsZins = zins / 100 / 12;
    for (let m = 0; m < jahre * 12 && rest > 0; m++) {
      const z = rest * monatsZins;
      rest = Math.max(0, rest - (rate - z));
    }
    /* Volltilgungsdauer grob über die Restschuldformel abschätzen. */
    let laufzeit = 0, r2 = darlehen;
    while (r2 > 0 && laufzeit < 600) { r2 = r2 - (rate - r2 * monatsZins); laufzeit++; }
    return {
      gesamt, darlehen,
      rate: Math.round(rate),
      restschuld: Math.round(rest),
      eigenkapitalQuote: gesamt > 0 ? Math.round(eigenkapital / gesamt * 100) : 0,
      laufzeitJahre: Math.round(laufzeit / 12 * 10) / 10
    };
  }

  /* ================================================================
     5. Passung – warum steht dieses Inserat wo es steht
     ================================================================ */

  function pendelZeit(l, profil) {
    if (!profil || !profil.anker || !profil.anker.length) return null;
    let best = null;
    profil.anker.forEach((a) => {
      const min = U.travelMin(l, a, a.mittel || profil.verkehrsmittel || 'oepnv');
      if (!best || min < best.min) best = { min, anker: a };
    });
    return best;
  }

  function bewerten(l, profil) {
    const p = profil || {};
    const gw = p.gewichtung || { preis: 3, lage: 3, groesse: 3, ausstattung: 2, energie: 2, pendeln: 3, fairness: 3 };
    const teile = [];
    const add = (schluessel, label, anteil, gewicht, text) => {
      teile.push({ schluessel, label, anteil: U.clamp(anteil, 0, 1), gewicht, text });
    };

    /* Preis gegen Budget */
    const preis = l.kind === 'kauf' ? l.kaufpreis : l.warm;
    if (l.kind === 'kauf') {
      const budget = (p.budgetKauf || 0);
      if (budget > 0) {
        const v = preis <= budget * 0.85 ? 1 : preis <= budget ? 0.8 : preis <= budget * 1.1 ? 0.35 : 0;
        add('preis', 'Kaufpreis', v, gw.preis, U.eur(preis) + ' bei ' + U.eur(budget) + ' Budget');
      }
    } else if (p.budgetWarm > 0) {
      const b = p.budgetWarm;
      const v = preis <= b * 0.8 ? 1 : preis <= b ? 0.85 : preis <= b * 1.08 ? 0.4 : 0;
      add('preis', 'Warmmiete', v, gw.preis, U.eur(preis) + ' bei ' + U.eur(b) + ' Budget');
    }

    /* Größe */
    if (p.zimmerMin || p.flaecheMin) {
      const zOk = !p.zimmerMin || l.zimmer >= p.zimmerMin;
      const fOk = !p.flaecheMin || l.flaeche >= p.flaecheMin;
      const ueber = p.flaecheMin ? U.clamp((l.flaeche - p.flaecheMin) / Math.max(10, p.flaecheMin * 0.5), 0, 1) : 0.5;
      const v = zOk && fOk ? 0.7 + 0.3 * ueber : zOk || fOk ? 0.35 : 0;
      add('groesse', 'Zuschnitt', v, gw.groesse, U.dec(l.zimmer) + ' Zi. auf ' + l.flaeche + ' m²');
    }

    /* Lage: Wunschviertel schlägt Wunschstadt */
    if ((p.viertel && p.viertel.length) || (p.staedte && p.staedte.length)) {
      const vTreffer = p.viertel && p.viertel.indexOf(l.viertelKey) >= 0;
      const sTreffer = p.staedte && p.staedte.indexOf(l.stadt) >= 0;
      const v = vTreffer ? 1 : sTreffer ? (p.viertel && p.viertel.length ? 0.55 : 1) : 0.15;
      add('lage', 'Lage', v, gw.lage, l.viertel + ', ' + l.stadt);
    }

    /* Ausstattung */
    const muss = p.mussHaben || [], schoen = p.schoenWaere || [];
    if (muss.length || schoen.length) {
      const mussOk = muss.filter((a) => l.ausstattung.indexOf(a) >= 0).length;
      const schoenOk = schoen.filter((a) => l.ausstattung.indexOf(a) >= 0).length;
      const vm = muss.length ? mussOk / muss.length : 1;
      const vs = schoen.length ? schoenOk / schoen.length : 1;
      const v = vm * 0.7 + vs * 0.3;
      add('ausstattung', 'Ausstattung', v, gw.ausstattung,
        (muss.length ? mussOk + ' von ' + muss.length + ' Pflicht' : '') +
        (schoen.length ? (muss.length ? ', ' : '') + schoenOk + ' von ' + schoen.length + ' Wunsch' : ''));
    }

    /* Energie – ein Grundstück hat keinen Ausweis, und einen zu erfinden
       wäre schlimmer, als das Kriterium wegzulassen. */
    if (l.energie) {
      const rang = ENERGIE_RANG[l.energie.klasse];
      add('energie', 'Energie', U.clamp(1 - rang / 8, 0, 1), gw.energie,
        'Klasse ' + l.energie.klasse + ' · ' + l.energie.kwh + ' kWh/(m²·a)');
    }

    /* Pendeln */
    const pz = pendelZeit(l, p);
    if (pz) {
      const grenze = p.maxPendel || 45;
      const v = pz.min <= grenze * 0.5 ? 1 : pz.min <= grenze ? 0.75 : pz.min <= grenze * 1.5 ? 0.35 : 0.05;
      add('pendeln', 'Weg zur Arbeit', v, gw.pendeln, U.minutesLabel(pz.min) + ' nach ' + pz.anker.name);
    }

    /* Preisfairness */
    const mc = mietCheck(l), kc = kaufCheck(l), bc = bodenCheck(l);
    if (bc) {
      const v = bc.diff <= -10 ? 1 : bc.diff <= 6 ? 0.85 : bc.diff <= 18 ? 0.5 : 0.2;
      add('fairness', 'Preis-Leistung', v, gw.fairness,
        U.num(bc.proQm) + ' €/m² Boden, ' + (bc.diff >= 0 ? '+' : '') + bc.diff + ' % zur Lage');
    } else if (mc) {
      const v = mc.diff <= -12 ? 1 : mc.diff <= 5 ? 0.85 : mc.diff <= 15 ? 0.5 : mc.diff <= 25 ? 0.25 : 0.05;
      add('fairness', 'Preis-Leistung', v, gw.fairness,
        (mc.diff >= 0 ? '+' : '') + mc.diff + ' % zur Vergleichsmiete');
    } else if (kc) {
      const v = kc.diff <= -10 ? 1 : kc.diff <= 6 ? 0.85 : kc.diff <= 18 ? 0.5 : 0.2;
      add('fairness', 'Preis-Leistung', v, gw.fairness, 'Faktor ' + U.dec(kc.faktor) + ' Jahresmieten');
    }

    /* WG-Zusammenpassen fließt bei WGs zusätzlich ein */
    let wgTeil = null;
    if (l.kind === 'wg' && NW.match) {
      const m = NW.match.wgPassung(l, p);
      if (m) {
        wgTeil = m;
        add('wg', 'WG-Passung', m.score / 100, 4, m.kurz);
      }
    }

    /* Chancen: viele Bewerber senken die Aussicht spürbar */
    const bewerber = l.stats.bewerber;
    const chance = bewerber < 5 ? 1 : bewerber < 20 ? 0.8 : bewerber < 60 ? 0.55 : bewerber < 120 ? 0.3 : 0.15;
    add('chance', 'Aussicht', chance, 1, bewerber + ' ' + U.plural(bewerber, 'Interessent', 'Interessenten'));

    /* Anbieterqualität */
    const anb = (l.anbieter.quote / 100) * 0.7 + (l.anbieter.verifiziert ? 0.3 : 0);
    add('anbieter', 'Anbieter', anb, 1,
      l.anbieter.quote + ' % Antwortquote' + (l.anbieter.verifiziert ? ', geprüft' : ', ungeprüft'));

    const gesamtGewicht = U.sum(teile.map((t) => t.gewicht)) || 1;
    let score = U.sum(teile.map((t) => t.anteil * t.gewicht)) / gesamtGewicht * 100;

    /* Ausschlusskriterien und Warnungen ziehen kräftig ab. */
    const risiko = risikoCheck(l);
    if (risiko.stufe === 'warnung') score *= 0.45;
    else if (risiko.stufe === 'achtung') score *= 0.82;

    const fehlendePflicht = muss.filter((a) => l.ausstattung.indexOf(a) < 0);
    if (fehlendePflicht.length) score *= Math.pow(0.72, fehlendePflicht.length);

    return {
      score: Math.round(U.clamp(score, 0, 100)),
      teile: teile.sort((a, b) => b.gewicht * b.anteil - a.gewicht * a.anteil),
      risiko, mietCheck: mc, kaufCheck: kc, bodenCheck: bc, wg: wgTeil,
      pendel: pz,
      fehlendePflicht
    };
  }

  /* ================================================================
     6. Filtern und Sortieren
     ================================================================ */

  function leerFilter() {
    return {
      arten: ['miete', 'wg'],
      q: '',
      staedte: [], viertel: [],
      umkreis: null,
      preisMin: null, preisMax: null,
      zimmerMin: null, zimmerMax: null,
      flaecheMin: null, flaecheMax: null,
      baujahrMin: null,
      energieMax: null,
      ausstattung: [],
      freiBis: null,
      anbieterArt: [],
      provisionsfrei: false,
      nurVerifiziert: false,
      ohneVerdacht: true,
      wgArt: [], wgRauchen: null, wgHaustiere: null, wgGroesse: null, wgAlter: null,
      maxPendel: null,
      sort: 'passung'
    };
  }

  /* Das Profil ist die eine Stelle, an der jemand seine Suche beschreibt.
     Daraus einen Filter zu bauen, ist genau die Arbeit, die niemand
     zweimal machen sollte. */
  function filterAusProfil(profil, vorlage) {
    const f = vorlage ? JSON.parse(JSON.stringify(vorlage)) : leerFilter();
    const p = profil || {};
    if (p.staedte && p.staedte.length) f.staedte = p.staedte.slice();
    if (p.viertel && p.viertel.length) f.viertel = p.viertel.slice();
    if (p.budgetWarm) f.preisMax = p.budgetWarm;
    if (p.zimmerMin) f.zimmerMin = p.zimmerMin;
    if (p.flaecheMin) f.flaecheMin = p.flaecheMin;
    if (p.einzugAb) f.freiBis = p.einzugAb;
    if (p.mussHaben && p.mussHaben.length) f.ausstattung = p.mussHaben.slice();
    if (p.arten && p.arten.length) f.arten = p.arten.slice();
    return f;
  }

  /* Wo Filter und Profil auseinanderlaufen – damit die Suche darauf
     hinweisen kann, statt es stillschweigend zu ignorieren. */
  function profilAbweichung(filter, profil) {
    const p = profil || {}, ab = [];
    if (p.staedte && p.staedte.length && filter.staedte.length &&
      p.staedte.join() !== filter.staedte.join()) {
      ab.push({ feld: 'staedte', label: 'Städte', profil: p.staedte.join(', '), filter: filter.staedte.join(', ') });
    }
    if (p.budgetWarm && filter.preisMax && filter.preisMax !== p.budgetWarm) {
      ab.push({ feld: 'preisMax', label: 'Budget', profil: p.budgetWarm + ' €', filter: filter.preisMax + ' €' });
    }
    if (p.flaecheMin && filter.flaecheMin && filter.flaecheMin !== p.flaecheMin) {
      ab.push({ feld: 'flaecheMin', label: 'Fläche', profil: p.flaecheMin + ' m²', filter: filter.flaecheMin + ' m²' });
    }
    return ab;
  }

  function passtText(l, q) {
    if (!q) return true;
    const worte = U.norm(q).split(' ').filter(Boolean);
    const heu = U.norm([l.titel, l.stadt, l.viertel, l.strasse, l.beschreibung, l.ausstattung.join(' '), l.anbieter.name].join(' '));
    return worte.every((w) => heu.indexOf(w) >= 0);
  }

  function filtern(listings, f, profil) {
    const p = profil || {};
    return listings.filter((l) => {
      if (f.arten.length && f.arten.indexOf(l.kind) < 0) return false;
      if (!passtText(l, f.q)) return false;
      if (f.staedte.length && f.staedte.indexOf(l.stadt) < 0) return false;
      if (f.viertel.length && f.viertel.indexOf(l.viertelKey) < 0) return false;
      if (f.umkreis && U.distKm(l, f.umkreis) > f.umkreis.km) return false;

      const preis = l.kind === 'kauf' ? l.kaufpreis : l.warm;
      if (f.preisMin != null && preis < f.preisMin) return false;
      if (f.preisMax != null && preis > f.preisMax) return false;

      if (f.zimmerMin != null && l.zimmer < f.zimmerMin) return false;
      if (f.zimmerMax != null && l.zimmer > f.zimmerMax) return false;
      if (f.flaecheMin != null && l.flaeche < f.flaecheMin) return false;
      if (f.flaecheMax != null && l.flaeche > f.flaecheMax) return false;
      if (f.baujahrMin != null && l.baujahr < f.baujahrMin) return false;
      /* Wer nach Energieklasse filtert, sucht ein Gebäude – ein
         Grundstück fällt dann folgerichtig heraus. */
      if (f.energieMax && (!l.energie || ENERGIE_RANG[l.energie.klasse] > ENERGIE_RANG[f.energieMax])) return false;

      if (f.ausstattung.length && !f.ausstattung.every((a) => l.ausstattung.indexOf(a) >= 0)) return false;
      if (f.freiBis && l.freiAb > f.freiBis) return false;
      if (f.anbieterArt.length && f.anbieterArt.indexOf(l.anbieter.art) < 0) return false;
      if (f.provisionsfrei && l.provision > 0) return false;
      if (f.nurVerifiziert && !l.anbieter.verifiziert) return false;
      if (f.ohneVerdacht && risikoCheck(l).stufe === 'warnung') return false;

      if (l.kind === 'wg' && l.wg) {
        if (f.wgArt.length && !f.wgArt.some((a) => l.wg.art.indexOf(a) >= 0)) return false;
        if (f.wgRauchen === 'rauchfrei' && l.wg.rauchen === 'überall erlaubt') return false;
        if (f.wgHaustiere === 'erlaubt' && l.wg.haustiere === 'nicht erlaubt') return false;
        if (f.wgGroesse && (l.wg.groesse < f.wgGroesse[0] || l.wg.groesse > f.wgGroesse[1])) return false;
        if (f.wgAlter && (l.wg.durchschnittsalter < f.wgAlter[0] || l.wg.durchschnittsalter > f.wgAlter[1])) return false;
      }

      if (f.maxPendel) {
        const pz = pendelZeit(l, p);
        if (pz && pz.min > f.maxPendel) return false;
      }
      return true;
    });
  }

  function sortieren(treffer, sort, profil) {
    const mitScore = treffer.map((l) => ({ l, b: bewerten(l, profil) }));
    const cmp = {
      passung: (a, b) => b.b.score - a.b.score,
      preis: (a, b) => (a.l.kind === 'kauf' ? a.l.kaufpreis : a.l.warm) - (b.l.kind === 'kauf' ? b.l.kaufpreis : b.l.warm),
      preisAb: (a, b) => (b.l.kind === 'kauf' ? b.l.kaufpreis : b.l.warm) - (a.l.kind === 'kauf' ? a.l.kaufpreis : a.l.warm),
      preisqm: (a, b) => (a.l.kind === 'kauf' ? a.l.kaufpreis : a.l.kalt) / a.l.flaeche - (b.l.kind === 'kauf' ? b.l.kaufpreis : b.l.kalt) / b.l.flaeche,
