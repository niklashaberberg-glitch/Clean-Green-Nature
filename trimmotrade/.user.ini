; =====================================================================
; PHP-Einstellungen für TrimmoTrade
;
; Diese Datei wirkt bei Hostern, die PHP als FastCGI betreiben – bei
; netcup ist das der Fall. Sie steht bewusst hier und nicht in der
; .htaccess: php_value in der .htaccess wirkt nur mit mod_php und
; erzeugt sonst einen Fehler 500, der schwer zu finden ist.
;
; Der Grund für die Werte: Ein Inserat mit Bildern kommt als eine
; einzige Anfrage an. Zwölf Bilder à 8 MB wären theoretisch 96 MB –
; hochgeladen wird aber jedes Bild einzeln, und der Server rechnet es
; sofort auf 1600 Pixel herunter. 16 MB reichen also mit Abstand und
; halten die Grenze niedrig genug, dass niemand den Speicher füllt.
; =====================================================================

post_max_size = 16M
upload_max_filesize = 16M

; Bildbearbeitung braucht kurzzeitig Speicher: Ein 12-Megapixel-Foto
; belegt beim Entpacken rund 48 MB, unabhängig von der Dateigröße.
memory_limit = 256M

; Fehler ins Protokoll, nie in die Antwort. Steht auch in api/index.php,
; hier noch einmal für alles außerhalb davon.
display_errors = Off
log_errors = On
